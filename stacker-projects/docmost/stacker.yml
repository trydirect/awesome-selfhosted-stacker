name: docmost
version: "0.5.0"

project:
  identity: docmost

install:
  inputs:
    commonDomain: docs.example.com

app:
  type: custom
  image: docmost/docmost:latest
  ports:
    - "3000:3000"
  environment:
    APP_URL: https://docs.example.com
    DATABASE_URL: postgresql://docmost:${DB_PASSWORD}@postgres:5432/docmost
    REDIS_URL: redis://redis:6379
    APP_SECRET: "${APP_SECRET}"
  volumes:
    - docmost_uploads:/app/uploads
  depends_on:
    - postgres
    - redis

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - docmost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U docmost
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  docmost_uploads: {}
  docmost_pgdata: {}

marketplace:
  publish: true
  display_name: "Docmost"
  short_description: "Open-source wiki and documentation platform (Notion/Confluence alternative). Real-time collaborative editing with spaces, comments and permissions."
  long_description: |
    **Docmost**: Open-source wiki and documentation platform (Notion/Confluence alternative). Real-time collaborative editing with spaces, comments and permissions.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `docmost/docmost:latest` |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/docmost

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [docmost]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/docmost
  no_secrets_confirmation: true
