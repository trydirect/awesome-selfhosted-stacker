name: pterodactyl

project:
  identity: pterodactyl

install:
  inputs:
    commonDomain: panel.example.com

app:
  type: custom
  image: ghcr.io/pterodactyl/panel:latest
  ports:
    - "80:80"
    - "443:443"
  environment:
    APP_URL: http://localhost
    APP_KEY: "${APP_KEY}"
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: pterodactyl
    DB_USERNAME: pterodactyl
    DB_PASSWORD: "${DB_PASSWORD}"
    CACHE_DRIVER: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    MAIL_DRIVER: smtp
    APP_ENV: production
    APP_DEBUG: "false"
  command: >-
    sh -c "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=80"
  volumes:
    - pterodactyl_data:/var/www/html/storage
    - pterodactyl_env:/var/www/html/.env

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: pterodactyl
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_DEBUG:
          mutability: editable
          display: boolean
        APP_ENV:
          mutability: editable
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_URL:
          mutability: editable
        CACHE_DRIVER:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USERNAME:
          mutability: editable
        MAIL_DRIVER:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        SESSION_DRIVER:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
    mysql:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  pterodactyl_data: {}
  pterodactyl_env: {}
  mysql_data: {}
