name: s4core
version: 1.0.0
organization: null
project:
  identity: s4core
app:
  type: custom
  path: .
  dockerfile: null
  image: s4core/s4core:latest
  build: null
  ports:
  - "9000:9000"
  volumes:
  - s4_data:/data
  environment:
    S4_DATA_DIR: /data
    S4_ACCESS_KEY_ID: ${S4_ACCESS_KEY_ID}
    S4_BIND: 0.0.0.0:9000
    RUST_LOG: ${RUST_LOG}
    S4_MAX_UPLOAD_SIZE: ${S4_MAX_UPLOAD_SIZE}
    S4_ROOT_USERNAME: root
    S4_SECRET_ACCESS_KEY: ${S4_SECRET_ACCESS_KEY}
    S4_ROOT_PASSWORD: ${S4_ROOT_PASSWORD}
  command: null
  healthcheck:
    test: CMD-SHELL wget --spider -q http://localhost:9000/health || exit 1
    interval: 30s
    timeout: 10s
    retries: 5
services:
- name: s4console
  image: s4core/s4console:latest
  ports:
  - "3000:3000"
  environment:
    NODE_ENV: production
    S4_BACKEND_URL: http://app:9000
  volumes: []
  depends_on: []
  command: null
  healthcheck: null
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '9000'
    - '3000'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: storage.example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck:
    endpoint: /health
    interval: 30s
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        S4_ACCESS_KEY_ID:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        S4_SECRET_ACCESS_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        S4_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "S4Core"
  short_description: "Single Sign-On service for the Origin platform (S4 sign-on server). Handle authentication for Origin-connected apps."
  long_description: |
    **S4core**: Single Sign-On service for the Origin platform (S4 sign-on server). Handle authentication for Origin-connected apps.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9000 (public) | `s4core/s4core:latest` |
    | s4console | 3000 (public) | `s4core/s4console:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/s4core

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [s4core]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/s4core
  no_secrets_confirmation: true
