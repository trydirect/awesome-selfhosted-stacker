name: caprover

app:
  type: custom
  image: caprover/caprover:latest
  ports:
    - "3000:3000"
    - "8080:8080"
  environment:
    ACCEPTED_TERMS: "true"
    BY_PASS_PROXY_CHECK: "TRUE"
    MAIN_NODE_IP_ADDRESS: "127.0.0.1"
  volumes:
    - caprover_data:/captain
    - /var/run/docker.sock:/var/run/docker.sock
  healthcheck:
    test: "CMD curl -fs http://localhost:3000"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

volumes:
  caprover_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"
      - "443"
      - "3000"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ACCEPTED_TERMS:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        caprover_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Caprover App"
  short_description: "Self-hosted caprover"
  long_description: |
    **caprover**: Self-hosted caprover

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public), 8080 (public) | `caprover/caprover:latest` |

    ## What you configure

    - **Defaults provided**: `ACCEPTED_TERMS` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/caprover

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [caprover app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/caprover
  no_secrets_confirmation: true
