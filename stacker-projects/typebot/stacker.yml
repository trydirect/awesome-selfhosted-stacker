name: typebot

project:
  identity: typebot

install:
  inputs:
    commonDomain: typebot.example.com

app:
  type: custom
  image: baptistearno/typebot-builder:3.19.1
  ports:
    - "3001:3000"
  environment:
    DATABASE_URL: postgresql://typebot:${DB_PASSWORD}@typebot-db:5432/typebot
    NEXTAUTH_URL: http://localhost:3001
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
    ADMIN_EMAIL: admin@example.com
    NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL}
    HOSTNAME: 0.0.0.0

services:
  - name: typebot-db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: typebot
      POSTGRES_USER: typebot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - typebot_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d typebot -U typebot
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  typebot_db: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: typebot.example.com
      ssl: off
      upstream: app:3000

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ENCRYPTION_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXTAUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_EMAIL:
          mutability: editable
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXTAUTH_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXT_PUBLIC_VIEWER_URL:
          mutability: editable
    typebot-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3001"

marketplace:
  publish: true
  display_name: "Typebot"
  short_description: "Visual builder for conversational forms and chatbots (Typeform alternative). Design interactive flows and embed them anywhere."
  long_description: |
    **Typebot**: Visual builder for conversational forms and chatbots (Typeform alternative). Design interactive flows and embed them anywhere.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public on 3001) | Web UI |
    | typebot-db | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ADMIN_EMAIL`, `NEXT_PUBLIC_VIEWER_URL`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/typebot

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [typebot]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/typebot
  no_secrets_confirmation: true
