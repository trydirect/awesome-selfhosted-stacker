name: typebot

project:
  identity: typebot

install:
  inputs:
    commonDomain: typebot.example.com

app:
  type: custom
  image: baptistearno/typebot-builder:latest
  ports:
    - "3001:3000"
  environment:
    DATABASE_URL: postgresql://typebot:${DB_PASSWORD}@typebot-db:5432/typebot
    NEXTAUTH_URL: http://localhost:3001
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
    ADMIN_EMAIL: admin@example.com
    NEXT_PUBLIC_VIEWER_URL: ${NEXT_PUBLIC_VIEWER_URL}

services:
  - name: typebot-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: typebot
      POSTGRES_USER: typebot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - typebot_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d typebot -U typebot
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  typebot_db: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: typebot.example.com
      ssl: off
      upstream: app:3000

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ADMIN_EMAIL:
          mutability: editable
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENCRYPTION_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXTAUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXTAUTH_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXT_PUBLIC_VIEWER_URL:
          mutability: editable
    typebot-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3001"
