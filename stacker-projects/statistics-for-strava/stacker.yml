name: statistics-for-strava
version: 1.0.0
project:
  identity: statistics-for-strava
install:
  inputs:
    commonDomain: strava.example.com
config_contract:
  services:
    app:
      fields:
        STRAVA_CLIENT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        STRAVA_REFRESH_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
app:
  type: custom
  image: robiningelbrecht/strava-statistics:latest
  ports:
  - "8081:8080"
  volumes:
  - strava_database:/var/www/storage/database
  - strava_files:/var/www/storage/files
  - strava_gear_maintenance:/var/www/storage/gear-maintenance
  - strava_watch:/var/www/watch
  environment:
    TZ: ${TZ}
    STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
    STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
    STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN}
services:
- name: daemon
  image: robiningelbrecht/strava-statistics:latest
  command: bin/console app:daemon:run
  volumes:
  - strava_database:/var/www/storage/database
  - strava_files:/var/www/storage/files
  - strava_gear_maintenance:/var/www/storage/gear-maintenance
  - strava_watch:/var/www/watch
  environment:
    TZ: ${TZ}
    STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
    STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
    STRAVA_REFRESH_TOKEN: ${STRAVA_REFRESH_TOKEN}
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '8081'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
monitoring:
  status_panel: true
env_file: .env
volumes:
  strava_database: {}
  strava_files: {}
  strava_gear_maintenance: {}
  strava_watch: {}

marketplace:
  publish: true
  display_name: "Statistics For Strava"
  short_description: "Dashboard for athletes: charts and analysis of your Strava activities. Self-hosted training statistics."
  long_description: |
    **Statistics For Strava**: Dashboard for athletes: charts and analysis of your Strava activities. Self-hosted training statistics.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public on 8081) | `robiningelbrecht/strava-statistics:latest` |
    | daemon | internal | `robiningelbrecht/strava-statistics:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/statistics-for-strava

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [statistics for strava]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/statistics-for-strava
  no_secrets_confirmation: true
