name: dashy
version: "3.1.0"

project:
  identity: dashy

install:
  inputs:
    commonDomain: dashboard.example.com

app:
  type: custom
  image: lissy93/dashy:4.9
  ports:
    - "8082:8080"
  volumes:
    - dashy_config:/app/user-data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      volumes:
        dashy_config: { mutability: generated }
env_file: .env

volumes:
  dashy_config: {}

marketplace:
  publish: true
  display_name: "Dashy"
  short_description: "Feature-rich, open-source homepage for your homelab. Organize all your self-hosted services into a customizable dashboard with health checks."
  long_description: |
    **Dashy**: Feature-rich, open-source homepage for your homelab. Organize all your self-hosted services into a customizable dashboard with health checks.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public on 8082) | `lissy93/dashy:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/dashy

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [dashy]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/dashy
  no_secrets_confirmation: true
