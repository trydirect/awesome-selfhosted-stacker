name: cyberchef

app:
  type: custom
  image: ghcr.io/gchq/cyberchef:latest
  ports:
    - "8000:8080"

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

monitoring:
  status_panel: true

env_file: .env
