name: calcom

app:
  type: custom
  image: calcom/cal.com:latest
  ports:
    - "3000:3000/tcp"
  environment:
    DATABASE_URL: postgresql://calcom:${DB_PASSWORD}@db:5432/calcom
    NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
    NEXT_PUBLIC_API_URL: http://localhost:3000
    CALCOM_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    CALCOM_TIMEZONE: UTC
  volumes:
    - calcom_data:/data
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost:3000/api/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

services:
  - name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calcom
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - calcom_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U calcom -d calcom"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  calcom_data: {}
  calcom_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CALCOM_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CALCOM_TIMEZONE:
          mutability: editable
        DATABASE_URL:
          mutability: editable
        NEXT_PUBLIC_API_URL:
          mutability: editable
        NEXT_PUBLIC_WEBAPP_URL:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        calcom_data:
          mutability: generated
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        calcom_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Calcom"
  short_description: "Open-source Calendly alternative for scheduling meetings. Self-host the booking infrastructure with calendars, availability rules and meeting links."
  long_description: |
    **calcom**: Open-source Calendly alternative for scheduling meetings. Self-host the booking infrastructure with calendars, availability rules and meeting links.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000/tcp (public on 3000) | `calcom/cal.com:latest` |
    | db | internal | Database |

    ## What you configure

    - **Defaults provided**: `CALCOM_TIMEZONE`, `DATABASE_URL`, `NEXT_PUBLIC_API_URL`, `NEXT_PUBLIC_WEBAPP_URL`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/calcom

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [calcom]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/calcom
  no_secrets_confirmation: true
