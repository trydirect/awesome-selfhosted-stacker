name: calcom

app:
  type: custom
  image: calcom/cal.com:latest
  ports:
    - "3000:3000/tcp"
  environment:
    DATABASE_URL: postgresql://calcom:${DB_PASSWORD}@db:5432/calcom
    NEXT_PUBLIC_WEBAPP_URL: http://localhost:3000
    NEXT_PUBLIC_API_URL: http://localhost:3000
    CALCOM_ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    CALCOM_TIMEZONE: UTC
  volumes:
    - calcom_data:/data
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost:3000/api/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

services:
  - name: db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: calcom
      POSTGRES_USER: calcom
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - calcom_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U calcom -d calcom"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  calcom_data: {}
  calcom_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CALCOM_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CALCOM_TIMEZONE:
          mutability: editable
        DATABASE_URL:
          mutability: editable
        NEXT_PUBLIC_API_URL:
          mutability: editable
        NEXT_PUBLIC_WEBAPP_URL:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        calcom_db:
          mutability: generated
