name: meilisearch
app:
  type: custom
  image: getmeili/meilisearch:latest
  ports:
  - 7700:7700
  environment:
    MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    MEILI_ENV: production
  volumes:
  - meilisearch_data:/meili_data
volumes:
  meilisearch_data: {}
proxy:
  type: none
  auto_detect: false
hooks:
  pre_build: ./scripts/generate-secrets.sh
config_contract:
  services:
    app:
      fields:
        MEILI_ENV:
          mutability: editable
        MEILI_MASTER_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
env_file: .env
deploy:
  target: server
  server:
    host: 46.224.127.228
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '7700'

marketplace:
  publish: true
  display_name: "Meilisearch"
  short_description: "Lightning-fast, typo-tolerant search engine with an easy API. Add instant search to apps with Meilisearch."
  long_description: |
    **Meilisearch**: Lightning-fast, typo-tolerant search engine with an easy API. Add instant search to apps with Meilisearch.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 7700 (public) | Search |

    ## What you configure

    - **Defaults provided**: `MEILI_ENV` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/meilisearch

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [meilisearch]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/meilisearch
  no_secrets_confirmation: true
