name: jenkins

project:
  identity: jenkins

app:
  type: custom
  image: jenkins/jenkins:2.541.3-lts-jdk17
  ports:
    - "8080:8080"
    - "50000:50000"
  volumes:
    - jenkins_data:/var/jenkins_home

volumes:
  jenkins_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"
      - "50000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields: {}
      volumes:
        jenkins_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Jenkins"
  short_description: "Automation server for CI/CD pipelines, LTS release with JDK 17"
  long_description: |
    **Jenkins**: Automation server for CI/CD pipelines, LTS release with JDK 17

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public), 50000 (public) | `jenkins/jenkins:2.541.3-lts-jdk17` — web UI + inbound agents |

    ## What you configure

    - The initial admin password is generated on first boot and printed in
      the container logs (`stacker logs --service app`)

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/jenkins

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [jenkins]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/jenkins
  no_secrets_confirmation: true
