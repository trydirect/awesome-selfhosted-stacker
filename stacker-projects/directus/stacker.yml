name: directus
app:
  type: custom
  image: directus/directus:latest
  ports:
  - "8055:8055"
  environment:
    KEY: ${KEY}
    SECRET: ${SECRET}
    DB_CLIENT: pg
    DB_HOST: directus-db
    DB_PORT: '5432'
    DB_DATABASE: directus
    DB_USER: directus
    DB_PASSWORD: ${DB_PASSWORD}
    ADMIN_EMAIL: admin@example.com
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
services:
- name: directus-db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: directus
    POSTGRES_USER: directus
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  volumes:
  - directus_db:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -d directus -U directus
    interval: 10s
    timeout: 5s
    retries: 10
volumes:
  directus_db: {}
proxy:
  type: none
  auto_detect: false
hooks:
  pre_build: ./scripts/generate-secrets.sh
config_contract:
  services:
    app:
      fields:
        ADMIN_EMAIL:
          mutability: editable
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_CLIENT:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    directus-db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
env_file: .env
deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22

marketplace:
  publish: true
  display_name: "Directus"
  short_description: "Instant REST and GraphQL API on top of any SQL database with a no-code admin app. Wrap existing databases with roles, files and automation."
  long_description: |
    **Directus**: Instant REST and GraphQL API on top of any SQL database with a no-code admin app. Wrap existing databases with roles, files and automation.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8055 (public) | `directus/directus:11.1.3` |
    | directus-db | internal | Database |

    ## What you configure

    - **Defaults provided**: `ADMIN_EMAIL`, `DB_CLIENT`, `DB_DATABASE`, `DB_HOST`, `DB_PORT`, `DB_USER` ship prefilled and can be adjusted in the deploy form

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/directus

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [directus]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/directus
  no_secrets_confirmation: true
