name: memos

app:
  type: custom
  image: ghcr.io/usememos/memos:latest
  ports:
    - "5230:5230"
  volumes:
    - memos_data:/var/opt/memos

volumes:
  memos_data: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

deploy:
  target: cloud
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5230"

config_contract:
  services:
    app:
      fields: {}
env_file: .env
