name: memos

app:
  type: custom
  image: ghcr.io/usememos/memos:v0.22.0
  ports:
    - "5230:5230"
  volumes:
    - memos_data:/var/opt/memos

volumes:
  memos_data: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

deploy:
  target: cloud
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5230"

env_file: .env

config_contract:
  services:
    app:
      volumes:
        memos_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Memos"
  short_description: "Lightweight, self-hosted memo cloud for quick notes and knowledge snippets. Capture ideas with tags, links and a chronological feed."
  long_description: |
    **Memos**: Lightweight, self-hosted memo cloud for quick notes and knowledge snippets. Capture ideas with tags, links and a chronological feed.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5230 (public) | `ghcr.io/usememos/memos:latest` |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/memos

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [memos]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/memos
  no_secrets_confirmation: true
