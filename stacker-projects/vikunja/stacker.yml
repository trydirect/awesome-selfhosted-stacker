name: vikunja
version: "0.22.0"

project:
  identity: vikunja

install:
  inputs:
    commonDomain: tasks.example.com

app:
  type: custom
  image: vikunja/vikunja:2
  ports:
    - "3456:3456"
  environment:
    VIKUNJA_SERVICE_PUBLICURL: https://tasks.example.com
    VIKUNJA_SERVICE_SECRET: "${JWT_SECRET}"
    VIKUNJA_DATABASE_TYPE: postgres
    VIKUNJA_DATABASE_HOST: postgres
    VIKUNJA_DATABASE_DATABASE: vikunja
    VIKUNJA_DATABASE_USER: vikunja
    VIKUNJA_DATABASE_PASSWORD: "${DB_PASSWORD}"
  volumes:
    - vikunja_files:/app/vikunja/files
  user: "0:0"

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: vikunja
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - vikunja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U vikunja
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: vikunja.example.com
      ssl: off
      upstream: app:3456

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3456"

config_contract:
  services:
    app:
      fields:
        VIKUNJA_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        VIKUNJA_SERVICE_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  vikunja_files: {}
  vikunja_pgdata: {}

marketplace:
  publish: true
  display_name: "Vikunja"
  short_description: "Open-source task, to-do and project organizer (Todoist alternative). Lists, kanban, gantt and calendars in one place."
  long_description: |
    **Vikunja**: Open-source task, to-do and project organizer (Todoist alternative). Lists, kanban, gantt and calendars in one place.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3456 (public) | `vikunja/vikunja:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/vikunja

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [vikunja]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/vikunja
  no_secrets_confirmation: true
