name: vikunja
version: "0.22.0"

project:
  identity: vikunja

install:
  inputs:
    commonDomain: tasks.example.com

app:
  type: custom
  image: vikunja/vikunja:latest
  ports:
    - "3456:3456"
  environment:
    VIKUNJA_SERVICE_PUBLICURL: https://tasks.example.com
    VIKUNJA_SERVICE_SECRET: "${JWT_SECRET}"
    VIKUNJA_DATABASE_TYPE: postgres
    VIKUNJA_DATABASE_HOST: postgres
    VIKUNJA_DATABASE_DATABASE: vikunja
    VIKUNJA_DATABASE_USER: vikunja
    VIKUNJA_DATABASE_PASSWORD: "${DB_PASSWORD}"
  volumes:
    - vikunja_files:/app/vikunja/files
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: vikunja
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - vikunja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U vikunja
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "3456"

config_contract:
  app:
    environment:
      - name: JWT_SECRET
        required: true
        secret: true
      - name: DB_PASSWORD
        required: true
        secret: true

hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: ./scripts/fix-volume-permissions.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  vikunja_files: {}
  vikunja_pgdata: {}
