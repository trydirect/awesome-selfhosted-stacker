name: freshrss

app:
  type: custom
  image: lscr.io/linuxserver/freshrss:latest
  ports:
    - "8080:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - freshrss_data:/config
    - freshrss_data:/data

volumes:
  freshrss_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: cloud
  server: null
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

config_contract:
  services:
    app:
      fields:
        PUID:
          mutability: editable
          display: number
        PGID:
          mutability: editable
          display: number
        TZ:
          mutability: editable

env_file: .env
