name: freshrss

app:
  type: custom
  image: lscr.io/linuxserver/freshrss:1.24.3
  ports:
    - "8080:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - freshrss_data:/config
    - freshrss_data:/data

volumes:
  freshrss_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: cloud
  server: null
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

config_contract:
  services:
    app:
      fields:
        PUID:
          mutability: editable
          display: number
        PGID:
          mutability: editable
          display: number
        TZ:
          mutability: editable

env_file: .env

marketplace:
  publish: true
  display_name: "Freshrss"
  short_description: "Self-hosted RSS feed aggregator that is light on resources. Read and sync subscriptions across clients with FreshRSS."
  long_description: |
    **Freshrss**: Self-hosted RSS feed aggregator that is light on resources. Read and sync subscriptions across clients with FreshRSS.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | API server |

    ## What you configure

    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/freshrss

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [freshrss]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/freshrss
  no_secrets_confirmation: true
