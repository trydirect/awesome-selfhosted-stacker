name: audiobookshelf

app:
  type: custom
  image: ghcr.io/advplyr/audiobookshelf:latest
  ports:
    - "13378:13378"
  volumes:
    - audiobooks_data:/audiobooks
    - audiobooks_config:/config
    - audiobooks_metadata:/metadata

volumes:
  audiobooks_data: {}
  audiobooks_config: {}
  audiobooks_metadata: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "13378"
