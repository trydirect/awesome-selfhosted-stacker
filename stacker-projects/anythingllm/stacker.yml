name: anythingllm

project:
  identity: anythingllm

install:
  inputs:
    commonDomain: chat.example.com

app:
  type: custom
  image: mintplexlabs/anythingllm:latest
  ports:
    - "3001:3001"
  environment:
    STORAGE_DIR: /app/server/storage
    JWT_SECRET: "${JWT_SECRET}"
    LLM_PROVIDER: openai
    OPEN_AI_KEY: "${OPENAI_API_KEY}"
    OPEN_AI_MODEL_PREF: gpt-4o-mini
    EMBEDDING_ENGINE: native
    VECTOR_DB: lancedb
  volumes:
    - anythingllm_storage:/app/server/storage

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: anythingllm.example.com
      ssl: off
      upstream: app:3001

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3001"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        EMBEDDING_ENGINE:
          mutability: editable
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        LLM_PROVIDER:
          mutability: editable
        OPEN_AI_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPEN_AI_MODEL_PREF:
          mutability: editable
        STORAGE_DIR:
          mutability: editable
        VECTOR_DB:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  anythingllm_storage: {}

marketplace:
  publish: true
  display_name: "Anythingllm"
  short_description: "All-in-one AI desktop and server application: chat with documents, run agents, and use many LLM providers in one self-hosted workspace. Includes vector database and multi-user support."
  long_description: |
    **Anythingllm**: All-in-one AI desktop and server application: chat with documents, run agents, and use many LLM providers in one self-hosted workspace. Includes vector database and multi-user support.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3001 (public) | `mintplexlabs/anythingllm:1.6.8` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `EMBEDDING_ENGINE`, `LLM_PROVIDER`, `OPEN_AI_MODEL_PREF`, `STORAGE_DIR`, `VECTOR_DB` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/anythingllm

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [anythingllm]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/anythingllm
  no_secrets_confirmation: true
