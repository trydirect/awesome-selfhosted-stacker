name: appwrite

project:
  identity: appwrite

install:
  inputs:
    commonDomain: api.example.com

app:
  type: custom
  image: appwrite/appwrite:1.6.0
  ports:
    - "80:80"
    - "443:443"
  environment:
    _APP_OPENSSL_KEY_V1: "${APPWRITE_KEY}"
    _APP_DOMAIN: localhost
    _APP_DOMAIN_TARGET: localhost
    _APP_REDIS_HOST: redis
    _APP_REDIS_PORT: 6379
    _APP_DB_HOST: mariadb
    _APP_DB_PORT: 3306
    _APP_DB_SCHEMA: appwrite
    _APP_DB_USER: appwrite
    _APP_DB_PASS: "${DB_PASSWORD}"
  volumes:
    - appwrite_data:/storage
    - appwrite_config:/storage/config
    - appwrite_functions:/storage/functions
    - appwrite_uploads:/storage/uploads

services:
  - name: mariadb
    image: mariadb:11.8.8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: appwrite
      MYSQL_USER: appwrite
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: influxdb
    image: influxdb:1.8
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      INFLUXDB_DB: appwrite
      INFLUXDB_ADMIN_ENABLED: "true"
    volumes:
      - influxdb_data:/var/lib/influxdb

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"
      - "443"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        _APP_OPENSSL_KEY_V1:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        _APP_DB_HOST:
          mutability: editable
        _APP_DB_PASS:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        _APP_DB_PORT:
          mutability: editable
          display: number
        _APP_DB_SCHEMA:
          mutability: editable
        _APP_DB_USER:
          mutability: editable
        _APP_DOMAIN:
          mutability: editable
        _APP_DOMAIN_TARGET:
          mutability: editable
        _APP_REDIS_HOST:
          mutability: editable
        _APP_REDIS_PORT:
          mutability: editable
          display: number
        volumes:
          mutability: editable
    influxdb:
      fields:
        INFLUXDB_ADMIN_ENABLED:
          mutability: editable
          display: boolean
        INFLUXDB_DB:
          mutability: editable
    mariadb:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  appwrite_data: {}
  appwrite_config: {}
  appwrite_functions: {}
  appwrite_uploads: {}
  mariadb_data: {}
  influxdb_data: {}

marketplace:
  publish: true
  display_name: "Appwrite"
  short_description: "Self-hosted Backend-as-a-Service with auth, databases, storage, functions and messaging. Ship web and mobile apps with a complete open-source backend."
  long_description: |
    **Appwrite**: Self-hosted Backend-as-a-Service with auth, databases, storage, functions and messaging. Ship web and mobile apps with a complete open-source backend.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public), 443 (public) | `appwrite/appwrite:1.6.0` |
    | mariadb | 3306 (local only) | Database |
    | redis | 6379 (local only) | Cache |
    | influxdb | 8086 (local only) | `influxdb:1.8` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `INFLUXDB_ADMIN_ENABLED`, `INFLUXDB_DB`, `MYSQL_DATABASE`, `MYSQL_USER` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/appwrite

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [appwrite]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/appwrite
  no_secrets_confirmation: true
