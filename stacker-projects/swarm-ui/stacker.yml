name: swarm-ui
version: "1.0.0"

project:
  identity: swarm-ui

app:
  type: custom
  image: mchaker/swarmui:latest
  ports:
    - "7801:7801"
  volumes:
    - swarm_data:/Data
    - swarm_backend:/dlbackend
    - ./Models:/Models
    - ./Output:/Output

volumes:
  swarm_data: {}
  swarm_backend: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: cloud
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    public_ports:
      - "7801"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      volumes:
        swarm_data: { mutability: generated }
        swarm_backend: { mutability: generated }
env_file: .env

marketplace:
  publish: true
  display_name: "Swarm Ui"
  short_description: "Self-hosted Stable Diffusion web UI with model management and generation"
  long_description: |
    **Swarm UI**: Self-hosted Stable Diffusion web UI with model management and generation

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 7801 (public) | Web UI |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/swarm-ui

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [swarm ui]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/swarm-ui
  no_secrets_confirmation: true
