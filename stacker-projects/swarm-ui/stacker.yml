name: swarm-ui
version: "1.0.0"

project:
  identity: swarm-ui

app:
  type: custom
  path: .
  dockerfile: Dockerfile
  ports:
    - "7801:7801"
  volumes:
    - swarm_data:/Data
    - swarm_backend:/dlbackend
    - ./Models:/Models
    - ./Output:/Output

volumes:
  swarm_data: {}
  swarm_backend: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: cloud
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    public_ports:
      - "7801"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      volumes:
        swarm_data: { mutability: generated }
        swarm_backend: { mutability: generated }
env_file: .env
