name: miniflux

project:
  identity: miniflux

install:
  inputs:
    commonDomain: rss.example.com

app:
  type: custom
  image: miniflux/miniflux:latest
  ports:
    - "8080:8080"
  environment:
    DATABASE_URL: "postgres://miniflux:${DB_PASSWORD}@postgres:5432/miniflux?sslmode=disable"
    RUN_MIGRATIONS: "1"
    CREATE_ADMIN: "1"
    ADMIN_USERNAME: admin
    ADMIN_PASSWORD: "${ADMIN_PASSWORD}"

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: miniflux
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U miniflux"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: rss.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_USERNAME:
          mutability: editable
        CREATE_ADMIN:
          mutability: editable
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        RUN_MIGRATIONS:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Miniflux"
  short_description: "Minimalist and fast RSS/Atom feed reader written in Go. Keyboard-driven reading with clean typography."
  long_description: |
    **Miniflux**: Minimalist and fast RSS/Atom feed reader written in Go. Keyboard-driven reading with clean typography.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `miniflux/miniflux:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ADMIN_USERNAME`, `CREATE_ADMIN`, `RUN_MIGRATIONS`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/miniflux

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [miniflux]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/miniflux
  no_secrets_confirmation: true
