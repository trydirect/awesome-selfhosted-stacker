name: docling-serve
version: "1.0.0"

project:
  identity: docling-serve

install:
  inputs:
    commonDomain: docling-serve.example.com

app:
  type: custom
  image: ghcr.io/docling-project/docling-serve-cpu:v1.37.0
  ports:
    - "5001:5001"
  environment:
    DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY}
    DOCLING_SERVE_ENABLE_UI: "1"
  volumes:
    - docling_cache:/opt/app-root/src/.cache
  healthcheck:
    test: "CMD curl -fs http://localhost:5001/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

volumes:
  docling_cache: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5001"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DOCLING_SERVE_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DOCLING_SERVE_ENABLE_UI:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        docling_cache:
          mutability: generated

marketplace:
  publish: true
  display_name: "Docling Serve"
  short_description: "Document conversion API, PDF, DOCX, images to structured formats"
  long_description: |
    **Docling Serve**: Document conversion API, PDF, DOCX, images to structured formats

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5001 (public) | `ghcr.io/docling-project/docling-serve-cpu:v1.37.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DOCLING_SERVE_ENABLE_UI` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/docling-serve

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [docling serve]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/docling-serve
  no_secrets_confirmation: true
