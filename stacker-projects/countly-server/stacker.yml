name: "countly-server"
version: "1.0.0"
project:
  identity: "countly-server"
install:
  inputs:
    commonDomain: "countly.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "bitnami/nginx:latest"
  ports:
    - "8080:8080"
  environment: {}
services:
  - name: "mongodb"
    image: "bitnami/mongodb:latest"
    volumes:
      - "countly_mongodb_data:/bitnami"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
  - name: "countly-api"
    image: "countly/api:latest"
    environment:
      COUNTLY_PLUGINS: "mobile,web,desktop,plugins,density,locale,browser,sources,views,logger,systemlogs,populator,reports,crashes,push,star-rating,slipping-away-users,compare,server-stats,dbviewer,times-of-day,compliance-hub,alerts,onboarding,consolidate,remote-config,hooks,dashboards,sdk,data-manager"
      COUNTLY_CONFIG__MONGODB_HOST: "mongodb"
      COUNTLY_CONFIG_API_API_WORKERS: "4"
      COUNTLY_CONFIG__FILESTORAGE: "gridfs"
      NODE_OPTIONS: "--max-old-space-size=2048"
  - name: "countly-frontend"
    image: "countly/frontend:latest"
    environment:
      COUNTLY_PLUGINS: "mobile,web,desktop,plugins,density,locale,browser,sources,views,logger,systemlogs,populator,reports,crashes,push,star-rating,slipping-away-users,compare,server-stats,dbviewer,times-of-day,compliance-hub,alerts,onboarding,consolidate,remote-config,hooks,dashboards,sdk,data-manager"
      COUNTLY_CONFIG__MONGODB_HOST: "mongodb"
      NODE_OPTIONS: "--max-old-space-size=2048"
proxy:
  type: "none"
  auto_detect: false
deploy:
  target: "local"
  cloud:
    provider: "hetzner"
    region: "fsn1"
    size: "cpx22"
    public_ports:
      - "8080"
monitoring:
  status_panel: true
config_contract:
  services:
    "countly-api":
      fields:
        COUNTLY_CONFIG_API_API_WORKERS:
          mutability: editable
        COUNTLY_CONFIG__FILESTORAGE:
          mutability: editable
        COUNTLY_CONFIG__MONGODB_HOST:
          mutability: editable
        COUNTLY_PLUGINS:
          mutability: editable
        NODE_OPTIONS:
          mutability: editable
    "mongodb":
      fields:
        ALLOW_EMPTY_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
env_file: ".env"
volumes:
  countly_mongodb_data: {}

marketplace:
  publish: true
  display_name: "Countly Server"
  short_description: "Open-source product analytics platform for mobile and web applications. Track user journeys, funnels and retention with full data ownership."
  long_description: |
    **Countly Server**: Open-source product analytics platform for mobile and web applications. Track user journeys, funnels and retention with full data ownership.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | Web server |
    | mongodb | internal | Database |
    | countly-api | internal | API server |
    | countly-frontend | internal | Web UI |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `COUNTLY_CONFIG_API_API_WORKERS`, `COUNTLY_CONFIG__FILESTORAGE`, `COUNTLY_CONFIG__MONGODB_HOST`, `COUNTLY_PLUGINS`, `NODE_OPTIONS` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/countly-server

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [countly server]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/countly-server
  no_secrets_confirmation: true
