name: invoiceninja

app:
  type: custom
  image: invoiceninja/invoiceninja:5.13
  ports:
    - "8080:80/tcp"
  environment:
    DB_PASSWORD: ${DB_PASSWORD}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: invoiceninja
    DB_USERNAME: invoiceninja
    APP_URL: http://localhost:8080
  volumes:
    - invoiceninja_data:/data
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost:80"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s

services:
  - name: db
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: invoiceninja
      MARIADB_USER: invoiceninja
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - invoiceninja_db:/var/lib/mysql
    healthcheck:
      test: "CMD healthcheck.sh --connect --innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  invoiceninja_data: {}
  invoiceninja_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
    db:
      fields:
        MARIADB_DATABASE:
          mutability: editable
        MARIADB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        invoiceninja_db:
          mutability: generated

marketplace:
  display_name: "Invoiceninja"
