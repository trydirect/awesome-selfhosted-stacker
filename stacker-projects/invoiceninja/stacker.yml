name: invoiceninja

app:
  type: custom
  image: invoiceninja/invoiceninja:latest
  ports:
    - "8080:80/tcp"
  environment:
    DB_PASSWORD: ${DB_PASSWORD}
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: invoiceninja
    DB_USERNAME: invoiceninja
    APP_URL: http://localhost:8080
  volumes:
    - invoiceninja_data:/data
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost:80"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s

services:
  - name: db
    image: mariadb:11
    environment:
      MARIADB_DATABASE: invoiceninja
      MARIADB_USER: invoiceninja
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - invoiceninja_db:/var/lib/mysql
    healthcheck:
      test: "CMD healthcheck.sh --connect --innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  invoiceninja_data: {}
  invoiceninja_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        invoiceninja_data:
          mutability: generated
    db:
      fields:
        MARIADB_DATABASE:
          mutability: editable
        MARIADB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        invoiceninja_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Invoiceninja"
  short_description: "Invoicing, billing, and payment management for freelancers"
  long_description: |
    **Invoiceninja**: Invoicing, billing, and payment management for freelancers

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80/tcp (public on 8080) | `invoiceninja/invoiceninja:latest` |
    | db | internal | Database |

    ## What you configure

    - **Defaults provided**: `DB_HOST`, `DB_NAME`, `DB_PORT`, `DB_USER`, `MARIADB_DATABASE`, `MARIADB_USER` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/invoiceninja

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [invoiceninja]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/invoiceninja
  no_secrets_confirmation: true
