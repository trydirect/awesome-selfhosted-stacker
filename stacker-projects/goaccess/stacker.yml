name: "goaccess"
version: "1.0.0"
project:
  identity: "goaccess"
install:
  inputs:
    commonDomain: "goaccess.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "nginx:1.27-alpine"
  ports:
    - "8080:80"
  volumes:
    - "goaccess_logs:/var/log/nginx"
    - "goaccess_public:/usr/share/nginx/html"
    - "./configs/nginx.conf:/etc/nginx/nginx.conf:ro"
  environment: {}
services:
  - name: "goaccess"
    image: "allinurl/goaccess:latest"
    ports:
      - "127.0.0.1:7890:7890"
    volumes:
      - "goaccess_logs:/srv/logs"
      - "goaccess_public:/srv/report"
      - "./configs/goaccess.conf:/srv/config/goaccess.conf:ro"
    command: "sh -c 'mkdir -p /srv/report && touch /srv/logs/access.log && exec goaccess --no-global-config --config-file=/srv/config/goaccess.conf'"
proxy:
  type: "none"
  auto_detect: false
deploy:
  target: "local"
  cloud:
    provider: "hetzner"
    region: "fsn1"
    size: "cpx22"
    public_ports:
      - "8080"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  goaccess_logs: {}
  goaccess_public: {}

config_contract:
  services:
    app:
      volumes:
        goaccess_logs:
          mutability: generated
        goaccess_public:
          mutability: generated
    goaccess:
      volumes:
        goaccess_logs:
          mutability: generated
        goaccess_public:
          mutability: generated

marketplace:
  publish: true
  display_name: "Goaccess"
  short_description: "Real-time web log analyzer with an interactive terminal and HTML reports. Make sense of Nginx/Apache access logs instantly."
  long_description: |
    **Goaccess**: Real-time web log analyzer with an interactive terminal and HTML reports. Make sense of Nginx/Apache access logs instantly.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | Web server |
    | goaccess | 7890 (local only) | `allinurl/goaccess:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/goaccess

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [goaccess]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/goaccess
  no_secrets_confirmation: true
