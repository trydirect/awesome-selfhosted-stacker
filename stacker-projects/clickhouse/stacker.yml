name: clickhouse

project:
  identity: clickhouse

install:
  inputs:
    commonDomain: clickhouse.example.com

app:
  type: custom
  image: clickhouse/clickhouse-server:24.8
  ports:
    - "8123:8123"
    - "9000:9000"
  environment:
    CLICKHOUSE_USER: default
    CLICKHOUSE_PASSWORD: "${DB_PASSWORD}"
    CLICKHOUSE_DB: clickhouse
  volumes:
    - clickhouse_data:/var/lib/clickhouse
    - clickhouse_logs:/var/log/clickhouse-server

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: clickhouse.example.com
      ssl: off
      upstream: app:8123

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8123"
      - "9000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CLICKHOUSE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CLICKHOUSE_DB:
          mutability: editable
        CLICKHOUSE_USER:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  clickhouse_data: {}
  clickhouse_logs: {}

marketplace:
  publish: true
  display_name: "Clickhouse"
  short_description: "Column-oriented OLAP database for fast analytical queries at scale. Deploy ClickHouse for real-time analytics over billions of rows."
  long_description: |
    **ClickHouse**: Column-oriented OLAP database for fast analytical queries at scale. Deploy ClickHouse for real-time analytics over billions of rows.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8123 (public), 9000 (public) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `CLICKHOUSE_DB`, `CLICKHOUSE_USER` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/clickhouse

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [clickhouse]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/clickhouse
  no_secrets_confirmation: true
