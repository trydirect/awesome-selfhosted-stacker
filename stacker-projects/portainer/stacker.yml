name: portainer

app:
  type: custom
  image: portainer/portainer-ce:latest
  ports:
    - "9000:9000"
  volumes:
    - portainer_data:/data
    - /var/run/docker.sock:/var/run/docker.sock

volumes:
  portainer_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9000"

config_contract:
  services:
    app:
      volumes:
        portainer_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Portainer"
  short_description: "Container management UI for Docker, Swarm and Kubernetes. Deploy and monitor containers with a friendly graphical interface."
  long_description: |
    **Portainer**: Container management UI for Docker, Swarm and Kubernetes. Deploy and monitor containers with a friendly graphical interface.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9000 (public) | `portainer/portainer-ce:2.21.4` |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/portainer

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [portainer]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/portainer
  no_secrets_confirmation: true
