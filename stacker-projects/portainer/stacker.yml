name: portainer

app:
  type: custom
  image: portainer/portainer-ce:latest
  ports:
    - "9000:9000"
  volumes:
    - portainer_data:/data
    - /var/run/docker.sock:/var/run/docker.sock

volumes:
  portainer_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "9000"
