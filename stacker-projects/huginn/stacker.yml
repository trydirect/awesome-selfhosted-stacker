name: huginn

project:
  identity: huginn

install:
  inputs:
    commonDomain: huginn.example.com

app:
  type: custom
  image: ghcr.io/huginn/huginn:latest
  ports:
    - "3000:3000"
  environment:
    DATABASE_ADAPTER: postgresql
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_NAME: huginn
    DATABASE_USERNAME: huginn
    DATABASE_PASSWORD: "${DB_PASSWORD}"
    HUGINN_DATABASE_NAME: huginn
    HUGINN_DATABASE_USERNAME: huginn
    HUGINN_DATABASE_PASSWORD: "${DB_PASSWORD}"
    HUGINN_DATABASE_HOST: postgres
    APP_SECRET_TOKEN: "${SECRET_KEY}"
  command: >-
    sh -c "bundle exec rake db:migrate db:seed && bundle exec rails server -b 0.0.0.0 -p 3000"
  volumes:
    - huginn_data:/data

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: huginn
      POSTGRES_USER: huginn
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U huginn"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: huginn.example.com
      ssl: off
      upstream: app:3000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_SECRET_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_ADAPTER:
          mutability: editable
        DATABASE_HOST:
          mutability: editable
        DATABASE_NAME:
          mutability: editable
        DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_PORT:
          mutability: editable
          display: number
        DATABASE_USERNAME:
          mutability: editable
        HUGINN_DATABASE_HOST:
          mutability: editable
        HUGINN_DATABASE_NAME:
          mutability: editable
        HUGINN_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HUGINN_DATABASE_USERNAME:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  huginn_data: {}
  postgres_data: {}
