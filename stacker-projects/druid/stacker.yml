name: druid
version: 1.0.0
project:
  identity: druid
install:
  inputs:
    commonDomain: druid.example.com
config_contract:
  services:
    app:
      fields:
        druid_metadata_storage_connector_password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    broker:
      fields:
        druid_metadata_storage_connector_password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    coordinator:
      fields:
        druid_metadata_storage_connector_password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    historical:
      fields:
        druid_metadata_storage_connector_password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    middlemanager:
      fields:
        druid_metadata_storage_connector_password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
app:
  type: custom
  image: apache/druid:38.0.0
  ports:
  - "8888:8888"
  command: router
  volumes:
  - druid_shared:/opt/shared
  - druid_router_var:/opt/druid/var
  environment:
    DRUID_SINGLE_NODE_CONF: micro-quickstart
    druid_emitter_logging_logLevel: debug
    druid_zk_service_host: zookeeper
    druid_extensions_loadList: '["postgresql-metadata-storage"]'
    druid_metadata_storage_type: postgresql
    druid_metadata_storage_connector_connectURI: jdbc:postgresql://postgres:5432/druid
    druid_metadata_storage_connector_user: druid
    druid_metadata_storage_connector_password: ${DB_PASSWORD}
    druid_storage_type: local
    druid_storage_storageDirectory: /opt/shared/segments
    druid_indexer_logs_type: file
    druid_indexer_logs_directory: /opt/shared/indexing-logs
    druid_processing_numThreads: '2'
    druid_processing_numMergeBuffers: '2'
services:
- name: postgres
  image: postgres:17.11
  environment:
    POSTGRES_DB: druid
    POSTGRES_USER: druid
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  volumes:
  - druid_metadata_data:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -U druid -d druid
    interval: 10s
    timeout: 5s
    retries: 10
- name: zookeeper
  image: zookeeper:3.5.10
  environment:
    ZOO_MY_ID: '1'
  volumes:
  - druid_zookeeper_data:/data
  - druid_zookeeper_datalog:/datalog
- name: coordinator
  image: apache/druid:38.0.0
  command: coordinator
  volumes:
  - druid_shared:/opt/shared
  - druid_coordinator_var:/opt/druid/var
  environment:
    DRUID_SINGLE_NODE_CONF: micro-quickstart
    druid_emitter_logging_logLevel: debug
    druid_zk_service_host: zookeeper
    druid_extensions_loadList: '["postgresql-metadata-storage"]'
    druid_metadata_storage_type: postgresql
    druid_metadata_storage_connector_connectURI: jdbc:postgresql://postgres:5432/druid
    druid_metadata_storage_connector_user: druid
    druid_metadata_storage_connector_password: ${DB_PASSWORD}
    druid_storage_type: local
    druid_storage_storageDirectory: /opt/shared/segments
    druid_indexer_logs_type: file
    druid_indexer_logs_directory: /opt/shared/indexing-logs
    druid_processing_numThreads: '2'
    druid_processing_numMergeBuffers: '2'
- name: broker
  image: apache/druid:38.0.0
  command: broker
  volumes:
  - druid_broker_var:/opt/druid/var
  environment:
    DRUID_SINGLE_NODE_CONF: micro-quickstart
    druid_emitter_logging_logLevel: debug
    druid_zk_service_host: zookeeper
    druid_extensions_loadList: '["postgresql-metadata-storage"]'
    druid_metadata_storage_type: postgresql
    druid_metadata_storage_connector_connectURI: jdbc:postgresql://postgres:5432/druid
    druid_metadata_storage_connector_user: druid
    druid_metadata_storage_connector_password: ${DB_PASSWORD}
    druid_storage_type: local
    druid_storage_storageDirectory: /opt/shared/segments
    druid_indexer_logs_type: file
    druid_indexer_logs_directory: /opt/shared/indexing-logs
    druid_processing_numThreads: '2'
    druid_processing_numMergeBuffers: '2'
- name: historical
  image: apache/druid:38.0.0
  command: historical
  volumes:
  - druid_shared:/opt/shared
  - druid_historical_var:/opt/druid/var
  environment:
    DRUID_SINGLE_NODE_CONF: micro-quickstart
    druid_emitter_logging_logLevel: debug
    druid_zk_service_host: zookeeper
    druid_extensions_loadList: '["postgresql-metadata-storage"]'
    druid_metadata_storage_type: postgresql
    druid_metadata_storage_connector_connectURI: jdbc:postgresql://postgres:5432/druid
    druid_metadata_storage_connector_user: druid
    druid_metadata_storage_connector_password: ${DB_PASSWORD}
    druid_storage_type: local
    druid_storage_storageDirectory: /opt/shared/segments
    druid_indexer_logs_type: file
    druid_indexer_logs_directory: /opt/shared/indexing-logs
    druid_processing_numThreads: '2'
    druid_processing_numMergeBuffers: '2'
- name: middlemanager
  image: apache/druid:38.0.0
  ports:
  - "8091:8091"
  - "8100:8100"
  - "8101:8101"
  - "8102:8102"
  - "8103:8103"
  - "8104:8104"
  - "8105:8105"
  command: middleManager
  volumes:
  - druid_shared:/opt/shared
  - druid_middlemanager_var:/opt/druid/var
  environment:
    DRUID_SINGLE_NODE_CONF: micro-quickstart
    druid_emitter_logging_logLevel: debug
    druid_zk_service_host: zookeeper
    druid_extensions_loadList: '["postgresql-metadata-storage"]'
    druid_metadata_storage_type: postgresql
    druid_metadata_storage_connector_connectURI: jdbc:postgresql://postgres:5432/druid
    druid_metadata_storage_connector_user: druid
    druid_metadata_storage_connector_password: ${DB_PASSWORD}
    druid_storage_type: local
    druid_storage_storageDirectory: /opt/shared/segments
    druid_indexer_logs_type: file
    druid_indexer_logs_directory: /opt/shared/indexing-logs
    druid_processing_numThreads: '2'
    druid_processing_numMergeBuffers: '2'
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '8888'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
monitoring:
  status_panel: true
env_file: .env
volumes:
  druid_metadata_data: {}
  druid_zookeeper_data: {}
  druid_zookeeper_datalog: {}
  druid_shared: {}
  druid_coordinator_var: {}
  druid_broker_var: {}
  druid_historical_var: {}
  druid_middlemanager_var: {}
  druid_router_var: {}

marketplace:
  publish: true
  display_name: "Druid"
  short_description: "Real-time analytics database built for fast slice-and-dice on large event streams. Apache Druid handles sub-second queries on streaming and batch data."
  long_description: |
    **Druid**: Real-time analytics database built for fast slice-and-dice on large event streams. Apache Druid handles sub-second queries on streaming and batch data.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    7 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8888 (public) | Web UI |
    | postgres | internal | Database |
    | zookeeper | internal | `zookeeper:3.5.10` |
    | coordinator | internal | Web UI |
    | broker | internal | Web UI |
    | historical | internal | Web UI |
    | middlemanager | 8091 (public), 8100 (public), 8101 (public), 8102 (public), 8103 (public), 8104 (public), 8105 (public) | Web UI |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 7 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 7 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/druid

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [druid]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/druid
  no_secrets_confirmation: true
