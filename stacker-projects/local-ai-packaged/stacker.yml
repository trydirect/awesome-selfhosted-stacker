# local-ai-packaged: n8n, Supabase, Ollama, Open WebUI, Flowise, Qdrant,
# Neo4j, SearXNG, Langfuse and Caddy - coleam00/local-ai-packaged as one
# stacker project. Services, volumes and config_contract are generated by
# scripts/build-services.py from the upstream sources; the rest is hand-written.
name: local-ai-packaged
version: "2c541913"

project:
  identity: local-ai-packaged

install:
  inputs:
    commonDomain: local-ai-packaged.example.com

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx42
    # Caddy serves each UI on its own port: n8n 8001, Open WebUI 8002,
    # Flowise 8003, Supabase 8005, Langfuse 8007, Neo4j 8008.
    public_ports:
      - "80"
      - "443"
      - "8001"
      - "8002"
      - "8003"
      - "8005"
      - "8007"
      - "8008"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

# >>> services: generated by scripts/build-services.py - do not edit by hand
# local-ai-packaged 2c541913c0f9, supabase 1d9808ab8b10, langfuse 3ef11ab9f937
services:
- name: flowise
  image: flowiseai/flowise:3.1.3
  environment:
    PORT: '3001'
    FLOWISE_USERNAME: ${FLOWISE_USERNAME}
    FLOWISE_PASSWORD: ${FLOWISE_PASSWORD}
  volumes:
  - flowise_data:/root/.flowise
  entrypoint: /bin/sh -c "sleep 3; flowise start"
  restart: unless-stopped
- name: open-webui
  image: ghcr.io/open-webui/open-webui:v0.12.2
  environment:
    WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
    OLLAMA_BASE_URL: http://ollama:11434
    ANONYMIZED_TELEMETRY: 'false'
  volumes:
  - open-webui:/app/backend/data
  restart: unless-stopped
- name: qdrant
  image: qdrant/qdrant:v1.19.2
  volumes:
  - qdrant_storage:/qdrant/storage
  restart: unless-stopped
- name: neo4j
  image: neo4j:2026.09.0-community
  environment:
    NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
  volumes:
  - neo4j_data:/data
  - neo4j_logs:/logs
  restart: always
- name: searxng
  image: searxng/searxng:2026.10.13-22c64b8d3
  environment:
    SEARXNG_BASE_URL: http://searxng:8080/
    SEARXNG_SECRET: ${SEARXNG_SECRET}
    UWSGI_WORKERS: '4'
    UWSGI_THREADS: '4'
  volumes:
  - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
  restart: unless-stopped
  cap_add:
  - CHOWN
  - SETGID
  - SETUID
  cap_drop:
  - ALL
- name: ollama-cpu
  image: ollama/ollama:0.40.4
  environment:
    OLLAMA_CONTEXT_LENGTH: '8192'
    OLLAMA_FLASH_ATTENTION: '1'
    OLLAMA_KV_CACHE_TYPE: q8_0
    OLLAMA_MAX_LOADED_MODELS: '2'
  volumes:
  - ollama_storage:/root/.ollama
  restart: unless-stopped
  aliases:
  - ollama
  deploy:
    replicas: ${OLLAMA_CPU_REPLICAS}
- name: ollama-gpu
  image: ollama/ollama:0.40.4
  environment:
    OLLAMA_CONTEXT_LENGTH: '8192'
    OLLAMA_FLASH_ATTENTION: '1'
    OLLAMA_KV_CACHE_TYPE: q8_0
    OLLAMA_MAX_LOADED_MODELS: '2'
  volumes:
  - ollama_storage:/root/.ollama
  restart: unless-stopped
  profiles:
  - gpu-nvidia
  aliases:
  - ollama
  deploy:
    resources:
      reservations:
        devices:
        - driver: nvidia
          count: 1
          capabilities:
          - gpu
- name: ollama-gpu-amd
  image: ollama/ollama:0.40.4-rocm
  environment:
    OLLAMA_CONTEXT_LENGTH: '8192'
    OLLAMA_FLASH_ATTENTION: '1'
    OLLAMA_KV_CACHE_TYPE: q8_0
    OLLAMA_MAX_LOADED_MODELS: '2'
  volumes:
  - ollama_storage:/root/.ollama
  restart: unless-stopped
  devices:
  - /dev/kfd
  - /dev/dri
  profiles:
  - gpu-amd
  aliases:
  - ollama
- name: ollama-pull
  image: ollama/ollama:0.40.4
  environment:
    OLLAMA_HOST: ollama:11434
  command: -c 'timeout 120 sh -c "until ollama list >/dev/null 2>&1; do sleep 2; done" || { echo "no ollama, skipping model pull"; exit 0; }; ollama pull qwen2.5:7b-instruct-q4_K_M && ollama pull nomic-embed-text'
  entrypoint: /bin/sh
  restart: 'no'
- name: langfuse-worker
  image: langfuse/langfuse-worker:4.59.0
  environment:
    NEXTAUTH_URL: http://localhost:3000
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
    SALT: ${LANGFUSE_SALT}
    ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
    TELEMETRY_ENABLED: 'false'
    LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
    CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: clickhouse
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    CLICKHOUSE_CLUSTER_ENABLED: 'false'
    CLICKHOUSE_CLUSTER_NAME: default
    LANGFUSE_USE_AZURE_BLOB: 'false'
    LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE: 'false'
    LANGFUSE_OCI_AUTH_TYPE: workload_identity
    LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
    LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
    LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
    LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
    LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
    LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
    LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
    LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
    LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
    LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    LANGFUSE_S3_MEDIA_UPLOAD_REQUEST_TIMEOUT_MS: '30000'
    LANGFUSE_OBSERVATION_FIELD_OVERFLOW_ENABLED: 'false'
    LANGFUSE_OBSERVATION_FIELD_SIZE_LIMIT_BYTES: '2097152'
    LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
    LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
    LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
    LANGFUSE_S3_BATCH_EXPORT_REGION: auto
    LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
    LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
    LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: 'true'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_AUTH: ${REDIS_AUTH}
    LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: 'false'
    REDIS_TLS_ENABLED: 'false'
    HOSTNAME: 0.0.0.0
  depends_on:
  - postgres
  - minio
  - redis
  - clickhouse
  restart: always
- name: langfuse-web
  image: langfuse/langfuse:4.59.0
  environment:
    NEXTAUTH_URL: http://localhost:3000
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
    SALT: ${LANGFUSE_SALT}
    ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
    TELEMETRY_ENABLED: 'false'
    LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: 'false'
    CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: clickhouse
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    CLICKHOUSE_CLUSTER_ENABLED: 'false'
    CLICKHOUSE_CLUSTER_NAME: default
    LANGFUSE_USE_AZURE_BLOB: 'false'
    LANGFUSE_USE_OCI_NATIVE_OBJECT_STORAGE: 'false'
    LANGFUSE_OCI_AUTH_TYPE: workload_identity
    LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
    LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
    LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
    LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
    LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
    LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
    LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
    LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
    LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
    LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    LANGFUSE_S3_MEDIA_UPLOAD_REQUEST_TIMEOUT_MS: '30000'
    LANGFUSE_OBSERVATION_FIELD_OVERFLOW_ENABLED: 'false'
    LANGFUSE_OBSERVATION_FIELD_SIZE_LIMIT_BYTES: '2097152'
    LANGFUSE_S3_BATCH_EXPORT_ENABLED: 'false'
    LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
    LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
    LANGFUSE_S3_BATCH_EXPORT_REGION: auto
    LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
    LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
    LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
    LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: 'true'
    REDIS_HOST: redis
    REDIS_PORT: '6379'
    REDIS_AUTH: ${REDIS_AUTH}
    LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: 'false'
    REDIS_TLS_ENABLED: 'false'
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    HOSTNAME: 0.0.0.0
  depends_on:
  - postgres
  - minio
  - redis
  - clickhouse
  restart: always
- name: clickhouse
  image: clickhouse/clickhouse-server:25.12.11.4
  environment:
    CLICKHOUSE_DB: default
    CLICKHOUSE_USER: clickhouse
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  volumes:
  - langfuse_clickhouse_data:/var/lib/clickhouse
  - langfuse_clickhouse_logs:/var/log/clickhouse-server
  healthcheck:
    test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
    interval: 5s
    timeout: 5s
    retries: 11
  restart: always
- name: minio
  image: cgr.dev/chainguard/minio@sha256:8d66c6b9ce8996091d841d768a88b4255faf0c25fa8de257d832ea4c27d08395
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  volumes:
  - langfuse_minio_data:/data
  command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
  entrypoint: sh
  healthcheck:
    test: CMD mc ready local
    interval: 1s
    timeout: 5s
    retries: 6
  restart: always
- name: redis
  image: redis:7.4.11-alpine
  environment:
    REDIS_AUTH: ${REDIS_AUTH}
  volumes:
  - langfuse_redis_data:/data
  command: -c 'exec redis-server --requirepass "$$REDIS_AUTH" --maxmemory-policy noeviction'
  entrypoint: /bin/sh
  healthcheck:
    test: CMD-SHELL redis-cli -a "$$REDIS_AUTH" ping | grep -q PONG
    interval: 3s
    timeout: 10s
    retries: 10
  restart: always
- name: postgres
  image: postgres:17.11
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: postgres
    TZ: UTC
    PGTZ: UTC
  volumes:
  - langfuse_postgres_data:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -U postgres
    interval: 3s
    timeout: 3s
    retries: 10
  restart: always
- name: studio
  image: supabase/studio:2026.09.07-sha-7996410
  environment:
    HOSTNAME: 0.0.0.0
    STUDIO_PG_META_URL: http://meta:8080
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_USER_READ_WRITE: postgres
    PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
    PGRST_DB_MAX_ROWS: '1000'
    PGRST_DB_EXTRA_SEARCH_PATH: public
    DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION}
    DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT}
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    SUPABASE_URL: http://api-gw:8000
    SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
    SUPABASE_ANON_KEY: ${ANON_KEY}
    SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    AUTH_JWT_SECRET: ${JWT_SECRET}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    ENABLED_FEATURES_LOGS_ALL: 'false'
    SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
  volumes:
  - supabase_snippets:/app/snippets
  - ./supabase/volumes/functions/main/index.ts:/app/edge-functions/main/index.ts:ro
  - ./supabase/volumes/functions/hello/index.ts:/app/edge-functions/hello/index.ts:ro
  healthcheck:
    test: CMD-SHELL node -e "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
    interval: 5s
    timeout: 10s
    retries: 7
  restart: unless-stopped
- name: api-gw
  image: kong/kong:3.9.3
  environment:
    KONG_DATABASE: 'off'
    KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
    KONG_ROUTER_FLAVOR: expressions
    KONG_DNS_ORDER: LAST,A,CNAME
    KONG_DNS_NOT_FOUND_TTL: '1'
    KONG_DNS_VALID_TTL: '5'
    KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
    KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
    KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    KONG_PROXY_ACCESS_LOG: /dev/stdout combined
    SUPABASE_ANON_KEY: ${ANON_KEY}
    SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
    DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
  volumes:
  - ./supabase/volumes/api/kong.yml:/home/kong/temp.yml:ro
  - ./supabase/volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
  depends_on:
  - studio
  entrypoint: /bin/sh /home/kong/kong-entrypoint.sh
  healthcheck:
    test: CMD kong health
    interval: 5s
    timeout: 5s
    retries: 5
  restart: unless-stopped
  aliases:
  - envoy
  - kong
- name: auth
  image: supabase/gotrue:v2.196.0
  environment:
    GOTRUE_API_HOST: 0.0.0.0
    GOTRUE_API_PORT: '9999'
    API_EXTERNAL_URL: ${API_EXTERNAL_URL}
    GOTRUE_DB_DRIVER: postgres
    GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    GOTRUE_SITE_URL: ${SITE_URL}
    GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
    GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
    GOTRUE_JWT_ADMIN_ROLES: service_role
    GOTRUE_JWT_AUD: authenticated
    GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
    GOTRUE_JWT_EXP: ${JWT_EXPIRY}
    GOTRUE_JWT_SECRET: ${JWT_SECRET}
    GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}
    GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
    GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
    GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
    GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
    GOTRUE_SMTP_HOST: ${SMTP_HOST}
    GOTRUE_SMTP_PORT: ${SMTP_PORT}
    GOTRUE_SMTP_USER: ${SMTP_USER}
    GOTRUE_SMTP_PASS: ${SMTP_PASS}
    GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
    GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
    GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
    GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
    GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
    GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP}
    GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM}
  depends_on:
  - db
  healthcheck:
    test: CMD wget --no-verbose --tries=1 --spider http://localhost:9999/health
    interval: 5s
    timeout: 5s
    retries: 3
  restart: unless-stopped
- name: rest
  image: postgrest/postgrest:v14.17
  environment:
    PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
    PGRST_DB_MAX_ROWS: '1000'
    PGRST_DB_EXTRA_SEARCH_PATH: public
    PGRST_DB_ANON_ROLE: anon
    PGRST_ADMIN_SERVER_PORT: '3001'
    PGRST_ADMIN_SERVER_HOST: localhost
    PGRST_JWT_SECRET: ${JWT_SECRET}
    PGRST_DB_USE_LEGACY_GUCS: 'false'
    PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
  depends_on:
  - db
  command: postgrest
  healthcheck:
    test: CMD postgrest --ready
    interval: 5s
    timeout: 5s
    retries: 3
  restart: unless-stopped
- name: realtime
  image: supabase/realtime:v2.134.10
  environment:
    PORT: '4000'
    DB_HOST: ${POSTGRES_HOST}
    DB_PORT: ${POSTGRES_PORT}
    DB_USER: supabase_admin
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    DB_NAME: ${POSTGRES_DB}
    DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
    DB_ENC_KEY: ${REALTIME_DB_ENC_KEY}
    API_JWT_SECRET: ${JWT_SECRET}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    METRICS_JWT_SECRET: ${JWT_SECRET}
    ERL_AFLAGS: -proto_dist inet_tcp
    DNS_NODES: ''''''
    RLIMIT_NOFILE: '10000'
    APP_NAME: realtime
    SEED_SELF_HOST: 'true'
    RUN_JANITOR: 'true'
    DISABLE_HEALTHCHECK_LOGGING: 'true'
    ANON_KEY: ${ANON_KEY}
  depends_on:
  - db
  healthcheck:
    interval: 30s
    retries: 4
    test: 'CMD-SHELL curl -sSfL --head -o /dev/null -H "Authorization: Bearer $$ANON_KEY" http://localhost:4000/api/tenants/realtime-dev/health'
    timeout: 5s
  restart: unless-stopped
- name: storage
  image: supabase/storage-api:v1.74.0
  environment:
    ANON_KEY: ${ANON_KEY}
    SERVICE_KEY: ${SERVICE_ROLE_KEY}
    POSTGREST_URL: http://rest:3000
    AUTH_JWT_SECRET: ${JWT_SECRET}
    DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
    REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
    FILE_SIZE_LIMIT: '52428800'
    STORAGE_BACKEND: file
    GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET}
    FILE_STORAGE_BACKEND_PATH: /var/lib/storage
    TENANT_ID: ${STORAGE_TENANT_ID}
    REGION: ${REGION}
    ENABLE_IMAGE_TRANSFORMATION: 'true'
    IMGPROXY_URL: http://imgproxy:5001
    S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID}
    S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET}
  volumes:
  - supabase_storage:/var/lib/storage
  depends_on:
  - db
  - rest
  - imgproxy
  healthcheck:
    test: CMD wget --no-verbose --tries=1 --spider http://storage:5000/status
    interval: 5s
    timeout: 5s
    retries: 5
  restart: unless-stopped
- name: imgproxy
  image: darthsim/imgproxy:v3.31.4
  environment:
    IMGPROXY_BIND: :5001
    IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
    IMGPROXY_USE_ETAG: 'true'
    IMGPROXY_AUTO_WEBP: ${IMGPROXY_AUTO_WEBP}
    IMGPROXY_MAX_SRC_RESOLUTION: '16.8'
  volumes:
  - supabase_storage:/var/lib/storage
  healthcheck:
    test: CMD imgproxy health
    interval: 5s
    timeout: 5s
    retries: 3
  restart: unless-stopped
- name: meta
  image: supabase/postgres-meta:v0.99.0
  environment:
    PG_META_PORT: '8080'
    PG_META_DB_HOST: ${POSTGRES_HOST}
    PG_META_DB_PORT: ${POSTGRES_PORT}
    PG_META_DB_NAME: ${POSTGRES_DB}
    PG_META_DB_USER: postgres
    PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
  depends_on:
  - db
  restart: unless-stopped
- name: functions
  image: supabase/edge-runtime:v1.76.2
  environment:
    JWT_SECRET: ${JWT_SECRET}
    SUPABASE_URL: http://api-gw:8000
    SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
    SUPABASE_ANON_KEY: ${ANON_KEY}
    SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT}
  volumes:
  - ./supabase/volumes/functions/main/index.ts:/home/deno/functions/main/index.ts:ro
  - ./supabase/volumes/functions/hello/index.ts:/home/deno/functions/hello/index.ts:ro
  - deno-cache:/root/.cache/deno
  depends_on:
  - api-gw
  command: start --user-worker-request-idle-timeout 150000 --main-service /home/deno/functions/main
  healthcheck:
    test: CMD-SHELL timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'
    interval: 5s
    timeout: 5s
    retries: 3
  restart: unless-stopped
- name: db
  image: supabase/postgres:17.6.1.136
  environment:
    POSTGRES_HOST: /var/run/postgresql
    PGPORT: ${POSTGRES_PORT}
    POSTGRES_PORT: ${POSTGRES_PORT}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: ${POSTGRES_DB}
    POSTGRES_DB: ${POSTGRES_DB}
    JWT_EXP: ${JWT_EXPIRY}
  volumes:
  - ./supabase/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql
  - ./supabase/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
  - ./supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql
  - ./supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
  - supabase_db_data:/var/lib/postgresql/data
  - ./supabase/volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql
  - ./supabase/volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql
  - ./supabase/volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql
  - db-config:/etc/postgresql-custom
  command: postgres -c config_file=/etc/postgresql/postgresql.conf -c log_min_messages=fatal
  healthcheck:
    test: CMD pg_isready -U postgres -h localhost
    interval: 5s
    timeout: 5s
    retries: 10
  restart: unless-stopped
- name: supavisor
  image: supabase/supavisor:2.9.12
  environment:
    PORT: '4000'
    POSTGRES_PORT: ${POSTGRES_PORT}
    POSTGRES_HOST: ${POSTGRES_HOST}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    DATABASE_URL: ecto://supabase_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/_supabase
    CLUSTER_POSTGRES: 'true'
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    VAULT_ENC_KEY: ${VAULT_ENC_KEY}
    API_JWT_SECRET: ${JWT_SECRET}
    METRICS_JWT_SECRET: ${JWT_SECRET}
    REGION: local
    ERL_AFLAGS: -proto_dist inet_tcp
    POOLER_TENANT_ID: ${POOLER_TENANT_ID}
    POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
    POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
    POOLER_POOL_MODE: transaction
    DB_POOL_SIZE: ${POOLER_DB_POOL_SIZE}
  volumes:
  - ./supabase/volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro
  depends_on:
  - db
  command: /bin/sh -c '/app/bin/migrate && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" && /app/bin/server'
  healthcheck:
    test: CMD curl -sSfL --head -o /dev/null http://127.0.0.1:4000/api/health
    interval: 10s
    timeout: 5s
    retries: 13
  restart: unless-stopped
- name: lap-caddy
  image: caddy:2.11.7-alpine
  ports:
  - 80:80
  - 443:443
  - 8001:8001
  - 8002:8002
  - 8003:8003
  - 8005:8005
  - 8007:8007
  - 8008:8008
  environment:
    N8N_HOSTNAME: '":8001"'
    WEBUI_HOSTNAME: '":8002"'
    FLOWISE_HOSTNAME: '":8003"'
    OLLAMA_HOSTNAME: '":8004"'
    SUPABASE_HOSTNAME: '":8005"'
    SEARXNG_HOSTNAME: '":8006"'
    LANGFUSE_HOSTNAME: '":8007"'
    NEO4J_HOSTNAME: '":8008"'
    LETSENCRYPT_EMAIL: internal
  volumes:
  - ./Caddyfile:/etc/caddy/Caddyfile:ro
  - caddy-data:/data
  - caddy-config:/config
  restart: unless-stopped
  cap_add:
  - NET_BIND_SERVICE
  cap_drop:
  - ALL
  aliases:
  - caddy
- name: lap-n8n
  image: n8nio/n8n:2.43.6
  environment:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: db
    DB_POSTGRESDB_USER: postgres
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    DB_POSTGRESDB_DATABASE: postgres
    N8N_DIAGNOSTICS_ENABLED: 'false'
    N8N_PERSONALIZATION_ENABLED: 'false'
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET}
    N8N_SECURE_COOKIE: 'false'
  volumes:
  - n8n_storage:/home/node/.n8n
  - n8n_shared:/data/shared
  depends_on:
  - db
  healthcheck:
    test: CMD-SHELL wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1
    interval: 15s
    timeout: 5s
    retries: 10
  restart: unless-stopped
  aliases:
  - n8n
