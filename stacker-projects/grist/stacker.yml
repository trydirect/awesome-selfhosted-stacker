name: grist
version: "1.0.0"

project:
  identity: grist

install:
  inputs:
    commonDomain: spreadsheet.example.com

app:
  type: custom
  image: gristlabs/grist:latest
  ports:
    - "8484:8484"
  environment:
    APP_HOME_URL: "${APP_HOME_URL}"
    GRIST_DEFAULT_EMAIL: admin@example.com
    GRIST_SANDBOX_FLAVOR: fuse
  volumes:
    - grist_data:/persist

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8484"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_HOME_URL:
          mutability: editable
        GRIST_DEFAULT_EMAIL:
          mutability: editable
        GRIST_SANDBOX_FLAVOR:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  grist_data: {}

marketplace:
  publish: true
  display_name: "Grist App"
  short_description: "Spreadsheet-database hybrid with relational data, formulas, and custom views"
  long_description: |
    **grist**: Spreadsheet-database hybrid with relational data, formulas, and custom views

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8484 (public) | `gristlabs/grist:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APP_HOME_URL`, `GRIST_DEFAULT_EMAIL`, `GRIST_SANDBOX_FLAVOR` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/grist

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [grist app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/grist
  no_secrets_confirmation: true
