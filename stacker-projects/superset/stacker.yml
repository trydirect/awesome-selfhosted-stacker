name: superset
version: 3.1.0
project:
  identity: superset
install:
  inputs:
    commonDomain: superset.example.com
app:
  type: python
  image: apache/superset:latest
  ports:
  - "8088:8088"
  environment:
    SUPERSET_DATABASE_URL: postgresql://superset:${DB_PASSWORD}@superset_db:5432/superset
    REDIS_URL: redis://redis:6379
    SUPERSET_SECRET_KEY: ${SECRET_KEY}
    SUPERSET_LOAD_EXAMPLES: 'false'
    ROW_LIMIT: '50000'
    SUPERSET_ENV: production
services:
- name: superset_db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: superset
    POSTGRES_USER: superset
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  ports:
  - "127.0.0.1:5432:5432"
  volumes:
  - superset_db:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -U superset -d superset
    interval: 10s
    timeout: 5s
    retries: 10
- name: redis
  image: redis:7-alpine
  ports:
  - "127.0.0.1:6379:6379"
  volumes:
  - superset_redis:/data
  healthcheck:
    test: CMD redis-cli ping
    interval: 10s
    timeout: 5s
    retries: 10
volumes:
  superset_db: {}
  superset_redis: {}
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '8088'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
config_contract:
  services:
    app:
      fields:
        SUPERSET_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    superset_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
monitoring:
  status_panel: true
env_file: .env

marketplace:
  publish: true
  display_name: "Superset"
  short_description: "Apache Superset: enterprise-grade data exploration and visualization. SQL IDE, dashboards and charts for your teams."
  long_description: |
    **Superset**: Apache Superset: enterprise-grade data exploration and visualization. SQL IDE, dashboards and charts for your teams.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8088 (public) | `apache/superset:latest` |
    | superset_db | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/superset

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [superset]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/superset
  no_secrets_confirmation: true
