name: apprise

project:
  identity: apprise

install:
  inputs:
    commonDomain: notify.example.com

app:
  type: custom
  image: caronc/apprise:2.0.2
  ports:
    - "8000:8000"
  environment:
    APPRISE_STATEFUL_MODE: enabled
    APPRISE_WORKER_COUNT: 1
  volumes:
    - apprise_config:/config
    - apprise_state:/state

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APPRISE_STATEFUL_MODE:
          mutability: editable
        APPRISE_WORKER_COUNT:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  apprise_config: {}
  apprise_state: {}

marketplace:
  publish: true
  display_name: "Apprise"
  short_description: "Notification API microservice that speaks 65+ services (Slack, Telegram, Discord, email and more). Send alerts from any app through a single lightweight endpoint."
  long_description: |
    **Apprise**: Notification API microservice that speaks 65+ services (Slack, Telegram, Discord, email and more). Send alerts from any app through a single lightweight endpoint.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `caronc/apprise:1.8.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APPRISE_STATEFUL_MODE`, `APPRISE_WORKER_COUNT` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/apprise

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [apprise]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/apprise
  no_secrets_confirmation: true
