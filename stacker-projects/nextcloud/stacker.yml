name: nextcloud
version: 28.0.0
organization: null
project:
  identity: nextcloud
app:
  type: php
  path: .
  dockerfile: null
  image: nextcloud:latest
  build: null
  ports:
  - "8081:80"
  volumes:
  - nextcloud_data:/var/www/html
  environment:
    NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.example.com
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
    MYSQL_DATABASE: nextcloud
    MYSQL_HOST: nextcloud_db
    MYSQL_PASSWORD: ${DB_PASSWORD}
    MYSQL_USER: nextcloud
  command: null
  healthcheck: null
services:
- name: nextcloud_db
  image: mariadb:11.8
  ports:
  - "127.0.0.1:3306:3306"
  environment:
    MARIADB_USER: nextcloud
    MARIADB_PASSWORD: ${DB_PASSWORD}
    MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    MARIADB_DATABASE: nextcloud
  volumes:
  - nextcloud_db:/var/lib/mysql
  depends_on: []
  command: null
  healthcheck:
    test: CMD mysqladmin ping -h localhost
    interval: 10s
    timeout: 5s
    retries: 10
- name: redis
  image: redis:7.4-alpine
  ports:
  - "127.0.0.1:6379:6379"
  environment: {}
  volumes:
  - nextcloud_redis:/data
  depends_on: []
  command: null
  healthcheck:
    test: CMD redis-cli ping
    interval: 10s
    timeout: 5s
    retries: 10
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '8081'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: nextcloud.example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXTCLOUD_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    nextcloud_db:
      fields:
        MARIADB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MARIADB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "Nextcloud"
  short_description: "Content collaboration platform: files, calendar, contacts and talk in one private cloud. The complete self-hosted productivity suite."
  long_description: |
    **Nextcloud**: Content collaboration platform: files, calendar, contacts and talk in one private cloud. The complete self-hosted productivity suite.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8081) | `nextcloud:latest` |
    | nextcloud_db | 3306 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/nextcloud

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [nextcloud]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/nextcloud
  no_secrets_confirmation: true
