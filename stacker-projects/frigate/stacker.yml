name: frigate

app:
  type: custom
  image: ghcr.io/blakeblackshear/frigate:stable
  ports:
    - "5001:5000"
    - "8554:8554"
    - "8555:8555/tcp"
    - "8555:8555/udp"
  privileged: true
  environment:
    FRIGATE_RTSP_PASSWORD: ${FRIGATE_RTSP_PASSWORD}
  volumes:
    - frigate_config:/config
    - frigate_storage:/media/frigate
    - /dev/bus/usb:/dev/bus/usb

volumes:
  frigate_config: {}
  frigate_storage: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        FRIGATE_RTSP_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
env_file: .env
