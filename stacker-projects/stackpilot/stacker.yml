name: stackpilot
version: "1.0.0"

project:
  identity: stackpilot

install:
  inputs:
    commonDomain: stackpilot.try.direct

config_contract:
  services:
    app:
      fields:
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    stackpilot-db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    stackpilot-n8n:
      fields:
        N8N_BASIC_AUTH_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    stackpilot-ollama:
      volumes:
        stackpilot_ollama:
          mutability: fixed
hooks:
  pre_build: ./scripts/generate-secrets.sh

app:
  type: custom
  image: trydirect/stackpilot:1.0.0
  ports:
    - "8080:8000"
  environment:
    DATABASE_URL: "postgresql://stackpilot:${POSTGRES_PASSWORD}@stackpilot-db:5432/stackpilot"
    REDIS_URL: "redis://stackpilot-redis:6379"
    OLLAMA_BASE_URL: "http://stackpilot-ollama:11434"
    N8N_WEBHOOK_URL: "http://stackpilot-n8n:5678/webhook/stackpilot"
    SECRET_KEY: "${SECRET_KEY}"
    OLLAMA_MODEL: "${OLLAMA_MODEL}"
    OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL}"
    ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    ADMIN_USER: "admin"
  volumes:
    - stackpilot_data:/app/data

services:
  - name: stackpilot-db
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: stackpilot
      POSTGRES_USER: stackpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - stackpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d stackpilot -U stackpilot
      interval: 10s
      timeout: 5s
      retries: 10

  - name: stackpilot-redis
    image: redis:7.4-alpine
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

  - name: stackpilot-ollama
    image: ollama/ollama:0.3.12
    volumes:
      - stackpilot_ollama:/root/.ollama
    ports:
      - "11434:11434"

  - name: stackpilot-n8n
    image: n8nio/n8n:1.64.0
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_WEBHOOK_URL: "http://stackpilot-n8n:5678/"
      GENERIC_TIMEZONE: "UTC"
    volumes:
      - stackpilot_n8n_data:/home/node/.n8n

volumes:
  stackpilot_data: {}
  stackpilot_pgdata: {}
  stackpilot_ollama: {}
  stackpilot_n8n_data: {}

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ~/.config/stacker/ssh/server-436_ed25519
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx32
    public_ports:
      # SSH must be listed explicitly: the firewall is built from this list
      # alone, so omitting 22 locks the owner out of their own server once the
      # rules are applied after the deploy.
      - "22"
      - "80"
      - "443"
      - "8080"
      - "5678"
      - "11434"

proxy:
  type: nginx-proxy-manager
  auto_detect: true

monitoring:
  status_panel: true
  healthcheck:
    endpoint: /health
    interval: 30s

env_file: .env

marketplace:
  display_name: "Stackpilot"
  short_description: "Self-hosted Stackpilot application, ready to deploy with Stacker"

  long_description: |
    # StackPilot
    
    [![Deploy to TryDirect](https://img.shields.io/badge/Deploy_to-TryDirect-blue)](https://try.direct/quick-deploy?source=github&repo=trydirect/awesome-selfhosted-stacker&path=stacker-projects/stackpilot&ref=206881a13b81ab43aaeca1316403e1343763f261)
    
    **Self-hosted AI website support assistant** - a fully functional RAG-based chat widget that learns from your data, deployable with a single command.
    
    ```
    ┌─────────────────────────────────────────────────────────────┐
    │                     WEBSITE (any site)                      │
    │  embed widget.js (see docs)    │
    └──────────────────────┬──────────────────────────────────────┘
                           ▼
    ┌─────────────────────────────────────────────────────────────┐
    │                  STACKPILOT API (FastAPI)                   │
    │  • Widget endpoint  • Admin dashboard  • RAG pipeline       │
    └───┬──────────┬──────────┬──────────┬────────────────────────┘
        ▼          ▼          ▼          ▼
    ┌────────┐ ┌────────┐ ┌────────┐ ┌────────────┐
    │Postgres│ │ Redis  │ │Ollama  │ │    n8n     │
    │+pgvec  │ │        │ │        │ │            │
    └────────┘ └────────┘ └────────┘ └────────────┘
    ```
    
    ---
    
    ## Quick Deploy
    
    ```bash
    stacker install stackpilot
    stacker deploy --target cloud --key htz-0
    ```
    
    ---
    
    ## Features
    
    - **Embeddable chat widget** - one embed tag adds AI support to any website
    - **RAG-powered answers** - semantic search over your knowledge base using pgvector
    - **Website crawler** - automatically ingests your site content into the knowledge base
    - **Self-hosted AI** - runs Ollama locally, no OpenAI/Anthropic API keys needed
    - **Conversation learning** - stores chat history, tracks feedback, improves over time
    - **Workflow automation** - escalates low-confidence answers via n8n webhooks
    - **Admin dashboard** - manage knowledge base, view conversations, pull models
    - **Production-ready** - Nginx Proxy Manager with auto-SSL, health checks, status panel
    
    ---
    
    ## Tech Stack
    
    | Service | Image | Purpose |
    |---------|-------|---------|
    | **app** | Custom Python (FastAPI) | API, RAG pipeline, admin dashboard, widget |
    | **stackpilot-db** | `pgvector/pgvector:0.8.0-pg16` | Knowledge base vectors + conversation history |
    | **stackpilot-redis** | `redis:7-alpine` | Caching, rate limiting, session store |
    | **stackpilot-ollama** | `ollama/ollama (pinned version)` | Self-hosted LLM inference + embeddings |
    | **stackpilot-n8n** | `n8nio/n8n (pinned version)` | Workflow automation, escalation, notifications |
    | **nginx-proxy-manager** | `jc21/nginx-proxy-manager (pinned version)` | Reverse proxy with auto-SSL |
    
    ---
    
    ## Prerequisites
    
    - A server with Docker and Docker Compose installed
    - At least 2GB RAM + 2GB swap (8GB+ recommended for running larger LLMs)
    - (Optional) A domain pointed at your server for SSL
    
    **Quick server setup** (installs Docker, creates swap):
    
    ```bash
    ./scripts/setup-server.sh YOUR_SERVER_IP
    ```
    
    ---
    
    ## Installation
    
    ### Option 1: Deploy with Stacker (recommended)
    
    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/stackpilot
    
    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh
    
    # Deploy to your server
    stacker deploy
    ```
    
    ### Option 2: Manual Docker Compose deploy
    
    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/stackpilot
    
    # Copy compose file and build
    cp .stacker/docker-compose.yml .
    docker compose up -d --build
    ```
    
    ### First Run Checklist
    
    1. **Open the admin dashboard**
       ```
       http://YOUR_SERVER_IP:8080/api/admin/dashboard
       ```
    
    2. **Sign in** with the `ADMIN_PASSWORD` from your `.env` file
    
    3. **Pull AI models** - go to the **Ollama** tab and pull:
       - `llama3.1` - the LLM for generating responses
       - `nomic-embed-text` - the embedding model for semantic search
    
    4. **Build your knowledge base** - go to the **Websites** tab and crawl your website:
       ```
       https://your-website.com
       ```
       Or add documents manually via the **Knowledge Base** tab.
    
    5. **Embed the widget** on your website:
       ```html
       embed widget.js URL (see docs)
       ```
    
    6. **(Optional) Set up SSL** - configure Nginx Proxy Manager at port `81` to route your domain to the app.
    
    ---
    
    ## Configuration
    
    All configuration is via environment variables in `.env`:
    
    | Variable | Default | Description |
    |----------|---------|-------------|
    | `SECRET_KEY` | auto-generated | Session signing key |
    | `DB_PASSWORD` | auto-generated | PostgreSQL password |
    | `ADMIN_PASSWORD` | auto-generated | Dashboard login password |
    | `N8N_PASSWORD` | auto-generated | n8n basic auth password |
    | `OLLAMA_MODEL` | `llama3.1` | LLM model for generating responses |
    | `OLLAMA_EMBED_MODEL` | `nomic-embed-text` | Embedding model for vector search |
    | `DEPLOY_HOST` | - | Server IP for Stacker deployment |
    | `BASE_PATH` | - | Local pr
    
    ...