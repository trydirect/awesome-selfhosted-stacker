name: private-sovereign-ai
version: "1.0.1"

project:
  identity: private-sovereign-ai

install:
  inputs:
    commonDomain: private-sovereign-ai.try.direct

config_contract:
  services:
    app:
      fields:
        # The buyer's own address. Declared so the bake turns the literal URL
        # baked into the compose back into ${WEBUI_URL}: without it every clone
        # would keep pointing links and redirects at the author's domain.
        WEBUI_URL:
          mutability: provided
          display: string
        WEBUI_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        INITIAL_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    sovereign-ai-ollama:
      volumes:
        # Model weights: gigabytes behind a pull. No credentials — Ollama holds
        # no secret of its own.
        sovereign_ai_ollama:
          mutability: fixed
    sovereign-ai-pipelines:
      volumes:
        # The integration scripts the author ships. Credentials for whatever a
        # pipeline talks to are Open WebUI "valves", stored in its own volume
        # (sovereign_ai_webui), which resets — so nothing secret lives here.
        sovereign_ai_pipelines:
          mutability: fixed
hooks:
  pre_build: ./scripts/generate-secrets.sh

app:
  type: custom
  image: ghcr.io/open-webui/open-webui:main
  # No host port publish — traffic reaches this container only via
  # the NPM reverse proxy on 443. Internal docker port stays 8080.
  environment:
    OLLAMA_BASE_URL: "http://sovereign-ai-ollama:11434"
    WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
    WEBUI_URL: "${WEBUI_URL}"
    SCARF_NO_ANALYTICS: "true"
    DO_NOT_TRACK: "true"
    ANONYMIZED_TELEMETRY: "false"
    ENABLE_SIGNUP: "false"
    DEFAULT_USER_ROLE: "user"
    ENABLE_COMMUNITY_SHARING: "false"
    WEBUI_AUTH: "true"
    ENABLE_RAG_WEB_SEARCH: "false"
    RAG_EMBEDDING_ENGINE: "ollama"
    RAG_EMBEDDING_MODEL: "nomic-embed-text"
    RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE: "true"
  volumes:
    - sovereign_ai_webui:/app/backend/data
  healthcheck:
    test: "CMD-SHELL curl -fsS http://localhost:8080/health || exit 1"
    interval: 30s
    timeout: 5s
    retries: 5

services:
  # Ollama — the local LLM runtime. Internal-only, reached from Open WebUI
  # via the docker DNS alias sovereign-ai-ollama:11434.
  - name: sovereign-ai-ollama
    image: ollama/ollama:latest
    environment: {}
    volumes:
      - sovereign_ai_ollama:/root/.ollama
    healthcheck:
      test: "CMD-SHELL ollama list >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 10

  # Pipelines — Open WebUI plugin runtime. Internal-only; Open WebUI
  # auto-discovers it on the docker network.
  - name: sovereign-ai-pipelines
    image: ghcr.io/open-webui/pipelines:main
    environment:
      PIPELINES_URLS: ""
    volumes:
      - sovereign_ai_pipelines:/app/pipelines
    healthcheck:
      test: "CMD-SHELL curl -fsS http://localhost:9099/ || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  sovereign_ai_webui: {}
  sovereign_ai_ollama: {}
  sovereign_ai_pipelines: {}

deploy:
  target: cloud
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: hel1
    size: cpx32
    key: htz-0
    # Only SSH + HTTP + HTTPS public. Open WebUI, Ollama, and Pipelines
    # are reached only via the NPM reverse proxy over HTTPS.
    public_ports:
      - "22"
      - "80"
      - "443"

# NPM auto-provisions the reverse proxy and issues a Let's Encrypt cert
# when this stack deploys. DNS for commonDomain must resolve to the server
# IP before deploy so LE HTTP-01 challenge succeeds.
proxy:
  type: nginx-proxy-manager
  auto_detect: true
  domains:
    - domain: "${commonDomain}"
      ssl: auto
      upstream: "app:8080"

monitoring:
  status_panel: true
  healthcheck:
    endpoint: /health
    interval: 30s

env_file: .env

marketplace:
  publish: true
  display_name: "Private Sovereign Ai"
  short_description: "Private sovereign AI stack combining Open WebUI and Ollama for fully local LLM use. Zero data leaves your server."
  long_description: |
    **Private Sovereign AI**: Private sovereign AI stack combining Open WebUI and Ollama for fully local LLM use. Zero data leaves your server.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | internal | Web UI |
    | sovereign-ai-ollama | internal | LLM runtime |
    | sovereign-ai-pipelines | internal | Web UI |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/private-sovereign-ai

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [private sovereign ai]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/private-sovereign-ai
  no_secrets_confirmation: true
