name: openproject
version: "14.3.0"

app:
  type: custom
  image: openproject/openproject:16
  ports:
    - "8080:80"
  environment:
    OPENPROJECT_HOST__NAME: ${DOMAIN}
    OPENPROJECT_HTTPS: "true"
    OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE}
    OPENPROJECT_DB__POSTGRESQL__HOST: postgres
    OPENPROJECT_DB__POSTGRESQL__PORT: "5432"
    OPENPROJECT_DB__POSTGRESQL__DATABASE: openproject
    OPENPROJECT_DB__POSTGRESQL__USERNAME: openproject
    OPENPROJECT_DB__POSTGRESQL__PASSWORD: ${OPENPROJECT_DATABASE_PASSWORD}
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "/"
    OPENPROJECT MAILER__SENDMETHOD: smtp
    OPENPROJECT_MAILER__SMTP__HOST: mailcatcher
    OPENPROJECT_MAILER__SMTP__PORT: "1025"
    OPENPROJECT_MAILER__SMTP__ENABLE__STARTTLS: "false"
  volumes:
    - "openproject-assets:/var/openproject/assets"
    - "openproject-logs:/var/openproject/logs"

services:
  - name: openproject-worker
    image: openproject/openproject:16
    command: bundle exec rails jobs:work
    environment:
      OPENPROJECT_HOST__NAME: ${DOMAIN}
      OPENPROJECT_HTTPS: "true"
      OPENPROJECT_SECRET_KEY_BASE: ${OPENPROJECT_SECRET_KEY_BASE}
      OPENPROJECT_DB__POSTGRESQL__HOST: postgres
      OPENPROJECT_DB__POSTGRESQL__PORT: "5432"
      OPENPROJECT_DB__POSTGRESQL__DATABASE: openproject
      OPENPROJECT_DB__POSTGRESQL__USERNAME: openproject
      OPENPROJECT_DB__POSTGRESQL__PASSWORD: ${OPENPROJECT_DATABASE_PASSWORD}
    volumes:
      - "openproject-assets:/var/openproject/assets"
    depends_on:
      - postgres

  - name: postgres
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: openproject
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: ${OPENPROJECT_DATABASE_PASSWORD}
    volumes:
      - "openproject-postgres:/var/lib/postgresql/data"

  - name: mailcatcher
    image: sj26/mailcatcher:0.9.0
    ports:
      - "1080:1080"


install:
  inputs:
    domain: projects.try.direct
    openproject-secret-key-base: ""
    openproject-database-password: ""

config_contract:
  services:
    app:
      fields:
        OPENPROJECT_DB__POSTGRESQL__PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENPROJECT_SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENPROJECT_DB__POSTGRESQL__DATABASE:
          mutability: editable
        OPENPROJECT_DB__POSTGRESQL__HOST:
          mutability: editable
        OPENPROJECT_DB__POSTGRESQL__PORT:
          mutability: editable
        OPENPROJECT_DB__POSTGRESQL__USERNAME:
          mutability: editable
        OPENPROJECT_HOST__NAME:
          mutability: editable
        OPENPROJECT_HTTPS:
          mutability: editable
        OPENPROJECT_MAILER__SMTP__ENABLE__STARTTLS:
          mutability: editable
        OPENPROJECT_MAILER__SMTP__HOST:
          mutability: editable
        OPENPROJECT_MAILER__SMTP__PORT:
          mutability: editable
        OPENPROJECT_RAILS__RELATIVE__URL__ROOT:
          mutability: editable
    openproject-worker:
      fields:
        OPENPROJECT_DB__POSTGRESQL__DATABASE:
          mutability: editable
        OPENPROJECT_DB__POSTGRESQL__HOST:
          mutability: editable
        OPENPROJECT_DB__POSTGRESQL__PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENPROJECT_DB__POSTGRESQL__PORT:
          mutability: editable
        OPENPROJECT_DB__POSTGRESQL__USERNAME:
          mutability: editable
        OPENPROJECT_HOST__NAME:
          mutability: editable
        OPENPROJECT_HTTPS:
          mutability: editable
        OPENPROJECT_SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        openproject-assets:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        openproject-postgres:
          mutability: generated

marketplace:
  publish: true
  display_name: "Openproject"
  short_description: "Open-source project management with Gantt charts, agile boards and wikis. Plan, track and release projects with OpenProject."
  long_description: |
    **openproject**: Open-source project management with Gantt charts, agile boards and wikis. Plan, track and release projects with OpenProject.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `openproject/openproject:16` |
    | openproject-worker | internal | Background worker |
    | postgres | internal | Database |
    | mailcatcher | 1080 (public) | `sj26/mailcatcher:latest` |

    ## What you configure

    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `OPENPROJECT_DB__POSTGRESQL__DATABASE`, `OPENPROJECT_DB__POSTGRESQL__HOST`, `OPENPROJECT_DB__POSTGRESQL__PORT`, `OPENPROJECT_DB__POSTGRESQL__USERNAME`, `OPENPROJECT_HOST__NAME`, `OPENPROJECT_HTTPS` and 12 more ship prefilled and can be adjusted in the deploy form

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/openproject

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [openproject]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/openproject
  no_secrets_confirmation: true
