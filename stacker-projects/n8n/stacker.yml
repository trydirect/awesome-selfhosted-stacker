name: n8n
version: "2.0.0"

project:
  identity: n8n

install:
  inputs:
    commonDomain: n8n.example.com

app:
  type: custom
  image: n8nio/n8n:2.45.4
  ports:
    - "5678:5678"
  environment:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER: n8n
    DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
    N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
    # Owner login, applied on every start by scripts/n8n-entrypoint.sh
    ADMIN_EMAIL: "${ADMIN_EMAIL}"
    ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    # The UI is served over plain HTTP on the server's IP
    N8N_SECURE_COOKIE: "false"
  volumes:
    - n8n_data:/home/node/.n8n
    - "./scripts/n8n-entrypoint.sh:/docker-entrypoint.sh:ro"
  depends_on:
    - postgres
  healthcheck:
    test: "CMD-SHELL wget -qO- http://localhost:5678/healthz/readiness || exit 1"
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

services:
  - name: postgres
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U n8n"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5678"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        N8N_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        ADMIN_EMAIL:
          mutability: provided
          pattern: "^[^@\\s\"]+@[^@\\s\"]+\\.[^@\\s\"]+$"
      volumes:
        n8n_data:
          mutability: generated
    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        postgres_data:
          mutability: generated
env_file: .env

volumes:
  n8n_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "n8n"
  short_description: "Workflow automation and AI agents with a visual editor and code when you need it, on your own server"
  long_description: |
    **n8n** (v2.45.4) is a fair-code platform for AI agents and workflow
    automation: a visual canvas, JavaScript and Python when you need them,
    and 1500+ integrations.

    Deploy from this page: TryDirect provisions the server, starts n8n with
    PostgreSQL and generates the database password, the encryption key for
    your stored credentials and your owner password for this deployment.
    Nothing is shared between deployments.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5678 (public) | `n8nio/n8n:2.45.4` |
    | postgres | internal | `postgres:17.11-alpine`, workflows and executions |

    ## What you configure

    - **ADMIN_EMAIL**: your owner login. The owner account exists before
      n8n starts serving, so nobody else can claim a fresh instance. The
      owner password is generated and shown in your project's secrets.

    The owner email and password are applied on every start; change them
    in the deployment's secrets, not in the n8n UI.

    ## Requirements

    - 2 GB RAM or more
    - The UI is served over plain HTTP on port 5678; put it behind HTTPS
      before using it for real credentials or public webhooks

    ## Alternative: deploy with the Stacker CLI

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/n8n
    cp .env.example .env    # set ADMIN_EMAIL
    ./scripts/generate-secrets.sh
    stacker deploy
    ```
  category: ai-agents
  tags: [n8n, workflow-automation, ai-agents, zapier-alternative, no-code]
  license: free
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/n8n
  no_secrets_confirmation: true
