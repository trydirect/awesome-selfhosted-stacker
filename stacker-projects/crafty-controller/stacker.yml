name: crafty-controller

project:
  identity: crafty-controller

install:
  inputs:
    commonDomain: minecraft.example.com

app:
  type: custom
  image: registry.gitlab.com/crafty-controller/crafty-4:4.3.0
  ports:
    - "8443:8443"
    - "25565:25565"
  environment:
    TZ: Etc/UTC
  volumes:
    - crafty_data:/crafty/app/config
    - crafty_backups:/crafty/app/backups
    - crafty_servers:/crafty/servers

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8443"
      - "25565"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  crafty_data: {}
  crafty_backups: {}
  crafty_servers: {}

marketplace:
  publish: true
  display_name: "Crafty Controller"
  short_description: "Web-based Minecraft server manager and launcher. Create, schedule and monitor Minecraft servers with automatic backups through Crafty Controller."
  long_description: |
    **Crafty Controller**: Web-based Minecraft server manager and launcher. Create, schedule and monitor Minecraft servers with automatic backups through Crafty Controller.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8443 (public), 25565 (public) | `registry.gitlab.com/crafty-controller/crafty-4:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/crafty-controller

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [crafty controller]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/crafty-controller
  no_secrets_confirmation: true
