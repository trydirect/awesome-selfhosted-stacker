name: hugo

project:
  identity: hugo

install:
  inputs:
    commonDomain: blog.example.com

app:
  type: custom
  image: klakegg/hugo:0.111.3
  ports:
    - "1313:1313"
  command: server --bind 0.0.0.0 --baseURL http://localhost:1313
  volumes:
    - hugo_data:/src

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "1313"

monitoring:
  status_panel: true

env_file: .env

volumes:
  hugo_data: {}

config_contract:
  services:
    app:
      volumes:
        hugo_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Hugo"
  short_description: "Deploy and preview the world's fastest static site generator. Build a Hugo site with theme and content served instantly."
  long_description: |
    **Hugo**: Deploy and preview the world's fastest static site generator. Build a Hugo site with theme and content served instantly.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 1313 (public) | `klakegg/hugo:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/hugo

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [hugo]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/hugo
  no_secrets_confirmation: true
