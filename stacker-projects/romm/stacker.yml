name: romm
version: 1.0.0
project:
  identity: romm
app:
  type: custom
  image: rommapp/romm:latest
  ports:
  - "8080:8080"
  environment:
    DB_HOST: romm-db
    DB_NAME: romm
    DB_USER: romm-user
    DB_PASSWD: ${DB_PASSWD}
    ROMM_AUTH_SECRET_KEY: ${ROMM_AUTH_SECRET_KEY}
    SCREENSCRAPER_USER: ${SCREENSCRAPER_USER}
    SCREENSCRAPER_PASSWORD: ${SCREENSCRAPER_PASSWORD}
    RETROACHIEVEMENTS_API_KEY: ${RETROACHIEVEMENTS_API_KEY}
    STEAMGRIDDB_API_KEY: ${STEAMGRIDDB_API_KEY}
    HASHEOUS_API_ENABLED: 'true'
  volumes:
  - romm_resources:/romm/resources
  - romm_redis_data:/redis-data
  - ./library:/romm/library
  - ./assets:/romm/assets
  - ./config:/romm/config
services:
- name: romm-db
  image: mariadb:11.8.8
  environment:
    MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    MARIADB_DATABASE: romm
    MARIADB_USER: romm-user
    MARIADB_PASSWORD: ${DB_PASSWD}
  volumes:
  - mysql_data:/var/lib/mysql
  healthcheck:
    test: CMD healthcheck.sh --connect --innodb_initialized
    interval: 10s
    timeout: 5s
    retries: 10
volumes:
  mysql_data: {}
  romm_resources: {}
  romm_redis_data: {}
install:
  inputs:
    commonDomain: romm.example.com
config_contract:
  services:
    app:
      fields:
        RETROACHIEVEMENTS_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ROMM_AUTH_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SCREENSCRAPER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        STEAMGRIDDB_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    romm-db:
      required:
      - MARIADB_DATABASE
      - MARIADB_USER
      fields:
        MARIADB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MARIADB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    romm:
      required:
      - DB_HOST
      - DB_NAME
      - DB_USER
      secret:
      - DB_PASSWD
      - ROMM_AUTH_SECRET_KEY
      optional:
      - SCREENSCRAPER_USER
      - SCREENSCRAPER_PASSWORD
      - RETROACHIEVEMENTS_API_KEY
      - STEAMGRIDDB_API_KEY
hooks:
  pre_build: ./scripts/generate-secrets.sh
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    public_ports:
    - '8080'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
monitoring:
  status_panel: true
env_file: .env

marketplace:
  publish: true
  display_name: "Romm"
  short_description: "ROM manager and emulator library with a beautiful web UI. Organize, scan and play your retro game collection."
  long_description: |
    **Romm**: ROM manager and emulator library with a beautiful web UI. Organize, scan and play your retro game collection.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `rommapp/romm:latest` |
    | romm-db | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 6 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/romm

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [romm]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/romm
  no_secrets_confirmation: true
