name: sonarqube

project:
  identity: sonarqube

app:
  type: custom
  image: sonarqube:26.10.0.133078-community
  ports:
    - "9000:9000"
  environment:
    SONAR_JDBC_URL: "jdbc:postgresql://postgres:5432/sonarqube"
    SONAR_JDBC_USERNAME: sonar
    SONAR_JDBC_PASSWORD: "${POSTGRES_PASSWORD}"
  volumes:
    - sonarqube_data:/opt/sonarqube/data
    - sonarqube_extensions:/opt/sonarqube/extensions
    - sonarqube_logs:/opt/sonarqube/logs

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - sonarqube_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: "CMD pg_isready -U sonar -d sonarqube"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sonarqube_data: {}
  sonarqube_extensions: {}
  sonarqube_logs: {}
  sonarqube_pgdata: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        SONAR_JDBC_URL:
          mutability: editable
        SONAR_JDBC_USERNAME:
          mutability: editable
        SONAR_JDBC_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        sonarqube_data:
          mutability: generated
        sonarqube_extensions:
          mutability: generated
        sonarqube_logs:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_USER:
          mutability: editable
      volumes:
        sonarqube_pgdata:
          mutability: generated

marketplace:
  publish: true
  display_name: "SonarQube"
  short_description: "Code quality and security analysis for 30+ languages (community edition)"
  long_description: |
    **SonarQube**: Code quality and security analysis for 30+ languages (community edition)

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9000 (public) | `sonarqube:26.10.0.133078-community` — web UI and scanner API |
    | postgres | internal | `postgres:16-alpine` — analysis database |

    ## What you configure

    - **Defaults provided**: `SONAR_JDBC_URL`, `SONAR_JDBC_USERNAME`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (4 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/sonarqube

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [sonarqube]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/sonarqube
  no_secrets_confirmation: true
