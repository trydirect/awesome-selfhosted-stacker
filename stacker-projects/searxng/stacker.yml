name: searxng
version: "2024.2.10"

app:
  type: custom
  image: searxng/searxng:latest
  ports:
    - "8080:8080"
  environment:
    SEARXNG_BASE_URL: https://${DOMAIN}
    SEARXNG_SECRET: ${SEARXNG_SECRET}
    SEARXNG_RATELIMIT: true
    SEARXNG_RATE_LIMIT_IP: 1/minute
    SEARXNG_RATE_LIMIT_PER_IP: 3/second
  volumes:
    - "searxng-data:/etc/searxng"


install:
  inputs:
    domain: search.try.direct
    searxng-secret: ""
proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

env_file: .env

volumes:
  searxng-data: {}

config_contract:
  services:
    app:
      fields:
        SEARXNG_BASE_URL:
          mutability: editable
        SEARXNG_RATELIMIT:
          mutability: editable
        SEARXNG_RATE_LIMIT_IP:
          mutability: editable
        SEARXNG_RATE_LIMIT_PER_IP:
          mutability: editable
        SEARXNG_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        searxng-data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Searxng"
  short_description: "Privacy-respecting metasearch engine that aggregates results from many engines. Search the web without being tracked."
  long_description: |
    **SearXNG**: Privacy-respecting metasearch engine that aggregates results from many engines. Search the web without being tracked.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `searxng/searxng:latest` |

    ## What you configure

    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `SEARXNG_BASE_URL`, `SEARXNG_RATELIMIT`, `SEARXNG_RATE_LIMIT_IP`, `SEARXNG_RATE_LIMIT_PER_IP` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/searxng

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [searxng]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/searxng
  no_secrets_confirmation: true
