name: searxng
version: "2024.2.10"

app:
  type: custom
  image: searxng/searxng:latest
  ports:
    - "8080:8080"
  environment:
    SEARXNG_BASE_URL: https://${DOMAIN}
    SEARXNG_SECRET: ${SEARXNG_SECRET}
    SEARXNG_RATELIMIT: true
    SEARXNG_RATE_LIMIT_IP: 1/minute
    SEARXNG_RATE_LIMIT_PER_IP: 3/second
  volumes:
    - "searxng-data:/etc/searxng"


install:
  inputs:
    domain: search.try.direct
    searxng-secret: ""
proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

env_file: .env

volumes:
  searxng-data: {}
