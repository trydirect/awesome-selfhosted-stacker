name: actual

app:
  type: custom
  image: actualbudget/actual-server:latest
  ports:
    - "3000:5006/tcp"
  environment:
    DB_PASSWORD: ${DB_PASSWORD}
  volumes:
    - actual_data:/data
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost:5006"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s

services:
  - name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: actual
      POSTGRES_USER: actual
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - actual_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U actual -d actual"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  actual_data: {}
  actual_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        actual_data:
          mutability: generated
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        actual_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Actual App"
  short_description: "Personal finance manager with envelope budgeting and local-first data storage"
  long_description: |
    **actual**: Personal finance manager with envelope budgeting and local-first data storage

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5006/tcp (public on 3000) | API server |
    | db | internal | Database |

    ## What you configure

    - **Defaults provided**: `DB_HOST`, `DB_NAME`, `DB_PORT`, `DB_USER`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/actual

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [actual app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/actual
  no_secrets_confirmation: true
