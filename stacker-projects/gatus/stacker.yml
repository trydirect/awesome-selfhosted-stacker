name: gatus

project:
  identity: gatus

app:
  type: custom
  image: twinproduction/gatus:v5.38.0
  ports:
    - "8080:8080"
  volumes:
    - gatus_data:/data

volumes:
  gatus_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields: {}
      volumes:
        gatus_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Gatus"
  short_description: "Status dashboard with health checks, alerts and uptime badges"
  long_description: |
    **Gatus**: Status dashboard with health checks, alerts and uptime badges

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `twinproduction/gatus:v5.38.0` — status and health dashboard |

    ## What you configure

    - Endpoints, conditions and alerting providers are defined in
      `config.yaml` inside the generated `gatus_data` volume; a default
      configuration is created on first start

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/gatus

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [gatus]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/gatus
  no_secrets_confirmation: true
