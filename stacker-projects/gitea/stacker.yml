name: gitea
version: 1.21.0
organization: null
project:
  identity: gitea
app:
  type: custom
  path: .
  dockerfile: null
  image: gitea/gitea:latest
  build: null
  ports:
  - "3000:3000"
  - "2222:22"
  volumes:
  - gitea_data:/data
  environment:
    GITEA_SERVER_ROOT_URL: https://git.example.com/
    GITEA_RUN_MODE: prod
    GITEA_DATABASE_HOST: gitea_db:5432
    GITEA_DATABASE_NAME: gitea
    GITEA_DATABASE_USER: gitea
    GITEA_SERVER_HTTP_PORT: '3000'
    GITEA_SERVER_DOMAIN: git.example.com
    GITEA_SECURITY_INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    GITEA_SERVER_SSH_PORT: '2222'
    GITEA_DATABASE_TYPE: postgres
    GITEA_DATABASE_PASSWD: ${DB_PASSWORD}
    GITEA_SECURITY_SECRET_KEY: ${SECRET_KEY}
  command: null
  healthcheck: null
services:
- name: gitea_db
  image: postgres:16-alpine
  ports:
  - "127.0.0.1:5432:5432"
  environment:
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: gitea
    POSTGRES_USER: gitea
  volumes:
  - gitea_db:/var/lib/postgresql/data
  depends_on: []
  command: null
  healthcheck:
    test: CMD-SHELL pg_isready -U gitea -d gitea
    interval: 10s
    timeout: 5s
    retries: 10
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '3000'
    - '2222'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: git.example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        GITEA_SECURITY_INTERNAL_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        GITEA_DATABASE_PASSWD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        GITEA_SECURITY_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    gitea_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "Gitea"
  short_description: "Lightweight self-hosted Git service with code review, issues and packages. A fast GitHub alternative written in Go."
  long_description: |
    **Gitea**: Lightweight self-hosted Git service with code review, issues and packages. A fast GitHub alternative written in Go.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public), 22 (public on 2222) | `gitea/gitea:1.22.3` |
    | gitea_db | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/gitea

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [gitea]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/gitea
  no_secrets_confirmation: true
