name: ofelia

app:
  type: custom
  image: mcuadros/ofelia:latest
  environment:
    OFELIA_HOST: "ofelia"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./ofelia.ini:/etc/ofelia/config.ini:ro

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports: []

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        OFELIA_HOST:
          mutability: editable
        volumes:
          mutability: editable

marketplace:
  publish: true
  display_name: "Ofelia"
  short_description: "Modern Docker job scheduler and cron replacement. Run periodic commands inside your containers with rich scheduling and email notifications."
  long_description: |
    **ofelia**: Modern Docker job scheduler and cron replacement. Run periodic commands inside your containers with rich scheduling and email notifications.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | internal | `mcuadros/ofelia:latest` |

    ## What you configure

    - **Defaults provided**: `OFELIA_HOST` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/ofelia

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [ofelia]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/ofelia
  no_secrets_confirmation: true
