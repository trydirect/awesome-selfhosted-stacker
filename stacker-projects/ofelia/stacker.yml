name: ofelia

app:
  type: custom
  image: mcuadros/ofelia:latest
  environment:
    OFELIA_HOST: "ofelia"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ./ofelia.ini:/etc/ofelia/config.ini:ro

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports: []

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        OFELIA_HOST:
          mutability: editable
        volumes:
          mutability: editable
