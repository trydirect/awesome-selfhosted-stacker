name: onetimesecret

project:
  identity: onetimesecret

app:
  type: custom
  image: onetimesecret/onetimesecret:0.16.1
  ports:
    - "3000:3000"
  environment:
    REDIS_URL: redis://onetimesecret-redis:6379
    HOSTNAME: localhost
    SECRET: ${SECRET}
  volumes:
    - ots_data:/var/lib/onetimesecret

services:
  - name: onetimesecret-redis
    image: redis:7.4-alpine
    volumes:
      - ots_redis:/data
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ots_data: {}
  ots_redis: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: onetimesecret.example.com
      ssl: off
      upstream: app:3000

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

deploy:
  target: cloud
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"

config_contract:
  services:
    app:
      fields:
        SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HOSTNAME:
          mutability: editable
        REDIS_URL:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Onetimesecret"
  short_description: "Share sensitive information via links that self-destruct after reading. One-time secrets for passwords, keys and credentials."
  long_description: |
    **Onetimesecret**: Share sensitive information via links that self-destruct after reading. One-time secrets for passwords, keys and credentials.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `onetimesecret/onetimesecret:latest` |
    | onetimesecret-redis | internal | Cache |

    ## What you configure

    - **Defaults provided**: `HOSTNAME`, `REDIS_URL` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/onetimesecret

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [onetimesecret]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/onetimesecret
  no_secrets_confirmation: true
