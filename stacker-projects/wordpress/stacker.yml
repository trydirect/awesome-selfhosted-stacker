name: wordpress
version: 6.5.0
project:
  identity: wordpress
install:
  inputs:
    commonDomain: wordpress.example.com
app:
  type: php
  image: wordpress
  ports:
  - "8080:80"
  environment:
    WORDPRESS_DB_HOST: wordpress_db:3306
    WORDPRESS_DB_NAME: wordpress
    WORDPRESS_DB_USER: wordpress
    WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    WORDPRESS_TABLE_PREFIX: wp_
    WORDPRESS_DEBUG: 'false'
  volumes:
  - wordpress_data:/var/www/html
services:
- name: wordpress_db
  image: mysql:8.0
  environment:
    MYSQL_DATABASE: wordpress
    MYSQL_USER: wordpress
    MYSQL_PASSWORD: ${DB_PASSWORD}
    MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  ports:
  - "127.0.0.1:3306:3306"
  volumes:
  - wordpress_db:/var/lib/mysql
  healthcheck:
    test: CMD mysqladmin ping -h localhost
    interval: 10s
    timeout: 5s
    retries: 10
volumes:
  wordpress_db: {}
  wordpress_data: {}
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '8080'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
config_contract:
  services:
    app:
      fields:
        WORDPRESS_DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    wordpress_db:
      fields:
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
monitoring:
  status_panel: true
env_file: .env

marketplace:
  publish: true
  display_name: "Wordpress"
  short_description: "The world's most popular CMS, deployed with MySQL. Publish sites, blogs and shops with thousands of plugins."
  long_description: |
    **wordpress**: The world's most popular CMS, deployed with MySQL. Publish sites, blogs and shops with thousands of plugins.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `wordpress:6.6` |
    | wordpress_db | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/wordpress

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [wordpress]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/wordpress
  no_secrets_confirmation: true
