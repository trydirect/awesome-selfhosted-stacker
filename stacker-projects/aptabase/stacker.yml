name: "aptabase"
version: "1.0.0"
project:
  identity: "aptabase"
install:
  inputs:
    commonDomain: "aptabase.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "ghcr.io/aptabase/aptabase:0.4.2"
  ports:
    - "3000:8080"
  environment:
    ASPNETCORE_URLS: "http://0.0.0.0:8080"
    BASE_URL: "${BASE_URL}"
    DATABASE_URL: "Host=postgres;Port=5432;Database=aptabase;Username=aptabase;Password=${DB_PASSWORD}"
    CLICKHOUSE_URL: "Host=clickhouse;Protocol=http;Port=8123;Username=aptabase;Password=${CLICKHOUSE_PASSWORD};Database=default"
    AUTH_SECRET: "${AUTH_SECRET}"
services:
  - name: "postgres"
    image: "postgres:16.4-alpine"
    environment:
      POSTGRES_DB: "aptabase"
      POSTGRES_USER: "aptabase"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "aptabase_postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: "CMD-SHELL pg_isready -U aptabase -d aptabase"
      interval: "10s"
      timeout: "5s"
      retries: 10
  - name: "clickhouse"
    image: "clickhouse/clickhouse-server:23.8.4.69"
    environment:
      CLICKHOUSE_DB: "default"
      CLICKHOUSE_USER: "aptabase"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
    volumes:
      - "aptabase_clickhouse_data:/var/lib/clickhouse"
    healthcheck:
      test: "CMD-SHELL wget -qO- http://127.0.0.1:8123/ping || exit 1"
      interval: "10s"
      timeout: "5s"
      retries: 10
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: aptabase.example.com
      ssl: off
      upstream: app:8080
deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  aptabase_postgres_data: {}
  aptabase_clickhouse_data: {}

config_contract:
  services:
    app:
      fields:
        AUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ASPNETCORE_URLS:
          mutability: editable
        BASE_URL:
          mutability: editable
        CLICKHOUSE_URL:
          mutability: editable
        DATABASE_URL:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        aptabase_postgres_data:
          mutability: generated
    clickhouse:
      fields:
        CLICKHOUSE_DB:
          mutability: editable
        CLICKHOUSE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CLICKHOUSE_USER:
          mutability: editable
      volumes:
        aptabase_clickhouse_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Aptabase"
  short_description: "Privacy-friendly, open-source analytics for mobile and desktop apps. GDPR-compliant app analytics you fully own on your own server."
  long_description: |
    **Aptabase**: Privacy-friendly, open-source analytics for mobile and desktop apps. GDPR-compliant app analytics you fully own on your own server.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public on 3000) | `ghcr.io/aptabase/aptabase:main` |
    | postgres | internal | Database |
    | clickhouse | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ASPNETCORE_URLS`, `BASE_URL`, `CLICKHOUSE_URL`, `DATABASE_URL`, `CLICKHOUSE_DB`, `CLICKHOUSE_USER` and 2 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/aptabase

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [aptabase]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/aptabase
  no_secrets_confirmation: true
