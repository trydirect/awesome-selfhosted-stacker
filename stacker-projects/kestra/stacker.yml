name: kestra

project:
  identity: kestra

install:
  inputs:
    commonDomain: workflows.example.com

app:
  type: custom
  image: kestra/kestra:v0.19.8
  ports:
    - "8080:8080"
  environment:
    KESTRA_CONFIGURATION: |
      datasources:
        postgres:
          url: jdbc:postgresql://postgres:5432/kestra
          driver-class-name: org.postgresql.Driver
          username: kestra
          password: ${DB_PASSWORD}
      kestra:
        repository:
          type: postgres
        storage:
          type: local
          local:
            base-path: /app/storage
        queue:
          type: postgres
        tasks:
          tmp-dir:
            path: /tmp/kestra-wd/tmp
        url: http://localhost:8080/
  command: server standalone
  volumes:
    - kestra_data:/app/storage
    - kestra_tmp:/tmp/kestra-wd

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U kestra"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: kestra.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        KESTRA_CONFIGURATION:
          mutability: editable
        command:
          mutability: editable
        datasources:
          mutability: editable
        kestra:
          mutability: editable
        local:
          mutability: editable
        path:
          mutability: editable
        postgres:
          mutability: editable
        queue:
          mutability: editable
        repository:
          mutability: editable
        storage:
          mutability: editable
        tasks:
          mutability: editable
        type:
          mutability: editable
        url:
          mutability: editable
        username:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  kestra_data: {}
  kestra_tmp: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Kestra"
  short_description: "Event-driven orchestration platform for scheduling and workflows as YAML code. Run data pipelines, CI jobs and automations at scale."
  long_description: |
    **Kestra**: Event-driven orchestration platform for scheduling and workflows as YAML code. Run data pipelines, CI jobs and automations at scale.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `kestra/kestra:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `KESTRA_CONFIGURATION`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/kestra

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [kestra]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/kestra
  no_secrets_confirmation: true
