name: vane
version: "1.0.0"

project:
  identity: vane

install:
  inputs:
    commonDomain: vane.example.com

app:
  type: custom
  image: itzcrazykns1337/vane:v1.12.2
  ports:
    - "3000:3000"
  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  volumes:
    - vane_data:/home/vane/data
  healthcheck:
    test: "CMD-SHELL curl -fs http://$(hostname):3000/"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 120s

volumes:
  vane_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        OPENAI_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENAI_BASE_URL:
          mutability: editable
      volumes:
        vane_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Vane"
  short_description: "Security vulnerability scanner for containers and infrastructure"
  long_description: |
    **Vane**: Security vulnerability scanner for containers and infrastructure

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `itzcrazykns1337/vane:v1.12.2` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `OPENAI_BASE_URL` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/vane

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [vane]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/vane
  no_secrets_confirmation: true
