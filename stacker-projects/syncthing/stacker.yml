name: syncthing

app:
  type: custom
  image: lscr.io/linuxserver/syncthing:latest
  ports:
    - "8384:8384"
    - "22000:22000/tcp"
    - "22000:22000/udp"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - syncthing_config:/config
    - syncthing_data:/data

volumes:
  syncthing_config: {}
  syncthing_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Syncthing"
  short_description: "Continuous, peer-to-peer file synchronization between devices. No cloud, no tracking, your files stay on your hardware."
  long_description: |
    **Syncthing**: Continuous, peer-to-peer file synchronization between devices. No cloud, no tracking, your files stay on your hardware.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8384 (public), 22000/tcp (public on 22000), 22000/udp (public on 22000) | API server |

    ## What you configure

    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/syncthing

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [syncthing]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/syncthing
  no_secrets_confirmation: true
