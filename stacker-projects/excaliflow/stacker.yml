name: excaliflow
version: "1.0.0"

project:
  identity: excaliflow

install:
  inputs:
    commonDomain: excaliflow.example.com

app:
  type: custom
  image: optimum/excaliflow:1.0.0
  ports:
    - "3000:3000"
  environment:
    PORT: "3000"
  healthcheck:
    test: "CMD wget -q -O /dev/null http://localhost:3000/"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 20s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PORT:
          mutability: editable
          required: false

marketplace:
  publish: true
  display_name: "Excaliflow"
  short_description: "Excalidraw-style diagrams with live animated flows"
  long_description: |
    **Excaliflow**: Excalidraw-style diagrams with live animated flows

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `optimum/excaliflow:1.0.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PORT` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/excaliflow

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [excaliflow]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/excaliflow
  no_secrets_confirmation: true
