name: excaliflow
version: "1.0.0"

project:
  identity: excaliflow

install:
  inputs:
    commonDomain: excaliflow.example.com

app:
  type: custom
  dockerfile: Dockerfile
  ports:
    - "3000:3000"
  environment:
    PORT: "3000"
  healthcheck:
    test: "CMD wget -q -O /dev/null http://localhost:3000/"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 20s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PORT:
          mutability: editable
          required: false
