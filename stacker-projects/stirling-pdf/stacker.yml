name: stirling-pdf

app:
  type: custom
  image: frooodle/s-pdf:latest
  ports:
    - "8080:8080"
  volumes:
    - stirling_data:/usr/share/tessdata
    - stirling_config:/configs

volumes:
  stirling_data: {}
  stirling_config: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: server
  server:
    host: 178.105.135.200
    user: root
    ssh_key: ~/.config/stacker/ssh/server-438_ed25519
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"
