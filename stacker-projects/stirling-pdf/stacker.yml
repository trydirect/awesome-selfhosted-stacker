name: stirling-pdf

app:
  type: custom
  image: frooodle/s-pdf:latest
  ports:
    - "8080:8080"
  volumes:
    - stirling_data:/usr/share/tessdata
    - stirling_config:/configs

volumes:
  stirling_data: {}
  stirling_config: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: cloud
  server: null
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"


config_contract:
  services:
    app:
      volumes:
        stirling_data:
          mutability: generated
        stirling_config:
          mutability: generated

marketplace:
  publish: true
  display_name: "Stirling Pdf"
  short_description: "Web-based PDF toolkit: merge, split, convert, compress, OCR and more. Do everything with PDFs locally in your browser."
  long_description: |
    **Stirling PDF**: Web-based PDF toolkit: merge, split, convert, compress, OCR and more. Do everything with PDFs locally in your browser.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `frooodle/s-pdf:latest` |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/stirling-pdf

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [stirling pdf]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/stirling-pdf
  no_secrets_confirmation: true
