name: libredesk

app:
  type: custom
  image: libredesk/libredesk:v2.9.0
  ports:
    - "9000:9000/tcp"
  environment:
    LIBREDESK_SYSTEM_USER_PASSWORD: ${ADMIN_PASSWORD}
  command: sh -c "./libredesk --install --idempotent-install --yes --config /libredesk/config.toml && ./libredesk --upgrade --yes --config /libredesk/config.toml && ./libredesk --config /libredesk/config.toml"
  volumes:
    - ./config.toml:/libredesk/config.toml
    - libredesk_uploads:/libredesk/uploads
  depends_on:
    - db
    - redis
  healthcheck:
    test: "CMD curl -fs http://localhost:9000/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 120s

services:
  - name: db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: libredesk
      POSTGRES_USER: libredesk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - libredesk_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U libredesk -d libredesk"
      interval: 10s
      timeout: 5s
      retries: 6
  - name: redis
    image: redis:7.4-alpine
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  libredesk_uploads: {}
  libredesk_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        LIBREDESK_SYSTEM_USER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        libredesk_db:
          mutability: generated

marketplace:
  display_name: "Libredesk"
