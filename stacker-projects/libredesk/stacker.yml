name: libredesk

app:
  type: custom
  image: libredesk/libredesk:v2.9.0
  ports:
    - "9000:9000/tcp"
  environment:
    LIBREDESK_SYSTEM_USER_PASSWORD: ${ADMIN_PASSWORD}
  command: sh -c "./libredesk --install --idempotent-install --yes --config /libredesk/config.toml && ./libredesk --upgrade --yes --config /libredesk/config.toml && ./libredesk --config /libredesk/config.toml"
  volumes:
    - ./config.toml:/libredesk/config.toml
    - libredesk_uploads:/libredesk/uploads
  depends_on:
    - db
    - redis
  healthcheck:
    test: "CMD curl -fs http://localhost:9000/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 120s

services:
  - name: db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: libredesk
      POSTGRES_USER: libredesk
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - libredesk_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U libredesk -d libredesk"
      interval: 10s
      timeout: 5s
      retries: 6
  - name: redis
    image: redis:7.4-alpine
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  libredesk_uploads: {}
  libredesk_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        LIBREDESK_SYSTEM_USER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        libredesk_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Libredesk"
  short_description: "Self-hosted libredesk"
  long_description: |
    **libredesk**: Self-hosted libredesk

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9000/tcp (public on 9000) | `libredesk/libredesk:latest` |
    | db | internal | Database |
    | redis | internal | Cache |

    ## What you configure

    - **Defaults provided**: `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/libredesk

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [libredesk app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/libredesk
  no_secrets_confirmation: true
