name: docker-socket-proxy

app:
  type: custom
  image: tecnativa/docker-socket-proxy:v0.5.0
  ports:
    - "2375:2375"
  environment:
    CONTAINERS: "1"
    SERVICES: "1"
    POST: "0"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "2375"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CONTAINERS:
          mutability: editable
        POST:
          mutability: editable
        SERVICES:
          mutability: editable

marketplace:
  publish: true
  display_name: "Docker Socket Proxy App"
  short_description: "Self-hosted docker-socket-proxy"
  long_description: |
    **docker-socket-proxy**: Self-hosted docker-socket-proxy

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 2375 (public) | Reverse proxy |

    ## What you configure

    - **Defaults provided**: `CONTAINERS`, `POST`, `SERVICES` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/docker-socket-proxy

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [docker socket proxy app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/docker-socket-proxy
  no_secrets_confirmation: true
