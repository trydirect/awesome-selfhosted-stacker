name: uptimekuma
version: 1.0.0
organization: null
project:
  identity: uptimekuma
app:
  type: custom
  path: .
  dockerfile: null
  image: louislam/uptime-kuma:2
  build: null
  ports:
  - "3001:3001"
  volumes:
  - uptime_kuma_data:/app/data
  environment:
    TZ: ${TZ}
    UMASK: '0022'
  command: null
  healthcheck:
    test: CMD-SHELL curl -fsS http://localhost:3001 || exit 1
    interval: 30s
    timeout: 10s
    retries: 5
services: []
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '3001'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: uptimekuma.example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: null
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services: {}

marketplace:
  publish: true
  display_name: "Uptimekuma"
  short_description: "Self-hosted uptime monitoring with a status pages and many notification channels. Know the moment a service goes down."
  long_description: |
    **uptimekuma**: Self-hosted uptime monitoring with a status pages and many notification channels. Know the moment a service goes down.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3001 (public) | Web UI |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/uptimekuma

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [uptimekuma]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/uptimekuma
  no_secrets_confirmation: true
