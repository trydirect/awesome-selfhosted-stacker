name: apitable

app:
  type: custom
  image: apitable/all-in-one:latest
  ports:
    - "8084:80/tcp"
  environment:
    SERVER_PORT: "80"
    MYSQL_HOST: db
    MYSQL_PORT: "3306"
    MYSQL_USER: apitable
    MYSQL_PASSWORD: ${DB_PASSWORD}
    MYSQL_DATABASE: apitable
  volumes:
    - apitable_data:/var/lib/mysql
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost/80"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

services:
  - name: db
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: apitable
      MYSQL_USER: apitable
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - apitable_db:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  apitable_data: {}
  apitable_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8084"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_HOST:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MYSQL_PORT:
          mutability: editable
          display: number
        MYSQL_USER:
          mutability: editable
        SERVER_PORT:
          mutability: editable
          display: number
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        apitable_data:
          mutability: generated
    db:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        apitable_db:
          mutability: generated
