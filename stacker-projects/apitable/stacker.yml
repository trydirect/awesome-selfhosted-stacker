name: apitable

app:
  type: custom
  image: apitable/all-in-one:latest
  ports:
    - "8084:80/tcp"
  environment:
    APITABLE_URL: http://localhost:8084
  volumes:
    - apitable_data:/apitable
  healthcheck:
    test: "CMD curl -fs http://localhost/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 180s

volumes:
  apitable_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8084"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APITABLE_URL:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        apitable_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Apitable"
  short_description: "Self-hosted apitable application, ready to deploy with Stacker"
  long_description: |
    **Apitable**: Self-hosted apitable application, ready to deploy with Stacker

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80/tcp (public on 8084) | API server |

    ## What you configure

    - **Defaults provided**: `APITABLE_URL` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/apitable

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [apitable]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/apitable
  no_secrets_confirmation: true
