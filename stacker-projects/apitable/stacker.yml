name: apitable

app:
  type: custom
  image: apitable/all-in-one:v1.13.0-beta.1_2016
  ports:
    - "8084:80/tcp"
  environment:
    APITABLE_URL: http://localhost:8084
  volumes:
    - apitable_data:/apitable
  healthcheck:
    test: "CMD curl -fs http://localhost/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 180s

volumes:
  apitable_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8084"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APITABLE_URL:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        apitable_data:
          mutability: generated

marketplace:
  display_name: "Apitable"
