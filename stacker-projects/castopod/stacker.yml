name: castopod

project:
  identity: castopod

install:
  inputs:
    commonDomain: podcast.example.com

app:
  type: custom
  image: castopod/app:latest
  ports:
    - "8000:8000"
  environment:
    CP_DATABASE_HOST: mysql
    CP_DATABASE_NAME: castopod
    CP_DATABASE_USER: castopod
    CP_DATABASE_PASSWORD: "${DB_PASSWORD}"
    CP_BASEURL: http://localhost:8000
    CP_ANALYTICS_SALT: "${ANALYTICS_SALT}"
    CP_CACHE_HANDLER: file
  volumes:
    - castopod_data:/var/www/castopod/writable

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: castopod
      MYSQL_USER: castopod
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  castopod_data: {}
  mysql_data: {}
