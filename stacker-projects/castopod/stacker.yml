name: castopod

project:
  identity: castopod

install:
  inputs:
    commonDomain: podcast.example.com

app:
  type: custom
  image: castopod/app:latest
  ports:
    - "8000:8000"
  environment:
    CP_DATABASE_HOST: mysql
    CP_DATABASE_NAME: castopod
    CP_DATABASE_USER: castopod
    CP_DATABASE_PASSWORD: "${DB_PASSWORD}"
    CP_BASEURL: http://localhost:8000
    CP_ANALYTICS_SALT: "${ANALYTICS_SALT}"
    CP_CACHE_HANDLER: file
  volumes:
    - castopod_data:/var/www/castopod/writable

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: castopod
      MYSQL_USER: castopod
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CP_ANALYTICS_SALT:
          mutability: editable
        CP_BASEURL:
          mutability: editable
        CP_CACHE_HANDLER:
          mutability: editable
        CP_DATABASE_HOST:
          mutability: editable
        CP_DATABASE_NAME:
          mutability: editable
        CP_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CP_DATABASE_USER:
          mutability: editable
        volumes:
          mutability: editable
    mysql:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  castopod_data: {}
  mysql_data: {}

marketplace:
  publish: true
  display_name: "Castopod"
  short_description: "Self-hosted podcasting platform with analytics and full federation via ActivityPub. Publish and distribute podcasts you fully control."
  long_description: |
    **Castopod**: Self-hosted podcasting platform with analytics and full federation via ActivityPub. Publish and distribute podcasts you fully control.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `castopod/app:latest` |
    | mysql | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `CP_BASEURL`, `CP_CACHE_HANDLER`, `CP_DATABASE_HOST`, `CP_DATABASE_NAME`, `CP_DATABASE_USER`, `MYSQL_DATABASE` and 1 more ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/castopod

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [castopod]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/castopod
  no_secrets_confirmation: true
