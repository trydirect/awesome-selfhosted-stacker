name: mattermost

app:
  type: custom
  image: mattermost/mattermost-enterprise-edition:latest
  ports:
    - "8065:8065"
  environment:
    MM_SQLSETTINGS_DRIVERNAME: postgres
    MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${DB_PASSWORD}@mattermost-db:5432/mattermost?sslmode=disable
    MM_SERVICESETTINGS_SITEURL: http://localhost:8065
  volumes:
    - mattermost_data:/mattermost/config
    - mattermost_data:/mattermost/data
    - mattermost_logs:/mattermost/logs
    - mattermost_plugins:/mattermost/plugins
    - mattermost_client_plugins:/mattermost/client/plugins

services:
  - name: mattermost-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mattermost_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d mattermost -U mattermost
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mattermost_data: {}
  mattermost_logs: {}
  mattermost_plugins: {}
  mattermost_client_plugins: {}
  mattermost_db: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8065"

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        MM_SERVICESETTINGS_SITEURL:
          mutability: editable
        MM_SQLSETTINGS_DATASOURCE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MM_SQLSETTINGS_DRIVERNAME:
          mutability: editable
        volumes:
          mutability: editable
    mattermost-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Mattermost"
  short_description: "Open-source Slack alternative for team messaging with threads and calls. Self-hosted, secure collaboration for technical teams."
  long_description: |
    **Mattermost**: Open-source Slack alternative for team messaging with threads and calls. Self-hosted, secure collaboration for technical teams.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8065 (public) | `mattermost/mattermost-enterprise-edition:9.11` |
    | mattermost-db | internal | Database |

    ## What you configure

    - **Defaults provided**: `MM_SERVICESETTINGS_SITEURL`, `MM_SQLSETTINGS_DRIVERNAME`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/mattermost

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [mattermost]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/mattermost
  no_secrets_confirmation: true
