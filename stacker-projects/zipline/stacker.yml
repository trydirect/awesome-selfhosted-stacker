name: zipline

project:
  identity: zipline

install:
  inputs:
    commonDomain: upload.example.com

app:
  type: custom
  image: ghcr.io/diced/zipline:latest
  ports:
    - "3000:3000"
  environment:
    DATABASE_URL: "postgres://zipline:${DB_PASSWORD}@postgres:5432/zipline"
    CORE_SECRET: "${SECRET_KEY}"
    CORE_RETURN_HTTPS: "false"
  volumes:
    - zipline_data:/zipline/uploads

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: zipline
      POSTGRES_USER: zipline
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U zipline"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: upload.example.com
      ssl: off
      upstream: app:3000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  zipline_data: {}
  postgres_data: {}
