name: ganymede
version: 1.0.0
project:
  identity: ganymede
install:
  inputs:
    commonDomain: ganymede.example.com
config_contract:
  services:
    app:
      fields:
        TWITCH_CLIENT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    ganymede-db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
app:
  type: custom
  image: ghcr.io/zibbp/ganymede:v1.2.1
  ports:
  - "4800:4000"
  volumes:
  - ganymede_videos:/data/videos
  - ganymede_temp:/data/temp
  - ganymede_logs:/data/logs
  - ganymede_config:/data/config
  environment:
    DEBUG: 'false'
    TZ: ${TZ}
    VIDEOS_DIR: /data/videos
    TEMP_DIR: /data/temp
    LOGS_DIR: /data/logs
    CONFIG_DIR: /data/config
    DB_HOST: ganymede-db
    DB_PORT: '5432'
    DB_USER: ganymede
    DB_PASS: ${DB_PASSWORD}
    DB_NAME: ganymede-prd
    DB_SSL: disable
    TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
    TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
    MAX_CHAT_DOWNLOAD_EXECUTIONS: '3'
    MAX_CHAT_RENDER_EXECUTIONS: '2'
    MAX_VIDEO_DOWNLOAD_EXECUTIONS: '2'
    MAX_VIDEO_CONVERT_EXECUTIONS: '3'
    MAX_VIDEO_SPRITE_THUMBNAIL_EXECUTIONS: '2'
    SHOW_SSO_LOGIN_BUTTON: 'true'
    FORCE_SSO_AUTH: 'false'
    REQUIRE_LOGIN: 'false'
services:
- name: ganymede-db
  image: postgres:14
  environment:
    POSTGRES_DB: ganymede-prd
    POSTGRES_USER: ganymede
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  volumes:
  - ganymede_postgres_data:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -U ganymede -d ganymede-prd
    interval: 10s
    timeout: 5s
    retries: 10
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '4800'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
monitoring:
  status_panel: true
env_file: .env
volumes:
  ganymede_videos: {}
  ganymede_temp: {}
  ganymede_logs: {}
  ganymede_config: {}
  ganymede_postgres_data: {}

marketplace:
  publish: true
  display_name: "Ganymede"
  short_description: "Live stream archiving platform with a real-time chat experience. Capture streams and make them browsable on demand."
  long_description: |
    **Ganymede**: Live stream archiving platform with a real-time chat experience. Capture streams and make them browsable on demand.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 4000 (public on 4800) | `ghcr.io/zibbp/ganymede:latest` |
    | ganymede-db | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/ganymede

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [ganymede]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/ganymede
  no_secrets_confirmation: true
