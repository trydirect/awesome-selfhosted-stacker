name: urbackup

project:
  identity: urbackup

install:
  inputs:
    commonDomain: backup.example.com

app:
  type: custom
  image: uroni/urbackup-server:latest
  ports:
    - "55414:55414"
    - "35623:35623"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    URBACKUP_WEB_PASSWORD: "${URBACKUP_PASSWORD}"
  volumes:
    - urbackup_data:/var/urbackup
    - urbackup_backups:/backups

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: backup.example.com
      ssl: off
      upstream: app:55414

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "55414"
      - "35623"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  urbackup_data: {}
  urbackup_backups: {}