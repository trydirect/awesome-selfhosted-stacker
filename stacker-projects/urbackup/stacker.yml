name: urbackup

project:
  identity: urbackup

install:
  inputs:
    commonDomain: backup.example.com

app:
  type: custom
  image: uroni/urbackup-server:2.4.13
  ports:
    - "55414:55414"
    - "35623:35623"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    URBACKUP_WEB_PASSWORD: "${URBACKUP_PASSWORD}"
  volumes:
    - urbackup_data:/var/urbackup
    - urbackup_backups:/backups

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: backup.example.com
      ssl: off
      upstream: app:55414

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "55414"
      - "35623"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        URBACKUP_WEB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  urbackup_data: {}
  urbackup_backups: {}

marketplace:
  publish: true
  display_name: "Urbackup"
  short_description: "Client-server backup system for Windows and Linux with image and file backups. Centralized, versioned backups over the network."
  long_description: |
    **Urbackup**: Client-server backup system for Windows and Linux with image and file backups. Centralized, versioned backups over the network.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 55414 (public), 35623 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/urbackup

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [urbackup]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/urbackup
  no_secrets_confirmation: true
