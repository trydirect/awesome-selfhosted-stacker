name: listmonk
version: "4.1.0"

project:
  identity: listmonk

install:
  inputs:
    commonDomain: newsletter.example.com

app:
  type: custom
  image: listmonk/listmonk:v4.1.0
  command: sh -c "yes | ./listmonk --install; exec ./listmonk"
  ports:
    - "9000:9000"
  environment:
    LISTMONK_app__address: "0.0.0.0:9000"
    LISTMONK_app__admin_username: admin
    LISTMONK_app__admin_password: "${ADMIN_PASSWORD}"
    LISTMONK_db__host: postgres
    LISTMONK_db__port: "5432"
    LISTMONK_db__user: listmonk
    LISTMONK_db__password: "${DB_PASSWORD}"
    LISTMONK_db__database: listmonk
    LISTMONK_db__ssl_mode: disable
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: listmonk
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - listmonk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U listmonk
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9000"

config_contract:
  services:
    app:
      fields:
        LISTMONK_app__admin_password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        LISTMONK_db__password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  listmonk_pgdata: {}

marketplace:
  publish: true
  display_name: "Listmonk"
  short_description: "High-performance, self-hosted newsletter and mailing list manager. Import subscribers, design campaigns and track opens."
  long_description: |
    **Listmonk**: High-performance, self-hosted newsletter and mailing list manager. Import subscribers, design campaigns and track opens.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9000 (public) | `listmonk/listmonk:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/listmonk

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [listmonk]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/listmonk
  no_secrets_confirmation: true
