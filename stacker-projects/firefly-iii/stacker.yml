name: firefly-iii
version: "6.1.15"

app:
  type: custom
  image: fireflyiii/core:version-6.1.24
  ports:
    - "8080:8080"
  environment:
    APP_ENV: local
    APP_DEBUG: "false"
    SITE_OWNER: ""
    APP_KEY: ${FIREFLY_III_APP_KEY}
    DEFAULT_LANGUAGE: en_US
    DEFAULT_LOCALE: equal
    TZ: Etc/UTC
    TRUSTED_PROXIES: "**"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: firefly
    DB_USERNAME: firefly
    DB_PASSWORD: ${FIREFLY_III_DATABASE_PASSWORD}
    MAIL_MAILER: log
    APP_URL: https://${DOMAIN}
  volumes:
    - "firefly-iii-upload:/var/www/html/storage/upload"

services:
  - name: postgres
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${FIREFLY_III_DATABASE_PASSWORD}
    volumes:
      - "firefly-iii-postgres:/var/lib/postgresql/data"


install:
  inputs:
    domain: finance.try.direct
    firefly-iii-app-key: ""
    firefly-iii-database-password: ""

config_contract:
  services:
    app:
      fields:
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_DEBUG:
          mutability: editable
        APP_ENV:
          mutability: editable
        APP_URL:
          mutability: editable
        DB_CONNECTION:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PORT:
          mutability: editable
        DB_USERNAME:
          mutability: editable
        DEFAULT_LANGUAGE:
          mutability: editable
        DEFAULT_LOCALE:
          mutability: editable
        MAIL_MAILER:
          mutability: editable
        SITE_OWNER:
          mutability: editable
        TRUSTED_PROXIES:
          mutability: editable
        TZ:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        firefly-iii-postgres:
          mutability: generated

marketplace:
  display_name: "Firefly Iii"
  short_description: "Self-hosted Firefly Iii application, ready to deploy with Stacker"

  long_description: |
    ## Firefly Iii
    
    A self-hosted Firefly Iii stack, ready to deploy with Stacker.
    
    ### What's included
    
    - **Postgres** (postgres)
    
    ### Docker images
    
    - `fireflyiii/core:version-6.1.24`
    - `postgres:16.4-alpine`
    
    ### Quick start
    
    ```bash
    stacker install firefly-iii
    ```
    
    ### Configuration
    
    Secrets and passwords are auto-generated on first deploy. Customize via `stacker.yml` or environment variables.