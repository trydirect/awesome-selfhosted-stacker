name: firefly-iii
version: "6.1.15"

app:
  type: custom
  image: fireflyiii/core:latest
  ports:
    - "8080:8080"
  environment:
    APP_ENV: local
    APP_DEBUG: "false"
    SITE_OWNER: ""
    APP_KEY: ${FIREFLY_III_APP_KEY}
    DEFAULT_LANGUAGE: en_US
    DEFAULT_LOCALE: equal
    TZ: Etc/UTC
    TRUSTED_PROXIES: "**"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: firefly
    DB_USERNAME: firefly
    DB_PASSWORD: ${FIREFLY_III_DATABASE_PASSWORD}
    MAIL_MAILER: log
    APP_URL: https://${DOMAIN}
  volumes:
    - "firefly-iii-upload:/var/www/html/storage/upload"

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: firefly
      POSTGRES_USER: firefly
      POSTGRES_PASSWORD: ${FIREFLY_III_DATABASE_PASSWORD}
    volumes:
      - "firefly-iii-postgres:/var/lib/postgresql/data"

config_contract:
  inputs:
    - name: domain
      type: string
      default: finance.try.direct
      description: "Domain name for the application"
    - name: firefly-iii-app-key
      type: secret
      default: ""
      description: "Firefly III application key"
    - name: firefly-iii-database-password
      type: secret
      default: ""
      description: "PostgreSQL password for Firefly III"
