name: zammad
version: "6.3.0"

project:
  identity: zammad

install:
  inputs:
    commonDomain: support.example.com

app:
  type: custom
  image: zammad/zammad:latest
  ports:
    - "8080:80"
  environment:
    POSTGRESQL_HOST: postgres
    POSTGRESQL_PORT: "5432"
    POSTGRESQL_DB: zammad
    POSTGRESQL_USER: zammad
    POSTGRESQL_PASS: ${ZAMMAD_DATABASE_PASSWORD}
    RAILS_ENV: production
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    MEMCACHED_SERVERS: memcached:11211
    ZAMMAD_SESSION_HOST: redis
    ZAMMAD_SESSION_PORT: "6379"
    ZAMMAD_WEBSOCKET_HOST: zammad-websocket
    ZAMMAD_WEBSOCKET_PORT: "6042"
  volumes:
    - "zammad-storage:/opt/zammad/storage"

services:
  - name: zammad-websocket
    image: zammad/zammad:latest
    command: zammad-websocket
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DATABASE_PASSWORD}
      RAILS_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MEMCACHED_SERVERS: memcached:11211
      ZAMMAD_SESSION_HOST: redis
      ZAMMAD_SESSION_PORT: "6379"
    depends_on:
      - postgres
      - redis

  - name: zammad-worker
    image: zammad/zammad:latest
    command: zammad-worker
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DATABASE_PASSWORD}
      RAILS_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MEMCACHED_SERVERS: memcached:11211
    depends_on:
      - postgres
      - redis

  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zammad
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: ${ZAMMAD_DATABASE_PASSWORD}
    volumes:
      - "zammad-postgres:/var/lib/postgresql/data"

  - name: redis
    image: redis:7-alpine
    volumes:
      - "zammad-redis:/data"

  - name: memcached
    image: memcached:1.6-alpine
    command: memcached -m 256M

config_contract:
  inputs:
    - name: domain
      type: string
      default: support.try.direct
      description: "Domain name for the application"
    - name: zammad-database-password
      type: secret
      default: ""
      description: "PostgreSQL password for Zammad"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: support.example.com
      ssl: off
      upstream: app:80

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"

env_file: .env

volumes:
  zammad-storage: {}
  zammad-postgres: {}
  zammad-redis: {}
