name: zammad
version: "6.3.0"

project:
  identity: zammad

install:
  inputs:
    commonDomain: support.example.com
    domain: support.try.direct
    zammad-database-password: ""

app:
  type: custom
  image: zammad/zammad:7.2
  ports:
    - "8080:80"
  environment:
    POSTGRESQL_HOST: postgres
    POSTGRESQL_PORT: "5432"
    POSTGRESQL_DB: zammad
    POSTGRESQL_USER: zammad
    POSTGRESQL_PASS: ${ZAMMAD_DATABASE_PASSWORD}
    RAILS_ENV: production
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    MEMCACHED_SERVERS: memcached:11211
    ZAMMAD_SESSION_HOST: redis
    ZAMMAD_SESSION_PORT: "6379"
    ZAMMAD_WEBSOCKET_HOST: zammad-websocket
    ZAMMAD_WEBSOCKET_PORT: "6042"
  volumes:
    - "zammad-storage:/opt/zammad/storage"

services:
  - name: zammad-websocket
    image: zammad/zammad:7.2
    command: zammad-websocket
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DATABASE_PASSWORD}
      RAILS_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MEMCACHED_SERVERS: memcached:11211
      ZAMMAD_SESSION_HOST: redis
      ZAMMAD_SESSION_PORT: "6379"
    depends_on:
      - postgres
      - redis

  - name: zammad-worker
    image: zammad/zammad:7.2
    command: zammad-worker
    environment:
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DATABASE_PASSWORD}
      RAILS_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MEMCACHED_SERVERS: memcached:11211
    depends_on:
      - postgres
      - redis

  - name: postgres
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: zammad
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: ${ZAMMAD_DATABASE_PASSWORD}
    volumes:
      - "zammad-postgres:/var/lib/postgresql/data"

  - name: redis
    image: redis:7.4-alpine
    volumes:
      - "zammad-redis:/data"

  - name: memcached
    image: memcached:1.6-alpine
    command: memcached -m 256M

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: support.example.com
      ssl: off
      upstream: app:80

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"

env_file: .env

volumes:
  zammad-storage: {}
  zammad-postgres: {}
  zammad-redis: {}

config_contract:
  services:
    app:
      fields:
        MEMCACHED_SERVERS:
          mutability: editable
        POSTGRESQL_DB:
          mutability: editable
        POSTGRESQL_HOST:
          mutability: editable
        POSTGRESQL_PASS:
          mutability: editable
        POSTGRESQL_PORT:
          mutability: editable
        POSTGRESQL_USER:
          mutability: editable
        RAILS_ENV:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        REDIS_PORT:
          mutability: editable
        ZAMMAD_SESSION_HOST:
          mutability: editable
        ZAMMAD_SESSION_PORT:
          mutability: editable
        ZAMMAD_WEBSOCKET_HOST:
          mutability: editable
        ZAMMAD_WEBSOCKET_PORT:
          mutability: editable
      volumes:
        zammad-storage:
          mutability: generated
    zammad-websocket:
      fields:
        MEMCACHED_SERVERS:
          mutability: editable
        POSTGRESQL_DB:
          mutability: editable
        POSTGRESQL_HOST:
          mutability: editable
        POSTGRESQL_PASS:
          mutability: editable
        POSTGRESQL_PORT:
          mutability: editable
        POSTGRESQL_USER:
          mutability: editable
        RAILS_ENV:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        REDIS_PORT:
          mutability: editable
        ZAMMAD_SESSION_HOST:
          mutability: editable
        ZAMMAD_SESSION_PORT:
          mutability: editable
    zammad-worker:
      fields:
        MEMCACHED_SERVERS:
          mutability: editable
        POSTGRESQL_DB:
          mutability: editable
        POSTGRESQL_HOST:
          mutability: editable
        POSTGRESQL_PASS:
          mutability: editable
        POSTGRESQL_PORT:
          mutability: editable
        POSTGRESQL_USER:
          mutability: editable
        RAILS_ENV:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        REDIS_PORT:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        zammad-postgres:
          mutability: generated
    redis:
      volumes:
        zammad-redis:
          mutability: generated

marketplace:
  publish: true
  display_name: "Zammad"
  short_description: "Open-source helpdesk/ticketing system with email, chat and phone channels. Manage customer conversations in one place."
  long_description: |
    **Zammad**: Open-source helpdesk/ticketing system with email, chat and phone channels. Manage customer conversations in one place.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    6 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `zammad/zammad:6.3.1` |
    | zammad-websocket | internal | Web UI |
    | zammad-worker | internal | Background worker |
    | postgres | internal | Database |
    | redis | internal | Cache |
    | memcached | internal | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `MEMCACHED_SERVERS`, `POSTGRESQL_DB`, `POSTGRESQL_HOST`, `POSTGRESQL_PASS`, `POSTGRESQL_PORT`, `POSTGRESQL_USER` and 29 more ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 6 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/zammad

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [zammad]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/zammad
  no_secrets_confirmation: true
