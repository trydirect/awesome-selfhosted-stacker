name: firezone

project:
  identity: firezone

install:
  inputs:
    commonDomain: vpn.example.com

app:
  type: custom
  image: firezone/firezone:latest
  ports:
    - "8080:8080"
    - "51820:51820/udp"
  environment:
    EXTERNAL_URL: http://localhost:8080
    DATABASE_URL: "postgres://firezone:${DB_PASSWORD}@postgres:5432/firezone"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    LIVE_VIEW_SIGNING_SALT: "${LIVE_VIEW_SIGNING_SALT}"
    SECRET_KEY: "${SECRET_KEY}"
    LOG_LEVEL: info
  command: >-
    sh -c "mix ecto.migrate && /app/bin/migrate && /app/bin/server"
  volumes:
    - firezone_data:/var/firezone

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: firezone
      POSTGRES_USER: firezone
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U firezone"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"
      - "51820/udp"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        EXTERNAL_URL:
          mutability: editable
        LIVE_VIEW_SIGNING_SALT:
          mutability: editable
        LOG_LEVEL:
          mutability: editable
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  firezone_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Firezone"
  short_description: "Zero-trust access platform built on WireGuard. Provide secure, identity-aware access to internal applications without exposing ports."
  long_description: |
    **Firezone**: Zero-trust access platform built on WireGuard. Provide secure, identity-aware access to internal applications without exposing ports.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public), 51820/udp (public on 51820) | `firezone/firezone:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `EXTERNAL_URL`, `LOG_LEVEL`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/firezone

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [firezone]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/firezone
  no_secrets_confirmation: true
