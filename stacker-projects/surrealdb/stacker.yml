name: surrealdb

project:
  identity: surrealdb

install:
  inputs:
    commonDomain: surrealdb.example.com

app:
  type: custom
  image: surrealdb/surrealdb:v2.0.0.0.0
  ports:
    - "8000:8000"
  environment:
    SURREAL_USER: root
    SURREAL_PASS: "${DB_PASSWORD}"
    SURREAL_PATH: rocksdb:///data/surrealdb
  command: start --log trace --user ${SURREAL_USER} --pass ${SURREAL_PASS} rocksdb:///data/surrealdb
  volumes:
    - surrealdb_data:/data

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: surrealdb.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        SURREAL_PASS:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SURREAL_PATH:
          mutability: editable
        SURREAL_USER:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  surrealdb_data: {}

marketplace:
  publish: true
  display_name: "Surrealdb"
  short_description: "Multi-model database: document, graph and relational in one engine. Run queries over REST, WebSocket and SQL."
  long_description: |
    **SurrealDB**: Multi-model database: document, graph and relational in one engine. Run queries over REST, WebSocket and SQL.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `surrealdb/surrealdb:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `SURREAL_PATH`, `SURREAL_USER` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/surrealdb

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [surrealdb]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/surrealdb
  no_secrets_confirmation: true
