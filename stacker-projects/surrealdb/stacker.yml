name: surrealdb

project:
  identity: surrealdb

install:
  inputs:
    commonDomain: surrealdb.example.com

app:
  type: custom
  image: surrealdb/surrealdb:latest
  ports:
    - "8000:8000"
  environment:
    SURREAL_USER: root
    SURREAL_PASS: "${DB_PASSWORD}"
    SURREAL_PATH: rocksdb:///data/surrealdb
  command: start --log trace --user ${SURREAL_USER} --pass ${SURREAL_PASS} rocksdb:///data/surrealdb
  volumes:
    - surrealdb_data:/data

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: surrealdb.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  surrealdb_data: {}