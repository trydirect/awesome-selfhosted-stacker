name: metube

app:
  type: custom
  image: alexta69/metube:latest
  ports:
    - "8081:8081"
  volumes:
    - metube_downloads:/downloads
    - metube_state:/state

volumes:
  metube_downloads: {}
  metube_state: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
