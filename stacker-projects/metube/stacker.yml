name: metube

app:
  type: custom
  image: alexta69/metube:2026.10.25
  ports:
    - "8081:8081"
  volumes:
    - metube_downloads:/downloads
    - metube_state:/state

volumes:
  metube_downloads: {}
  metube_state: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      volumes:
        metube_downloads: { mutability: generated }
        metube_state: { mutability: generated }
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8081"

marketplace:
  publish: true
  display_name: "Metube"
  short_description: "Web UI for yt-dlp, download videos from YouTube and thousands of sites. Queue downloads with formats and quality presets."
  long_description: |
    **Metube**: Web UI for yt-dlp, download videos from YouTube and thousands of sites. Queue downloads with formats and quality presets.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8081 (public) | `alexta69/metube:latest` |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/metube

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [metube]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/metube
  no_secrets_confirmation: true
