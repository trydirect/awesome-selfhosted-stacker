        AP_POSTGRES_DATABASE:
          mutability: editable
        AP_POSTGRES_HOST:
          mutability: editable
        AP_POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        AP_POSTGRES_PORT:
          mutability: editable
        AP_POSTGRES_USERNAME:
          mutability: editable
        AP_REDIS_HOST:
          mutability: editable
        AP_REDIS_PORT:
          mutability: editable
        AP_TELEMETRY_ENABLED:
          mutability: editable
