        AP_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        AP_ENGINE_EXECUTABLE_PATH:
          mutability: editable
        AP_ENVIRONMENT:
          mutability: editable
        AP_EXECUTION_MODE:
          mutability: editable
        AP_FLOW_TIMEOUT_SECONDS:
          mutability: editable
        AP_FRONTEND_URL:
          mutability: editable
        AP_JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        AP_POSTGRES_DATABASE:
          mutability: editable
        AP_POSTGRES_HOST:
          mutability: editable
        AP_POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        AP_POSTGRES_PORT:
          mutability: editable
        AP_POSTGRES_USERNAME:
          mutability: editable
        AP_REDIS_HOST:
