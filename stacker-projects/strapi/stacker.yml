name: strapi
version: 4.25.0
organization: null
project:
  identity: strapi
app:
  type: node
  path: .
  dockerfile: null
  image: naskio/strapi:latest
  build: null
  ports:
  - "1337:1337"
  volumes:
  - strapi_data:/strapi/src/api
  environment:
    DATABASE_PASSWORD: ${DB_PASSWORD}
    DATABASE_CLIENT: postgres
    DATABASE_HOST: strapi_db
    DATABASE_NAME: strapi
    JWT_SECRET: ${JWT_SECRET}
    ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    DATABASE_PORT: '5432'
    DATABASE_USERNAME: strapi
    NODE_ENV: production
  command: strapi start
  healthcheck: null
services:
- name: strapi_db
  image: postgres:16-alpine
  ports:
  - "127.0.0.1:5432:5432"
  environment:
    POSTGRES_USER: strapi
    POSTGRES_DB: strapi
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  volumes:
  - strapi_db:/var/lib/postgresql/data
  depends_on: []
  command: null
  healthcheck:
    test: CMD-SHELL pg_isready -U strapi -d strapi
    interval: 10s
    timeout: 5s
    retries: 10
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '1337'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: strapi.example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    strapi_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "Strapi"
  short_description: "Open-source headless CMS with a customizable admin panel and REST/GraphQL APIs. Manage content for any front end."
  long_description: |
    **Strapi**: Open-source headless CMS with a customizable admin panel and REST/GraphQL APIs. Manage content for any front end.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 1337 (public) | API server |
    | strapi_db | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/strapi

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [strapi]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/strapi
  no_secrets_confirmation: true
