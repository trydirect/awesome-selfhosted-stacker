name: apache-airflow

project:
  identity: apache-airflow

install:
  inputs:
    commonDomain: airflow.example.com

app:
  type: custom
  image: apache/airflow:latest
  ports:
    - "8080:8080"
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${DB_PASSWORD}@postgres:5432/airflow"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__FERNET_KEY: "${FERNET_KEY}"
    AIRFLOW__WEBSERVER__SECRET_KEY: "${SECRET_KEY}"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  command: >-
    sh -c "airflow db migrate && airflow webserver"
  volumes:
    - airflow_dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U airflow"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: airflow.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        AIRFLOW__CORE__EXECUTOR:
          mutability: editable
        AIRFLOW__CORE__FERNET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        AIRFLOW__WEBSERVER__EXPOSE_CONFIG:
          mutability: editable
        AIRFLOW__WEBSERVER__SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  airflow_dags: {}
  airflow_logs: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Apache Airflow"
  short_description: "Platform to programmatically author, schedule and monitor data workflows as code. Deploy Apache Airflow with its metadata database ready for pipelines."
  long_description: |
    **Apache Airflow**: Platform to programmatically author, schedule and monitor data workflows as code. Deploy Apache Airflow with its metadata database ready for pipelines.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `apache/airflow:2.10.2` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `AIRFLOW__CORE__EXECUTOR`, `AIRFLOW__WEBSERVER__EXPOSE_CONFIG`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/apache-airflow

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [apache airflow]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/apache-airflow
  no_secrets_confirmation: true
