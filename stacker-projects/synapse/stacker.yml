name: synapse
version: 1.128.0
organization: null
project:
  identity: synapse
app:
  type: custom
  path: .
  dockerfile: null
  image: matrixdotorg/synapse:v1.128.0
  build: null
  ports:
  - "8008:8008"
  - "8448:8448"
  volumes:
  - synapse_data:/data
  environment:
    POSTGRES_USER: synapse
    POSTGRES_DB: synapse
    SYNAPSE_REPORT_STATS: no
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_HOST: synapse_db
    SYNAPSE_SERVER_NAME: matrix.example.com
  command: null
  healthcheck: null
services:
- name: synapse_db
  image: postgres:16.4-alpine
  ports:
  - "127.0.0.1:5432:5432"
  environment:
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_USER: synapse
    POSTGRES_INITDB_ARGS: -c shared_buffers=256MB
    POSTGRES_DB: synapse
  volumes:
  - synapse_db:/var/lib/postgresql/data
  depends_on: []
  command: null
  healthcheck:
    test: CMD-SHELL pg_isready -U synapse -d synapse
    interval: 10s
    timeout: 5s
    retries: 10
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '8008'
    - '8448'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: matrix.example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    synapse_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "Synapse"
  short_description: "Reference Matrix homeserver, decentralized, federated messaging. Run your own secure chat infrastructure."
  long_description: |
    **Synapse**: Reference Matrix homeserver, decentralized, federated messaging. Run your own secure chat infrastructure.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8008 (public), 8448 (public) | `matrixdotorg/synapse:latest` |
    | synapse_db | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/synapse

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [synapse]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/synapse
  no_secrets_confirmation: true
