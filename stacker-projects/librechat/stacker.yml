name: librechat
version: "0.7.3"

project:
  identity: librechat

install:
  inputs:
    commonDomain: librechat.example.com

app:
  type: custom
  image: ghcr.io/danny-avila/librechat:latest
  ports:
    - "3080:3080"
  environment:
    MONGO_URI: "mongodb://mongo:27017/librechat"
    CREDS_KEY: ${CREDS_KEY}
    CREDS_IV: ${CREDS_IV}
    JWT_SECRET: ${JWT_SECRET}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    HOST_URL: http://0.0.0.0:3080
    NODE_ENV: production
    LOG_LEVEL: info
  volumes:
    - "librechat-images:/app/client/public/images"
    - "librechat-logs:/app/api/logs"
    - "librechat-cache:/app/api/node_modules/.cache"

services:
  - name: mongo
    image: mongo:7
    volumes:
      - "librechat-mongo:/data/db"

config_contract:
  inputs:
    - name: domain
      type: string
      default: librechat.try.direct
      description: "Domain name for the application"
    - name: creds-key
      type: secret
      default: ""
      description: "Credentials encryption key"
    - name: creds-iv
      type: secret
      default: ""
      description: "Credentials initialization vector"
    - name: jwt-secret
      type: secret
      default: ""
      description: "JWT secret"
    - name: jwt-refresh-secret
      type: secret
      default: ""
      description: "JWT refresh secret"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: librechat.example.com
      ssl: off
      upstream: app:3080

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3080"

env_file: .env

volumes:
  librechat-images: {}
  librechat-logs: {}
  librechat-cache: {}
  librechat-mongo: {}
