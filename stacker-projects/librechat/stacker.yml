name: librechat
version: "0.7.3"

project:
  identity: librechat

install:
  inputs:
    commonDomain: librechat.example.com
    domain: librechat.try.direct
    creds-key: ""
    creds-iv: ""
    jwt-secret: ""
    jwt-refresh-secret: ""

app:
  type: custom
  image: ghcr.io/danny-avila/librechat:latest
  ports:
    - "3080:3080"
  environment:
    MONGO_URI: "mongodb://mongo:27017/librechat"
    CREDS_KEY: ${CREDS_KEY}
    CREDS_IV: ${CREDS_IV}
    JWT_SECRET: ${JWT_SECRET}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    HOST_URL: http://0.0.0.0:3080
    NODE_ENV: production
    LOG_LEVEL: info
  volumes:
    - "librechat-images:/app/client/public/images"
    - "librechat-logs:/app/api/logs"
    - "librechat-cache:/app/api/node_modules/.cache"

services:
  - name: mongo
    image: mongo:7
    volumes:
      - "librechat-mongo:/data/db"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: librechat.example.com
      ssl: off
      upstream: app:3080

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3080"

env_file: .env

volumes:
  librechat-images: {}
  librechat-logs: {}
  librechat-cache: {}
  librechat-mongo: {}

config_contract:
  services:
    app:
      fields:
        CREDS_IV:
          mutability: editable
        CREDS_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HOST_URL:
          mutability: editable
        JWT_REFRESH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        LOG_LEVEL:
          mutability: editable
        MONGO_URI:
          mutability: editable
        NODE_ENV:
          mutability: editable
      volumes:
        librechat-images:
          mutability: generated
        librechat-logs:
          mutability: generated
        librechat-cache:
          mutability: generated
    mongo:
      volumes:
        librechat-mongo:
          mutability: generated

marketplace:
  publish: true
  display_name: "Librechat"
  short_description: "Open-source chat interface supporting OpenAI, Anthropic, Google and local models. One polished UI for many LLM providers with chat history."
  long_description: |
    **LibreChat**: Open-source chat interface supporting OpenAI, Anthropic, Google and local models. One polished UI for many LLM providers with chat history.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3080 (public) | `ghcr.io/danny-avila/librechat:latest` |
    | mongo | internal | `mongo:7` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `CREDS_IV`, `HOST_URL`, `LOG_LEVEL`, `MONGO_URI`, `NODE_ENV` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/librechat

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [librechat]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/librechat
  no_secrets_confirmation: true
