name: mosquitto

project:
  identity: mosquitto

app:
  type: custom
  image: eclipse-mosquitto:2.1.2-alpine
  ports:
    - "1883:1883"
  volumes:
    - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "1883"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

marketplace:
  publish: true
  display_name: "Eclipse Mosquitto"
  short_description: "Lightweight MQTT broker for IoT messaging, MQTT 3.1.1 and 5.0"
  long_description: |
    **Eclipse Mosquitto**: Lightweight MQTT broker for IoT messaging, MQTT 3.1.1 and 5.0

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 1883 (public) | `eclipse-mosquitto:2.1.2-alpine` — MQTT broker (anonymous access) |

    ## What you configure

    - The broker listens on 1883 with anonymous access enabled — tighten
      `mosquitto.conf` for production (password file, TLS listener)

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/mosquitto

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [mosquitto]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/mosquitto
  no_secrets_confirmation: true
