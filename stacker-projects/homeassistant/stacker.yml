name: homeassistant

project:
  identity: homeassistant

install:
  inputs:
    commonDomain: homeassistant.example.com

app:
  type: custom
  image: lscr.io/linuxserver/homeassistant:latest
  ports:
    - "8123:8123"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - ha_config:/config

volumes:
  ha_config: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: homeassistant.example.com
      ssl: off
      upstream: app:8123

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8123"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Homeassistant"
  short_description: "Open-source home automation platform that puts local control first. Connect thousands of devices and build automations with Home Assistant."
  long_description: |
    **Homeassistant**: Open-source home automation platform that puts local control first. Connect thousands of devices and build automations with Home Assistant.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8123 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/homeassistant

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [homeassistant]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/homeassistant
  no_secrets_confirmation: true
