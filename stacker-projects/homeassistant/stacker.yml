name: homeassistant

app:
  type: custom
  image: lscr.io/linuxserver/homeassistant:latest
  ports:
    - "8123:8123"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - ha_config:/config

volumes:
  ha_config: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test

env_file: .env
