name: homeassistant

project:
  identity: homeassistant

install:
  inputs:
    commonDomain: homeassistant.example.com

app:
  type: custom
  image: lscr.io/linuxserver/homeassistant:latest
  ports:
    - "8123:8123"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - ha_config:/config

volumes:
  ha_config: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: homeassistant.example.com
      ssl: off
      upstream: app:8123

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8123"

monitoring:
  status_panel: true

env_file: .env
