name: moodist

project:
  identity: moodist

install:
  inputs:
    commonDomain: sounds.example.com

app:
  type: custom
  image: ghcr.io/remvze/moodist:latest
  ports:
    - "8080:80"

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

monitoring:
  status_panel: true

env_file: .env
