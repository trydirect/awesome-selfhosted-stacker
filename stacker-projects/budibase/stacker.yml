name: budibase

project:
  identity: budibase

install:
  inputs:
    commonDomain: apps.example.com

app:
  type: custom
  image: budibase/budibase:cloud
  ports:
    - "80:80"
  environment:
    INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
    JWT_SECRET: "${JWT_SECRET}"
    COUCH_DB_URL: http://couchdb:5984
    REDIS_URL: redis://redis:6379
    MINIO_URL: http://minio:9000
    MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
    MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
  volumes:
    - budibase_data:/data

services:
  - name: couchdb
    image: couchdb:3
    ports:
      - "127.0.0.1:5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: "${COUCHDB_PASSWORD}"
    volumes:
      - couchdb_data:/opt/couchdb/data
    healthcheck:
      test: "CMD curl -f http://localhost:5984/_up || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: minio
    image: firstfinger/minio:1.7.3
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY}"
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: "CMD curl -f http://localhost:9000/minio/health/live || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        INTERNAL_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MINIO_ACCESS_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MINIO_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        COUCH_DB_URL:
          mutability: editable
        MINIO_URL:
          mutability: editable
        REDIS_URL:
          mutability: editable
        volumes:
          mutability: editable
    couchdb:
      fields:
        COUCHDB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        COUCHDB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
    minio:
      fields:
        MINIO_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MINIO_ROOT_USER:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        command:
          mutability: editable
env_file: .env

volumes:
  budibase_data: {}
  couchdb_data: {}
  minio_data: {}

marketplace:
  publish: true
  display_name: "Budibase"
  short_description: "Open-source low-code platform for building business apps on top of your data. Create internal tools, forms and workflows with minimal code."
  long_description: |
    **Budibase**: Open-source low-code platform for building business apps on top of your data. Create internal tools, forms and workflows with minimal code.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public) | `budibase/budibase:v3.1.1` |
    | couchdb | 5984 (local only) | `couchdb:3` |
    | redis | 6379 (local only) | Cache |
    | minio | 9000 (local only), 9001 (local only) | Object storage |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `COUCH_DB_URL`, `MINIO_URL`, `REDIS_URL`, `COUCHDB_USER` ship prefilled and can be adjusted in the deploy form

    All 7 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/budibase

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [budibase]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/budibase
  no_secrets_confirmation: true
