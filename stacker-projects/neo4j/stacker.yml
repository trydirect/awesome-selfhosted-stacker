name: neo4j

project:
  identity: neo4j

app:
  type: custom
  image: neo4j:5.26.32-community
  ports:
    - "7474:7474"
    - "7687:7687"
  environment:
    NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
  volumes:
    - neo4j_data:/data

volumes:
  neo4j_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "7474"
      - "7687"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        NEO4J_AUTH:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        neo4j_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Neo4j"
  short_description: "Graph database with Cypher query language, browser UI on 7474"
  long_description: |
    **Neo4j**: Graph database with Cypher query language, browser UI on 7474

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 7474 (public), 7687 (public) | `neo4j:5.26.32-community` — HTTP browser + Bolt protocol |

    ## What you configure

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store. The initial user
    is `neo4j` with the generated password.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/neo4j

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [neo4j]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/neo4j
  no_secrets_confirmation: true
