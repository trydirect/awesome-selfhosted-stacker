name: archon

version: "0.11.1"

project:
  identity: archon

install:
  inputs:
    commonDomain: archon.example.com

app:
  type: custom
  image: ghcr.io/coleam00/archon:0.11.1
  ports:
    - "3000:3000/tcp"
  environment:
    ARCHON_DOCKER: "true"
    PORT: "3000"
    WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
    CLAUDE_API_KEY: ${CLAUDE_API_KEY}
  volumes:
    - archon_data:/.archon
    - archon_user_home:/home/appuser
  healthcheck:
    test: "CMD curl -fs http://localhost:3000/api/health"
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 15s

volumes:
  archon_data: {}
  archon_user_home: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ARCHON_DOCKER:
          mutability: editable
        PORT:
          mutability: editable
          display: number
        WEBHOOK_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        TOKEN_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CLAUDE_CODE_OAUTH_TOKEN:
          mutability: provided
        CLAUDE_API_KEY:
          mutability: provided
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        archon_data:
          mutability: generated
        archon_user_home:
          mutability: generated

marketplace:
  publish: true
  display_name: "Archon"
  short_description: "AI knowledge engine and task orchestrator for building AI agents"
  long_description: |
    **Archon**: AI knowledge engine and task orchestrator for building AI agents

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000/tcp (public on 3000) | `ghcr.io/coleam00/archon:0.11.1` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ARCHON_DOCKER`, `PORT` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/archon

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [archon]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/archon
  no_secrets_confirmation: true
