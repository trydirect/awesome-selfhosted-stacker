name: grocy

app:
  type: custom
  image: lscr.io/linuxserver/grocy:latest
  ports:
    - "9283:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - grocy_data:/config

volumes:
  grocy_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "9283"
