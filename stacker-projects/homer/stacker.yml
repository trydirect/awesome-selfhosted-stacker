name: homer

project:
  identity: homer

install:
  inputs:
    commonDomain: dashboard.example.com

app:
  type: custom
  image: b4bz/homer:v26.08.3
  ports:
    - "8080:8080"
  volumes:
    - homer_config:/www/assets
    - ./config.yml:/www/assets/config.yml

volumes:
  homer_config: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: dashboard.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      volumes:
        homer_config: { mutability: generated }
env_file: .env

marketplace:
  publish: true
  display_name: "Homer"
  short_description: "Minimalist static dashboard for all your services. A lightweight, configurable homepage for homelab links."
  long_description: |
    **Homer**: Minimalist static dashboard for all your services. A lightweight, configurable homepage for homelab links.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `b4bz/homer:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/homer

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [homer]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/homer
  no_secrets_confirmation: true
