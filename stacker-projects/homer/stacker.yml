name: homer

project:
  identity: homer

install:
  inputs:
    commonDomain: dashboard.example.com

app:
  type: custom
  image: b4bz/homer:latest
  ports:
    - "8080:8080"
  volumes:
    - homer_config:/www/assets
    - ./config.yml:/www/assets/config.yml

volumes:
  homer_config: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: dashboard.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

env_file: .env
