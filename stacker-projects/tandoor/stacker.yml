name: tandoor
version: "1.5.19"

project:
  identity: tandoor

install:
  inputs:
    commonDomain: recipes.example.com

app:
  type: custom
  image: vabene1111/recipes:latest
  ports:
    - "8080:80"
  environment:
    SECRET_KEY: "${SECRET_KEY}"
    DB_ENGINE: django.db.backends.postgresql
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: tandoor
    POSTGRES_USER: tandoor
    POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ALLOWED_HOSTS: "*"
  volumes:
    - tandoor_staticfiles:/opt/recipes/staticfiles
    - tandoor_mediafiles:/opt/recipes/mediafiles
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: tandoor
      POSTGRES_USER: tandoor
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - tandoor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U tandoor
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

config_contract:
  services:
    app:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  tandoor_staticfiles: {}
  tandoor_mediafiles: {}
  tandoor_pgdata: {}

marketplace:
  publish: true
  display_name: "Tandoor"
  short_description: "Recipe manager and meal planner for households. Import recipes, plan weeks and build shopping lists with Tandoor."
  long_description: |
    **Tandoor**: Recipe manager and meal planner for households. Import recipes, plan weeks and build shopping lists with Tandoor.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `vabene1111/recipes:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/tandoor

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [tandoor]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/tandoor
  no_secrets_confirmation: true
