name: chatwoot

project:
  identity: chatwoot

install:
  inputs:
    commonDomain: chatwoot.try.direct

app:
  type: custom
  image: chatwoot/chatwoot:develop-ce
  command: sh docker/entrypoints/rails.sh sh -c "bundle exec rails db:prepare && mkdir -p tmp/pids && bundle exec puma -C config/puma.rb"
  ports:
    - "3000:3000"
  environment:
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    DATABASE_URL: postgresql://chatwoot:${DB_PASSWORD}@chatwoot-db:5432/chatwoot
    REDIS_URL: redis://chatwoot-redis:6379
    RAILS_ENV: production
    FRONTEND_URL: http://localhost:3000
    MAILER_SENDER_EMAIL: admin@example.com
    ENABLE_ACCOUNT_SIGNUP: "false"

services:
  - name: chatwoot-db
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - chatwoot_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d chatwoot -U chatwoot
      interval: 10s
      timeout: 5s
      retries: 10

  - name: chatwoot-redis
    image: redis:7.4-alpine
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  chatwoot_db: {}
  chatwoot_data: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: chatwoot.example.com
      ssl: off
      upstream: app:3000

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENABLE_ACCOUNT_SIGNUP:
          mutability: editable
          display: boolean
        FRONTEND_URL:
          mutability: editable
        MAILER_SENDER_EMAIL:
          mutability: editable
        RAILS_ENV:
          mutability: editable
        REDIS_URL:
          mutability: editable
    chatwoot-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"

marketplace:
  publish: true
  display_name: "Chatwoot"
  short_description: "Open-source customer support platform (Intercom alternative). Unified inbox for live chat, email, WhatsApp and social channels."
  long_description: |
    **Chatwoot**: Open-source customer support platform (Intercom alternative). Unified inbox for live chat, email, WhatsApp and social channels.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `chatwoot/chatwoot:develop-ce` |
    | chatwoot-db | internal | Database |
    | chatwoot-redis | internal | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ENABLE_ACCOUNT_SIGNUP`, `FRONTEND_URL`, `MAILER_SENDER_EMAIL`, `RAILS_ENV`, `REDIS_URL`, `POSTGRES_DB` and 1 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/chatwoot

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [chatwoot]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/chatwoot
  no_secrets_confirmation: true
