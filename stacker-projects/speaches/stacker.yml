name: speaches
version: "0.8.3"

project:
  identity: speaches

install:
  inputs:
    commonDomain: speaches.example.com

app:
  type: custom
  image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
  ports:
    - "8000:8000"
  environment:
    API_KEY: ${API_KEY}
  volumes:
    - speaches_hf_cache:/home/ubuntu/.cache/huggingface/hub
  healthcheck:
    test: "CMD-SHELL curl -fs -H 'Authorization: Bearer ${API_KEY}' http://localhost:8000/health"
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 10s

volumes:
  speaches_hf_cache: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        speaches_hf_cache:
          mutability: generated

marketplace:
  publish: true
  display_name: "Speaches"
  short_description: "OpenAI-compatible speech-to-text and text-to-speech API"
  long_description: |
    **Speaches**: OpenAI-compatible speech-to-text and text-to-speech API

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `ghcr.io/speaches-ai/speaches:0.8.3-cpu` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/speaches

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [speaches]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/speaches
  no_secrets_confirmation: true
