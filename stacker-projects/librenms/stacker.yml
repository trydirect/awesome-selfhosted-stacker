name: librenms

app:
  type: custom
  image: librenms/librenms:latest
  ports:
    - "8000:8000/tcp"
  environment:
    APP_URL: http://localhost:8000
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: librenms
    DB_USERNAME: librenms
    DB_PASSWORD: ${DB_PASSWORD}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    MAIL_FROM: librenms@localhost
  volumes:
    - librenms_data:/data
  depends_on:
    - db
    - redis
  healthcheck:
    test: "CMD curl -fs http://localhost:8000/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 180s

services:
  - name: db
    image: mariadb:11
    environment:
      MARIADB_DATABASE: librenms
      MARIADB_USER: librenms
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - librenms_db:/var/lib/mysql
    healthcheck:
      test: "CMD healthcheck.sh --connect --innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 6
  - name: redis
    image: redis:7-alpine
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  librenms_data: {}
  librenms_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_URL:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USERNAME:
          mutability: editable
        MAIL_FROM:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        REDIS_PORT:
          mutability: editable
          display: number
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        librenms_data:
          mutability: generated
    db:
      fields:
        MARIADB_DATABASE:
          mutability: editable
        MARIADB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        librenms_db:
          mutability: generated
