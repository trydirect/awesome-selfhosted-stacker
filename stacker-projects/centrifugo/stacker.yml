name: centrifugo

project:
  identity: centrifugo

install:
  inputs:
    commonDomain: ws.example.com

app:
  type: custom
  image: centrifugo/centrifugo:latest
  ports:
    - "8000:8000"
  environment:
    CENTRIFUGO_API_KEY: "${API_KEY}"
    CENTRIFUGO_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    CENTRIFUGO_ADMIN_SECRET: "${ADMIN_SECRET}"
  command: centrifugo --api_insecure
  volumes:
    - centrifugo_data:/centrifugo

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: ws.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  centrifugo_data: {}
