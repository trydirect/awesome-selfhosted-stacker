name: mastodon
version: "4.2.0"

project:
  identity: mastodon

install:
  inputs:
    commonDomain: mastodon.example.com

app:
  type: custom
  image: ghcr.io/mastodon/mastodon:latest
  command: bash -c "bundle exec rails db:prepare && bundle exec puma -C config/puma.rb"
  ports:
    - "3000:3000"
  environment:
    LOCAL_DOMAIN: mastodon.example.com
    SINGLE_USER_MODE: "false"
    SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
    OTP_SECRET: "${OTP_SECRET}"
    VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY}"
    VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY}"
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}"
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}"
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}"
    DB_HOST: mastodon_db
    DB_PORT: "5432"
    DB_NAME: mastodon_production
    DB_USER: mastodon
    DB_PASS: "${DB_PASSWORD}"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    RAILS_ENV: production

services:
  - name: mastodon_db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mastodon_production
      POSTGRES_USER: mastodon
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mastodon_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U mastodon -d mastodon_production"
      interval: 10s
      timeout: 5s
      retries: 10

  - name: redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - mastodon_redis:/data
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 10

  - name: sidekiq
    image: ghcr.io/mastodon/mastodon:latest
    command: bundle exec sidekiq -c 5 -v
    environment:
      DB_HOST: mastodon_db
      DB_PORT: "5432"
      DB_NAME: mastodon_production
      DB_USER: mastodon
      DB_PASS: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RAILS_ENV: production
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY}"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT}"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY}"
    depends_on:
      - mastodon_db
      - redis

volumes:
  mastodon_db: {}
  mastodon_redis: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: local
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  services:
    app:
      fields:
        VAPID_PUBLIC_KEY:
          mutability: provided
        ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OTP_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        VAPID_PRIVATE_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

    mastodon_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

marketplace:
  publish: true
  display_name: "Mastodon"
  short_description: "Decentralized social network on the ActivityPub protocol. Host your own microblogging instance federated with the fediverse."
  long_description: |
    **Mastodon**: Decentralized social network on the ActivityPub protocol. Host your own microblogging instance federated with the fediverse.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `ghcr.io/mastodon/mastodon:latest` |
    | mastodon_db | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |
    | sidekiq | internal | Background worker |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **VAPID_PUBLIC_KEY**: you provide this in the deploy form

    All 12 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/mastodon

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [mastodon]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/mastodon
  no_secrets_confirmation: true
