name: baserow

project:
  identity: baserow

install:
  inputs:
    commonDomain: database.example.com

app:
  type: custom
  image: baserow/baserow:2.4.1
  ports:
    - "80:80"
    - "443:443"
  environment:
    BASEROW_PUBLIC_URL: http://localhost:80
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_NAME: baserow
    DATABASE_USER: baserow
    DATABASE_PASSWORD: "${DB_PASSWORD}"
    SECRET_KEY: "${SECRET_KEY}"
  volumes:
    - baserow_data:/baserow/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: baserow
      POSTGRES_USER: baserow
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U baserow"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        BASEROW_PUBLIC_URL:
          mutability: editable
        DATABASE_HOST:
          mutability: editable
        DATABASE_NAME:
          mutability: editable
        DATABASE_PORT:
          mutability: editable
          display: number
        DATABASE_USER:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  baserow_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Baserow"
  short_description: "Open-source no-code database and Airtable alternative. Create relational databases with a spreadsheet-like interface and full API access."
  long_description: |
    **Baserow**: Open-source no-code database and Airtable alternative. Create relational databases with a spreadsheet-like interface and full API access.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public), 443 (public) | `baserow/baserow:1.28.2` |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `BASEROW_PUBLIC_URL`, `DATABASE_HOST`, `DATABASE_NAME`, `DATABASE_PORT`, `DATABASE_USER`, `POSTGRES_DB` and 1 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/baserow

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [baserow]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/baserow
  no_secrets_confirmation: true
