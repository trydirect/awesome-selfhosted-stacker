name: zitadel
version: 4.16.0
app:
  type: custom
  image: ghcr.io/zitadel/zitadel:v4.16.0
  ports:
    - "8080:8080"
  command: start-from-init --masterkey "${ZITADEL_MASTERKEY}"
  environment:
    ZITADEL_PORT: 8080
    ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
    ZITADEL_EXTERNALPORT: 8080
    ZITADEL_EXTERNALSECURE: 'false'
    ZITADEL_TLS_ENABLED: 'false'
    ZITADEL_PUBLIC_SCHEME: http
    ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/zitadel?sslmode=disable
    ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: 'false'
    ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: 'true'
    ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED: 'false'
  healthcheck:
    test: CMD /app/zitadel ready
    interval: 10s
    timeout: 30s
    retries: 12
    start_period: 20s
services:
  - name: postgres
    image: postgres:17.10-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: zitadel
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    healthcheck:
      test: CMD-SHELL pg_isready -d zitadel -U postgres
      interval: 10s
      timeout: 30s
      retries: 10
      start_period: 20s
  - name: redis
    image: redis:7.4.9-alpine
    command: --save "" --appendonly no
volumes:
  postgres-data: {}
proxy:
  type: none
  auto_detect: false
deploy:
  target: cloud
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

config_contract:
  services:
    app:
      fields:
        ZITADEL_MASTERKEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ZITADEL_DOMAIN:
          mutability: editable
        ZITADEL_PORT:
          mutability: editable
          display: number
        ZITADEL_EXTERNALPORT:
          mutability: editable
          display: number
        ZITADEL_EXTERNALSECURE:
          mutability: editable
          display: boolean
        ZITADEL_TLS_ENABLED:
          mutability: editable
          display: boolean
        ZITADEL_PUBLIC_SCHEME:
          mutability: editable
        ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED:
          mutability: editable
          display: boolean
        ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED:
          mutability: editable
          display: boolean
        ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED:
          mutability: editable
          display: boolean
    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        POSTGRES_DB:
          mutability: editable

hooks:
  pre_build: ./scripts/generate-secrets.sh
env_file: .env

marketplace:
  publish: true
  display_name: "Zitadel"
  short_description: "Cloud-native identity management with passkeys, OIDC and OAuth2. A battle-tested IAM you self-host."
  long_description: |
    **Zitadel**: Cloud-native identity management with passkeys, OIDC and OAuth2. A battle-tested IAM you self-host.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `ghcr.io/zitadel/zitadel:v4.16.0` |
    | postgres | internal | Database |
    | redis | internal | Cache |

    ## What you configure

    - **Defaults provided**: `ZITADEL_CACHES_CONNECTORS_REDIS_ENABLED`, `ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED`, `ZITADEL_DOMAIN`, `ZITADEL_EXTERNALPORT`, `ZITADEL_EXTERNALSECURE`, `ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED` and 5 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/zitadel

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [zitadel]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/zitadel
  no_secrets_confirmation: true
