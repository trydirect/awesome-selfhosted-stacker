name: waha
version: "2026.9.2"

project:
  identity: waha

install:
  inputs:
    commonDomain: waha.example.com

app:
  type: custom
  image: devlikeapro/waha:latest-2026.9.2
  ports:
    - "3000:3000"
  environment:
    WHATSAPP_DEFAULT_ENGINE: WEBJS
    WAHA_API_KEY: ${WAHA_API_KEY}
    WHATSAPP_API_KEY_EXCLUDE_PATH: "ping,health"
  volumes:
    - waha_sessions:/app/.sessions
  healthcheck:
    test: "CMD curl -fs http://localhost:3000/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

volumes:
  waha_sessions: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        WAHA_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        WHATSAPP_API_KEY_EXCLUDE_PATH:
          mutability: provided
        WHATSAPP_DEFAULT_ENGINE:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        waha_sessions:
          mutability: generated

marketplace:
  publish: true
  display_name: "Waha"
  short_description: "Self-hosted WhatsApp HTTP API gateway with multi-device support and webhooks"
  long_description: |
    **Waha**: Self-hosted WhatsApp HTTP API gateway with multi-device support and webhooks

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `devlikeapro/waha:latest-2026.9.2` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **WHATSAPP_API_KEY_EXCLUDE_PATH**: you provide this in the deploy form
    - **Defaults provided**: `WHATSAPP_DEFAULT_ENGINE` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/waha

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [waha]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/waha
  no_secrets_confirmation: true
