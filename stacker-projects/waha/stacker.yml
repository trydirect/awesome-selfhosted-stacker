name: waha
version: "2026.9.2"

project:
  identity: waha

install:
  inputs:
    commonDomain: waha.example.com

app:
  type: custom
  image: devlikeapro/waha:latest-2026.9.2
  ports:
    - "3000:3000"
  environment:
    WHATSAPP_DEFAULT_ENGINE: WEBJS
    WAHA_API_KEY: ${WAHA_API_KEY}
    WHATSAPP_API_KEY_EXCLUDE_PATH: "ping,health"
  volumes:
    - waha_sessions:/app/.sessions
  healthcheck:
    test: "CMD curl -fs http://localhost:3000/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

volumes:
  waha_sessions: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        WAHA_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        WHATSAPP_API_KEY_EXCLUDE_PATH:
          mutability: editable
        WHATSAPP_DEFAULT_ENGINE:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        waha_sessions:
          mutability: generated
