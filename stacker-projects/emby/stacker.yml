name: emby

project:
  identity: emby

install:
  inputs:
    commonDomain: media.example.com

app:
  type: custom
  image: emby/embyserver:4.11.0.10
  ports:
    - "8096:8096"
    - "8920:8920"
  environment:
    UID: "1000"
    GID: "1000"
  volumes:
    - emby_config:/config
    - emby_data:/media

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8096"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        GID:
          mutability: editable
        UID:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  emby_config: {}
  emby_data: {}

marketplace:
  publish: true
  display_name: "Emby"
  short_description: "Personal media server for organizing, streaming and watching your movies and TV shows. Emby transcodes and serves media to any device."
  long_description: |
    **Emby**: Personal media server for organizing, streaming and watching your movies and TV shows. Emby transcodes and serves media to any device.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8096 (public), 8920 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `GID`, `UID` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/emby

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [emby]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/emby
  no_secrets_confirmation: true
