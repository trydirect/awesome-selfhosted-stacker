name: etherpad
version: "1.10.0"

app:
  type: custom
  image: etherpad/etherpad:latest
  ports:
    - "9001:9001"
  environment:
    DB_TYPE: dirty
    DB_DIR: /opt/etherpad-lite/var/dirty.db
    IP: "0.0.0.0"
    PORT: "9001"
    SHOW_SETTINGS_IN_ADMIN_PAGE: "true"
    ADMIN_PASSWORD: ${ETHERPAD_ADMIN_PASSWORD}
    USER_PASSWORD: ${ETHERPAD_USER_PASSWORD}
    REQUIRE_SESSION: "false"
    EDIT_ONLY: "false"
    MINIFY: "true"
    MAXAge: "21600"
    ABIWORD: ""
    SOFFICE: ""
    TIDYPAR: ""
    ALLOW_UNKNOWN_FILE_ENDS: "true"
    REQUIRE_AUTHENTICATION: "false"
    REQUIRE_AUTHORIZATION: "false"
    TRUST_PROXY: "true"
    DISABLE_IPLOGGING: "false"
    automaticReconnectionTimeout: "0"
    loadTest: "false"
    loglevel: "WARN"
  volumes:
    - "etherpad-data:/opt/etherpad-lite/var"

proxy:
  type: nginx-proxy-manager
  auto_detect: true
  domains:
    - domain: etherpad.example.com
      ssl: auto
      upstream: app:9001

env_file: .env


install:
  inputs:
    domain: etherpad.try.direct
    etherpad-admin-password: ""
    etherpad-user-password: ""

config_contract:
  services:
    app:
      fields:
        ABIWORD:
          mutability: editable
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ALLOW_UNKNOWN_FILE_ENDS:
          mutability: editable
        DB_DIR:
          mutability: editable
        DB_TYPE:
          mutability: editable
        DISABLE_IPLOGGING:
          mutability: editable
        EDIT_ONLY:
          mutability: editable
        IP:
          mutability: editable
        MAXAge:
          mutability: editable
        MINIFY:
          mutability: editable
        PORT:
          mutability: editable
        REQUIRE_AUTHENTICATION:
          mutability: editable
        REQUIRE_AUTHORIZATION:
          mutability: editable
        REQUIRE_SESSION:
          mutability: editable
        SHOW_SETTINGS_IN_ADMIN_PAGE:
          mutability: editable
        SOFFICE:
          mutability: editable
        TIDYPAR:
          mutability: editable
        TRUST_PROXY:
          mutability: editable
        USER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        automaticReconnectionTimeout:
          mutability: editable
        loadTest:
          mutability: editable
        loglevel:
          mutability: editable
      volumes:
        etherpad-data:
          mutability: generated
