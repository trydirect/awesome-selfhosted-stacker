name: etherpad
version: "1.10.0"

app:
  type: custom
  image: etherpad/etherpad:1.9.7
  ports:
    - "9001:9001"
  environment:
    DB_TYPE: dirty
    DB_DIR: /opt/etherpad-lite/var/dirty.db
    IP: "0.0.0.0"
    PORT: "9001"
    SHOW_SETTINGS_IN_ADMIN_PAGE: "true"
    ADMIN_PASSWORD: ${ETHERPAD_ADMIN_PASSWORD}
    USER_PASSWORD: ${ETHERPAD_USER_PASSWORD}
    REQUIRE_SESSION: "false"
    EDIT_ONLY: "false"
    MINIFY: "true"
    MAXAge: "21600"
    ABIWORD: ""
    SOFFICE: ""
    TIDYPAR: ""
    ALLOW_UNKNOWN_FILE_ENDS: "true"
    REQUIRE_AUTHENTICATION: "false"
    REQUIRE_AUTHORIZATION: "false"
    TRUST_PROXY: "true"
    DISABLE_IPLOGGING: "false"
    automaticReconnectionTimeout: "0"
    loadTest: "false"
    loglevel: "WARN"
  volumes:
    - "etherpad-data:/opt/etherpad-lite/var"

proxy:
  type: nginx-proxy-manager
  auto_detect: true
  domains:
    - domain: etherpad.example.com
      ssl: auto
      upstream: app:9001

env_file: .env


install:
  inputs:
    domain: etherpad.try.direct
    etherpad-admin-password: ""
    etherpad-user-password: ""

config_contract:
  services:
    app:
      fields:
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        USER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ABIWORD:
          mutability: editable
        ALLOW_UNKNOWN_FILE_ENDS:
          mutability: editable
        DB_DIR:
          mutability: editable
        DB_TYPE:
          mutability: editable
        DISABLE_IPLOGGING:
          mutability: editable
        EDIT_ONLY:
          mutability: editable
        IP:
          mutability: editable
        MAXAge:
          mutability: editable
        MINIFY:
          mutability: editable
        PORT:
          mutability: editable
        REQUIRE_AUTHENTICATION:
          mutability: editable
        REQUIRE_AUTHORIZATION:
          mutability: editable
        REQUIRE_SESSION:
          mutability: editable
        SHOW_SETTINGS_IN_ADMIN_PAGE:
          mutability: editable
        SOFFICE:
          mutability: editable
        TIDYPAR:
          mutability: editable
        TRUST_PROXY:
          mutability: editable
        automaticReconnectionTimeout:
          mutability: editable
        loadTest:
          mutability: editable
        loglevel:
          mutability: editable
      volumes:
        etherpad-data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Etherpad"
  short_description: "Real-time collaborative document editor with colored cursors and change history. Write together in the browser with Etherpad."
  long_description: |
    **Etherpad**: Real-time collaborative document editor with colored cursors and change history. Write together in the browser with Etherpad.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9001 (public) | `etherpad/etherpad:latest` |

    ## What you configure

    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `ABIWORD`, `ALLOW_UNKNOWN_FILE_ENDS`, `DB_DIR`, `DB_TYPE`, `DISABLE_IPLOGGING`, `EDIT_ONLY` and 10 more ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/etherpad

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [etherpad]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/etherpad
  no_secrets_confirmation: true
