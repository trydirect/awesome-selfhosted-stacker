name: outline
version: 1.0.0
project:
  identity: outline
app:
  type: node
  image: outlinewiki/outline:latest
  ports:
  - "3000:3000"
  environment:
    PORT: '3000'
    NODE_ENV: production
    FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
    DATABASE_URL: postgres://outline:${DB_PASSWORD}@postgres:5432/outline?sslmode=disable
    REDIS_URL: redis://redis:6379
    SECRET_KEY: ${SECRET_KEY}
    UTILS_SECRET: ${UTILS_SECRET}
    URL: ${URL}
    COLLABORATION_URL: ${COLLABORATION_URL}
    FORCE_HTTPS: 'false'
services:
- name: postgres
  image: postgres:16
  ports:
  - "127.0.0.1:5432:5432"
  environment:
    POSTGRES_USER: outline
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: outline
  volumes:
  - postgres_data:/var/lib/postgresql/data
- name: redis
  image: redis:7-alpine
  ports:
  - "127.0.0.1:6380:6379"
  environment: {}
  volumes: []
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '3000'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
monitoring:
  status_panel: true
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: .stacker/migrate.sh
env_file: .env
install:
  inputs:
    commonDomain: example.com
config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        UTILS_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        REDIS_URL:
          mutability: editable
          display: string
        DATABASE_URL:
          mutability: editable
          display: string
        FILE_STORAGE_UPLOAD_MAX_SIZE:
          mutability: editable
          display: number

marketplace:
  publish: true
  display_name: "Outline"
  short_description: "Self-hosted outline application, ready to deploy with Stacker"
  long_description: |
    **Outline**: Self-hosted outline application, ready to deploy with Stacker

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `outlinewiki/outline:latest` |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DATABASE_URL`, `FILE_STORAGE_UPLOAD_MAX_SIZE`, `REDIS_URL` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/outline

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [outline]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/outline
  no_secrets_confirmation: true
