name: minio

project:
  identity: minio

install:
  inputs:
    commonDomain: s3.example.com

app:
  type: custom
  image: bitnami/minio:latest
  ports:
    - "9000:9000"
    - "9001:9001"
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  command: server /data --console-address ":9001"
  volumes:
    - minio_data:/data

volumes:
  minio_data: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: s3.example.com
      ssl: off
      upstream: app:9000

monitoring:
  status_panel: true

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        MINIO_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MINIO_ROOT_USER:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "9000"
      - "9001"

marketplace:
  publish: true
  display_name: "Minio"
  short_description: "S3-compatible object storage for private clouds. Store and serve buckets with a console, lifecycle rules and replication."
  long_description: |
    **MinIO**: S3-compatible object storage for private clouds. Store and serve buckets with a console, lifecycle rules and replication.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9000 (public), 9001 (public) | `pgsty/silo:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `MINIO_ROOT_USER` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/minio

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [minio]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/minio
  no_secrets_confirmation: true
