name: minio

project:
  identity: minio

install:
  inputs:
    commonDomain: s3.example.com

app:
  type: custom
  image: minio/minio:latest
  ports:
    - "9000:9000"
    - "9001:9001"
  environment:
    MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  command: server /data --console-address ":9001"
  volumes:
    - minio_data:/data

volumes:
  minio_data: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: s3.example.com
      ssl: off
      upstream: app:9000

monitoring:
  status_panel: true

hooks:
  pre_build: ./scripts/generate-secrets.sh

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "9000"
      - "9001"
