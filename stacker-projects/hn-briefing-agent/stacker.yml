name: hn-briefing-agent
version: "1.0.0"

project:
  identity: hn-briefing-agent

install:
  inputs:
    commonDomain: hn-briefing.example.com

app:
  type: custom
  image: optimum/hn-briefing-agent:1.0.0
  ports:
    - "8000:8000"
  environment:
    GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    AGENTSCOUT_DELIVERY: ${AGENTSCOUT_DELIVERY}
    AGENTSCOUT_WEBHOOK_URL: ${AGENTSCOUT_WEBHOOK_URL}
    AGENTSCOUT_GMAIL_CLIENT_ID: ${AGENTSCOUT_GMAIL_CLIENT_ID}
    AGENTSCOUT_GMAIL_CLIENT_SECRET: ${AGENTSCOUT_GMAIL_CLIENT_SECRET}
    AGENTSCOUT_GMAIL_REFRESH_TOKEN: ${AGENTSCOUT_GMAIL_REFRESH_TOKEN}
  healthcheck:
    test: "CMD python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/docs')\""
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        AGENTSCOUT_GMAIL_CLIENT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        AGENTSCOUT_GMAIL_REFRESH_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        GOOGLE_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    app:
      fields:
        GOOGLE_API_KEY:
          mutability: provided
          display: password
          required: false
        AGENTSCOUT_DELIVERY:
          mutability: editable
          required: false
        AGENTSCOUT_WEBHOOK_URL:
          mutability: editable
          required: false
        AGENTSCOUT_GMAIL_CLIENT_ID:
          mutability: editable
          required: false
        AGENTSCOUT_GMAIL_CLIENT_SECRET:
          mutability: provided
          display: password
          required: false
        AGENTSCOUT_GMAIL_REFRESH_TOKEN:
          mutability: provided
          display: password
          required: false
