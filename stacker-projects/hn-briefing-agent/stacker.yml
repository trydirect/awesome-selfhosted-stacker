name: hn-briefing-agent
version: "1.0.0"

project:
  identity: hn-briefing-agent

install:
  inputs:
    commonDomain: hn-briefing.example.com

app:
  type: custom
  image: optimum/hn-briefing-agent:1.0.0
  ports:
    - "8000:8000"
  environment:
    GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    AGENTSCOUT_DELIVERY: ${AGENTSCOUT_DELIVERY}
    AGENTSCOUT_WEBHOOK_URL: ${AGENTSCOUT_WEBHOOK_URL}
    AGENTSCOUT_GMAIL_CLIENT_ID: ${AGENTSCOUT_GMAIL_CLIENT_ID}
    AGENTSCOUT_GMAIL_CLIENT_SECRET: ${AGENTSCOUT_GMAIL_CLIENT_SECRET}
    AGENTSCOUT_GMAIL_REFRESH_TOKEN: ${AGENTSCOUT_GMAIL_REFRESH_TOKEN}
  healthcheck:
    test: "CMD python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/docs')\""
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        GOOGLE_API_KEY:
          mutability: provided
          display: password
          required: false
        AGENTSCOUT_DELIVERY:
          mutability: editable
          required: false
        AGENTSCOUT_WEBHOOK_URL:
          mutability: editable
          required: false
        AGENTSCOUT_GMAIL_CLIENT_ID:
          mutability: editable
          required: false
        AGENTSCOUT_GMAIL_CLIENT_SECRET:
          mutability: provided
          display: password
          required: false
        AGENTSCOUT_GMAIL_REFRESH_TOKEN:
          mutability: provided
          display: password
          required: false

marketplace:
  publish: true
  display_name: "Hn Briefing Agent"
  short_description: "Scheduled HN briefing API (Gemini/ADK), webhook or Gmail delivery"
  long_description: |
    **Hn Briefing Agent**: Scheduled HN briefing API (Gemini/ADK), webhook or Gmail delivery

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `optimum/hn-briefing-agent:1.0.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `AGENTSCOUT_DELIVERY`, `AGENTSCOUT_GMAIL_CLIENT_ID`, `AGENTSCOUT_WEBHOOK_URL` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/hn-briefing-agent

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [hn briefing agent]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/hn-briefing-agent
  no_secrets_confirmation: true
