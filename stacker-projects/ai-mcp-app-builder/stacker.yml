name: ai-mcp-app-builder
version: "1.0.0"

project:
  identity: ai-mcp-app-builder

install:
  inputs:
    commonDomain: ai-mcp-app-builder.example.com

app:
  type: custom
  image: optimum/ai-mcp-app-builder:1.0.0
  ports:
    - "3000:3000"
  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_MODEL: ${OPENAI_MODEL}
    E2B_API_KEY: ${E2B_API_KEY}
    E2B_TEMPLATE: ${E2B_TEMPLATE}
    DEFAULT_MCP_SERVERS: ${DEFAULT_MCP_SERVERS}
  healthcheck:
    test: "CMD wget -q -O /dev/null http://localhost:3000/"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 60s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        E2B_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENAI_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENAI_MODEL:
          mutability: editable
          required: false
        E2B_TEMPLATE:
          mutability: editable
          required: false
        DEFAULT_MCP_SERVERS:
          mutability: editable
          required: false

marketplace:
  publish: true
  display_name: "Ai Mcp App Builder"
  short_description: "Describe an MCP app, get a live sandboxed instance"
  long_description: |
    **AI MCP App Builder**: Describe an MCP app, get a live sandboxed instance

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | Web UI |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DEFAULT_MCP_SERVERS`, `E2B_TEMPLATE`, `OPENAI_MODEL` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/ai-mcp-app-builder

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [ai mcp app builder]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/ai-mcp-app-builder
  no_secrets_confirmation: true
