name: ai-mcp-app-builder
version: "1.0.0"

project:
  identity: ai-mcp-app-builder

install:
  inputs:
    commonDomain: ai-mcp-app-builder.example.com

app:
  type: custom
  image: optimum/ai-mcp-app-builder:1.0.0
  ports:
    - "3000:3000"
  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    OPENAI_MODEL: ${OPENAI_MODEL}
    E2B_API_KEY: ${E2B_API_KEY}
    E2B_TEMPLATE: ${E2B_TEMPLATE}
    DEFAULT_MCP_SERVERS: ${DEFAULT_MCP_SERVERS}
  healthcheck:
    test: "CMD wget -q -O /dev/null http://localhost:3000/"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 60s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        E2B_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENAI_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENAI_MODEL:
          mutability: editable
          required: false
        E2B_TEMPLATE:
          mutability: editable
          required: false
        DEFAULT_MCP_SERVERS:
          mutability: editable
          required: false