name: typesense

project:
  identity: typesense

install:
  inputs:
    commonDomain: search.example.com

app:
  type: custom
  image: typesense/typesense:31.0.rc22
  ports:
    - "8108:8108"
  environment:
    TYPESENSE_DATA_DIR: /data
    TYPESENSE_API_KEY: "${TYPESENSE_API_KEY}"
    TYPESENSE_ENABLE_CORS: "true"
  command: --data-dir /data --api-key=${TYPESENSE_API_KEY} --enable-cors
  volumes:
    - typesense_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8108"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        TYPESENSE_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        TYPESENSE_DATA_DIR:
          mutability: editable
        TYPESENSE_ENABLE_CORS:
          mutability: editable
          display: boolean
        command:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
env_file: .env

volumes:
  typesense_data: {}

marketplace:
  publish: true
  display_name: "Typesense"
  short_description: "Fast, typo-tolerant open-source search engine optimized for developer productivity. Lightning search with a friendly API."
  long_description: |
    **Typesense**: Fast, typo-tolerant open-source search engine optimized for developer productivity. Lightning search with a friendly API.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8108 (public) | Search |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `TYPESENSE_DATA_DIR`, `TYPESENSE_ENABLE_CORS` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/typesense

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [typesense]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/typesense
  no_secrets_confirmation: true
