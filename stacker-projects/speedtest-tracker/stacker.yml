name: speedtest-tracker

app:
  type: custom
  image: lscr.io/linuxserver/speedtest-tracker:latest
  ports:
    - "8080:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    APP_KEY: ${APP_KEY}
  volumes:
    - speedtest_config:/config

volumes:
  speedtest_config: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test

config_contract:
  services:
    app:
      fields:
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Speedtest Tracker"
  short_description: "Automated internet speed tests with historical charts and alerts. Track download, upload and ping over time."
  long_description: |
    **Speedtest Tracker**: Automated internet speed tests with historical charts and alerts. Track download, upload and ping over time.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | API server |

    ## What you configure

    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/speedtest-tracker

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [speedtest tracker]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/speedtest-tracker
  no_secrets_confirmation: true
