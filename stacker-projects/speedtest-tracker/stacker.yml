name: speedtest-tracker

app:
  type: custom
  image: lscr.io/linuxserver/speedtest-tracker:latest
  ports:
    - "8080:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    APP_KEY: ${APP_KEY}
  volumes:
    - speedtest_config:/config

volumes:
  speedtest_config: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test

config_contract:
  services:
    app:
      fields:
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env
