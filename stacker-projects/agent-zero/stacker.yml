name: agent-zero
version: "1.0.1"

project:
  identity: agent-zero

install:
  inputs:
    commonDomain: agent-zero.example.com

app:
  type: custom
  image: agent0ai/agent-zero:v2.14
  ports:
    - "50080:80"
  environment:
    AUTH_LOGIN: "${AUTH_LOGIN}"
    AUTH_PASSWORD: "${AUTH_PASSWORD}"
  volumes:
    - agent_zero_usr:/a0/usr
  healthcheck:
    test: "CMD curl -fsI http://localhost:80/"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

volumes:
  agent_zero_usr: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "50080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        AUTH_LOGIN:
          mutability: editable
        AUTH_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        agent_zero_usr:
          mutability: generated

marketplace:
  display_name: Agent Zero
  short_description: "Agent Zero AI agent framework on your own server: the agent gets a Linux computer, a browser and memory, behind a login."
  category: ai-agents
  tags: [ai-agent, autonomous-agent, llm, browser-automation]
  license: free
  support_url: https://github.com/agent0ai/agent-zero
  no_secrets_confirmation: true
  long_description: |
    ## Agent Zero

    [Agent Zero](https://github.com/agent0ai/agent-zero) is an open agent framework for work
    that needs more than chat. The agent runs in its own Dockerized Linux environment with a
    terminal, files, a browser and per-project memory, and can delegate tasks to subagents.

    ### What you get

    - **Agent Zero v2.14** web UI on port 50080
    - A persistent volume for your settings, projects, memory and files
    - A health check on the container

    ### Security

    The web UI and API require a login. The username defaults to `admin` and the
    password is generated fresh for every install. The UI is served over plain HTTP on
    port 50080; put it behind HTTPS before sending real credentials over the internet.

    ### After install

    Open the web UI, sign in, and choose your LLM provider and API key in Settings
    (OpenAI, Anthropic, OpenRouter, Ollama and others).
