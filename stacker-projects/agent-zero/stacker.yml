name: agent-zero
version: "1.0.0"

project:
  identity: agent-zero

install:
  inputs:
    commonDomain: agent-zero.example.com

app:
  type: custom
  image: agent0ai/agent-zero:v2.14
  ports:
    - "50080:80"
  environment:
    AUTH_LOGIN: "${AUTH_LOGIN}"
    AUTH_PASSWORD: "${AUTH_PASSWORD}"
  volumes:
    - agent_zero_usr:/a0/usr
  healthcheck:
    test: "CMD curl -fsI http://localhost:80/"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

volumes:
  agent_zero_usr: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "50080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        AUTH_LOGIN:
          mutability: editable
        AUTH_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        agent_zero_usr:
          mutability: generated

marketplace:
  publish: true
  display_name: "Agent Zero"
  short_description: "AI agent framework with computer use, RAG and multi-model support"
  long_description: |
    **Agent Zero**: AI agent framework with computer use, RAG and multi-model support

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 50080) | `agent0ai/agent-zero:v2.14` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `AUTH_LOGIN` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/agent-zero

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [agent zero]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/agent-zero
  no_secrets_confirmation: true
