name: rustfs
version: 1.0.0
organization: null
project:
  identity: rustfs
app:
  type: custom
  path: .
  dockerfile: null
  image: rustfs/rustfs:latest
  build: null
  ports:
  - "9000:9000"
  - "9001:9001"
  volumes:
  - rustfs_data:/data
  - rustfs_logs:/app/logs
  environment:
    RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    RUSTFS_OBS_LOGGER_LEVEL: info
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
    RUSTFS_CONSOLE_ENABLE: 'true'
    RUSTFS_VOLUMES: /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3
    RUSTFS_ADDRESS: 0.0.0.0:9000
    RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
    RUSTFS_UNSAFE_BYPASS_DISK_CHECK: 'true'
  command: null
  healthcheck: null
services:
- name: otel-collector
  image: otel/opentelemetry-collector:latest
  ports: []
  environment: {}
  volumes: []
  depends_on: []
  command: null
  healthcheck: null
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: ~/.ssh/id_ed25519
    key: null
    server: null
    public_ports:
    - '9000'
    - '9001'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: ./entrypoint.sh
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        RUSTFS_ACCESS_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        RUSTFS_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        rustfs_data: { mutability: generated }
        rustfs_logs: { mutability: generated }

marketplace:
  publish: true
  display_name: "Rustfs"
  short_description: "S3-compatible object storage written in Rust. Fast, reliable private file storage with a clean S3 API."
  long_description: |
    **Rustfs**: S3-compatible object storage written in Rust. Fast, reliable private file storage with a clean S3 API.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9000 (public), 9001 (public) | Object storage |
    | otel-collector | internal | `otel/opentelemetry-collector:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/rustfs

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [rustfs]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/rustfs
  no_secrets_confirmation: true
