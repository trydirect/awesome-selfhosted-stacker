name: writefreely
version: "0.15.0"

project:
  identity: writefreely

install:
  inputs:
    commonDomain: blog.example.com

app:
  type: custom
  image: writeas/writefreely:latest
  ports:
    - "8082:8080"
  environment:
    WF_HOST: blog.example.com
    WF_DB_TYPE: mysql
    WF_DB_HOST: mysql
    WF_DB_NAME: writefreely
    WF_DB_USER: writefreely
    WF_DB_PASSWORD: "${DB_PASSWORD}"
  volumes:
    - writefreely_data:/data
  depends_on:
    - mysql

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: writefreely
      MYSQL_USER: writefreely
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - writefreely_mysql:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        WF_DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    mysql:
      fields:
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  writefreely_data: {}
  writefreely_mysql: {}

marketplace:
  publish: true
  display_name: "Writefreely"
  short_description: "Minimalist federated blogging platform with Markdown"
  long_description: |
    **Writefreely**: Minimalist federated blogging platform with Markdown

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public on 8082) | `writeas/writefreely:latest` |
    | mysql | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/writefreely

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [writefreely]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/writefreely
  no_secrets_confirmation: true
