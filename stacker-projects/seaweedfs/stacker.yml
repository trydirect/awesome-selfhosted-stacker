name: seaweedfs

project:
  identity: seaweedfs

install:
  inputs:
    commonDomain: storage.example.com

app:
  type: custom
  image: chrislusf/seaweedfs:latest
  ports:
    - "8888:8888"
    - "8333:8333"
  environment:
    WEED_SERVER_ADDR: 0.0.0.0
  command: server -dir=/data -s3 -ip=0.0.0.0 -ip.bind=0.0.0.0
  volumes:
    - seaweedfs_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8888"
      - "8333"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  seaweedfs_data: {}