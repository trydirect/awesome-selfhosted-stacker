name: seaweedfs

project:
  identity: seaweedfs

install:
  inputs:
    commonDomain: storage.example.com

app:
  type: custom
  image: chrislusf/seaweedfs:3.76
  ports:
    - "8888:8888"
    - "8333:8333"
  environment:
    WEED_SERVER_ADDR: 0.0.0.0
  command: server -dir=/data -s3 -ip=0.0.0.0 -ip.bind=0.0.0.0
  volumes:
    - seaweedfs_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8888"
      - "8333"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        WEED_SERVER_ADDR:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  seaweedfs_data: {}

marketplace:
  publish: true
  display_name: "Seaweedfs"
  short_description: "Scalable distributed file storage optimized for small files. Simple S3 API with automatic volume allocation."
  long_description: |
    **Seaweedfs**: Scalable distributed file storage optimized for small files. Simple S3 API with automatic volume allocation.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8888 (public), 8333 (public) | Object storage |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `WEED_SERVER_ADDR` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/seaweedfs

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [seaweedfs]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/seaweedfs
  no_secrets_confirmation: true
