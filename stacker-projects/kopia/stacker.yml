name: kopia

project:
  identity: kopia

install:
  inputs:
    commonDomain: kopia.try.direct

app:
  type: custom
  image: kopia/kopia:latest
  ports:
    - "51515:51515"
  environment:
    KOPIA_PASSWORD: ${KOPIA_PASSWORD}
    USER: root
  command: server start --insecure --address=0.0.0.0:51515
  volumes:
    - kopia_config:/app/config
    - kopia_cache:/app/cache
    - kopia_logs:/app/logs

volumes:
  kopia_config: {}
  kopia_cache: {}
  kopia_logs: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: kopia.example.com
      ssl: off
      upstream: app:51515

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: server
  server:
    host: 46.224.127.228
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "51515"
