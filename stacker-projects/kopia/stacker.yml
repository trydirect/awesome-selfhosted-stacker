name: kopia

project:
  identity: kopia

install:
  inputs:
    commonDomain: kopia.try.direct

app:
  type: custom
  image: kopia/kopia:latest
  ports:
    - "51515:51515"
  environment:
    KOPIA_PASSWORD: ${KOPIA_PASSWORD}
    USER: root
  command: server start --insecure --address=0.0.0.0:51515
  volumes:
    - kopia_config:/app/config
    - kopia_cache:/app/cache
    - kopia_logs:/app/logs

volumes:
  kopia_config: {}
  kopia_cache: {}
  kopia_logs: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: kopia.example.com
      ssl: off
      upstream: app:51515

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        KOPIA_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        USER:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "51515"

marketplace:
  publish: true
  display_name: "Kopia"
  short_description: "Fast, encrypted incremental backups with content-addressed storage. Deduplicate, compress and snapshot to any storage backend."
  long_description: |
    **Kopia**: Fast, encrypted incremental backups with content-addressed storage. Deduplicate, compress and snapshot to any storage backend.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 51515 (public) | `kopia/kopia:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `USER` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/kopia

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [kopia]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/kopia
  no_secrets_confirmation: true
