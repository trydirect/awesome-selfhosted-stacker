name: plane

app:
  type: custom
  image: makeplane/plane-aio-community:stable
  ports:
    - "8000:8000/tcp"
  environment:
    DATABASE_URL: postgresql://plane:${DB_PASSWORD}@db:5432/plane
    REDIS_URL: redis://redis:6379
    WEB_BASE_URL: http://localhost:8000
    SECRET_KEY: ${SECRET_KEY}
  volumes:
    - plane_data:/app
  depends_on:
    - db
    - redis
  healthcheck:
    test: "CMD curl -fs http://localhost:8000"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

services:
  - name: db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - plane_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U plane -d plane"
      interval: 10s
      timeout: 5s
      retries: 6
  - name: redis
    image: redis:7-alpine
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  plane_data: {}
  plane_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DATABASE_URL:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        WEB_BASE_URL:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        plane_data:
          mutability: generated
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        plane_db:
          mutability: generated
