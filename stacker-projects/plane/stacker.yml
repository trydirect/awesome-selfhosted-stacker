name: plane

app:
  type: custom
  image: makeplane/plane-aio-community:stable
  ports:
    - "8000:80/tcp"
  environment:
    DOMAIN_NAME: localhost
    DATABASE_URL: postgresql://plane:${DB_PASSWORD}@db:5432/plane
    REDIS_URL: redis://redis:6379
    AMQP_URL: amqp://plane:${MQ_PASSWORD}@mq:5672/plane
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: plane
    AWS_SECRET_ACCESS_KEY: plane123secret
    AWS_S3_ENDPOINT_URL: http://minio:9000
    AWS_S3_BUCKET_NAME: uploads
    USE_MINIO: "1"
    SECRET_KEY: ${SECRET_KEY}
  volumes:
    - plane_data:/app
  depends_on:
    - db
    - redis
    - mq
    - minio
  healthcheck:
    test: "CMD curl -fs http://localhost:80"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 180s

services:
  - name: db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: plane
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - plane_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U plane -d plane"
      interval: 10s
      timeout: 5s
      retries: 6
  - name: redis
    image: redis:7-alpine
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5
  - name: mq
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - plane_mq:/var/lib/rabbitmq
    healthcheck:
      test: "CMD rabbitmq-diagnostics -q ping"
      interval: 10s
      timeout: 10s
      retries: 8
  - name: minio
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: plane
      MINIO_ROOT_PASSWORD: plane123secret
      MINIO_DEFAULT_BUCKETS: uploads
    volumes:
      - plane_minio:/bitnami/minio
    healthcheck:
      test: "CMD curl -f http://localhost:9000/minio/health/live"
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  plane_data: {}
  plane_db: {}
  plane_mq: {}
  plane_minio: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        AWS_ACCESS_KEY_ID:
          mutability: editable
        AWS_REGION:
          mutability: editable
        AWS_S3_BUCKET_NAME:
          mutability: editable
        AWS_S3_ENDPOINT_URL:
          mutability: editable
        AWS_SECRET_ACCESS_KEY:
          mutability: editable
        AMQP_URL:
          mutability: editable
        DATABASE_URL:
          mutability: editable
        DOMAIN_NAME:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          display: password
        USE_MINIO:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        plane_data:
          mutability: generated
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        plane_db:
          mutability: generated
    mq:
      fields:
        environment:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        plane_mq:
          mutability: generated
    minio:
      fields:
        command:
          mutability: editable
        environment:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        plane_minio:
          mutability: generated
