name: readeck

project:
  identity: readeck

install:
  inputs:
    commonDomain: readeck.example.com

app:
  type: custom
  image: codeberg.org/readeck/readeck:0.16.2
  ports:
    - "8000:8000"
  environment:
    READECK_DATABASE_DRIVER: postgres
    READECK_DATABASE_SOURCE: "postgres://readeck:${DB_PASSWORD}@postgres:5432/readeck?sslmode=disable"
    READECK_SECRET_KEY: "${SECRET_KEY}"
  volumes:
    - readeck_data:/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: readeck
      POSTGRES_USER: readeck
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U readeck"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: readeck.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        READECK_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        READECK_DATABASE_DRIVER:
          mutability: editable
        READECK_DATABASE_SOURCE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  readeck_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Readeck"
  short_description: "Read-it-later service that extracts clean articles from the web. Save, tag and read offline with readeck."
  long_description: |
    **Readeck**: Read-it-later service that extracts clean articles from the web. Save, tag and read offline with readeck.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `codeberg.org/readeck/readeck:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `READECK_DATABASE_DRIVER`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/readeck

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [readeck]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/readeck
  no_secrets_confirmation: true
