name: lobechat

project:
  identity: lobechat

install:
  inputs:
    commonDomain: chat.example.com

app:
  type: custom
  image: lobehub/lobe-chat:latest
  ports:
    - "3210:3210"
  environment:
    NEXT_PUBLIC_SELF_HOSTED: "true"
    ACCESS_CODE: "${ADMIN_PASSWORD}"
    DATABASE_URL: "postgresql://lobechat:${DB_PASSWORD}@postgres:5432/lobechat"
    NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${AUTH_SECRET}"
    S3_ENDPOINT: https://s3.amazonaws.com
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    S3_BUCKET: lobechat
  volumes:
    - lobechat_data:/app/data
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: lobechat
      POSTGRES_USER: lobechat
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U lobechat"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "3210"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  lobechat_data: {}
  postgres_data: {}