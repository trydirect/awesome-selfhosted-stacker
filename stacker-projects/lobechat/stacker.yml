name: lobechat

project:
  identity: lobechat

install:
  inputs:
    commonDomain: chat.example.com

app:
  type: custom
  image: lobehub/lobe-chat:latest
  ports:
    - "3210:3210"
  environment:
    NEXT_PUBLIC_SELF_HOSTED: "true"
    ACCESS_CODE: "${ADMIN_PASSWORD}"
    DATABASE_URL: "postgresql://lobechat:${DB_PASSWORD}@postgres:5432/lobechat"
    NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${AUTH_SECRET}"
    S3_ENDPOINT: https://s3.amazonaws.com
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    S3_BUCKET: lobechat
  volumes:
    - lobechat_data:/app/data
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: lobechat
      POSTGRES_USER: lobechat
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U lobechat"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: lobechat.example.com
      ssl: off
      upstream: app:3210

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3210"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ACCESS_CODE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXT_PUBLIC_SELF_HOSTED:
          mutability: editable
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        S3_ACCESS_KEY_ID:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        S3_BUCKET:
          mutability: editable
        S3_ENDPOINT:
          mutability: editable
        S3_REGION:
          mutability: editable
        S3_SECRET_ACCESS_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        depends_on:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  lobechat_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Lobechat"
  short_description: "Modern, feature-rich ChatGPT-style UI supporting many LLM providers and plugins. Beautiful self-hosted AI chat experience."
  long_description: |
    **Lobechat**: Modern, feature-rich ChatGPT-style UI supporting many LLM providers and plugins. Beautiful self-hosted AI chat experience.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3210 (public) | `lobehub/lobe-chat:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `NEXT_PUBLIC_SELF_HOSTED`, `S3_BUCKET`, `S3_ENDPOINT`, `S3_REGION`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 6 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/lobechat

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [lobechat]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/lobechat
  no_secrets_confirmation: true
