name: floci
version: null
organization: null
project:
  identity: null
app:
  type: custom
  path: .
  dockerfile: null
  image: floci/floci:nightly
  build: null
  ports:
  - "4566:4566"
  volumes:
  - /var/run/docker.sock:/var/run/docker.sock
  - ./data:/app/data
  environment:
    FLOCI_TLS_ENABLED: 'false'
    FLOCI_HOSTNAME: floci
    FLOCI_SERVICES_DOCKER_NETWORK: floci_default
    FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED: 'true'
    FLOCI_BASE_URL: http://floci:4566
    FLOCI_SERVICES_RDS_PROXY_BASE_PORT: '7001'
  command: null
  healthcheck:
    test: CMD curl -f http://localhost:4566/_floci/health || exit 1
    interval: 10s
    timeout: 5s
    retries: 10
services:
  - name: floci-ui
    image: floci/floci-ui:0.7.0
    ports:
      - "4500:4500"
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PORT: "4500"
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: cloud
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: nbg1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: ~/.ssh/id_rsa
    key: null
    server: null
    public_ports:
    - '4566'
  server: null
  registry: null
  default_target: null
  targets: {}
install:
  inputs: {}
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck:
    endpoint: http://localhost:4566/_floci/health
    interval: 30s
  metrics: null
hooks:
  pre_build: null
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        FLOCI_HOSTNAME:
          mutability: generated
          type: alphanumeric
          length: 16
        FLOCI_TLS_ENABLED:
          mutability: editable
          display: boolean
        FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED:
          mutability: editable
          display: boolean
        FLOCI_SERVICES_RDS_PROXY_BASE_PORT:
          mutability: editable
          display: number
    floci-ui:
      fields:
        AWS_ACCESS_KEY_ID:
          mutability: generated
          type: alphanumeric
          length: 20
          display: password
        AWS_SECRET_ACCESS_KEY:
          mutability: generated
          type: base64
          length: 40
          display: password
        AWS_REGION:
          mutability: editable

marketplace:
  publish: true
  display_name: "Floci"
  short_description: "Self-hosted network monitoring and visualization tool. Map and observe your infrastructure from a single pane of glass."
  long_description: |
    **floci**: Self-hosted network monitoring and visualization tool. Map and observe your infrastructure from a single pane of glass.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 4566 (public) | `floci/floci:latest` |
    | floci-ui | 4500 (public) | Web UI |

    ## What you configure

    - **Defaults provided**: `FLOCI_SERVICES_LAMBDA_HOT_RELOAD_ENABLED`, `FLOCI_SERVICES_RDS_PROXY_BASE_PORT`, `FLOCI_TLS_ENABLED`, `AWS_REGION` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/floci

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [floci]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/floci
  no_secrets_confirmation: true
