name: rocket-chat
version: 6.12.0
project:
  identity: rocket-chat
install:
  inputs:
    commonDomain: chat.example.com
app:
  type: custom
  image: rocket.chat:6.12.2
  ports:
  - "3000:3000"
  environment:
    MONGO_URL: mongodb://mongo:27017/rocketchat
    MONGO_OPLOG_URL: mongodb://mongo:27017/local
    ROOT_URL: https://chat.example.com
  depends_on:
  - mongo
services:
- name: mongo
  image: mongo:9.0.4.0.12
  environment:
    MONGO_INITDB_DATABASE: rocketchat
  ports:
  - "127.0.0.1:27017:27017"
  volumes:
  - mongo_data:/data/db
  command: |
    mongod --replSet rs0
  healthcheck:
    test: CMD mongosh --eval 'db.adminCommand("ping")'
    interval: 10s
    timeout: 5s
    retries: 10
volumes:
  mongo_data: {}
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '3000'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
monitoring:
  status_panel: true
config_contract:
  services:
    app:
      fields:
        MONGO_OPLOG_URL:
          mutability: editable
        MONGO_URL:
          mutability: editable
        ROOT_URL:
          mutability: editable
        depends_on:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Rocket Chat"
  short_description: "Open-source team communication platform with chat, channels and integrations. A self-hosted Slack alternative at any scale."
  long_description: |
    **Rocket Chat**: Open-source team communication platform with chat, channels and integrations. A self-hosted Slack alternative at any scale.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `rocket.chat:6.12.2` |
    | mongo | 27017 (local only) | `mongo:7.0.12` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `MONGO_OPLOG_URL`, `MONGO_URL`, `ROOT_URL` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/rocket-chat

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [rocket chat]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/rocket-chat
  no_secrets_confirmation: true
