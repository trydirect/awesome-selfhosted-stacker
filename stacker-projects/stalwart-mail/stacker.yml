name: stalwart-mail

project:
  identity: stalwart-mail

install:
  inputs:
    commonDomain: mail.example.com

app:
  type: custom
  image: stalwartlabs/mail-server:latest
  ports:
    - "25:25"
    - "143:143"
    - "465:465"
    - "587:587"
    - "993:993"
    - "8080:8080"
  environment:
    STALWART_ADMIN_SECRET: "${ADMIN_PASSWORD}"
  volumes:
    - stalwart_data:/opt/stalwart-mail

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: mail.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "25"
      - "80"
      - "143"
      - "443"
      - "465"
      - "587"
      - "993"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  stalwart_data: {}
