name: stalwart-mail

project:
  identity: stalwart-mail

install:
  inputs:
    commonDomain: mail.example.com

app:
  type: custom
  image: stalwartlabs/stalwart:latest
  ports:
    - "25:25"
    - "143:143"
    - "465:465"
    - "587:587"
    - "993:993"
    - "8080:8080"
  environment:
    STALWART_ADMIN_SECRET: "${ADMIN_PASSWORD}"
  volumes:
    - stalwart_data:/opt/stalwart-mail

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: mail.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "25"
      - "80"
      - "143"
      - "443"
      - "465"
      - "587"
      - "993"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        STALWART_ADMIN_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
env_file: .env

volumes:
  stalwart_data: {}

marketplace:
  publish: true
  display_name: "Stalwart Mail"
  short_description: "All-in-one mail server written in Rust: SMTP, IMAP, JMAP with spam filtering. Modern, fast self-hosted email in a single binary."
  long_description: |
    **Stalwart Mail**: All-in-one mail server written in Rust: SMTP, IMAP, JMAP with spam filtering. Modern, fast self-hosted email in a single binary.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 25 (public), 143 (public), 465 (public), 587 (public), 993 (public), 8080 (public) | `stalwartlabs/stalwart:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/stalwart-mail

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [stalwart mail]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/stalwart-mail
  no_secrets_confirmation: true
