name: organizr

app:
  type: custom
  image: organizr/organizr:latest
  ports:
    - "9983:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - organizr_config:/config

volumes:
  organizr_config: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "9983"
