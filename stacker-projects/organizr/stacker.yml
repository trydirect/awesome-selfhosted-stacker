name: organizr

app:
  type: custom
  image: organizr/organizr:latest
  ports:
    - "9983:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - organizr_config:/config

volumes:
  organizr_config: {}

proxy:
  type: none
  auto_detect: false

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9983"

marketplace:
  publish: true
  display_name: "Organizr"
  short_description: "Iframe-based start page that integrates all your self-hosted apps with SSO. One tab to rule your homelab."
  long_description: |
    **Organizr**: Iframe-based start page that integrates all your self-hosted apps with SSO. One tab to rule your homelab.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 9983) | `organizr/organizr:latest` |

    ## What you configure

    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/organizr

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [organizr]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/organizr
  no_secrets_confirmation: true
