name: bitwarden
version: "2024.7.0"

project:
  identity: bitwarden

install:
  inputs:
    commonDomain: vault.example.com

app:
  type: custom
  image: vaultwarden/server:alpine
  ports:
    - "80:80"
    - "3012:3012"
  environment:
    DOMAIN: "https://vault.example.com"
    SIGNUPS_ALLOWED: "false"
    INVITATIONS_ALLOWED: "true"
    SHOW_PASSWORD_HINT: "false"
    LOG_LEVEL: info
    LOG_FILE: /data/vw.log
    DATABASE_URL: "postgresql://bitwarden:${DB_PASSWORD}@bitwarden_db:5432/bitwarden"
    ADMIN_TOKEN: "${ADMIN_TOKEN}"
  volumes:
    - bitwarden_data:/data

services:
  - name: bitwarden_db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: bitwarden
      POSTGRES_USER: bitwarden
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bitwarden_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U bitwarden -d bitwarden"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  bitwarden_db: {}
  bitwarden_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: local
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"
      - "3012"

config_contract:
  services:
    app:
      fields:
        ADMIN_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SHOW_PASSWORD_HINT:
          mutability: provided
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    bitwarden_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

marketplace:
  publish: true
  display_name: "Bitwarden"
  short_description: "Bitwarden password manager server components for self-hosted credential management. Store and sync passwords securely across all your devices."
  long_description: |
    **Bitwarden**: Bitwarden password manager server components for self-hosted credential management. Store and sync passwords securely across all your devices.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public), 3012 (public) | API server |
    | bitwarden_db | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **SHOW_PASSWORD_HINT**: you provide this in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/bitwarden

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [bitwarden]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/bitwarden
  no_secrets_confirmation: true
