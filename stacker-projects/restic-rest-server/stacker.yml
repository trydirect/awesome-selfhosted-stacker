name: restic-rest-server

project:
  identity: restic-rest-server

install:
  inputs:
    commonDomain: backup.example.com

app:
  type: custom
  image: restic/rest-server:latest
  ports:
    - "8000:8000"
  command: "/entrypoint.sh --no-auth --listen :8000"
  volumes:
    - restic_repos:/data

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: backup.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  restic_repos: {}