name: baikal

project:
  identity: baikal

install:
  inputs:
    commonDomain: dav.example.com

app:
  type: custom
  image: ckulka/baikal:0.9.5
  ports:
    - "8080:80"
  volumes:
    - baikal_config:/var/www/html/config
    - baikal_data:/var/www/html/Specific

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

monitoring:
  status_panel: true

env_file: .env

volumes:
  baikal_config: {}
  baikal_data: {}

config_contract:
  services:
    app:
      volumes:
        baikal_config:
          mutability: generated
        baikal_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Baikal"
  short_description: "Lightweight CalDAV and CardDAV server for contacts and calendars. Sync address books and events with any client using this compact Baïkal server."
  long_description: |
    **baikal**: Lightweight CalDAV and CardDAV server for contacts and calendars. Sync address books and events with any client using this compact Baïkal server.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `ckulka/baikal:0.9.5` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/baikal

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [baikal]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/baikal
  no_secrets_confirmation: true
