name: baikal

project:
  identity: baikal

install:
  inputs:
    commonDomain: dav.example.com

app:
  type: custom
  image: ckulka/baikal:latest
  ports:
    - "8080:80"
  volumes:
    - baikal_config:/var/www/html/config
    - baikal_data:/var/www/html/Specific

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

monitoring:
  status_panel: true

env_file: .env

volumes:
  baikal_config: {}
  baikal_data: {}
