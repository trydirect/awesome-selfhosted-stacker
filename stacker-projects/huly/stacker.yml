name: huly
version: "0.6.0"

project:
  identity: huly

install:
  inputs:
    commonDomain: huly.example.com
    domain: huly.try.direct
    huly-database-password: ""
    huly-auth-secret: ""
    huly-server-secret: ""

app:
  type: custom
  image: ghcr.io/hcengineering/platform:latest
  ports:
    - "8080:8080"
  environment:
    SERVER_PORT: "8080"
    DB_URL: postgres://postgres:${HULY_DATABASE_PASSWORD}@postgres:5432/huly
    REDIS_URL: redis://redis:6379
    ACCOUNTS_URL: http://localhost:8083
    AUTH_SECRET: ${HULY_AUTH_SECRET}
    UPLOAD_URL: /files
    STORAGE_CONFIG: minio|localhost?accessKey=minioadmin&secretKey=minioadmin
    TELEGRAM_API_ID: ""
    TELEGRAM_API_KEY: ""
    GITHUB_APP_NAME: ""
    GITHUB_PRIVATE_KEY: ""
    GITHUB_WEBHOOK_URL: ""
    GITHUB_CLIENT_ID: ""
    GITHUB_CLIENT_SECRET: ""
  volumes:
    - "huly-files:/files"

services:
  - name: huly-account
    image: ghcr.io/hcengineering/account:latest
    environment:
      ACCOUNTS_PORT: "8083"
      DB_URL: postgres://postgres:${HULY_DATABASE_PASSWORD}@postgres:5432/huly
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${HULY_AUTH_SECRET}
      SERVER_SECRET: ${HULY_SERVER_SECRET}
    depends_on:
      - postgres
      - redis

  - name: huly-worker
    image: ghcr.io/hcengineering/worker:latest
    environment:
      SERVER_PORT: "8080"
      DB_URL: postgres://postgres:${HULY_DATABASE_PASSWORD}@postgres:5432/huly
      REDIS_URL: redis://redis:6379
      ACCOUNTS_URL: http://huly-account:8083
      UPLOAD_URL: /files
      STORAGE_CONFIG: minio|localhost?accessKey=minioadmin&secretKey=minioadmin
    volumes:
      - "huly-files:/files"
    depends_on:
      - postgres
      - redis
      - huly-account

  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HULY_DATABASE_PASSWORD}
    volumes:
      - "huly-postgres:/var/lib/postgresql/data"

  - name: redis
    image: redis:7-alpine
    volumes:
      - "huly-redis:/data"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: huly.example.com
      ssl: off
      upstream: app:8080

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

env_file: .env

volumes:
  huly-files: {}
  huly-postgres: {}
  huly-redis: {}

config_contract:
  services:
    app:
      fields:
        ACCOUNTS_URL:
          mutability: editable
        AUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_URL:
          mutability: editable
        GITHUB_APP_NAME:
          mutability: editable
        GITHUB_CLIENT_ID:
          mutability: editable
        GITHUB_CLIENT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        GITHUB_PRIVATE_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        GITHUB_WEBHOOK_URL:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SERVER_PORT:
          mutability: editable
        STORAGE_CONFIG:
          mutability: editable
        TELEGRAM_API_ID:
          mutability: editable
        TELEGRAM_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        UPLOAD_URL:
          mutability: editable
      volumes:
        huly-files:
          mutability: generated
    huly-account:
      fields:
        ACCOUNTS_PORT:
          mutability: editable
        AUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_URL:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SERVER_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    huly-worker:
      fields:
        ACCOUNTS_URL:
          mutability: editable
        DB_URL:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SERVER_PORT:
          mutability: editable
        STORAGE_CONFIG:
          mutability: editable
        UPLOAD_URL:
          mutability: editable
      volumes:
        huly-files:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        huly-postgres:
          mutability: generated
    redis:
      volumes:
        huly-redis:
          mutability: generated
