name: caddy
app:
  type: custom
  image: caddy:2.8.4
  ports:
  - "80:80"
  - "443:443"
  - 443:443/udp
  volumes:
  - caddy_data:/data
  - caddy_config:/config
volumes:
  caddy_data: {}
  caddy_config: {}
proxy:
  type: none
  auto_detect: false
env_file: .env
deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: /Users/vasilipascal/work/stacker-project-examples/stacker-project-test
    port: 22

config_contract:
  services:
    app:
      volumes:
        caddy_data:
          mutability: generated
        caddy_config:
          mutability: generated

marketplace:
  publish: true
  display_name: "Caddy"
  short_description: "Automatic HTTPS reverse proxy and static file server. Caddy obtains and renews certificates out of the box with a one-line configuration."
  long_description: |
    **Caddy**: Automatic HTTPS reverse proxy and static file server. Caddy obtains and renews certificates out of the box with a one-line configuration.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public), 443 (public), 443/udp (public on 443) | Web server |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/caddy

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [caddy]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/caddy
  no_secrets_confirmation: true
