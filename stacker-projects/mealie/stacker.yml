name: mealie

app:
  type: custom
  image: ghcr.io/mealie-recipes/mealie:latest
  ports:
    - "9925:9000"
  environment:
    ALLOW_SIGNUP: "true"
    DB_ENGINE: sqlite
    BASE_URL: http://mealie:9000
  volumes:
    - mealie_data:/app/data

volumes:
  mealie_data: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: cloud
  server: null
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "9925"
