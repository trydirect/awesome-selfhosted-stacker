name: cryptpad
version: 5.7.0
app:
  type: custom
  image: cryptpad/cryptpad:latest
  ports:
  - "3000:3000"
  - "3001:3001"
  environment:
    CPAD_MAIN_DOMAIN: https://${DOMAIN}
    CPAD_CONF: /cryptpad/config/config.js
  volumes:
  - cryptpad-config:/cryptpad/config
  - cryptpad-data:/cryptpad/blob
  - cryptpad-customize:/cryptpad/customize
  - cryptpad-sessions:/cryptpad/sessions
env_file: .env
install:
  inputs:
    domain: cryptpad.try.direct

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: /Users/vasilipascal/work/stacker-project-examples/stacker-project-test
    port: 22
