name: cryptpad
version: 5.7.0
app:
  type: custom
  image: cryptpad/cryptpad:latest
  ports:
  - "3000:3000"
  - "3001:3001"
  environment:
    CPAD_MAIN_DOMAIN: https://${DOMAIN}
    CPAD_CONF: /cryptpad/config/config.js
  volumes:
  - cryptpad-config:/cryptpad/config
  - cryptpad-data:/cryptpad/blob
  - cryptpad-customize:/cryptpad/customize
  - cryptpad-sessions:/cryptpad/sessions
env_file: .env
install:
  inputs:
    domain: cryptpad.try.direct

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: /Users/vasilipascal/work/stacker-project-examples/stacker-project-test
    port: 22

config_contract:
  services:
    app:
      fields:
        CPAD_CONF:
          mutability: editable
        CPAD_MAIN_DOMAIN:
          mutability: editable
      volumes:
        cryptpad-config:
          mutability: generated
        cryptpad-data:
          mutability: generated
        cryptpad-customize:
          mutability: generated
        cryptpad-sessions:
          mutability: generated

marketplace:
  publish: true
  display_name: "Cryptpad"
  short_description: "Zero-knowledge collaborative office suite: documents, spreadsheets, presentations and kanban. All content is encrypted in the browser before storage."
  long_description: |
    **CryptPad**: Zero-knowledge collaborative office suite: documents, spreadsheets, presentations and kanban. All content is encrypted in the browser before storage.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public), 3001 (public) | `cryptpad/cryptpad:latest` |

    ## What you configure

    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `CPAD_CONF`, `CPAD_MAIN_DOMAIN` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/cryptpad

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [cryptpad]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/cryptpad
  no_secrets_confirmation: true
