name: dawarich
version: "0.16.0"

project:
  identity: dawarich

install:
  inputs:
    commonDomain: locations.example.com
    domain: locations.try.direct
    dawarich-database-password: ""
    dawarich-secret-key-base: ""
    dawarich-encryption-key: ""

app:
  type: custom
  image: freikin/dawarich:latest
  ports:
    - "3000:3000"
  environment:
    RAILS_ENV: production
    REDIS_URL: redis://redis:6379/0
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: dawarich
    DATABASE_USERNAME: dawarich
    DATABASE_PASSWORD: ${DAWARICH_DATABASE_PASSWORD}
    SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
    APPLICATION_HOST: ${DOMAIN}
    APPLICATION_PROTOCOL: https
    ENCRYPTION_PRIMARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
    ENCRYPTION_DTERMINARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
    DawarichBackgroundJob: enabled
    SELF_HOSTED: "true"
  volumes:
    - "dawarich-storage:/var/app/storage"

services:
  - name: dawarich-background
    image: freikin/dawarich:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: dawarich
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: ${DAWARICH_DATABASE_PASSWORD}
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      APPLICATION_HOST: ${DOMAIN}
      APPLICATION_PROTOCOL: https
      ENCRYPTION_PRIMARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
      ENCRYPTION_DTERMINARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
    volumes:
      - "dawarich-storage:/var/app/storage"
    depends_on:
      - postgres
      - redis

  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dawarich
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: ${DAWARICH_DATABASE_PASSWORD}
    volumes:
      - "dawarich-postgres:/var/lib/postgresql/data"

  - name: redis
    image: redis:7-alpine
    volumes:
      - "dawarich-redis:/data"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: locations.example.com
      ssl: off
      upstream: app:3000

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"

env_file: .env

volumes:
  dawarich-storage: {}
  dawarich-postgres: {}
  dawarich-redis: {}

config_contract:
  services:
    app:
      fields:
        APPLICATION_HOST:
          mutability: editable
        APPLICATION_PROTOCOL:
          mutability: editable
        DATABASE_HOST:
          mutability: editable
        DATABASE_NAME:
          mutability: editable
        DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_PORT:
          mutability: editable
        DATABASE_USERNAME:
          mutability: editable
        DawarichBackgroundJob:
          mutability: editable
        ENCRYPTION_DTERMINARY_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENCRYPTION_PRIMARY_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        RAILS_ENV:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SELF_HOSTED:
          mutability: editable
      volumes:
        dawarich-storage:
          mutability: generated
    dawarich-background:
      fields:
        APPLICATION_HOST:
          mutability: editable
        APPLICATION_PROTOCOL:
          mutability: editable
        DATABASE_HOST:
          mutability: editable
        DATABASE_NAME:
          mutability: editable
        DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_PORT:
          mutability: editable
        DATABASE_USERNAME:
          mutability: editable
        ENCRYPTION_DTERMINARY_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENCRYPTION_PRIMARY_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        RAILS_ENV:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        dawarich-storage:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        dawarich-postgres:
          mutability: generated
    redis:
      volumes:
        dawarich-redis:
          mutability: generated

marketplace:
  publish: true
  display_name: "Dawarich"
  short_description: "Self-hosted location tracking platform (Google Timeline alternative). Store and visualize your GPS history with full ownership of your location data."
  long_description: |
    **Dawarich**: Self-hosted location tracking platform (Google Timeline alternative). Store and visualize your GPS history with full ownership of your location data.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `freikin/dawarich:latest` |
    | dawarich-background | internal | `freikin/dawarich:latest` |
    | postgres | internal | Database |
    | redis | internal | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `APPLICATION_HOST`, `APPLICATION_PROTOCOL`, `DATABASE_HOST`, `DATABASE_NAME`, `DATABASE_PORT`, `DATABASE_USERNAME` and 13 more ship prefilled and can be adjusted in the deploy form

    All 9 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/dawarich

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [dawarich]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/dawarich
  no_secrets_confirmation: true
