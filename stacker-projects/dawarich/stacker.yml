name: dawarich
version: "0.16.0"

project:
  identity: dawarich

install:
  inputs:
    commonDomain: locations.example.com

app:
  type: custom
  image: freika/dawarich:latest
  ports:
    - "3000:3000"
  environment:
    RAILS_ENV: production
    REDIS_URL: redis://redis:6379/0
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: dawarich
    DATABASE_USERNAME: dawarich
    DATABASE_PASSWORD: ${DAWARICH_DATABASE_PASSWORD}
    SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
    APPLICATION_HOST: ${DOMAIN}
    APPLICATION_PROTOCOL: https
    ENCRYPTION_PRIMARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
    ENCRYPTION_DTERMINARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
    DawarichBackgroundJob: enabled
    SELF_HOSTED: "true"
  volumes:
    - "dawarich-storage:/var/app/storage"

services:
  - name: dawarich-background
    image: freika/dawarich:latest
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379/0
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: dawarich
      DATABASE_USERNAME: dawarich
      DATABASE_PASSWORD: ${DAWARICH_DATABASE_PASSWORD}
      SECRET_KEY_BASE: ${DAWARICH_SECRET_KEY_BASE}
      APPLICATION_HOST: ${DOMAIN}
      APPLICATION_PROTOCOL: https
      ENCRYPTION_PRIMARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
      ENCRYPTION_DTERMINARY_KEY: ${DAWARICH_ENCRYPTION_KEY}
    volumes:
      - "dawarich-storage:/var/app/storage"
    depends_on:
      - postgres
      - redis

  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dawarich
      POSTGRES_USER: dawarich
      POSTGRES_PASSWORD: ${DAWARICH_DATABASE_PASSWORD}
    volumes:
      - "dawarich-postgres:/var/lib/postgresql/data"

  - name: redis
    image: redis:7-alpine
    volumes:
      - "dawarich-redis:/data"

config_contract:
  inputs:
    - name: domain
      type: string
      default: locations.try.direct
      description: "Domain name for the application"
    - name: dawarich-database-password
      type: secret
      default: ""
      description: "PostgreSQL password for Dawarich"
    - name: dawarich-secret-key-base
      type: secret
      default: ""
      description: "Rails secret key base"
    - name: dawarich-encryption-key
      type: secret
      default: ""
      description: "Dawarich encryption key"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: locations.example.com
      ssl: off
      upstream: app:3000

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"

env_file: .env

volumes:
  dawarich-storage: {}
  dawarich-postgres: {}
  dawarich-redis: {}
