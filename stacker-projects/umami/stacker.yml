name: umami
version: 1.0.0
organization: null
project:
  identity: umami
app:
  type: node
  path: .
  dockerfile: null
  image: ghcr.io/umami-software/umami:postgresql-latest
  build: null
  ports:
  - "3000:3000"
  volumes: []
  environment:
    DATABASE_URL: postgresql://umami:${DB_PASSWORD}@postgres:5432/umami
    PORT: '3000'
    APP_SECRET: ${APP_SECRET}
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: '1'
    HOSTNAME: 0.0.0.0
  command: null
  healthcheck: null
services:
- name: postgres
  image: postgres:16.4-alpine
  ports:
  - "127.0.0.1:5432:5432"
  environment:
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: umami
    POSTGRES_USER: umami
  volumes:
  - postgres_data:/var/lib/postgresql/data
  depends_on: []
  command: null
  healthcheck:
    test: CMD-SHELL pg_isready -U umami -d umami
    interval: 5s
    timeout: 5s
    retries: 5
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '3000'
  server:
    host: 178.105.17.198
    user: root
    ssh_key: ~/.config/stacker/ssh/server-453_ed25519
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        APP_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "Umami"
  short_description: "Deploy the official Umami analytics stack with PostgreSQL, fully configured and production-ready."
  long_description: |
    **Umami**: Deploy the official Umami analytics stack with PostgreSQL, fully configured and production-ready.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | Database |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/umami

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [umami]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/umami
  no_secrets_confirmation: true
