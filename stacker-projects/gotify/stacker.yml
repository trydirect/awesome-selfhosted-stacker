name: gotify
app:
  type: custom
  image: gotify/server:latest
  ports:
  - 8080:80
  volumes:
  - gotify_data:/app/data
volumes:
  gotify_data: {}
proxy:
  type: none
  auto_detect: false
monitoring:
  status_panel: true
env_file: .env
deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
