name: linkwarden
version: "2.7.0"

project:
  identity: linkwarden

install:
  inputs:
    commonDomain: links.example.com

app:
  type: custom
  image: ghcr.io/linkwarden/linkwarden:latest
  ports:
    - "3000:3000"
  environment:
    DATABASE_URL: postgresql://linkwarden:${DB_PASSWORD}@postgres:5432/linkwarden
    NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
    NEXTAUTH_URL: https://links.example.com
  volumes:
    - linkwarden_data:/data/data
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: linkwarden
      POSTGRES_USER: linkwarden
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - linkwarden_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U linkwarden
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXTAUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  linkwarden_data: {}
  linkwarden_pgdata: {}

marketplace:
  publish: true
  display_name: "Linkwarden"
  short_description: "Collaborative bookmark manager that archives web pages as screenshots and text. Save, organize and share links with your team."
  long_description: |
    **Linkwarden**: Collaborative bookmark manager that archives web pages as screenshots and text. Save, organize and share links with your team.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `ghcr.io/linkwarden/linkwarden:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/linkwarden

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [linkwarden]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/linkwarden
  no_secrets_confirmation: true
