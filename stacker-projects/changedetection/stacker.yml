name: changedetection

app:
  type: custom
  image: ghcr.io/dgtlmoon/changedetection.io:latest
  ports:
    - "5001:5000"
  volumes:
    - changedetection_data:/datastore

volumes:
  changedetection_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "5001"

monitoring:
  status_panel: true

env_file: .env
