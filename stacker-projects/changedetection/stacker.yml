name: changedetection

app:
  type: custom
  image: ghcr.io/dgtlmoon/changedetection.io:latest
  ports:
    - "5001:5000"
  volumes:
    - changedetection_data:/datastore

volumes:
  changedetection_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5001"

monitoring:
  status_panel: true

env_file: .env

config_contract:
  services:
    app:
      volumes:
        changedetection_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Changedetection"
  short_description: "Monitor web pages for changes and get notified. Track prices, restocks or content updates on any website with flexible CSS selectors."
  long_description: |
    **Changedetection**: Monitor web pages for changes and get notified. Track prices, restocks or content updates on any website with flexible CSS selectors.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5000 (public on 5001) | `ghcr.io/dgtlmoon/changedetection.io:latest` |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/changedetection

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [changedetection]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/changedetection
  no_secrets_confirmation: true
