name: onlyoffice
version: "8.1.0"

app:
  type: custom
  image: onlyoffice/documentserver:latest
  ports:
    - "80:80"
  environment:
    JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    JWT_HEADER: Authorization
    JWT_HEADER_SCHEMA: Bearer
    JWT_ENABLED: "false"
    ONLYOFFICE_EXAMPLE: "false"
    ONLYOFFICE_SAMPLE: "false"
    WOPI_ENABLED: "false"
  volumes:
    - "onlyoffice-data:/var/www/onlyoffice/Data"
    - "onlyoffice-logs:/var/log/onlyoffice"


install:
  inputs:
    domain: docs.try.direct
    onlyoffice-jwt-secret: ""

config_contract:
  services:
    app:
      fields:
        JWT_ENABLED:
          mutability: editable
        JWT_HEADER:
          mutability: editable
        JWT_HEADER_SCHEMA:
          mutability: editable
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ONLYOFFICE_EXAMPLE:
          mutability: editable
        ONLYOFFICE_SAMPLE:
          mutability: editable
        WOPI_ENABLED:
          mutability: editable
      volumes:
        onlyoffice-data:
          mutability: generated
        onlyoffice-logs:
          mutability: generated

marketplace:
  publish: true
  display_name: "Onlyoffice"
  short_description: "Full-featured office suite for documents, spreadsheets and presentations with real-time collaboration. A self-hosted Microsoft Office alternative."
  long_description: |
    **onlyoffice**: Full-featured office suite for documents, spreadsheets and presentations with real-time collaboration. A self-hosted Microsoft Office alternative.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public) | API server |

    ## What you configure

    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `JWT_ENABLED`, `JWT_HEADER`, `JWT_HEADER_SCHEMA`, `ONLYOFFICE_EXAMPLE`, `ONLYOFFICE_SAMPLE`, `WOPI_ENABLED` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/onlyoffice

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [onlyoffice]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/onlyoffice
  no_secrets_confirmation: true
