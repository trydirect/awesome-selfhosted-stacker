name: onlyoffice
version: "8.1.0"

app:
  type: custom
  image: onlyoffice/documentserver:8.1.1
  ports:
    - "80:80"
  environment:
    JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    JWT_HEADER: Authorization
    JWT_HEADER_SCHEMA: Bearer
    JWT_ENABLED: "false"
    ONLYOFFICE_EXAMPLE: "false"
    ONLYOFFICE_SAMPLE: "false"
    WOPI_ENABLED: "false"
  volumes:
    - "onlyoffice-data:/var/www/onlyoffice/Data"
    - "onlyoffice-logs:/var/log/onlyoffice"


install:
  inputs:
    domain: docs.try.direct
    onlyoffice-jwt-secret: ""

config_contract:
  services:
    app:
      fields:
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_ENABLED:
          mutability: editable
        JWT_HEADER:
          mutability: editable
        JWT_HEADER_SCHEMA:
          mutability: editable
        ONLYOFFICE_EXAMPLE:
          mutability: editable
        ONLYOFFICE_SAMPLE:
          mutability: editable
        WOPI_ENABLED:
          mutability: editable

marketplace:
  display_name: "OnlyOffice"
