name: onlyoffice
version: "8.1.0"

app:
  type: custom
  image: onlyoffice/documentserver:latest
  ports:
    - "80:80"
  environment:
    JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
    JWT_HEADER: Authorization
    JWT_HEADER_SCHEMA: Bearer
    JWT_ENABLED: "false"
    ONLYOFFICE_EXAMPLE: "false"
    ONLYOFFICE_SAMPLE: "false"
    WOPI_ENABLED: "false"
  volumes:
    - "onlyoffice-data:/var/www/onlyoffice/Data"
    - "onlyoffice-logs:/var/log/onlyoffice"


install:
  inputs:
    domain: docs.try.direct
    onlyoffice-jwt-secret: ""

config_contract:
  services:
    app:
      fields:
        JWT_ENABLED:
          mutability: editable
        JWT_HEADER:
          mutability: editable
        JWT_HEADER_SCHEMA:
          mutability: editable
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ONLYOFFICE_EXAMPLE:
          mutability: editable
        ONLYOFFICE_SAMPLE:
          mutability: editable
        WOPI_ENABLED:
          mutability: editable
      volumes:
        onlyoffice-data:
          mutability: generated
        onlyoffice-logs:
          mutability: generated
