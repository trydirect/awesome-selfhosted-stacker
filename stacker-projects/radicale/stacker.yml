name: radicale

project:
  identity: radicale

install:
  inputs:
    commonDomain: calendar.example.com

app:
  type: custom
  image: tomsquest/docker-radicale:3.4.0
  ports:
    - "5232:5232"
  environment:
    RADICALE_AUTH_TYPE: htpasswd
  volumes:
    - radicale_data:/data
    - radicale_config:/config

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5232"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        RADICALE_AUTH_TYPE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
env_file: .env

volumes:
  radicale_data: {}
  radicale_config: {}

marketplace:
  publish: true
  display_name: "Radicale"
  short_description: "Small CalDAV and CardDAV server that just works. Sync contacts and calendars with a lightweight, secure Radicale instance."
  long_description: |
    **Radicale**: Small CalDAV and CardDAV server that just works. Sync contacts and calendars with a lightweight, secure Radicale instance.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5232 (public) | `tomsquest/docker-radicale:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/radicale

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [radicale]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/radicale
  no_secrets_confirmation: true
