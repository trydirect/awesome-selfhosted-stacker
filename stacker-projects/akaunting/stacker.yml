name: akaunting

app:
  type: custom
  image: akaunting/akaunting:latest
  ports:
    - "8080:80/tcp"
  environment:
    DB_PASSWORD: ${DB_PASSWORD}
  volumes:
    - akaunting_data:/data
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost:80"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s

services:
  - name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: akaunting
      POSTGRES_USER: akaunting
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - akaunting_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U akaunting -d akaunting"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  akaunting_data: {}
  akaunting_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        akaunting_data:
          mutability: generated
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        akaunting_db:
          mutability: generated
