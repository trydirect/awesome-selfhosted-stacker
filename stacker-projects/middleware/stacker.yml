name: "middleware"
version: "1.0.0"
project:
  identity: "middleware"
install:
  inputs:
    commonDomain: "middleware.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "middlewareeng/middleware:latest"
  ports:
    - "3333:3333"
    - "127.0.0.1:9696:9696"
    - "127.0.0.1:9697:9697"
  volumes:
    - "middleware_postgres_data:/var/lib/postgresql/data"
    - "middleware_keys:/app/keys"
  environment:
    PORT: "3333"
    ANALYTICS_SERVER_PORT: "9696"
    SYNC_SERVER_PORT: "9697"
    DEFAULT_SYNC_DAYS: "${DEFAULT_SYNC_DAYS}"
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: middleware.example.com
      ssl: off
      upstream: app:3333
deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3333"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  middleware_postgres_data: {}
  middleware_keys: {}

config_contract:
  services:
    app:
      fields:
        ANALYTICS_SERVER_PORT:
          mutability: editable
        DEFAULT_SYNC_DAYS:
          mutability: editable
        PORT:
          mutability: editable
        SYNC_SERVER_PORT:
          mutability: editable
      volumes:
        middleware_postgres_data:
          mutability: generated
        middleware_keys:
          mutability: generated

marketplace:
  publish: true
  display_name: "Middleware"
  short_description: "Observability platform combining logs, metrics and traces with incident management. Monitor your stack end to end."
  long_description: |
    **Middleware**: Observability platform combining logs, metrics and traces with incident management. Monitor your stack end to end.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3333 (public), 9696 (local only), 9697 (local only) | `middlewareeng/middleware:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ANALYTICS_SERVER_PORT`, `DEFAULT_SYNC_DAYS`, `PORT`, `SYNC_SERVER_PORT` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/middleware

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [middleware]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/middleware
  no_secrets_confirmation: true
