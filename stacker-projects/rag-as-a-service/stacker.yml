name: rag-as-a-service
version: "1.0.0"

project:
  identity: rag-as-a-service

install:
  inputs:
    commonDomain: rag-as-a-service.example.com

app:
  type: custom
  image: optimum/rag-as-a-service:1.0.0
  ports:
    - "8501:8501"
  healthcheck:
    test: "CMD python -c \"import urllib.request as u; u.urlopen('http://localhost:8501/')\""
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8501"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

marketplace:
  publish: true
  display_name: "Rag As A Service"
  short_description: "Streamlit RAG service; API keys entered in UI"
  long_description: |
    **RAG As A Service**: Streamlit RAG service; API keys entered in UI

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8501 (public) | `optimum/rag-as-a-service:1.0.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/rag-as-a-service

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [rag as a service]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/rag-as-a-service
  no_secrets_confirmation: true
