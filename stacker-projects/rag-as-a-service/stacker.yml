name: rag-as-a-service
version: "1.0.0"

project:
  identity: rag-as-a-service

install:
  inputs:
    commonDomain: rag-as-a-service.example.com

app:
  type: custom
  dockerfile: Dockerfile
  ports:
    - "8501:8501"
  healthcheck:
    test: "CMD python -c \"import urllib.request as u; u.urlopen('http://localhost:8501/')\""
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 30s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8501"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true
