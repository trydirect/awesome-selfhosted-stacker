name: komga
version: "1.12.0"

project:
  identity: komga

install:
  inputs:
    commonDomain: comics.example.com

app:
  type: custom
  image: gotson/komga:1.29.1
  ports:
    - "25600:25600"
  environment:
    KOMGA_DATABASE_URL: jdbc:h2:file:/config/database
  volumes:
    - komga_config:/config
    - komga_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "25600"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        KOMGA_DATABASE_URL:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  komga_config: {}
  komga_data: {}

marketplace:
  publish: true
  display_name: "Komga App"
  short_description: "Comic and manga server with OPDS support, web reader, and metadata management"
  long_description: |
    **komga**: Comic and manga server with OPDS support, web reader, and metadata management

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 25600 (public) | `gotson/komga:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `KOMGA_DATABASE_URL` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/komga

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [komga app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/komga
  no_secrets_confirmation: true
