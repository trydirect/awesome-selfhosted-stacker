name: roundcube
version: "1.6.9"

app:
  type: custom
  image: roundcube/roundcubemail:1.6.20-fpm-alpine
  ports:
    - "80:80"
  environment:
    ROUNDCUBEMAIL_DEFAULT_HOST: ${ROUNDCUBE_IMAP_HOST}
    ROUNDCUBEMAIL_DEFAULT_PORT: "993"
    ROUNDCUBEMAIL_SMTP_SERVER: ${ROUNDCUBE_SMTP_HOST}
    ROUNDCUBEMAIL_SMTP_PORT: "587"
    ROUNDCUBEMAIL_SKIN: elastic
    ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    ROUNDCUBEMAIL_DB_TYPE: sqlite
    ROUNDCUBEMAIL_DB_DSN: "sqlite:/var/roundcube/db/roundcube.sqlite?mode=0646"
    ROUNDCUBEMAIL_SECRET_KEY: ${ROUNDCUBE_SECRET_KEY}
  volumes:
    - "roundcube-db:/var/roundcube/db"
    - "roundcube-data:/var/roundcube/data"


install:
  inputs:
    domain: mail.try.direct
    roundcube-imap-host: ""
    roundcube-smtp-host: ""
    roundcube-secret-key: ""

config_contract:
  services:
    app:
      fields:
        ROUNDCUBEMAIL_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ROUNDCUBEMAIL_DB_DSN:
          mutability: editable
        ROUNDCUBEMAIL_DB_TYPE:
          mutability: editable
        ROUNDCUBEMAIL_DEFAULT_HOST:
          mutability: editable
        ROUNDCUBEMAIL_DEFAULT_PORT:
          mutability: editable
        ROUNDCUBEMAIL_SKIN:
          mutability: editable
        ROUNDCUBEMAIL_SMTP_PORT:
          mutability: editable
        ROUNDCUBEMAIL_SMTP_SERVER:
          mutability: editable
        ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE:
          mutability: editable
      volumes:
        roundcube-db:
          mutability: generated
        roundcube-data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Roundcube"
  short_description: "Browser-based IMAP webmail with a desktop-like interface. A clean, extensible Roundcube installation for your mail domain."
  long_description: |
    **roundcube**: Browser-based IMAP webmail with a desktop-like interface. A clean, extensible Roundcube installation for your mail domain.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public) | `roundcube/roundcubemail:latest` |

    ## What you configure

    - **Domain** (`domain`): the hostname the stack is served on
    - **Domain** (`roundcube-imap-host`): the hostname the stack is served on
    - **Domain** (`roundcube-smtp-host`): the hostname the stack is served on
    - **Defaults provided**: `ROUNDCUBEMAIL_DB_DSN`, `ROUNDCUBEMAIL_DB_TYPE`, `ROUNDCUBEMAIL_DEFAULT_HOST`, `ROUNDCUBEMAIL_DEFAULT_PORT`, `ROUNDCUBEMAIL_SKIN`, `ROUNDCUBEMAIL_SMTP_PORT` and 2 more ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/roundcube

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [roundcube]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/roundcube
  no_secrets_confirmation: true
