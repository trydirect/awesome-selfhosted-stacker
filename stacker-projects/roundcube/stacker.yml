name: roundcube
version: "1.6.9"

app:
  type: custom
  image: roundcube/roundcubemail:latest
  ports:
    - "80:80"
  environment:
    ROUNDCUBEMAIL_DEFAULT_HOST: ${ROUNDCUBE_IMAP_HOST}
    ROUNDCUBEMAIL_DEFAULT_PORT: "993"
    ROUNDCUBEMAIL_SMTP_SERVER: ${ROUNDCUBE_SMTP_HOST}
    ROUNDCUBEMAIL_SMTP_PORT: "587"
    ROUNDCUBEMAIL_SKIN: elastic
    ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    ROUNDCUBEMAIL_DB_TYPE: sqlite
    ROUNDCUBEMAIL_DB_DSN: "sqlite:/var/roundcube/db/roundcube.sqlite?mode=0646"
    ROUNDCUBEMAIL_SECRET_KEY: ${ROUNDCUBE_SECRET_KEY}
  volumes:
    - "roundcube-db:/var/roundcube/db"
    - "roundcube-data:/var/roundcube/data"


install:
  inputs:
    domain: mail.try.direct
    roundcube-imap-host: ""
    roundcube-smtp-host: ""
    roundcube-secret-key: ""

config_contract:
  services:
    app:
      fields:
        ROUNDCUBEMAIL_DB_DSN:
          mutability: editable
        ROUNDCUBEMAIL_DB_TYPE:
          mutability: editable
        ROUNDCUBEMAIL_DEFAULT_HOST:
          mutability: editable
        ROUNDCUBEMAIL_DEFAULT_PORT:
          mutability: editable
        ROUNDCUBEMAIL_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ROUNDCUBEMAIL_SKIN:
          mutability: editable
        ROUNDCUBEMAIL_SMTP_PORT:
          mutability: editable
        ROUNDCUBEMAIL_SMTP_SERVER:
          mutability: editable
        ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE:
          mutability: editable
      volumes:
        roundcube-db:
          mutability: generated
        roundcube-data:
          mutability: generated
