name: opensearch

project:
  identity: opensearch

install:
  inputs:
    commonDomain: search.example.com

app:
  type: custom
  image: opensearchproject/opensearch:2
  ports:
    - "9200:9200"
    - "9600:9600"
  environment:
    discovery.type: single-node
    plugins.security.disabled: "true"
    DISABLE_INSTALL_DEMO_CONFIG: "true"
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: "${OPENSEARCH_ADMIN_PASSWORD}"
    bootstrap.memory_lock: "false"
    OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
  volumes:
    - opensearch_data:/usr/share/opensearch/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9200"
      - "9600"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DISABLE_INSTALL_DEMO_CONFIG:
          mutability: editable
        OPENSEARCH_INITIAL_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENSEARCH_JAVA_OPTS:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  opensearch_data: {}

marketplace:
  publish: true
  display_name: "Opensearch"
  short_description: "Community-driven, open-source search and analytics suite (Elasticsearch fork). Full-text search, dashboards and observability plugins."
  long_description: |
    **OpenSearch**: Community-driven, open-source search and analytics suite (Elasticsearch fork). Full-text search, dashboards and observability plugins.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9200 (public), 9600 (public) | Search |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DISABLE_INSTALL_DEMO_CONFIG`, `OPENSEARCH_JAVA_OPTS` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/opensearch

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [opensearch]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/opensearch
  no_secrets_confirmation: true
