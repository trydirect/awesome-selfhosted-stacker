name: sonarr

project:
  identity: sonarr

install:
  inputs:
    commonDomain: tv.example.com

app:
  type: custom
  image: linuxserver/sonarr:latest
  ports:
    - "8989:8989"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  volumes:
    - sonarr_config:/config
    - sonarr_tv:/tv
    - sonarr_downloads:/downloads

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8989"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  sonarr_config: {}
  sonarr_tv: {}
  sonarr_downloads: {}
