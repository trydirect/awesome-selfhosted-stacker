name: keycloak

project:
  identity: keycloak

install:
  inputs:
    commonDomain: auth.example.com

app:
  type: custom
  image: quay.io/keycloak/keycloak:latest
  ports:
    - "8080:8080"
  environment:
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
    KC_DB_USERNAME: keycloak
    KC_DB_PASSWORD: ${DB_PASSWORD}
  command: start-dev

services:
  - name: keycloak-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d keycloak -U keycloak
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  keycloak_db: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: auth.example.com
      ssl: off
      upstream: app:8080

monitoring:
  status_panel: true

hooks:
  pre_build: ./scripts/generate-secrets.sh

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"
