name: keycloak

project:
  identity: keycloak

install:
  inputs:
    commonDomain: auth.example.com

app:
  type: custom
  image: quay.io/keycloak/keycloak:26.0.0
  ports:
    - "8080:8080"
  environment:
    KEYCLOAK_ADMIN: admin
    KEYCLOAK_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    KC_DB: postgres
    KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
    KC_DB_USERNAME: keycloak
    KC_DB_PASSWORD: ${DB_PASSWORD}
  command: start-dev

services:
  - name: keycloak-db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d keycloak -U keycloak
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  keycloak_db: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: auth.example.com
      ssl: off
      upstream: app:8080

monitoring:
  status_panel: true

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        KC_DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        KEYCLOAK_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        KC_DB:
          mutability: editable
        KC_DB_URL:
          mutability: editable
        KC_DB_USERNAME:
          mutability: editable
        KEYCLOAK_ADMIN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        command:
          mutability: editable
    keycloak-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

marketplace:
  publish: true
  display_name: "Keycloak"
  short_description: "Open-source identity and access management: SSO, OAuth2, OIDC and LDAP. Add centralized login to all your applications."
  long_description: |
    **Keycloak**: Open-source identity and access management: SSO, OAuth2, OIDC and LDAP. Add centralized login to all your applications.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `quay.io/keycloak/keycloak:latest` |
    | keycloak-db | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `KC_DB`, `KC_DB_URL`, `KC_DB_USERNAME`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/keycloak

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [keycloak]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/keycloak
  no_secrets_confirmation: true
