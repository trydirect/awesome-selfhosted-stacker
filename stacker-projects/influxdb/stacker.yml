name: influxdb

project:
  identity: influxdb

install:
  inputs:
    commonDomain: influxdb.example.com

app:
  type: custom
  image: influxdb:2.7
  ports:
    - "8086:8086"
  environment:
    DOCKER_INFLUXDB_INIT_MODE: setup
    DOCKER_INFLUXDB_INIT_USERNAME: admin
    DOCKER_INFLUXDB_INIT_PASSWORD: "${DB_PASSWORD}"
    DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
    DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
    DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${API_KEY}"
  volumes:
    - influxdb_data:/var/lib/influxdb2
    - influxdb_config:/etc/influxdb2

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: influxdb.example.com
      ssl: off
      upstream: app:8086

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8086"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DOCKER_INFLUXDB_INIT_BUCKET:
          mutability: editable
        DOCKER_INFLUXDB_INIT_MODE:
          mutability: editable
        DOCKER_INFLUXDB_INIT_ORG:
          mutability: editable
        DOCKER_INFLUXDB_INIT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DOCKER_INFLUXDB_INIT_USERNAME:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  influxdb_data: {}
  influxdb_config: {}

marketplace:
  publish: true
  display_name: "Influxdb"
  short_description: "Purpose-built time series database for metrics and events. Query high-cardinality data with InfluxDB's fast writes and SQL-like language."
  long_description: |
    **InfluxDB**: Purpose-built time series database for metrics and events. Query high-cardinality data with InfluxDB's fast writes and SQL-like language.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8086 (public) | `influxdb:2.7` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DOCKER_INFLUXDB_INIT_BUCKET`, `DOCKER_INFLUXDB_INIT_MODE`, `DOCKER_INFLUXDB_INIT_ORG`, `DOCKER_INFLUXDB_INIT_USERNAME` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/influxdb

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [influxdb]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/influxdb
  no_secrets_confirmation: true
