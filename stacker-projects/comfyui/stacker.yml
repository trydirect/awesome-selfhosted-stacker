name: comfyui

project:
  identity: comfyui
version: "1.0.0"

app:
  type: custom
  path: .
  image: ashleykza/comfyui:latest
  ports:
    - "8188:3001"
  environment:
    EXTRA_ARGS: "--cpu"
    PRELOAD_MODELS: "[]"

services: []

proxy:
  type: none
  auto_detect: false

deploy:
  target: local
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx42
    public_ports:
      - "8188"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CLI_ARGS:
          mutability: editable
        EXTRA_ARGS:
          mutability: editable
        PRELOAD_MODELS:
          mutability: editable
env_file: .env
