name: comfyui

project:
  identity: comfyui
version: "1.0.0"

app:
  type: custom
  path: .
  image: ashleykza/comfyui:cu128-py311-v0.26.0
  ports:
    - "8188:3001"
  environment:
    EXTRA_ARGS: "--cpu"
    PRELOAD_MODELS: "[]"

services: []

proxy:
  type: none
  auto_detect: false

deploy:
  target: local
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx42
    public_ports:
      - "8188"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CLI_ARGS:
          mutability: editable
        EXTRA_ARGS:
          mutability: editable
        PRELOAD_MODELS:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Comfyui"
  short_description: "Self-hosted ComfyUI node for AI image generation workflows. Run and compose generative models locally with a visual node graph."
  long_description: |
    **Comfyui**: Self-hosted ComfyUI node for AI image generation workflows. Run and compose generative models locally with a visual node graph.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3001 (public on 8188) | Web UI |

    ## What you configure

    - **Defaults provided**: `CLI_ARGS`, `EXTRA_ARGS`, `PRELOAD_MODELS` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/comfyui

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [comfyui]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/comfyui
  no_secrets_confirmation: true
