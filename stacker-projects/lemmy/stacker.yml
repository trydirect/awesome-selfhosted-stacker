name: lemmy
version: 0.19.0
project:
  identity: lemmy
install:
  inputs:
    commonDomain: lemmy.example.com
app:
  type: custom
  image: dessalines/lemmy:0.19.11
  ports:
  - "8536:8536"
  environment:
    LEMMY_HOSTNAME: lemmy.example.com
    LEMMY_DATABASE_URL: postgresql://lemmy:${DB_PASSWORD}@lemmy_db:5432/lemmy
    LEMMY_JWT_SECRET: ${JWT_SECRET}
    LEMMY_DEFAULT_ADMIN_USERNAME: admin
    LEMMY_DEFAULT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    LEMMY_DEFAULT_ADMIN_EMAIL: admin@example.com
    LEMMY_RATE_LIMIT_POST: '6'
    LEMMY_RATE_LIMIT_POST_INTERVAL: '600'
    LEMMY_FEDERATION_ENABLED: 'true'
    LEMMY_FEDERATION_STRICT_ALLOWLIST: 'false'
  volumes:
  - ./config.hjson:/config/config.hjson:ro
  depends_on:
  - lemmy_db
  - lemmy_pictrs
services:
- name: lemmy_db
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: lemmy
    POSTGRES_USER: lemmy
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_INITDB_ARGS: -c shared_buffers=256MB
  ports:
  - "127.0.0.1:5432:5432"
  volumes:
  - lemmy_db:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -U lemmy -d lemmy
    interval: 10s
    timeout: 5s
    retries: 10
- name: lemmy_pictrs
  image: asonix/pictrs:latest
  environment:
    PICTRS_OPENTELEMETRY_URL: http://otel:4137
    PICTRS_LOG_TARGETS: warn
    PICTRS_MEDIA_LOCATION: /mnt/pictrs
  ports:
  - "127.0.0.1:6969:6969"
  volumes:
  - lemmy_pictrs:/mnt/pictrs
volumes:
  lemmy_db: {}
  lemmy_pictrs: {}
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx31
    public_ports:
    - '8536'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
config_contract:
  services:
    app:
      fields:
        LEMMY_JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        LEMMY_DEFAULT_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    lemmy_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
monitoring:
  status_panel: true
env_file: .env

marketplace:
  publish: true
  display_name: "Lemmy"
  short_description: "Federated link aggregator and discussion platform (Reddit alternative) on the Fediverse. Run communities that interlink across instances."
  long_description: |
    **Lemmy**: Federated link aggregator and discussion platform (Reddit alternative) on the Fediverse. Run communities that interlink across instances.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8536 (public) | `dessalines/lemmy:0.19.11` |
    | lemmy_db | 5432 (local only) | Database |
    | lemmy_pictrs | 6969 (local only) | `asonix/pictrs:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 6 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/lemmy

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [lemmy]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/lemmy
  no_secrets_confirmation: true
