name: manticore

project:
  identity: manticore

install:
  inputs:
    commonDomain: search.example.com

app:
  type: custom
  image: manticoresearch/manticore:6.3.6
  ports:
    - "9306:9306"
    - "9308:9308"
    - "9312:9312"
  volumes:
    - manticore_data:/var/lib/manticore
    - manticore_log:/var/log/manticore

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9306"
      - "9308"
      - "9312"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  manticore_data: {}
  manticore_log: {}

config_contract:
  services:
    app:
      volumes:
        manticore_data:
          mutability: generated
        manticore_log:
          mutability: generated

marketplace:
  publish: true
  display_name: "Manticore"
  short_description: "Fast open-source search engine (MySQL-compatible) for full-text and vector search. A drop-in Elasticsearch/SQLite FTS alternative."
  long_description: |
    **Manticore**: Fast open-source search engine (MySQL-compatible) for full-text and vector search. A drop-in Elasticsearch/SQLite FTS alternative.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9306 (public), 9308 (public), 9312 (public) | `manticoresearch/manticore:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/manticore

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [manticore]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/manticore
  no_secrets_confirmation: true
