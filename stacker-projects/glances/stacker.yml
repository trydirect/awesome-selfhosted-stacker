name: glances
version: "4.1.0"

project:
  identity: glances

install:
  inputs:
    commonDomain: monitor.example.com

app:
  type: custom
  image: nicolargo/glances:latest-full
  ports:
    - "61208:61208"
  environment:
    GLANCES_OPT: "-w"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  privileged: true

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "61208"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        GLANCES_OPT:
          mutability: editable
        privileged:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env
