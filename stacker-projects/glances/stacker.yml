name: glances
version: "4.1.0"

project:
  identity: glances

install:
  inputs:
    commonDomain: monitor.example.com

app:
  type: custom
  image: nicolargo/glances:latest-full
  ports:
    - "61208:61208"
  environment:
    GLANCES_OPT: "-w"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  privileged: true

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "61208"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        GLANCES_OPT:
          mutability: editable
        privileged:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Glances"
  short_description: "Cross-platform system monitoring tool with a web mode. Watch CPU, memory, disks and processes in real time via Glances."
  long_description: |
    **Glances**: Cross-platform system monitoring tool with a web mode. Watch CPU, memory, disks and processes in real time via Glances.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 61208 (public) | `nicolargo/glances:latest-full` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `GLANCES_OPT` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/glances

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [glances]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/glances
  no_secrets_confirmation: true
