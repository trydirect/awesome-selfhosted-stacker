name: discourse
version: 3.2.0
project:
  identity: discourse
install:
  inputs:
    commonDomain: forum.example.com
app:
  type: custom
  image: discourse/discourse:latest
  ports:
  - "80:80"
  - "443:443"
  environment:
    DISCOURSE_HOSTNAME: forum.example.com
    DISCOURSE_DEVELOPER_EMAILS: admin@example.com
    DISCOURSE_SMTP_ADDRESS: smtp.example.com
    DISCOURSE_SMTP_PORT: '587'
    DISCOURSE_SMTP_USER_NAME: ${SMTP_USER}
    DISCOURSE_SMTP_PASSWORD: ${SMTP_PASSWORD}
    DISCOURSE_SMTP_ENABLE_START_TLS: 'true'
    DISCOURSE_DB_HOST: discourse_db
    DISCOURSE_DB_PORT: '5432'
    DISCOURSE_DB_NAME: discourse
    DISCOURSE_DB_USERNAME: discourse
    DISCOURSE_DB_PASSWORD: ${DB_PASSWORD}
    DISCOURSE_REDIS_HOST: redis
    REDIS_HOST: redis
services:
- name: discourse_db
  image: pgvector/pgvector:0.8.0-pg16
  environment:
    POSTGRES_DB: discourse
    POSTGRES_USER: discourse
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  ports:
  - "127.0.0.1:5432:5432"
  volumes:
  - discourse_db:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -U discourse -d discourse
    interval: 10s
    timeout: 5s
    retries: 10
- name: redis
  image: redis:7.4-alpine
  ports:
  - "127.0.0.1:6379:6379"
  volumes:
  - discourse_redis:/data
  healthcheck:
    test: CMD redis-cli ping
    interval: 10s
    timeout: 5s
    retries: 10
volumes:
  discourse_db: {}
  discourse_redis: {}
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '80'
    - '443'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
config_contract:
  services:
    app:
      fields:
        DISCOURSE_DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DISCOURSE_SMTP_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SMTP_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    discourse_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
monitoring:
  status_panel: true
env_file: .env

marketplace:
  publish: true
  display_name: "Discourse"
  short_description: "The de-facto standard for modern community forum software. Run your own Discourse forum with rich markdown, SSO and gamification."
  long_description: |
    **Discourse**: The de-facto standard for modern community forum software. Run your own Discourse forum with rich markdown, SSO and gamification.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public), 443 (public) | `discourse/discourse:latest` |
    | discourse_db | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/discourse

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [discourse]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/discourse
  no_secrets_confirmation: true
