name: gitness
version: "1.0.0"

project:
  identity: gitness

install:
  inputs:
    commonDomain: git.example.com

app:
  type: custom
  image: harness/gitness:3.0.0-beta.11
  ports:
    - "3000:3000"
  environment:
    GITNESS_PRINCIPAL_ADMIN_EMAIL: admin@example.com
    GITNESS_PRINCIPAL_ADMIN_USERNAME: admin
    GITNESS_PRINCIPAL_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    GITNESS_URL_BASE: https://git.example.com
  volumes:
    - gitness_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  services:
    app:
      fields:
        GITNESS_PRINCIPAL_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  gitness_data: {}

marketplace:
  publish: true
  display_name: "Gitness"
  short_description: "Open-source Git hosting with built-in CI/CD pipelines (Harness Gitness). Repos, pull requests and pipelines in one binary."
  long_description: |
    **Gitness**: Open-source Git hosting with built-in CI/CD pipelines (Harness Gitness). Repos, pull requests and pipelines in one binary.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `harness/gitness:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/gitness

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [gitness]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/gitness
  no_secrets_confirmation: true
