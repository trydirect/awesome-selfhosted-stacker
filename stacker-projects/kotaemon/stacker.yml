name: kotaemon
version: "0.12.0"

project:
  identity: kotaemon

install:
  inputs:
    commonDomain: kotaemon.example.com

app:
  type: custom
  image: ghcr.io/cinnamon/kotaemon:main-lite
  ports:
    - "7860:7860/tcp"
  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    KH_FEATURE_USER_MANAGEMENT_ADMIN: ${ADMIN_USERNAME}
    KH_FEATURE_USER_MANAGEMENT_PASSWORD: ${ADMIN_PASSWORD}
  volumes:
    - kotaemon_data:/app/ktem_app_data
  healthcheck:
    test: "CMD curl -fs http://localhost:7860/"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

volumes:
  kotaemon_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx42
    public_ports:
      - "7860"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        OPENAI_API_KEY:
          mutability: provided
          display: password
        KH_FEATURE_USER_MANAGEMENT_PASSWORD:
          mutability: provided
          display: password
        ADMIN_USERNAME:
          mutability: generated
          type: alphanumeric
          length: 16
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        kotaemon_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Kotaemon"
  short_description: "RAG-based document QA, chat with your PDFs and documents"
  long_description: |
    **Kotaemon**: RAG-based document QA, chat with your PDFs and documents

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 7860/tcp (public on 7860) | `ghcr.io/cinnamon/kotaemon:main-lite` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/kotaemon

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [kotaemon]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/kotaemon
  no_secrets_confirmation: true
