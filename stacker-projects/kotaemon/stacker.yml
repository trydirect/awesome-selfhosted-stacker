name: kotaemon
version: "0.12.0"

project:
  identity: kotaemon

install:
  inputs:
    commonDomain: kotaemon.example.com

app:
  type: custom
  image: ghcr.io/cinnamon/kotaemon:main-lite
  ports:
    - "7860:7860/tcp"
  environment:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    KH_FEATURE_USER_MANAGEMENT_ADMIN: ${ADMIN_USERNAME}
    KH_FEATURE_USER_MANAGEMENT_PASSWORD: ${ADMIN_PASSWORD}
  volumes:
    - kotaemon_data:/app/ktem_app_data
  healthcheck:
    test: "CMD curl -fs http://localhost:7860/"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 120s

volumes:
  kotaemon_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx42
    public_ports:
      - "7860"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        OPENAI_API_KEY:
          mutability: provided
          display: password
        KH_FEATURE_USER_MANAGEMENT_PASSWORD:
          mutability: provided
          display: password
        ADMIN_USERNAME:
          mutability: generated
          type: alphanumeric
          length: 16
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        kotaemon_data:
          mutability: generated
