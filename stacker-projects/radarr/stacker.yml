name: radarr

project:
  identity: radarr

install:
  inputs:
    commonDomain: movies.example.com

app:
  type: custom
  image: linuxserver/radarr:5.15.1
  ports:
    - "7878:7878"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  volumes:
    - radarr_config:/config
    - radarr_movies:/movies
    - radarr_downloads:/downloads

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "7878"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  radarr_config: {}
  radarr_movies: {}
  radarr_downloads: {}

marketplace:
  publish: true
  display_name: "Radarr"
  short_description: "Movie collection manager for Usenet and BitTorrent users. Grabs, upgrades and organizes films automatically."
  long_description: |
    **Radarr**: Movie collection manager for Usenet and BitTorrent users. Grabs, upgrades and organizes films automatically.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 7878 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/radarr

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [radarr]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/radarr
  no_secrets_confirmation: true
