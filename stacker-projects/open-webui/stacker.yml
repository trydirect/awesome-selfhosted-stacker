name: open-webui
version: "1.0.0"

project:
  identity: open-webui

install:
  inputs:
    commonDomain: ""

config_contract:
  services:
    app:
      fields:
        WEBUI_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

app:
  type: custom
  image: ghcr.io/open-webui/open-webui:v0.3.32
  ports:
    - "3000:8080"
  environment:
    OLLAMA_BASE_URL: "http://ollama:11434"
    WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
    SCARF_NO_ANALYTICS: "true"
    DO_NOT_TRACK: "true"
    ANONYMIZED_TELEMETRY: "false"

services:
  - name: ollama
    image: ollama/ollama:0.3.12
    ports:
      - "11434:11434"
    environment: {}
    volumes:
      - ollama:/root/.ollama

proxy:
  type: none
  auto_detect: false

deploy:
  target: local

monitoring:
  status_panel: true

env_file: .env
env: {}

volumes:
  ollama: {}

marketplace:
  publish: true
  display_name: "Open Webui"
  short_description: "Self-hosted AI chat interface with Ollama support and multi-model"
  long_description: |
    **Open WebUI**: Self-hosted AI chat interface with Ollama support and multi-model

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public on 3000) | Web UI |
    | ollama | 11434 (public) | LLM runtime |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/open-webui

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [open webui]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/open-webui
  no_secrets_confirmation: true
