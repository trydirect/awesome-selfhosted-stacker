name: stackdog
version: null
organization: null
project:
  identity: stackdog
app:
  type: static
  path: ''
  dockerfile: null
  image: null
  build: null
  ports: []
  volumes: []
  environment: {}
  command: null
  healthcheck: null
services:
- name: stackdog
  image: trydirect/stackdog
  ports:
  - "5000:5000"
  environment:
    STACKDOG_SNIFF_INTERVAL: '600'
    STACKDOG_AI_PROVIDER: openai
    STACKDOG_LOG_SOURCES: /var/log/syslog,/var/log/auth.log
    APP_PORT: '5000'
    STACKDOG_SLACK_WEBHOOK_URL: yourslackchannelwebhook
    STACKDOG_AI_MODEL: gpt-4o-mini
    STACKDOG_AI_API_KEY: '***REDACTED***'
    DATABASE_URL: /data/stackdog.db
    STACKDOG_AI_API_URL: https://api.openai.com/v1
    APP_HOST: 0.0.0.0
  volumes:
  - stackdog-data:/data
  - /var/run/docker.sock:/var/run/docker.sock
  depends_on: []
  command: null
  healthcheck: null
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: nbg1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: ~/.ssh/id_rsa
    key: null
    server: null
    public_ports:
    - '5000'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs: {}
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: false
  healthcheck: null
  metrics: null
hooks:
  pre_build: null
  post_deploy: null
  on_failure: null
env_file: null
env: {}
config_contract:
  services:
    stackdog:
      fields:
        STACKDOG_AI_API_KEY:
          mutability: provided
          display: password

marketplace:
  publish: true
  display_name: "Stackdog"
  short_description: "Stackdog is an open-source security monitoring tool that watches your self-hosted stack for threats, anomalies, and unauthorized activity in real time."
  long_description: |
    **Stackdog**: Stackdog is an open-source security monitoring tool that watches your self-hosted stack for threats, anomalies, and unauthorized activity in real time.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    services together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/stackdog

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [stackdog]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/stackdog
  no_secrets_confirmation: true
