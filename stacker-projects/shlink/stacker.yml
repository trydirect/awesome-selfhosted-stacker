name: shlink

project:
  identity: shlink

install:
  inputs:
    commonDomain: links.example.com

app:
  type: custom
  image: shlinkio/shlink:5
  ports:
    - "8080:8080"
  environment:
    DB_DRIVER: postgres
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: shlink
    DB_USER: shlink
    DB_PASSWORD: "${DB_PASSWORD}"
    DEFAULT_DOMAIN: localhost:8080
    IS_HTTPS_ENABLED: "false"
    GEOLITE_LICENSE_KEY: "${GEOLITE_LICENSE_KEY}"

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: shlink
      POSTGRES_USER: shlink
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U shlink"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: links.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_DRIVER:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        DEFAULT_DOMAIN:
          mutability: editable
        GEOLITE_LICENSE_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        IS_HTTPS_ENABLED:
          mutability: editable
          display: boolean
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Shlink"
  short_description: "Self-hosted URL shortener with REST API, QR codes and visit stats. Own every short link you share."
  long_description: |
    **Shlink**: Self-hosted URL shortener with REST API, QR codes and visit stats. Own every short link you share.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `shlinkio/shlink:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DB_DRIVER`, `DB_HOST`, `DB_NAME`, `DB_PORT`, `DB_USER`, `DEFAULT_DOMAIN` and 3 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/shlink

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [shlink]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/shlink
  no_secrets_confirmation: true
