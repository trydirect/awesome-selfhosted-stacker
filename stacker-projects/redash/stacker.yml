name: redash
version: 13.0.0
project:
  identity: redash
install:
  inputs:
    commonDomain: redash.example.com
app:
  type: custom
  image: redash/redash:26.9.0
  ports:
  - "5003:5000"
  environment:
    REDASH_DATABASE_URL: postgresql://redash:${DB_PASSWORD}@redash_db:5432/redash
    REDASH_REDIS_URL: redis://redis:6379
    REDASH_SECRET_KEY: ${SECRET_KEY}
    REDASH_LOG_LEVEL: INFO
    REDASH_MULTI_ORG: 'false'
    REDASH_ENFORCE_HTTPS: 'false'
    REDASH_GOOGLE_CLIENT_ID: ''
    REDASH_GOOGLE_CLIENT_SECRET: ''
    REDASH_QUERY_RESULTS_MAX_AGE: '43200'
services:
- name: redash_db
  image: postgres:16.4-alpine
  environment:
    POSTGRES_DB: redash
    POSTGRES_USER: redash
    POSTGRES_PASSWORD: ${DB_PASSWORD}
  ports:
  - "127.0.0.1:5432:5432"
  volumes:
  - redash_db:/var/lib/postgresql/data
  healthcheck:
    test: CMD-SHELL pg_isready -U redash -d redash
    interval: 10s
    timeout: 5s
    retries: 10
- name: redis
  image: redis:7.4-alpine
  ports:
  - "127.0.0.1:6380:6379"
  volumes:
  - redash_redis:/data
  healthcheck:
    test: CMD redis-cli ping
    interval: 10s
    timeout: 5s
    retries: 10
volumes:
  redash_db: {}
  redash_redis: {}
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
    - '5003'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
config_contract:
  services:
    app:
      fields:
        REDASH_GOOGLE_CLIENT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        REDASH_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    redash_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh
monitoring:
  status_panel: true
env_file: .env

marketplace:
  publish: true
  display_name: "Redash"
  short_description: "Connect, query and visualize data from dozens of sources. Redash dashboards for your team's metrics with SQL and alerts."
  long_description: |
    **Redash**: Connect, query and visualize data from dozens of sources. Redash dashboards for your team's metrics with SQL and alerts.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5000 (public on 5003) | `redash/redash:latest` |
    | redash_db | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/redash

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [redash]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/redash
  no_secrets_confirmation: true
