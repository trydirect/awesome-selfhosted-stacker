name: langflow

project:
  identity: langflow

install:
  inputs:
    commonDomain: workflows.example.com

app:
  type: custom
  image: langflowai/langflow:latest
  ports:
    - "7860:7860"
  environment:
    LANGFLOW_AUTO_LOGIN: "false"
    LANGFLOW_SECRET_KEY: "${LANGFLOW_SECRET_KEY}"
    LANGFLOW_SUPERUSER: admin
    LANGFLOW_SUPERUSER_PASSWORD: "${ADMIN_PASSWORD}"
    LANGFLOW_DATABASE_URL: "postgresql://langflow:${DB_PASSWORD}@postgres:5432/langflow"
  volumes:
    - langflow_data:/app/langflow

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: langflow
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U langflow"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: langflow.example.com
      ssl: off
      upstream: app:7860

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "7860"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        LANGFLOW_AUTO_LOGIN:
          mutability: editable
        LANGFLOW_DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        LANGFLOW_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        LANGFLOW_SUPERUSER:
          mutability: editable
        LANGFLOW_SUPERUSER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  langflow_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Langflow"
  short_description: "Visual builder for LLM applications, drag-and-drop components to compose AI chains. Prototype and deploy RAG and agent flows fast."
  long_description: |
    **Langflow**: Visual builder for LLM applications, drag-and-drop components to compose AI chains. Prototype and deploy RAG and agent flows fast.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 7860 (public) | `langflowai/langflow:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `LANGFLOW_AUTO_LOGIN`, `LANGFLOW_SUPERUSER`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/langflow

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [langflow]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/langflow
  no_secrets_confirmation: true
