name: planka

project:
  identity: planka

install:
  inputs:
    commonDomain: kanban.example.com

app:
  type: custom
  image: ghcr.io/plankanban/planka:latest
  ports:
    - "1337:1337"
  environment:
    DATABASE_URL: "postgres://planka:${DB_PASSWORD}@postgres:5432/planka"
    BASE_URL: http://localhost:1337
    SECRET_KEY: "${SECRET_KEY}"
    TRUST_PROXY: "0"
  volumes:
    - planka_data:/app/public/user-avatars
    - planka_attachments:/app/private/attachments

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: planka
      POSTGRES_USER: planka
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U planka"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: kanban.example.com
      ssl: off
      upstream: app:1337

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "1337"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        BASE_URL:
          mutability: editable
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        TRUST_PROXY:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  planka_data: {}
  planka_attachments: {}
  postgres_data: {}
