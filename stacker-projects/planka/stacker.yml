name: planka

project:
  identity: planka

install:
  inputs:
    commonDomain: kanban.example.com

app:
  type: custom
  image: ghcr.io/plankanban/planka:latest
  ports:
    - "1337:1337"
  environment:
    DATABASE_URL: "postgres://planka:${DB_PASSWORD}@postgres:5432/planka"
    BASE_URL: http://localhost:1337
    SECRET_KEY: "${SECRET_KEY}"
    TRUST_PROXY: "0"
  volumes:
    - planka_data:/app/public/user-avatars
    - planka_attachments:/app/private/attachments

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: planka
      POSTGRES_USER: planka
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U planka"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: kanban.example.com
      ssl: off
      upstream: app:1337

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "1337"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        BASE_URL:
          mutability: editable
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        TRUST_PROXY:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  planka_data: {}
  planka_attachments: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Planka"
  short_description: "Kanban board for agile teams (Trello alternative) with a slick interface. Boards, cards, checklists and workflows."
  long_description: |
    **Planka**: Kanban board for agile teams (Trello alternative) with a slick interface. Boards, cards, checklists and workflows.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 1337 (public) | `ghcr.io/plankanban/planka:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `BASE_URL`, `TRUST_PROXY`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/planka

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [planka]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/planka
  no_secrets_confirmation: true
