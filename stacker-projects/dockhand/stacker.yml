name: dockhand
version: "1.0.0"

project:
  identity: dockhand

install:
  inputs:
    commonDomain: dockhand.try.direct

app:
  type: custom
  image: fnsys/dockhand:latest
  ports:
    - "3000:3000"
  environment:
    DATA_DIR: /app/data
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - dockhand-data:/app/data
  healthcheck:
    test: "CMD curl -fsS http://localhost:3000/"
    interval: 30s
    timeout: 5s
    retries: 3

volumes:
  dockhand-data: {}

deploy:
  target: cloud
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: hel1
    size: cpx22
    key: htz-0
    public_ports:
      - "22"
      - "80"
      - "443"

proxy:
  type: none
  auto_detect: false
monitoring:
  status_panel: true
  healthcheck:
    endpoint: /
    interval: 30s

config_contract:
  services:
    app:
      fields:
        DATA_DIR:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Dockhand"
  short_description: "Clean web UI for managing Docker containers on your server. Inspect logs, start/stop containers and manage volumes without the command line."
  long_description: |
    **Dockhand**: Clean web UI for managing Docker containers on your server. Inspect logs, start/stop containers and manage volumes without the command line.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `fnsys/dockhand:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DATA_DIR` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/dockhand

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [dockhand]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/dockhand
  no_secrets_confirmation: true
