name: vaultwarden-caddy
version: "1.0.0"

project:
  identity: vaultwarden-caddy

install:
  inputs:
    commonDomain: vault.example.com

app:
  type: custom
  image: vaultwarden/server:latest
  ports:
    - "8080:80"
  environment:
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    SIGNUPS_ALLOWED: "true"
    DOMAIN: http://vault.example.com
  volumes:
    - vaultwarden_data:/data

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: vault.example.com
      ssl: "off"
      upstream: app:80

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ADMIN_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DOMAIN:
          mutability: editable
        SIGNUPS_ALLOWED:
          mutability: editable
          display: boolean
        volumes:
          mutability: editable
env_file: .env

volumes:
  vaultwarden_data: {}

marketplace:
  publish: true
  display_name: "Vaultwarden Caddy"
  short_description: "Vaultwarden password manager with automatic HTTPS via Caddy. Bitwarden-compatible vault with zero-config TLS."
  long_description: |
    **Vaultwarden Caddy**: Vaultwarden password manager with automatic HTTPS via Caddy. Bitwarden-compatible vault with zero-config TLS.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DOMAIN`, `SIGNUPS_ALLOWED` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/vaultwarden-caddy

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [vaultwarden caddy]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/vaultwarden-caddy
  no_secrets_confirmation: true
