name: network-tools

app:
  type: custom
  dockerfile: Dockerfile
  image: trydirect/network-tools:1.0.0

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test



config_contract:
  services: {}

marketplace:
  display_name: "Network Tools"
  short_description: "Self-hosted Network Tools application, ready to deploy with Stacker"

  long_description: |
    ## Network Tools
    
    A self-hosted Network Tools stack, ready to deploy with Stacker.
    
    ### Docker images
    
    - `trydirect/network-tools:1.0.0`
    
    ### Quick start
    
    ```bash
    stacker install network-tools
    ```
    
    ### Configuration
    
    Secrets and passwords are auto-generated on first deploy. Customize via `stacker.yml` or environment variables.