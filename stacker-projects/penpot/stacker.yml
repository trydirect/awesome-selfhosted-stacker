name: penpot
version: "2.1"

project:
  identity: penpot

install:
  inputs:
    commonDomain: penpot.example.com
    domain: penpot.try.direct
    penpot-database-password: ""

app:
  type: custom
  image: penpotapp/frontend:latest
  ports:
    - "9001:80"
  environment:
    PENPOT_FLAGS: enable-registration enable-login-with-password enable-login-with-oidc enable-login-with-google enable-login-with-github enable-login-with-gitlab

services:
  - name: penpot-backend
    image: penpotapp/backend:latest
    environment:
      PENPOT_FLAGS: enable-registration enable-login-with-password enable-login-with-oidc enable-login-with-google enable-login-with-github enable-login-with-gitlab
      PENPOT_DATABASE_URI: "postgresql://postgres:5432/penpot"
      PENPOT_DATABASE_USERNAME: postgres
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DATABASE_PASSWORD}
      PENPOT_REDIS_URI: "redis://redis:6379"
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: "false"
      PENPOT_SMTP_DEFAULT_FROM: no-reply@penpot.local
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@penpot.local
      PENPOT_SMTP_HOST: mailcatcher
      PENPOT_SMTP_PORT: "1025"
      PENPOT_SMTP_TLS: "false"
      PENPOT_SMTP_SSL: "false"
    volumes:
      - "penpot-assets:/opt/data/assets"
    depends_on:
      - postgres
      - redis

  - name: penpot-exporter
    image: penpotapp/exporter:latest
    environment:
      PENPOT_REDIS_URI: "redis://redis:6379"
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
    volumes:
      - "penpot-assets:/opt/data/assets"
    depends_on:
      - redis

  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: penpot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PENPOT_DATABASE_PASSWORD}
    volumes:
      - "penpot-postgres:/var/lib/postgresql/data"

  - name: redis
    image: redis:7-alpine
    volumes:
      - "penpot-redis:/data"

  - name: mailcatcher
    image: sj26/mailcatcher:latest
    ports:
      - "1080:1080"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: penpot.example.com
      ssl: off
      upstream: app:80

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "9001"

env_file: .env

volumes:
  penpot-assets: {}
  penpot-postgres: {}
  penpot-redis: {}

config_contract:
  services:
    app:
      fields:
        PENPOT_FLAGS:
          mutability: editable
    penpot-backend:
      fields:
        PENPOT_ASSETS_STORAGE_BACKEND:
          mutability: editable
        PENPOT_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PENPOT_DATABASE_URI:
          mutability: editable
        PENPOT_DATABASE_USERNAME:
          mutability: editable
        PENPOT_FLAGS:
          mutability: editable
        PENPOT_REDIS_URI:
          mutability: editable
        PENPOT_SMTP_DEFAULT_FROM:
          mutability: editable
        PENPOT_SMTP_DEFAULT_REPLY_TO:
          mutability: editable
        PENPOT_SMTP_HOST:
          mutability: editable
        PENPOT_SMTP_PORT:
          mutability: editable
        PENPOT_SMTP_SSL:
          mutability: editable
        PENPOT_SMTP_TLS:
          mutability: editable
        PENPOT_STORAGE_ASSETS_FS_DIRECTORY:
          mutability: editable
        PENPOT_TELEMETRY_ENABLED:
          mutability: editable
      volumes:
        penpot-assets:
          mutability: generated
    penpot-exporter:
      fields:
        PENPOT_ASSETS_STORAGE_BACKEND:
          mutability: editable
        PENPOT_REDIS_URI:
          mutability: editable
        PENPOT_STORAGE_ASSETS_FS_DIRECTORY:
          mutability: editable
      volumes:
        penpot-assets:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        penpot-postgres:
          mutability: generated
    redis:
      volumes:
        penpot-redis:
          mutability: generated
