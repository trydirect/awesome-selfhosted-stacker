name: wallabag
version: "2.6.0"

project:
  identity: wallabag

install:
  inputs:
    commonDomain: wallabag.example.com

app:
  type: php
  image: wallabag/wallabag:latest
  ports:
    - "8080:80"
  environment:
    SYMFONY_ENV: prod
    SYMFONY_DEBUG: "0"
    SYMFONY_SECRET: "${SYMFONY_SECRET}"
    DATABASE_DRIVER: pdo_pgsql
    DATABASE_HOST: wallabag_db
    DATABASE_PORT: "5432"
    DATABASE_NAME: wallabag
    DATABASE_USER: wallabag
    DATABASE_PASSWORD: "${DB_PASSWORD}"
    MAILER_TRANSPORT: "null"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  volumes:
    - wallabag_data:/var/www/wallabag/data

services:
  - name: wallabag_db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallabag
      POSTGRES_USER: wallabag
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wallabag_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U wallabag -d wallabag"
      interval: 10s
      timeout: 5s
      retries: 10

  - name: redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - wallabag_redis:/data
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  wallabag_db: {}
  wallabag_data: {}
  wallabag_redis: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: wallabag.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"

config_contract:
  services:
    app:
      fields:
        DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SYMFONY_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

    wallabag_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

marketplace:
  publish: true
  display_name: "Wallabag"
  short_description: "Save articles to read later with clean extraction (Pocket alternative). Self-hosted read-it-later with full-text search."
  long_description: |
    **Wallabag**: Save articles to read later with clean extraction (Pocket alternative). Self-hosted read-it-later with full-text search.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `wallabag/wallabag:latest` |
    | wallabag_db | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/wallabag

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [wallabag]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/wallabag
  no_secrets_confirmation: true
