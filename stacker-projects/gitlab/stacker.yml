name: gitlab
version: "18.10.1"

project:
  identity: gitlab

install:
  inputs:
    commonDomain: git.example.com

app:
  type: custom
  image: gitlab/gitlab-ce:18.10.1-ce.0
  ports:
    - "8082:80"
    - "2222:22"
  environment: {}
  volumes:
    - gitlab_config:/etc/gitlab
    - gitlab_logs:/var/log/gitlab
    - gitlab_data:/var/opt/gitlab
    - ./gitlab.rb:/etc/gitlab/gitlab.rb:ro
  shm_size: 256m
  healthcheck:
    test: "CMD-SHELL curl -f http://localhost/-/health || exit 1"
    interval: 60s
    timeout: 30s
    retries: 10

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: ${GITLAB_DOMAIN}
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  cloud:
    provider: hetzner
    orchestrator: remote
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    ssh_key: ~/.config/stacker/ssh/gitlab-cloud
    key: gitlab
    public_ports:
      - "80"
      - "443"
      - "2222"

monitoring:
  status_panel: true

env_file: .env

volumes:
  gitlab_config: {}
  gitlab_logs: {}
  gitlab_data: {}
