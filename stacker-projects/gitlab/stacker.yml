name: gitlab
version: 18.10.1
project:
  identity: gitlab-ce
install:
  inputs:
    commonDomain: git.example.com
app:
  type: custom
  image: gitlab/gitlab-ce:18.10.1-ce.0
  ports:
  - "8082:80"
  - "2222:22"
  environment:
    GITLAB_OMNIBUS_CONFIG: ${GITLAB_OMNIBUS_CONFIG}
  volumes:
  - gitlab_config:/etc/gitlab
  - gitlab_logs:/var/log/gitlab
  - gitlab_data:/var/opt/gitlab
  shm_size: 256m
  healthcheck:
    test: CMD-SHELL curl -f http://localhost/-/health || exit 1
    interval: 60s
    timeout: 30s
    retries: 10
proxy:
  type: caddy
  auto_detect: false
  domains:
  - domain: ${GITLAB_DOMAIN}
    ssl: off
    upstream: app:80
deploy:
  target: server
  server:
    host: 46.224.127.228
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  cloud:
    provider: hetzner
    orchestrator: remote
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    ssh_key: ~/.config/stacker/ssh/gitlab-cloud
    key: gitlab
    public_ports:
    - '80'
    - '443'
    - '2222'
monitoring:
  status_panel: true
config_contract:
  services:
    app:
      fields:
        GITLAB_OMNIBUS_CONFIG:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        shm_size:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env
volumes:
  gitlab_config: {}
  gitlab_logs: {}
  gitlab_data: {}

marketplace:
  publish: true
  display_name: "Gitlab"
  short_description: "Complete DevSecOps platform: Git hosting, CI/CD, registries and security scanning. Run the full GitLab stack on your infrastructure."
  long_description: |
    **GitLab**: Complete DevSecOps platform: Git hosting, CI/CD, registries and security scanning. Run the full GitLab stack on your infrastructure.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8082), 22 (public on 2222) | `gitlab/gitlab-ce:18.10.1-ce.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `GITLAB_OMNIBUS_CONFIG` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/gitlab

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [gitlab]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/gitlab
  no_secrets_confirmation: true
