name: ghost
version: 1.0.0
organization: null
project:
  identity: ghost
app:
  type: custom
  path: .
  dockerfile: null
  image: ghost:5-alpine
  build: null
  ports:
  - "2368:2368"
  volumes:
  - ghost_content:/var/lib/ghost/content
  environment:
    database__client: mysql
    url: ${GHOST_URL}
    database__connection__host: mysql
    database__connection__user: ghost
    database__connection__password: ${DB_PASSWORD}
    database__connection__database: ghost
    NODE_ENV: production
  command: null
  healthcheck: null
services:
- name: mysql
  image: mysql:8
  ports:
  - "127.0.0.1:3306:3306"
  environment:
    MYSQL_USER: ghost
    MYSQL_DATABASE: ghost
    MYSQL_PASSWORD: ${DB_PASSWORD}
    MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
  volumes:
  - mysql_data:/var/lib/mysql
  depends_on: []
  command: null
  healthcheck: null
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '2368'
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: ''
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        database__connection__password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    mysql:
      fields:
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "Ghost"
  short_description: "Modern publishing platform, headless CMS with themes and editor"
  long_description: |
    **Ghost**: Modern publishing platform, headless CMS with themes and editor

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 2368 (public) | `ghost:5-alpine` |
    | mysql | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/ghost

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [ghost]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/ghost
  no_secrets_confirmation: true
