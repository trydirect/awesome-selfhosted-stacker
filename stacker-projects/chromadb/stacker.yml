name: chromadb

project:
  identity: chromadb

app:
  type: custom
  image: chromadb/chroma:1.1.0
  ports:
    - "8000:8000"
  environment:
    ANONYMIZED_TELEMETRY: "FALSE"
  volumes:
    - chroma_data:/chroma/chroma

volumes:
  chroma_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ANONYMIZED_TELEMETRY:
          mutability: editable
          display: boolean
      volumes:
        chroma_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Chroma"
  short_description: "AI-native embedding database for retrieval-augmented generation"
  long_description: |
    **Chroma**: AI-native embedding database for retrieval-augmented generation

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `chromadb/chroma:1.1.0` — embedding database REST API |

    ## What you configure

    - **Defaults provided**: `ANONYMIZED_TELEMETRY` ships prefilled and can be adjusted in the deploy form
    - Collections and embeddings through the REST API on 8000; data persists
      in the generated `chroma_data` volume

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/chromadb

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [chromadb]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/chromadb
  no_secrets_confirmation: true
