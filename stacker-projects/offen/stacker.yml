name: "offen"
version: "1.0.0"
project:
  identity: "offen"
install:
  inputs:
    commonDomain: "offen.example.com"
config_contract:
  services:
    app:
      fields:
        OFFEN_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "offen/offen:latest"
  ports:
    - "3000:3000"
  volumes:
    - "offen_data:/var/opt/offen"
  environment:
    OFFEN_SERVER_PORT: "3000"
    OFFEN_DATABASE_DIALECT: "sqlite3"
    OFFEN_DATABASE_CONNECTIONSTRING: "/var/opt/offen/db.sqlite"
    OFFEN_SECRET: "${OFFEN_SECRET}"
    OFFEN_APP_ROOTACCOUNT: "${OFFEN_APP_ROOTACCOUNT}"
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: offen.example.com
      ssl: off
      upstream: app:3000
deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  offen_data: {}

marketplace:
  publish: true
  display_name: "Offen"
  short_description: "Privacy-friendly, GDPR-compliant web analytics where users see and own their data. Fair and transparent page statistics."
  long_description: |
    **Offen**: Privacy-friendly, GDPR-compliant web analytics where users see and own their data. Fair and transparent page statistics.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `offen/offen:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/offen

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [offen]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/offen
  no_secrets_confirmation: true
