name: peertube
version: "6.0.3"

app:
  type: custom
  image: chocobozzz/peertube:production
  ports:
    - "9000:9000"
  environment:
    NODE_ENV: production
    PEERTUBE_DB_HOST: postgres
    PEERTUBE_DB_PORT: "5432"
    PEERTUBE_DB_NAME: peertube
    PEERTUBE_DB_USER: peertube
    PEERTUBE_DB_PASSWORD: ${PEERTUBE_DATABASE_PASSWORD}
    PEERTUBE_REDIS_HOST: redis
    PEERTUBE_REDIS_PORT: "6379"
    PEERTUBE_REDIS_PASSWORD: ${PEERTUBE_REDIS_PASSWORD}
    PEERTUBE_SMTP_HOSTNAME: mailcatcher
    PEERTUBE_SMTP_PORT: "1025"
    PEERTUBE_SMTP_FROM: no-reply@${DOMAIN}
    PEERTUBE_WEBSERVER_PORT: "9000"
    PEERTUBE_WEBSERVER_HOSTNAME: ${DOMAIN}
    PEERTUBE_TRAFFIC_VIDEO_LIMIT: -1
    PEERTUBE_UPLOAD_LIMIT: 10737418240
  volumes:
    - "peertube-data:/data"
    - "peertube-config:/config"

services:
  - name: postgres
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: peertube
      POSTGRES_USER: peertube
      POSTGRES_PASSWORD: ${PEERTUBE_DATABASE_PASSWORD}
    volumes:
      - "peertube-postgres:/var/lib/postgresql/data"

  - name: redis
    image: redis:7.4-alpine
    command: redis-server --requirepass ${PEERTUBE_REDIS_PASSWORD}
    volumes:
      - "peertube-redis:/data"

  - name: mailcatcher
    image: sj26/mailcatcher:0.9.0
    ports:
      - "1080:1080"


install:
  inputs:
    domain: peertube.try.direct
    peertube-database-password: ""
    peertube-redis-password: ""

config_contract:
  services:
    app:
      fields:
        PEERTUBE_DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PEERTUBE_REDIS_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NODE_ENV:
          mutability: editable
        PEERTUBE_DB_HOST:
          mutability: editable
        PEERTUBE_DB_NAME:
          mutability: editable
        PEERTUBE_DB_PORT:
          mutability: editable
        PEERTUBE_DB_USER:
          mutability: editable
        PEERTUBE_REDIS_HOST:
          mutability: editable
        PEERTUBE_REDIS_PORT:
          mutability: editable
        PEERTUBE_SMTP_FROM:
          mutability: editable
        PEERTUBE_SMTP_HOSTNAME:
          mutability: editable
        PEERTUBE_SMTP_PORT:
          mutability: editable
        PEERTUBE_TRAFFIC_VIDEO_LIMIT:
          mutability: editable
        PEERTUBE_UPLOAD_LIMIT:
          mutability: editable
        PEERTUBE_WEBSERVER_HOSTNAME:
          mutability: editable
        PEERTUBE_WEBSERVER_PORT:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        peertube-postgres:
          mutability: generated
    redis:
      volumes:
        peertube-redis:
          mutability: generated

marketplace:
  display_name: "Peertube"
  short_description: "Self-hosted Peertube application, ready to deploy with Stacker"

  long_description: |
    ## Peertube
    
    A self-hosted Peertube stack, ready to deploy with Stacker.
    
    ### What's included
    
    - **Postgres** (postgres)
    - **Redis** (redis)
    - **Mailcatcher** (mailcatcher)
    
    ### Docker images
    
    - `chocobozzz/peertube:production`
    - `postgres:16.4-alpine`
    - `redis:7.4-alpine`
    - `sj26/mailcatcher:0.9.0`
    
    ### Quick start
    
    ```bash
    stacker install peertube
    ```
    
    ### Configuration
    
    Secrets and passwords are auto-generated on first deploy. Customize via `stacker.yml` or environment variables.