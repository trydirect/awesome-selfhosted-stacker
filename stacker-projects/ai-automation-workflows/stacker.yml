name: ai-workflows-v2
version: "1.0.0"

# NOTE: `name` and `project.identity` intentionally kept as ai-workflows-v2
# to avoid recreating containers/volumes on the already-deployed prod stack
# at 65.109.165.211. Folder name is the human-readable slug; do not sync.

project:
  identity: ai-workflows-v2

install:
  inputs:
    commonDomain: ai-automation-workflows.try.direct

config_contract:
  app:
    environment:
      - name: FLOWISE_USERNAME
        required: true
        secret: false
      - name: FLOWISE_PASSWORD
        required: true
        secret: true
      - name: DB_PASSWORD
        required: true
        secret: true
      - name: APIKEY_SECRET
        required: true
        secret: true
      - name: SECRET_KEY
        required: true
        secret: true
      - name: N8N_PASSWORD
        required: true
        secret: true

hooks:
  pre_build: ./scripts/generate-secrets.sh

app:
  type: custom
  image: flowiseai/flowise:latest
  ports:
    - "3001:3000"
  environment:
    PORT: "3000"
    FLOWISE_USERNAME: "${FLOWISE_USERNAME}"
    FLOWISE_PASSWORD: "${FLOWISE_PASSWORD}"
    DATABASE_TYPE: postgres
    DATABASE_HOST: ai-workflows-db
    DATABASE_PORT: "5432"
    DATABASE_NAME: flowise
    DATABASE_USER: flowise
    DATABASE_PASSWORD: "${DB_PASSWORD}"
    APIKEY_SECRET: "${APIKEY_SECRET}"
    SECRETKEY_SECRET: "${SECRET_KEY}"
    LOG_LEVEL: info
    TOOL_FUNCTION_BUILTIN_DEP: "crypto,os"
    TOOL_FUNCTION_EXTERNAL_DEP: ""
  volumes:
    - ai_workflows_data:/root/.flowise

services:
  - name: ai-workflows-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowise
      POSTGRES_USER: flowise
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ai_workflows_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d flowise -U flowise
      interval: 10s
      timeout: 5s
      retries: 10

  - name: ai-workflows-redis
    image: redis:7-alpine
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

  - name: ai-workflows-ollama
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ai_workflows_ollama:/root/.ollama

  - name: ai-workflows-n8n
    image: n8nio/n8n:latest
    ports:
      - "5679:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      GENERIC_TIMEZONE: "UTC"
    volumes:
      - ai_workflows_n8n:/home/node/.n8n

  - name: ai-workflows-qdrant
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ai_workflows_qdrant:/qdrant/storage

volumes:
  ai_workflows_data: {}
  ai_workflows_pgdata: {}
  ai_workflows_ollama: {}
  ai_workflows_n8n: {}
  ai_workflows_qdrant: {}

deploy:
  target: cloud
  cloud:
    provider: hetzner
    region: hel1
    size: cpx32
    key: htz-0
    public_ports:
      # Only 22 (SSH) and 80/443 (NPM) are public. Flowise, n8n, Qdrant,
      # Ollama, and Postgres are reached only via the NPM reverse proxy
      # over HTTPS — never exposed directly.
      - "22"
      - "80"
      - "443"

proxy:
  type: nginx-proxy-manager
  auto_detect: true
  domains:
    # Flowise UI (primary landing) at the root subdomain.
    # ⚠ VERIFY: upstream is the top-level `app:` container. Stacker names it
    # after `project.identity` — confirm on your server with:
    #   docker ps --format '{{.Names}}' | grep workflow
    # If the actual name differs, update the upstream below.
    - domain: "${commonDomain}"
      ssl: auto
      upstream: "ai-workflows-v2:3000"
    # n8n workflow editor on the n8n. subdomain.
    - domain: "n8n.${commonDomain}"
      ssl: auto
      upstream: "ai-workflows-n8n:5678"
    # Qdrant dashboard on the qdrant. subdomain.
    # PROTECT with NPM basic auth or IP allowlist — Qdrant has no built-in auth on the dashboard.
    - domain: "qdrant.${commonDomain}"
      ssl: auto
      upstream: "ai-workflows-qdrant:6333"

monitoring:
  status_panel: true
  healthcheck:
    endpoint: /api/v1/health
    interval: 30s

env_file: .env
