name: focalboard

project:
  identity: focalboard

install:
  inputs:
    commonDomain: boards.example.com

app:
  type: custom
  image: mattermost/focalboard:latest
  ports:
    - "8000:8000"
  environment:
    FB_SERVER_ROOT: http://localhost:8000
    FB_DB_CONFIG: "postgres://focalboard:${DB_PASSWORD}@postgres:5432/focalboard?sslmode=disable&connect_timeout=10"
  volumes:
    - focalboard_data:/opt/focalboard/data

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: focalboard
      POSTGRES_USER: focalboard
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U focalboard"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  focalboard_data: {}
  postgres_data: {}
