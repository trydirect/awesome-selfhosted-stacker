name: teable

app:
  type: custom
  image: ghcr.io/teableio/teable:v1.0.0
  ports:
    - "3000:3000/tcp"
  environment:
    NODE_ENV: production
    PORT: "3000"
    PRISMA_DATABASE_URL: postgresql://teable:${DB_PASSWORD}@db:5432/teable
    BACKEND_CACHE_PROVIDER: redis
    BACKEND_CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@redis:6379/0
    PUBLIC_ORIGIN: http://localhost:3000
  volumes:
    - teable_data:/app/.assets
  depends_on:
    - db
    - redis
  healthcheck:
    test: "CMD curl -fs http://localhost:3000/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 120s

services:
  - name: db
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_DB: teable
      POSTGRES_USER: teable
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - teable_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U teable -d teable"
      interval: 10s
      timeout: 5s
      retries: 6
  - name: redis
    image: redis:8.8.3-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - teable_cache:/data
    healthcheck:
      test: "CMD-SHELL redis-cli -a ${REDIS_PASSWORD} ping"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  teable_data: {}
  teable_db: {}
  teable_cache: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        BACKEND_CACHE_PROVIDER:
          mutability: editable
        BACKEND_CACHE_REDIS_URI:
          mutability: editable
        NODE_ENV:
          mutability: editable
        PORT:
          mutability: editable
          display: number
        PRISMA_DATABASE_URL:
          mutability: editable
        PUBLIC_ORIGIN:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        teable_data:
          mutability: generated
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        teable_db:
          mutability: generated
    redis:
      fields:
        command:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        teable_cache:
          mutability: generated

marketplace:
  display_name: "Teable"
