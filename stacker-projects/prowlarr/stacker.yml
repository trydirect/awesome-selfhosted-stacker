name: prowlarr

project:
  identity: prowlarr

install:
  inputs:
    commonDomain: indexers.example.com

app:
  type: custom
  image: linuxserver/prowlarr:latest
  ports:
    - "9696:9696"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  volumes:
    - prowlarr_config:/config

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: indexers.example.com
      ssl: off
      upstream: app:9696

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "9696"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  prowlarr_config: {}

marketplace:
  publish: true
  display_name: "Prowlarr"
  short_description: "Indexer manager for Sonarr, Radarr, Lidarr and Readarr. Sync and organize torrent and usenet indexers in one place."
  long_description: |
    **Prowlarr**: Indexer manager for Sonarr, Radarr, Lidarr and Readarr. Sync and organize torrent and usenet indexers in one place.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9696 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/prowlarr

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [prowlarr]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/prowlarr
  no_secrets_confirmation: true
