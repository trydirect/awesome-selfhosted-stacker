name: prowlarr

project:
  identity: prowlarr

install:
  inputs:
    commonDomain: indexers.example.com

app:
  type: custom
  image: linuxserver/prowlarr:latest
  ports:
    - "9696:9696"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  volumes:
    - prowlarr_config:/config

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: indexers.example.com
      ssl: off
      upstream: app:9696

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "9696"

monitoring:
  status_panel: true

env_file: .env

volumes:
  prowlarr_config: {}
