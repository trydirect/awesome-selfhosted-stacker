name: netdata

app:
  type: custom
  image: netdata/netdata:v2.12.2
  ports:
    - "19999:19999"
  healthcheck:
    test: "CMD curl -fs http://localhost:19999"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "19999"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable

marketplace:
  publish: true
  display_name: "Netdata App"
  short_description: "Real-time infrastructure monitoring with per-second metrics and alerting"
  long_description: |
    **netdata**: Real-time infrastructure monitoring with per-second metrics and alerting

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 19999 (public) | `netdata/netdata:v1.47.5` |

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/netdata

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [netdata app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/netdata
  no_secrets_confirmation: true
