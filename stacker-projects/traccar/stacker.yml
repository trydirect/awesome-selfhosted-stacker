name: traccar

project:
  identity: traccar

install:
  inputs:
    commonDomain: gps.example.com

app:
  type: custom
  image: traccar/traccar:6.0
  ports:
    - "8083:8082"
    - "5151-5300:5151-5300"
  environment:
    CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
    DATABASE_DRIVER: org.postgresql.Driver
    DATABASE_URL: "jdbc:postgresql://database:5432/traccar"
    DATABASE_USER: traccar
    DATABASE_PASSWORD: "${DB_PASSWORD}"
  volumes:
    - traccar_logs:/opt/traccar/logs
    - traccar_conf:/opt/traccar/conf

services:
  - name: database
    image: timescale/timescaledb:latest-pg17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U traccar"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8082"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_URL:
          mutability: editable
        DATABASE_USER:
          mutability: editable
    database:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable

env_file: .env

volumes:
  traccar_logs: {}
  traccar_conf: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Traccar"
  short_description: "Cross-platform GPS tracking system supporting thousands of devices. Monitor vehicles and assets on live maps."
  long_description: |
    **Traccar**: Cross-platform GPS tracking system supporting thousands of devices. Monitor vehicles and assets on live maps.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8082 (public on 8083), 5151-5300 (public) | `traccar/traccar:latest` |
    | database | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DATABASE_URL`, `DATABASE_USER`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/traccar

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [traccar]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/traccar
  no_secrets_confirmation: true
