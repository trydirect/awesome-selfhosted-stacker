name: kimai

project:
  identity: kimai

install:
  inputs:
    commonDomain: time.example.com

app:
  type: custom
  image: kimai/kimai2:2.71.0
  ports:
    - "8001:8001"
  environment:
    DATABASE_URL: "mysql://kimai:${DB_PASSWORD}@mysql:3306/kimai"
    APP_SECRET: "${APP_SECRET}"
    TRUSTED_HOSTS: "localhost"
    MAILER_URL: "null://localhost"
    PHP_MEMORY_LIMIT: "512M"
  command: >-
    sh -c "/opt/kimai/bin/console kimai:install --no-interaction && /opt/kimai/bin/console kimai:user:create admin admin@example.com ROLE_SUPER_ADMIN ${ADMIN_PASSWORD} && apache2-foreground"
  volumes:
    - kimai_data:/opt/kimai/var/data
    - ./memory-limit.ini:/usr/local/etc/php/conf.d/memory-limit.ini:ro

services:
  - name: mysql
    image: mysql:8.4.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: kimai
      MYSQL_USER: kimai
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8001"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DATABASE_URL:
          mutability: editable
        MAILER_URL:
          mutability: editable
        TRUSTED_HOSTS:
          mutability: editable
    mysql:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  kimai_data: {}
  mysql_data: {}

marketplace:
  publish: true
  display_name: "Kimai"
  short_description: "Open-source time tracking for teams and freelancers. Log hours per project, export reports and invoice accurately."
  long_description: |
    **Kimai**: Open-source time tracking for teams and freelancers. Log hours per project, export reports and invoice accurately.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8001 (public) | `kimai/kimai2:latest` |
    | mysql | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DATABASE_URL`, `MAILER_URL`, `TRUSTED_HOSTS`, `MYSQL_DATABASE`, `MYSQL_USER` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/kimai

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [kimai]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/kimai
  no_secrets_confirmation: true
