name: openagent
version: "2.95.1"

project:
  identity: openagent

install:
  inputs:
    commonDomain: openagent.example.com

app:
  type: custom
  image: casbin/openagent:2.95.1
  ports:
    - "14000:14000"
  command: "--createDatabase=true"
  environment:
    RUNNING_IN_DOCKER: "true"
    DOCKER_DB_HOST: db
    dataSourceName: "root:${DB_PASSWORD}@tcp(localhost:3306)/"
  volumes:
    - openagent_files:/files
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fs http://localhost:14000/api/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 120s

services:
  - name: db
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - openagent_db:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  openagent_files: {}
  openagent_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "14000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DOCKER_DB_HOST:
          mutability: editable
        RUNNING_IN_DOCKER:
          mutability: editable
        dataSourceName:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        openagent_files:
          mutability: generated
    db:
      fields:
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        openagent_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Openagent"
  short_description: "Open-source AI agent platform with tool use and multi-model support"
  long_description: |
    **Openagent**: Open-source AI agent platform with tool use and multi-model support

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 14000 (public) | `casbin/openagent:2.95.1` |
    | db | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DOCKER_DB_HOST`, `RUNNING_IN_DOCKER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/openagent

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [openagent]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/openagent
  no_secrets_confirmation: true
