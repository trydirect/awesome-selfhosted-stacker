name: trilium
version: "0.63.7"

project:
  identity: trilium

install:
  inputs:
    commonDomain: notes.example.com

app:
  type: custom
  image: zadam/trilium:latest
  ports:
    - "8081:8080"
  environment:
    TRILIUM_DATA_DIR: /home/node/trilium-data
  volumes:
    - trilium_data:/home/node/trilium-data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8081"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        TRILIUM_DATA_DIR:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  trilium_data: {}

marketplace:
  publish: true
  display_name: "Trilium"
  short_description: "Personal hierarchical note-taking knowledge base with scripting and sharing. Build a second brain with Trilium Notes."
  long_description: |
    **Trilium**: Personal hierarchical note-taking knowledge base with scripting and sharing. Build a second brain with Trilium Notes.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public on 8081) | `zadam/trilium:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `TRILIUM_DATA_DIR` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/trilium

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [trilium]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/trilium
  no_secrets_confirmation: true
