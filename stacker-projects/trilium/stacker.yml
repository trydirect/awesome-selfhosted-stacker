name: trilium
version: "0.63.7"

project:
  identity: trilium

install:
  inputs:
    commonDomain: notes.example.com

app:
  type: custom
  image: zadam/trilium:latest
  ports:
    - "8081:8080"
  environment:
    TRILIUM_DATA_DIR: /home/node/trilium-data
  volumes:
    - trilium_data:/home/node/trilium-data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8081"

monitoring:
  status_panel: true

env_file: .env

volumes:
  trilium_data: {}
