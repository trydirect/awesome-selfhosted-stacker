name: hermes-agent
project:
  identity: hermes-agent
version: 1.0.0
app:
  type: custom
  image: nousresearch/hermes-agent:latest
  command: sleep infinity
  ports:
  - "8000:8000"
  - "8001:8001"
  environment:
    HERMES_UID: '1000'
    HERMES_GID: '1000'
    PYTHONUNBUFFERED: '1'
    HERMES_DASHBOARD: '1'
    HERMES_DASHBOARD_PORT: '8000'
    HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
    HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"
services: []
proxy:
  type: none
  auto_detect: false
deploy:
  target: cloud
  server:
    host: ${EXISTING_SERVER_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"
      - "8001"
monitoring:
  status_panel: true
config_contract:
  services:
    app:
      fields:
        HERMES_GID:
          mutability: editable
        HERMES_UID:
          mutability: editable
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PYTHONUNBUFFERED:
          mutability: editable
env_file: .env
env: {}
