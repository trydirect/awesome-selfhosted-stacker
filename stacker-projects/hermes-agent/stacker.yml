name: hermes-agent
project:
  identity: hermes-agent
version: 1.0.0
app:
  type: custom
  image: nousresearch/hermes-agent:latest
  command: sleep infinity
  ports:
  - "8000:8000"
  - "8001:8001"
  environment:
    HERMES_UID: '1000'
    HERMES_GID: '1000'
    PYTHONUNBUFFERED: '1'
    HERMES_DASHBOARD: '1'
    HERMES_DASHBOARD_PORT: '8000'
    HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
    HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"
services: []
proxy:
  type: none
  auto_detect: false
deploy:
  target: cloud
  server:
    host: ${EXISTING_SERVER_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"
      - "8001"
monitoring:
  status_panel: true
config_contract:
  services:
    app:
      fields:
        HERMES_GID:
          mutability: editable
        HERMES_UID:
          mutability: editable
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PYTHONUNBUFFERED:
          mutability: editable
env_file: .env
env: {}

marketplace:
  publish: true
  display_name: "Hermes Agent"
  short_description: "Self-hosted AI agent service for automating tasks through natural language. Deploy a private assistant that acts on your infrastructure."
  long_description: |
    **Hermes Agent**: Self-hosted AI agent service for automating tasks through natural language. Deploy a private assistant that acts on your infrastructure.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public), 8001 (public) | `nousresearch/hermes-agent:latest` |

    ## What you configure

    - **Defaults provided**: `HERMES_GID`, `HERMES_UID`, `PYTHONUNBUFFERED` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/hermes-agent

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [hermes agent]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/hermes-agent
  no_secrets_confirmation: true
