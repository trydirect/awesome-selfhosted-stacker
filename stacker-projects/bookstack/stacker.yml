name: bookstack

project:
  identity: bookstack

app:
  type: custom
  image: lscr.io/linuxserver/bookstack:latest
  ports:
    - "6875:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    APP_URL: http://localhost:6875
    DB_HOST: bookstack-db
    DB_USER: bookstack
    DB_PASS: ${DB_PASSWORD}
    APP_KEY: ${APP_KEY}
    DB_DATABASE: bookstack
  volumes:
    - bookstack_data:/config
    - "./bookstack.env:/config/www/.env:ro"

services:
  - name: bookstack-db
    image: lscr.io/linuxserver/mariadb:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bookstack_db:/config

volumes:
  bookstack_data: {}
  bookstack_db: {}

proxy:
  type: traefik
  auto_detect: false
  domains:
    - domain: bookstack.example.com
      ssl: off
      upstream: app:80

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_URL:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PASS:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_USER:
          mutability: editable
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
    bookstack-db:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
env_file: .env

deploy:
  target: cloud
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "6875"
