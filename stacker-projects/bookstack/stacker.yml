name: bookstack

project:
  identity: bookstack

app:
  type: custom
  image: lscr.io/linuxserver/bookstack:latest
  ports:
    - "6875:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    APP_URL: http://bookstack.example.com
    DB_HOST: bookstack-db
    DB_USER: bookstack
    DB_PASS: ${DB_PASSWORD}
    DB_DATABASE: bookstack
  volumes:
    - bookstack_data:/config

services:
  - name: bookstack-db
    image: lscr.io/linuxserver/mariadb:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bookstack_db:/config

volumes:
  bookstack_data: {}
  bookstack_db: {}

proxy:
  type: traefik
  auto_detect: false
  domains:
    - domain: bookstack.example.com
      ssl: off
      upstream: app:80

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: cloud
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "6875"
