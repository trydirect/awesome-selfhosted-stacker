name: bookstack

project:
  identity: bookstack

app:
  type: custom
  image: lscr.io/linuxserver/bookstack:latest
  ports:
    - "6875:80"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    APP_URL: http://localhost:6875
    DB_HOST: bookstack-db
    DB_USER: bookstack
    DB_PASS: ${DB_PASSWORD}
    APP_KEY: ${APP_KEY}
    DB_DATABASE: bookstack
  volumes:
    - bookstack_data:/config
    - "./bookstack.env:/config/www/.env:ro"

services:
  - name: bookstack-db
    image: lscr.io/linuxserver/mariadb:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bookstack_db:/config

volumes:
  bookstack_data: {}
  bookstack_db: {}

proxy:
  type: traefik
  auto_detect: false
  domains:
    - domain: bookstack.example.com
      ssl: off
      upstream: app:80

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_URL:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PASS:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_USER:
          mutability: editable
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
    bookstack-db:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
env_file: .env

deploy:
  target: cloud
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "6875"

marketplace:
  publish: true
  display_name: "Bookstack"
  short_description: "Simple, clean documentation and wiki platform organized in books, chapters and pages. Perfect for internal knowledge bases with markdown and WYSIWYG editing."
  long_description: |
    **BookStack**: Simple, clean documentation and wiki platform organized in books, chapters and pages. Perfect for internal knowledge bases with markdown and WYSIWYG editing.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 6875) | API server |
    | bookstack-db | internal | Database |

    ## What you configure

    - **Defaults provided**: `APP_URL`, `DB_DATABASE`, `DB_HOST`, `DB_USER`, `PGID`, `PUID` and 3 more ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/bookstack

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [bookstack]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/bookstack
  no_secrets_confirmation: true
