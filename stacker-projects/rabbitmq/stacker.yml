name: rabbitmq

project:
  identity: rabbitmq

app:
  type: custom
  image: rabbitmq:4.3.7-management-alpine
  ports:
    - "5672:5672"
    - "15672:15672"
  environment:
    RABBITMQ_DEFAULT_USER: rabbitmq
    RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
  volumes:
    - rabbitmq_data:/var/lib/rabbitmq
  healthcheck:
    test: "CMD rabbitmq-diagnostics -q ping"
    interval: 10s
    timeout: 5s
    retries: 5

volumes:
  rabbitmq_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5672"
      - "15672"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        RABBITMQ_DEFAULT_USER:
          mutability: editable
        RABBITMQ_DEFAULT_PASS:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        rabbitmq_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "RabbitMQ"
  short_description: "Message broker with management UI, AMQP 0-9-1 and streams"
  long_description: |
    **RabbitMQ**: Message broker with management UI, AMQP 0-9-1 and streams

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5672 (public), 15672 (public) | `rabbitmq:4.3.7-management-alpine` — AMQP + web management UI |

    ## What you configure

    - **Defaults provided**: `RABBITMQ_DEFAULT_USER` ships prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/rabbitmq

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [rabbitmq]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/rabbitmq
  no_secrets_confirmation: true
