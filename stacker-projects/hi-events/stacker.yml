name: hi-events

project:
  identity: hi-events

install:
  inputs:
    commonDomain: events.example.com

app:
  type: custom
  image: ghcr.io/hidevops/hi-events:1.0.1
  ports:
    - "8080:8080"
  environment:
    APP_NAME: Hi.Events
    APP_URL: http://localhost:8080
    APP_KEY: "${APP_KEY}"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: hievents
    DB_USERNAME: hievents
    DB_PASSWORD: "${DB_PASSWORD}"
    CACHE_DRIVER: redis
    REDIS_HOST: redis
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
  command: >-
    sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8080"
  volumes:
    - hievents_storage:/var/www/html/storage

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: hievents
      POSTGRES_USER: hievents
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U hievents"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: events.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_NAME:
          mutability: editable
        APP_URL:
          mutability: editable
        CACHE_DRIVER:
          mutability: editable
        DB_CONNECTION:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USERNAME:
          mutability: editable
        QUEUE_CONNECTION:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        SESSION_DRIVER:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  hievents_storage: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Hi Events"
  short_description: "Event management and ticketing platform with RSVP support"
  long_description: |
    **Hi Events**: Event management and ticketing platform with RSVP support

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `ghcr.io/hidevops/hi-events:latest` |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APP_NAME`, `APP_URL`, `CACHE_DRIVER`, `DB_CONNECTION`, `DB_DATABASE`, `DB_HOST` and 7 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/hi-events

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [hi events]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/hi-events
  no_secrets_confirmation: true
