name: btcpay-server
version: "2.0.0"

app:
  type: custom
  image: btcpayserver/btcpayserver:2.4.5
  ports:
    - "23000:23000"
  environment:
    BTCPAY_HOST: ${DOMAIN}
    BTCPAY_PORT: "23000"
    BTCPAY_PROTOCOL: https
    NBITCOIN_NETWORK: mainnet
    BTCPAY_CHAIN: BTC
    BTCPAY_EXPLORERURL: ""
    BTCPAY_LIGHTNING__CHARGEURL: ""
    BTCPAY_SSHCONNECTION: ""
    BTCPAY_SSHKEYFILE: ""
    DATABASE: "User ID=postgres;Host=postgres;Port=5432;Database=btcpayserver;Application Name=btcpay"
  volumes:
    - "btcpay-data:/datadir"
    - "btcpay-plugins:/plugins"

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btcpayserver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BTCPAY_DATABASE_PASSWORD}
    volumes:
      - "btcpay-postgres:/var/lib/postgresql/data"


install:
  inputs:
    domain: btc.try.direct
    btcpay-database-password: ""
deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "23000"

env_file: .env

config_contract:
  services:
    app:
      fields:
        BTCPAY_CHAIN:
          mutability: editable
        BTCPAY_EXPLORERURL:
          mutability: editable
        BTCPAY_HOST:
          mutability: editable
        BTCPAY_LIGHTNING__CHARGEURL:
          mutability: editable
        BTCPAY_PORT:
          mutability: editable
        BTCPAY_PROTOCOL:
          mutability: editable
        BTCPAY_SSHCONNECTION:
          mutability: editable
        BTCPAY_SSHKEYFILE:
          mutability: editable
        DATABASE:
          mutability: editable
        NBITCOIN_NETWORK:
          mutability: editable
      volumes:
        btcpay-data:
          mutability: generated
        btcpay-plugins:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        btcpay-postgres:
          mutability: generated
