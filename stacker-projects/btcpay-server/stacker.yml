name: btcpay-server
version: "2.0.0"

app:
  type: custom
  image: btcpayserver/btcpayserver:2.4.5
  ports:
    - "23000:23000"
  environment:
    BTCPAY_HOST: ${DOMAIN}
    BTCPAY_PORT: "23000"
    BTCPAY_PROTOCOL: https
    NBITCOIN_NETWORK: mainnet
    BTCPAY_CHAIN: BTC
    BTCPAY_EXPLORERURL: ""
    BTCPAY_LIGHTNING__CHARGEURL: ""
    BTCPAY_SSHCONNECTION: ""
    BTCPAY_SSHKEYFILE: ""
    DATABASE: "User ID=postgres;Host=postgres;Port=5432;Database=btcpayserver;Application Name=btcpay"
  volumes:
    - "btcpay-data:/datadir"
    - "btcpay-plugins:/plugins"

services:
  - name: postgres
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: btcpayserver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${BTCPAY_DATABASE_PASSWORD}
    volumes:
      - "btcpay-postgres:/var/lib/postgresql/data"


install:
  inputs:
    domain: btc.try.direct
    btcpay-database-password: ""
deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "23000"

env_file: .env

config_contract:
  services:
    app:
      fields:
        BTCPAY_CHAIN:
          mutability: editable
        BTCPAY_EXPLORERURL:
          mutability: editable
        BTCPAY_HOST:
          mutability: editable
        BTCPAY_LIGHTNING__CHARGEURL:
          mutability: editable
        BTCPAY_PORT:
          mutability: editable
        BTCPAY_PROTOCOL:
          mutability: editable
        BTCPAY_SSHCONNECTION:
          mutability: editable
        BTCPAY_SSHKEYFILE:
          mutability: editable
        DATABASE:
          mutability: editable
        NBITCOIN_NETWORK:
          mutability: editable
      volumes:
        btcpay-data:
          mutability: generated
        btcpay-plugins:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        btcpay-postgres:
          mutability: generated

marketplace:
  publish: true
  display_name: "Btcpay Server"
  short_description: "Self-hosted, open-source Bitcoin payment processor with no custody of funds. Accept BTC and Lightning payments with full privacy on your own server."
  long_description: |
    **Btcpay Server**: Self-hosted, open-source Bitcoin payment processor with no custody of funds. Accept BTC and Lightning payments with full privacy on your own server.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 23000 (public) | API server |
    | postgres | internal | Database |

    ## What you configure

    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `BTCPAY_CHAIN`, `BTCPAY_EXPLORERURL`, `BTCPAY_HOST`, `BTCPAY_LIGHTNING__CHARGEURL`, `BTCPAY_PORT`, `BTCPAY_PROTOCOL` and 6 more ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/btcpay-server

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [btcpay server]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/btcpay-server
  no_secrets_confirmation: true
