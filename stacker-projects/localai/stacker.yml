name: localai

project:
  identity: localai

install:
  inputs:
    commonDomain: ai.example.com

app:
  type: custom
  image: localai/localai:latest
  ports:
    - "8080:8080"
  environment:
    MODELS_PATH: /models
    THREADS: "4"
    DEBUG: "false"
  volumes:
    - localai_models:/models

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: localai.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: cloud
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  localai_models: {}