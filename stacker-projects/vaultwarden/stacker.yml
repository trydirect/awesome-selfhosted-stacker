name: vaultwarden
version: 1.0.0
organization: null
project:
  identity: vaultwarden
app:
  type: custom
  path: .
  dockerfile: null
  image: vaultwarden/server:alpine
  build: null
  ports:
  - "8080:80"
  volumes:
  - vaultwarden_data:/data
  environment:
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    SIGNUPS_ALLOWED: 'true'
    DOMAIN: http://localhost:8080
  command: null
  healthcheck: null
services:
  - name: proxy-manager
    image: jc21/nginx-proxy-manager:2.11.3
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '8080'
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ~/.config/stacker/ssh/server-451_ed25519
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: ''
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        ADMIN_TOKEN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
volumes:
  vaultwarden_data: {}
  npm_data: {}
  npm_letsencrypt: {}

marketplace:
  publish: true
  display_name: "Vaultwarden"
  short_description: "One-click Vaultwarden stack using only official images and guidance from the project docs."
  long_description: |
    **Vaultwarden**: One-click Vaultwarden stack using only official images and guidance from the project docs.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | API server |
    | proxy-manager | 80 (public), 443 (public), 81 (public) | Reverse proxy |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/vaultwarden

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [vaultwarden]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/vaultwarden
  no_secrets_confirmation: true
