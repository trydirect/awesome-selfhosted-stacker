name: vaultwarden
version: 1.0.0
organization: null
project:
  identity: vaultwarden
app:
  type: custom
  path: .
  dockerfile: null
  image: vaultwarden/server:latest
  build: null
  ports:
  - 8080:80
  volumes:
  - vaultwarden_data:/data
  environment:
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    SIGNUPS_ALLOWED: 'true'
    DOMAIN: http://localhost:8080
  command: null
  healthcheck: null
services:
  - name: proxy-manager
    image: jc21/nginx-proxy-manager:latest
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
proxy:
  type: none
  auto_detect: false
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '8080'
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ~/.config/stacker/ssh/server-451_ed25519
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: ''
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services: {}
volumes:
  vaultwarden_data: {}
  npm_data: {}
  npm_letsencrypt: {}
