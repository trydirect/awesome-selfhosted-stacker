services:
  app:
    image: vaultwarden/server:alpine
    ports:
      - "8080:80"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      DOMAIN: "http://localhost:8080"
      SIGNUPS_ALLOWED: "true"
    volumes:
      - "vaultwarden_data:/data"
    restart: unless-stopped
    networks:
      - app-network
    labels:
      my.stacker.dns: "app"
      my.stacker.scope: "project"
      my.stacker.service: "vaultwarden"

  proxy-manager:
    image: jc21/nginx-proxy-manager:2.11.3
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - "npm_data:/data"
      - "npm_letsencrypt:/etc/letsencrypt"
    restart: unless-stopped
    networks:
      - app-network
    labels:
      my.stacker.dns: "proxy-manager"
      my.stacker.scope: "project"
      my.stacker.service: "proxy-manager"

networks:
  app-network:
    driver: bridge

volumes:
  vaultwarden_data:
  npm_data:
  npm_letsencrypt:

