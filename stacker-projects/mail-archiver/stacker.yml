name: "mail-archiver"
version: "1.0.0"
project:
  identity: "mail-archiver"
install:
  inputs:
    commonDomain: "mailarchiver.example.com"
config_contract:
  services:
    app:
      fields:
        Authentication__Password:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
      volumes:
        mailarchiver_keys: { mutability: generated }
        mailarchiver_postgres_data: { mutability: generated }
    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "s1t5/mailarchiver:latest"
  ports:
    - "5002:5000"
  volumes:
    - "mailarchiver_keys:/app/DataProtection-Keys"
  environment:
    ConnectionStrings__DefaultConnection: "Host=postgres;Database=MailArchiver;Username=mailuser;Password=${DB_PASSWORD}"
    Authentication__Username: "${ADMIN_USERNAME}"
    Authentication__Password: "${ADMIN_PASSWORD}"
    TimeZone__DisplayTimeZoneId: "${TIMEZONE}"
services:
  - name: "postgres"
    image: "postgres:17-alpine"
    environment:
      POSTGRES_DB: "MailArchiver"
      POSTGRES_USER: "mailuser"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "mailarchiver_postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: "CMD-SHELL pg_isready -U mailuser -d MailArchiver"
      interval: "10s"
      timeout: "5s"
      retries: 10
proxy:
  type: "none"
  auto_detect: false
deploy:
  target: "local"
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: "hetzner"
    region: "fsn1"
    size: "cpx22"
    public_ports:
      - "5002"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  mailarchiver_keys: {}
  mailarchiver_postgres_data: {}

marketplace:
  publish: true
  display_name: "Mail Archiver"
  short_description: "Archive incoming email to storage for compliance and search. Keep a durable copy of messages outside the live mailbox."
  long_description: |
    **Mail Archiver**: Archive incoming email to storage for compliance and search. Keep a durable copy of messages outside the live mailbox.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5000 (public on 5002) | `s1t5/mailarchiver:latest` |
    | postgres | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/mail-archiver

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [mail archiver]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/mail-archiver
  no_secrets_confirmation: true
