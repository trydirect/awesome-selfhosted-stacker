name: hedgedoc
version: "1.9.9"

project:
  identity: hedgedoc

install:
  inputs:
    commonDomain: md.example.com

app:
  type: custom
  image: quay.io/hedgedoc/hedgedoc:latest
  ports:
    - "3000:3000"
  environment:
    CMD_DB_URL: postgres://hedgedoc:${DB_PASSWORD}@postgres:5432/hedgedoc
    CMD_DOMAIN: md.example.com
    CMD_PROTOCOL_USESSL: "true"
    CMD_SESSION_SECRET: "${SESSION_SECRET}"
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: hedgedoc
      POSTGRES_USER: hedgedoc
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - hedgedoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U hedgedoc
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  services:
    app:
      fields:
        CMD_SESSION_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SESSION_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  hedgedoc_pgdata: {}

marketplace:
  publish: true
  display_name: "Hedgedoc"
  short_description: "Collaborative markdown editor with real-time co-editing (CodiMD successor). Write docs, notes and diagrams together."
  long_description: |
    **HedgeDoc**: Collaborative markdown editor with real-time co-editing (CodiMD successor). Write docs, notes and diagrams together.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `quay.io/hedgedoc/hedgedoc:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/hedgedoc

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [hedgedoc]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/hedgedoc
  no_secrets_confirmation: true
