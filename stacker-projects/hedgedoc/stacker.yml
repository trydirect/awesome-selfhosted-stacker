name: hedgedoc
version: "1.9.9"

project:
  identity: hedgedoc

install:
  inputs:
    commonDomain: md.example.com

app:
  type: custom
  image: quay.io/hedgedoc/hedgedoc:latest
  ports:
    - "3000:3000"
  environment:
    CMD_DB_URL: postgres://hedgedoc:${DB_PASSWORD}@postgres:5432/hedgedoc
    CMD_DOMAIN: md.example.com
    CMD_PROTOCOL_USESSL: "true"
    CMD_SESSION_SECRET: "${SESSION_SECRET}"
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: hedgedoc
      POSTGRES_USER: hedgedoc
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - hedgedoc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U hedgedoc
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  app:
    environment:
      - name: DB_PASSWORD
        required: true
        secret: true
      - name: SESSION_SECRET
        required: true
        secret: true

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  hedgedoc_pgdata: {}
