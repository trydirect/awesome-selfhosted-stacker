name: element

project:
  identity: element

install:
  inputs:
    commonDomain: chat.example.com

app:
  type: custom
  image: vectorim/element-web:v1.11.84
  ports:
    - "8080:80"
  volumes:
    - element_config:/app/config

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: chat.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

env_file: .env

volumes:
  element_config: {}

config_contract:
  services:
    app:
      volumes:
        element_config:
          mutability: generated

marketplace:
  publish: true
  display_name: "Element"
  short_description: "Decentralized, end-to-end encrypted messaging client for the Matrix network. Self-host chat with rooms, calls and federation."
  long_description: |
    **Element**: Decentralized, end-to-end encrypted messaging client for the Matrix network. Self-host chat with rooms, calls and federation.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | Vector database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/element

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [element]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/element
  no_secrets_confirmation: true
