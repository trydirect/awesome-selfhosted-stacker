name: element

project:
  identity: element

install:
  inputs:
    commonDomain: chat.example.com

app:
  type: custom
  image: vectorim/element-web:latest
  ports:
    - "8080:80"
  volumes:
    - element_config:/app/config

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: chat.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

env_file: .env

volumes:
  element_config: {}
