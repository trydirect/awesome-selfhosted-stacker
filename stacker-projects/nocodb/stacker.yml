name: nocodb

app:
  type: custom
  image: nocodb/nocodb:2026.10.0
  ports:
    - "8080:8080"
  environment:
    NC_DB: pg://nocodb-db:5432?u=nocodb&p=${DB_PASSWORD}&d=nocodb
  volumes:
    - nocodb_data:/usr/app/data

services:
  - name: nocodb-db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nocodb_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d nocodb -U nocodb
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nocodb_data: {}
  nocodb_db: {}

proxy:
  type: none
  auto_detect: false

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        NC_DB:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
    nocodb-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

marketplace:
  publish: true
  display_name: "Nocodb"
  short_description: "Open-source Airtable alternative that turns any database into a smart spreadsheet. Instant REST API on top of your existing tables."
  long_description: |
    **NocoDB**: Open-source Airtable alternative that turns any database into a smart spreadsheet. Instant REST API on top of your existing tables.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `nocodb/nocodb:latest` |
    | nocodb-db | internal | Database |

    ## What you configure

    - **Defaults provided**: `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/nocodb

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [nocodb]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/nocodb
  no_secrets_confirmation: true
