name: nocodb

app:
  type: custom
  image: nocodb/nocodb:latest
  ports:
    - "8080:8080"
  environment:
    NC_DB: pg://nocodb-db:5432?u=nocodb&p=${DB_PASSWORD}&d=nocodb
  volumes:
    - nocodb_data:/usr/app/data

services:
  - name: nocodb-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nocodb
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nocodb_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d nocodb -U nocodb
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nocodb_data: {}
  nocodb_db: {}

proxy:
  type: none
  auto_detect: false

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        NC_DB:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
    nocodb-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"
