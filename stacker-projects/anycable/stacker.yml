name: anycable

project:
  identity: anycable

install:
  inputs:
    commonDomain: ws.example.com

app:
  type: custom
  image: anycable/anycable-go:latest
  ports:
    - "8080:8080"
    - "50051:50051"
  environment:
    ANYCABLE_HOST: 0.0.0.0
    ANYCABLE_PORT: 8080

services:
  - name: redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: ws.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"
      - "50051"

monitoring:
  status_panel: true

env_file: .env
