name: anycable

project:
  identity: anycable

install:
  inputs:
    commonDomain: ws.example.com

app:
  type: custom
  image: anycable/anycable-go:1.4.4
  ports:
    - "8080:8080"
    - "50051:50051"
  environment:
    ANYCABLE_HOST: 0.0.0.0
    ANYCABLE_PORT: 8080

services:
  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: ws.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"
      - "50051"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ANYCABLE_HOST:
          mutability: editable
        ANYCABLE_PORT:
          mutability: editable
          display: number
env_file: .env

marketplace:
  publish: true
  display_name: "Anycable"
  short_description: "Real-time WebSocket server compatible with Ruby on Rails ActionCable protocols. Scale live features with AnyCable's Go-powered Ruby alternatives."
  long_description: |
    **Anycable**: Real-time WebSocket server compatible with Ruby on Rails ActionCable protocols. Scale live features with AnyCable's Go-powered Ruby alternatives.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public), 50051 (public) | `anycable/anycable-go:1.4.4` |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ANYCABLE_HOST`, `ANYCABLE_PORT` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/anycable

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [anycable]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/anycable
  no_secrets_confirmation: true
