name: "archivesspace"
version: "1.0.0"
project:
  identity: "archivesspace"
install:
  inputs:
    commonDomain: "archivesspace.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "archivesspace/archivesspace:3.5.1"
  command: >-
    sh -c "/archivesspace/scripts/setup-database.sh && exec /archivesspace/archivesspace.sh"
  ports:
    - "8081:8080"
  environment:
    APPCONFIG_DB_URL: "jdbc:mysql://db:3306/archivesspace?useUnicode=true&characterEncoding=UTF-8&user=as&password=${DB_PASSWORD}"
    APPCONFIG_SOLR_URL: "http://solr:8983/solr/archivesspace"
    APPCONFIG_FRONTEND_PROXY_URL: "${PUBLIC_URL}/staff/"
    APPCONFIG_OAI_PROXY_URL: "${PUBLIC_URL}/oai"
    APPCONFIG_PUBLIC_PROXY_URL: "${PUBLIC_URL}/"
    APPCONFIG_BACKEND_URL: "${PUBLIC_URL}"
    APPCONFIG_FRONTEND_COOKIE_SECRET: "${FRONTEND_COOKIE_SECRET}"
    APPCONFIG_PUBLIC_COOKIE_SECRET: "${PUBLIC_COOKIE_SECRET}"
    APPCONFIG_PUBLIC_USER_SECRET: "${PUBLIC_USER_SECRET}"
    APPCONFIG_SEARCH_USER_SECRET: "${SEARCH_USER_SECRET}"
    APPCONFIG_STAFF_USER_SECRET: "${STAFF_USER_SECRET}"
    JAVA_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
services:
  - name: "db"
    image: "mysql:8.4"
    command: "--character-set-server=UTF8MB4 --innodb_buffer_pool_size=2G --innodb_buffer_pool_instances=2 --log_bin_trust_function_creators=1"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "archivesspace"
      MYSQL_USER: "as"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "archivesspace_mysql:/var/lib/mysql"
    healthcheck:
      test: "CMD-SHELL mysqladmin ping -h 127.0.0.1 -u root -p${DB_ROOT_PASSWORD} || exit 1"
      interval: "10s"
      timeout: "5s"
      retries: 10
  - name: "solr"
    image: "archivesspace/solr:3.5.1"
    command: "solr-create -p 8983 -c archivesspace -d archivesspace"
    volumes:
      - "archivesspace_solr:/var/solr"
proxy:
  type: "none"
  auto_detect: false
deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  archivesspace_mysql: {}
  archivesspace_solr: {}

config_contract:
  services:
    app:
      fields:
        APPCONFIG_FRONTEND_COOKIE_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APPCONFIG_PUBLIC_COOKIE_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APPCONFIG_PUBLIC_USER_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APPCONFIG_SEARCH_USER_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APPCONFIG_STAFF_USER_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APPCONFIG_BACKEND_URL:
          mutability: editable
        APPCONFIG_DB_URL:
          mutability: editable
        APPCONFIG_FRONTEND_PROXY_URL:
          mutability: editable
        APPCONFIG_OAI_PROXY_URL:
          mutability: editable
        APPCONFIG_PUBLIC_PROXY_URL:
          mutability: editable
        APPCONFIG_SOLR_URL:
          mutability: editable
        JAVA_OPTS:
          mutability: editable
    db:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
      volumes:
        archivesspace_mysql:
          mutability: generated
    solr:
      volumes:
        archivesspace_solr:
          mutability: generated

marketplace:
  publish: true
  display_name: "Archivesspace"
  short_description: "Open-source archival information management system for documenting and managing archives. Run ArchivesSpace to catalog collections, agents and accessions."
  long_description: |
    **Archivesspace**: Open-source archival information management system for documenting and managing archives. Run ArchivesSpace to catalog collections, agents and accessions.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public on 8081) | `archivesspace/archivesspace:3.5.1` |
    | db | internal | Database |
    | solr | internal | `archivesspace/solr:3.5.1` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APPCONFIG_BACKEND_URL`, `APPCONFIG_DB_URL`, `APPCONFIG_FRONTEND_PROXY_URL`, `APPCONFIG_OAI_PROXY_URL`, `APPCONFIG_PUBLIC_PROXY_URL`, `APPCONFIG_SOLR_URL` and 3 more ship prefilled and can be adjusted in the deploy form

    All 7 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/archivesspace

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [archivesspace]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/archivesspace
  no_secrets_confirmation: true
