name: woodpecker-ci

app:
  type: custom
  image: woodpeckerci/woodpecker-server:v3
  ports:
    - "8000:8000"
  environment:
    WOODPECKER_OPEN: "true"
    WOODPECKER_HOST: http://localhost:8000
    WOODPECKER_AGENT_SECRET: ${AGENT_SECRET}
    WOODPECKER_GITEA: "true"
    WOODPECKER_GITEA_SERVER: https://gitea.example.com
    WOODPECKER_GITHUB: "false"
  volumes:
    - woodpecker_data:/var/lib/woodpecker

services:
  - name: woodpecker-agent
    image: woodpeckerci/woodpecker-agent:v3
    environment:
      WOODPECKER_SERVER: app:9000
      WOODPECKER_AGENT_SECRET: ${AGENT_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - app

volumes:
  woodpecker_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        WOODPECKER_AGENT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        WOODPECKER_GITEA:
          mutability: editable
        WOODPECKER_GITHUB:
          mutability: editable
        WOODPECKER_HOST:
          mutability: editable
        WOODPECKER_OPEN:
          mutability: editable
        volumes:
          mutability: editable
    woodpecker-agent:
      fields:
        WOODPECKER_SERVER:
          mutability: editable
        depends_on:
          mutability: editable
env_file: .env
