name: duplicati

project:
  identity: duplicati

install:
  inputs:
    commonDomain: duplicati.try.direct

app:
  type: custom
  image: lscr.io/linuxserver/duplicati:2.0.9
  ports:
  - "8200:8200"
  environment:
    PUID: '1000'
    PGID: '1000'
    TZ: UTC
    SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
  volumes:
  - duplicati_config:/config
  - duplicati_backups:/backups
  - duplicati_source:/source
volumes:
  duplicati_config: {}
  duplicati_backups: {}
  duplicati_source: {}
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: duplicati.example.com
      ssl: off
      upstream: app:8200
config_contract:
  services:
    app:
      fields:
        SETTINGS_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8200"

marketplace:
  publish: true
  display_name: "Duplicati"
  short_description: "Encrypted incremental backups to cloud storage and remote servers. Schedule Duplicati jobs with deduplication, compression and web UI."
  long_description: |
    **Duplicati**: Encrypted incremental backups to cloud storage and remote servers. Schedule Duplicati jobs with deduplication, compression and web UI.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8200 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/duplicati

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [duplicati]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/duplicati
  no_secrets_confirmation: true
