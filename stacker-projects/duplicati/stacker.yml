name: duplicati

project:
  identity: duplicati

install:
  inputs:
    commonDomain: duplicati.try.direct

app:
  type: custom
  image: lscr.io/linuxserver/duplicati:latest
  ports:
  - 8200:8200
  environment:
    PUID: '1000'
    PGID: '1000'
    TZ: UTC
    SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
  volumes:
  - duplicati_config:/config
  - duplicati_backups:/backups
  - duplicati_source:/source
volumes:
  duplicati_config: {}
  duplicati_backups: {}
  duplicati_source: {}
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: duplicati.example.com
      ssl: off
      upstream: app:8200
env_file: .env

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8200"
