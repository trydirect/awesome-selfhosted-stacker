name: mongodb

project:
  identity: mongodb

install:
  inputs:
    commonDomain: mongodb.example.com

app:
  type: custom
  image: mongo:7
  ports:
    - "27017:27017"
  environment:
    MONGO_INITDB_ROOT_USERNAME: admin
    MONGO_INITDB_ROOT_PASSWORD: "${DB_PASSWORD}"
  volumes:
    - mongodb_data:/data/db
    - mongodb_config:/data/configdb

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: mongodb.example.com
      ssl: off
      upstream: app:27017

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "27017"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  mongodb_data: {}
  mongodb_config: {}