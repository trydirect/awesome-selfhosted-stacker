name: mongodb

project:
  identity: mongodb

install:
  inputs:
    commonDomain: mongodb.example.com

app:
  type: custom
  image: mongo:7
  ports:
    - "27017:27017"
  environment:
    MONGO_INITDB_ROOT_USERNAME: admin
    MONGO_INITDB_ROOT_PASSWORD: "${DB_PASSWORD}"
  volumes:
    - mongodb_data:/data/db
    - mongodb_config:/data/configdb

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: mongodb.example.com
      ssl: off
      upstream: app:27017

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "27017"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        MONGO_INITDB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MONGO_INITDB_ROOT_USERNAME:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  mongodb_data: {}
  mongodb_config: {}

marketplace:
  publish: true
  display_name: "Mongodb"
  short_description: "Deploy MongoDB, the document NoSQL database, with authentication enabled. Store JSON-like documents at any scale."
  long_description: |
    **MongoDB**: Deploy MongoDB, the document NoSQL database, with authentication enabled. Store JSON-like documents at any scale.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 27017 (public) | `mongo:7` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `MONGO_INITDB_ROOT_USERNAME` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/mongodb

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [mongodb]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/mongodb
  no_secrets_confirmation: true
