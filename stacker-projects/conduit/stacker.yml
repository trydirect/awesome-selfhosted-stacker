name: conduit

project:
  identity: conduit

install:
  inputs:
    commonDomain: matrix.example.com

app:
  type: custom
  image: matrixconduit/matrix-conduit:latest
  ports:
    - "6167:6167"
  environment:
    CONDUIT_SERVER_NAME: localhost
    CONDUIT_PORT: 6167
    CONDUIT_DATABASE_BACKEND: sqlite
    CONDUIT_DATABASE_PATH: /var/lib/conduit/conduit.db
  volumes:
    - conduit_data:/var/lib/conduit

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "6167"

monitoring:
  status_panel: true

env_file: .env

volumes:
  conduit_data: {}
