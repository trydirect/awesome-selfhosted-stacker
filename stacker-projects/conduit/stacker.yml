name: conduit

project:
  identity: conduit

install:
  inputs:
    commonDomain: matrix.example.com

app:
  type: custom
  image: matrixconduit/matrix-conduit:v0.10.15
  ports:
    - "6167:6167"
  environment:
    CONDUIT_CONFIG: /var/lib/conduit/conduit.toml
    CONDUIT_SERVER_NAME: localhost
    CONDUIT_PORT: 6167
    CONDUIT_DATABASE_BACKEND: sqlite
    CONDUIT_DATABASE_PATH: /var/lib/conduit/conduit.db
  volumes:
    - conduit_data:/var/lib/conduit
    - ./conduit.toml:/var/lib/conduit/conduit.toml:ro

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "6167"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CONDUIT_DATABASE_BACKEND:
          mutability: editable
        CONDUIT_DATABASE_PATH:
          mutability: editable
        CONDUIT_PORT:
          mutability: editable
          display: number
        CONDUIT_SERVER_NAME:
          mutability: editable
      volumes:
        conduit_data:
          mutability: generated
env_file: .env

volumes:
  conduit_data: {}

marketplace:
  publish: true
  display_name: "Conduit"
  short_description: "Lightweight, fast Matrix chat server written in Rust. Run your own homeserver compatible with the Matrix federation network."
  long_description: |
    **Conduit**: Lightweight, fast Matrix chat server written in Rust. Run your own homeserver compatible with the Matrix federation network.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 6167 (public) | Web UI |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `CONDUIT_DATABASE_BACKEND`, `CONDUIT_DATABASE_PATH`, `CONDUIT_PORT`, `CONDUIT_SERVER_NAME` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/conduit

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [conduit]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/conduit
  no_secrets_confirmation: true
