name: ollama-local
version: "1.0.0"

project:
  identity: ollama-local

install:
  inputs:
    commonDomain: ollama.try.direct
    domain: ollama.try.direct

app:
  type: custom
  image: ollama/ollama:latest
  ports:
    - "11434:11434"
  environment:
    OLLAMA_HOST: "0.0.0.0:11434"
    OLLAMA_ORIGINS: "*"
    OLLAMA_NUM_PARALLEL: "2"
    OLLAMA_MAX_LOADED_MODELS: "2"
    OLLAMA_KEEP_ALIVE: "5m"
  volumes:
    - "ollama-data:/root/.ollama"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: ollama.example.com
      ssl: off
      upstream: app:11434

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "11434"

env_file: .env

volumes:
  ollama-data: {}

config_contract:
  services:
    app:
      fields:
        OLLAMA_HOST:
          mutability: editable
        OLLAMA_KEEP_ALIVE:
          mutability: editable
        OLLAMA_MAX_LOADED_MODELS:
          mutability: editable
        OLLAMA_NUM_PARALLEL:
          mutability: editable
        OLLAMA_ORIGINS:
          mutability: editable
      volumes:
        ollama-data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Ollama Local"
  short_description: "Run large language models locally with Ollama's simple API. Pull models and chat entirely on your own hardware."
  long_description: |
    **Ollama Local**: Run large language models locally with Ollama's simple API. Pull models and chat entirely on your own hardware.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 11434 (public) | LLM runtime |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Domain** (`domain`): the hostname the stack is served on
    - **Defaults provided**: `OLLAMA_HOST`, `OLLAMA_KEEP_ALIVE`, `OLLAMA_MAX_LOADED_MODELS`, `OLLAMA_NUM_PARALLEL`, `OLLAMA_ORIGINS` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/ollama-local

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [ollama local]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/ollama-local
  no_secrets_confirmation: true
