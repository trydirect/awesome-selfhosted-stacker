name: pihole
version: 1.0.0
organization: null
project:
  identity: pihole
app:
  type: custom
  path: .
  dockerfile: null
  image: pihole/pihole:2024.07.0
  build: null
  ports:
  - "8080:80"
  - 8053:53/udp
  - 8053:53/tcp
  volumes: []
  environment:
    PIHOLE_DNS_: ${PIHOLE_DNS_}
    DNSSEC: 'true'
    TZ: ${TZ}
    CONDITIONAL_FORWARDING: 'false'
    WEBPASSWORD: ${WEBPASSWORD}
  command: null
  healthcheck: null
services: []
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: null
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: fsn1
    size: cpx22
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - '8080'
    - 8053/tcp
    - 8053/udp
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: ''
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        WEBPASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

marketplace:
  publish: true
  display_name: "Pihole"
  short_description: "Network-wide ad blocking via DNS with a stats dashboard. Protect every device by pointing DNS to this Pi-hole instance."
  long_description: |
    **pihole**: Network-wide ad blocking via DNS with a stats dashboard. Protect every device by pointing DNS to this Pi-hole instance.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080), 53/udp (public on 8053), 53/tcp (public on 8053) | `pihole/pihole:2024.07.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/pihole

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [pihole]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/pihole
  no_secrets_confirmation: true
