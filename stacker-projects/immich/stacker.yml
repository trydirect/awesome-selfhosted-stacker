name: immich

app:
  type: custom
  image: ghcr.io/immich-app/immich-server:v1.120.0
  ports:
    - "2283:2283"
  environment:
    DB_HOSTNAME: immich-db
    DB_USERNAME: immich
    DB_PASSWORD: ${DB_PASSWORD}
    DB_DATABASE_NAME: immich
    REDIS_HOSTNAME: immich-redis
    UPLOAD_LOCATION: /usr/src/app/upload
    IMMICH_HOST: '0.0.0.0'
    HOST: '0.0.0.0'
  volumes:
    - immich_upload:/usr/src/app/upload

services:
  - name: immich-db
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
    volumes:
      - immich_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d immich -U immich
      interval: 10s
      timeout: 5s
      retries: 10

  - name: immich-redis
    image: redis:7-alpine
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  immich_upload: {}
  immich_db: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: cloud
  server: null
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "2283"

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_HOSTNAME:
          mutability: editable
        DB_USERNAME:
          mutability: editable
        DB_DATABASE_NAME:
          mutability: editable
        REDIS_HOSTNAME:
          mutability: editable
        UPLOAD_LOCATION:
          mutability: editable
        IMMICH_HOST:
          mutability: editable
        HOST:
          mutability: editable
    immich-db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        POSTGRES_DB:
          mutability: editable

hooks:
  pre_build: ./scripts/generate-secrets.sh

env_file: .env
