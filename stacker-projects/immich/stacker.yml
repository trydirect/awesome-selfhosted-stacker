name: immich

app:
  type: custom
  image: ghcr.io/immich-app/immich-server:v1.120.0
  ports:
    - "2283:2283"
  environment:
    DB_HOSTNAME: immich-db
    DB_USERNAME: immich
    DB_PASSWORD: ${DB_PASSWORD}
    DB_DATABASE_NAME: immich
    REDIS_HOSTNAME: immich-redis
    UPLOAD_LOCATION: /usr/src/app/upload
    IMMICH_HOST: '0.0.0.0'
    HOST: '0.0.0.0'
  volumes:
    - immich_upload:/usr/src/app/upload

services:
  - name: immich-db
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
    volumes:
      - immich_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d immich -U immich
      interval: 10s
      timeout: 5s
      retries: 10

  - name: immich-redis
    image: redis:7.4-alpine
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  immich_upload: {}
  immich_db: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "2283"

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_HOSTNAME:
          mutability: editable
        DB_USERNAME:
          mutability: editable
        DB_DATABASE_NAME:
          mutability: editable
        REDIS_HOSTNAME:
          mutability: editable
        UPLOAD_LOCATION:
          mutability: editable
        IMMICH_HOST:
          mutability: editable
        HOST:
          mutability: editable
    immich-db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        POSTGRES_DB:
          mutability: editable

hooks:
  pre_build: ./scripts/generate-secrets.sh

env_file: .env

marketplace:
  publish: true
  display_name: "Immich"
  short_description: "High-performance self-hosted photo and video backup (Google Photos alternative). Mobile apps with ML-powered search and sharing."
  long_description: |
    **Immich**: High-performance self-hosted photo and video backup (Google Photos alternative). Mobile apps with ML-powered search and sharing.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 2283 (public) | API server |
    | immich-db | internal | Database |
    | immich-redis | internal | Cache |

    ## What you configure

    - **Defaults provided**: `DB_DATABASE_NAME`, `DB_HOSTNAME`, `DB_USERNAME`, `HOST`, `IMMICH_HOST`, `REDIS_HOSTNAME` and 3 more ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/immich

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [immich]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/immich
  no_secrets_confirmation: true
