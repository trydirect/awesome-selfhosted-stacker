name: crowdsec

app:
  type: custom
  image: crowdsecurity/crowdsec:latest
  environment:
    COLLECTIONS: "crowdsecurity/nginx"
    GID: "1000"
  volumes:
    - crowdsec_config:/etc/crowdsec
    - crowdsec_data:/var/lib/crowdsec/data
    - /var/log:/var/log:ro

volumes:
  crowdsec_config: {}
  crowdsec_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22

env_file: .env
