name: crowdsec

app:
  type: custom
  image: crowdsecurity/crowdsec:latest
  environment:
    COLLECTIONS: "crowdsecurity/nginx"
    GID: "1000"
  volumes:
    - crowdsec_config:/etc/crowdsec
    - crowdsec_data:/var/lib/crowdsec/data
    - /var/log:/var/log:ro

volumes:
  crowdsec_config: {}
  crowdsec_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22

config_contract:
  services:
    app:
      fields:
        COLLECTIONS:
          mutability: editable
        GID:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Crowdsec"
  short_description: "Collaborative intrusion prevention system that analyzes visitor behavior. Block attackers at your firewall with community threat intelligence."
  long_description: |
    **Crowdsec**: Collaborative intrusion prevention system that analyzes visitor behavior. Block attackers at your firewall with community threat intelligence.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | internal | `crowdsecurity/crowdsec:latest` |

    ## What you configure

    - **Defaults provided**: `COLLECTIONS`, `GID` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/crowdsec

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [crowdsec]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/crowdsec
  no_secrets_confirmation: true
