name: screego

project:
  identity: screego

install:
  inputs:
    commonDomain: screego.example.com

app:
  type: custom
  image: ghcr.io/screego/server:1
  ports:
    - "5050:5050"
  environment:
    SCREEGO_EXTERNAL_IP: 127.0.0.1
    SCREEGO_TURN_PORT_RANGE: 10000:10100

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: screego.example.com
      ssl: off
      upstream: app:5050

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        SCREEGO_EXTERNAL_IP:
          mutability: editable
        SCREEGO_TURN_PORT_RANGE:
          mutability: editable
          display: number
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "5050"

marketplace:
  publish: true
  display_name: "Screego"
  short_description: "Screen sharing for developers over WebSockets. Share your terminal or desktop in the browser with a single link."
  long_description: |
    **Screego**: Screen sharing for developers over WebSockets. Share your terminal or desktop in the browser with a single link.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5050 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `SCREEGO_EXTERNAL_IP`, `SCREEGO_TURN_PORT_RANGE` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/screego

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [screego]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/screego
  no_secrets_confirmation: true
