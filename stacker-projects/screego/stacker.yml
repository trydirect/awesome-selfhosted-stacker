name: screego

project:
  identity: screego

install:
  inputs:
    commonDomain: screego.example.com

app:
  type: custom
  image: ghcr.io/screego/server:latest
  ports:
    - "5050:5050"
  environment:
    SCREEGO_EXTERNAL_IP: auto
    SCREEGO_TURN_PORT_RANGE: 10000:10100

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: screego.example.com
      ssl: off
      upstream: app:5050

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "5050"
