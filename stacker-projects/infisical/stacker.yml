name: infisical

app:
  type: custom
  image: infisical/infisical:v0.162.9
  ports:
    - "8080:8080"
  environment:
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    AUTH_SECRET: ${AUTH_SECRET}
    DB_CONNECTION_URI: postgresql://infisical:${DB_PASSWORD}@infisical-db:5432/infisical
    SITE_URL: http://localhost:8080
    NODE_ENV: production
    REDIS_URL: redis://infisical-redis:6379

services:
  - name: infisical-redis
    image: redis:7.4-alpine
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  - name: infisical-db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - infisical_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d infisical -U infisical
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  infisical_db: {}

proxy:
  type: none
  auto_detect: false

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        AUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_CONNECTION_URI:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NODE_ENV:
          mutability: editable
        SITE_URL:
          mutability: editable
    infisical-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

marketplace:
  publish: true
  display_name: "Infisical"
  short_description: "Open-source secrets management platform for teams. Store, sync and inject environment secrets with end-to-end encryption."
  long_description: |
    **Infisical**: Open-source secrets management platform for teams. Store, sync and inject environment secrets with end-to-end encryption.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `infisical/infisical:v0.162.9` |
    | infisical-redis | internal | Cache |
    | infisical-db | internal | Database |

    ## What you configure

    - **Defaults provided**: `NODE_ENV`, `SITE_URL`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/infisical

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [infisical]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/infisical
  no_secrets_confirmation: true
