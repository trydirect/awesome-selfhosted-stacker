name: infisical

app:
  type: custom
  image: infisical/infisical:v0.162.9
  ports:
    - "8080:8080"
  environment:
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    AUTH_SECRET: ${AUTH_SECRET}
    DB_CONNECTION_URI: postgresql://infisical:${DB_PASSWORD}@infisical-db:5432/infisical
    SITE_URL: http://localhost:8080
    NODE_ENV: production

services:
  - name: infisical-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - infisical_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d infisical -U infisical
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  infisical_db: {}

proxy:
  type: none
  auto_detect: false

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        AUTH_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_CONNECTION_URI:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NODE_ENV:
          mutability: editable
        SITE_URL:
          mutability: editable
    infisical-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"
