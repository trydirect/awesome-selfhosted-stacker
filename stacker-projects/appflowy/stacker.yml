name: appflowy

project:
  identity: appflowy

install:
  inputs:
    commonDomain: appflowy.example.com

app:
  type: custom
  image: appflowyinc/appflowy_cloud:0.8.1
  ports:
    - "8000:8000"
  environment:
    APPFLOWY_DATABASE_URL: "postgres://appflowy:${DB_PASSWORD}@postgres:5432/appflowy"
    APPFLOWY_REDIS_URI: "redis://redis:6379"
    APPFLOWY_ENVIRONMENT: production
  volumes:
    - appflowy_data:/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: appflowy
      POSTGRES_USER: appflowy
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U appflowy"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APPFLOWY_DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APPFLOWY_ENVIRONMENT:
          mutability: editable
        APPFLOWY_REDIS_URI:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  appflowy_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Appflowy"
  short_description: "Open-source Notion alternative for notes, wikis and tasks with offline-first support. Self-host your AppFlowy workspace with sync server and databases."
  long_description: |
    **Appflowy**: Open-source Notion alternative for notes, wikis and tasks with offline-first support. Self-host your AppFlowy workspace with sync server and databases.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `appflowyinc/appflowy_cloud:latest` |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APPFLOWY_ENVIRONMENT`, `APPFLOWY_REDIS_URI`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/appflowy

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [appflowy]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/appflowy
  no_secrets_confirmation: true
