name: appflowy

project:
  identity: appflowy

install:
  inputs:
    commonDomain: appflowy.example.com

app:
  type: custom
  image: appflowyinc/appflowy_cloud:latest
  ports:
    - "8000:8000"
  environment:
    APPFLOWY_DATABASE_URL: "postgres://appflowy:${DB_PASSWORD}@postgres:5432/appflowy"
    APPFLOWY_REDIS_URI: "redis://redis:6379"
    APPFLOWY_ENVIRONMENT: production
  volumes:
    - appflowy_data:/data

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: appflowy
      POSTGRES_USER: appflowy
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U appflowy"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  appflowy_data: {}
  postgres_data: {}
