name: passbolt
version: "4.7.0"

project:
  identity: passbolt

install:
  inputs:
    commonDomain: passwords.example.com
    domain: passwords.try.direct
    passbolt-database-password: ""
    passbolt-gpg-key-fingerprint: ""

app:
  type: custom
  image: passbolt/passbolt:5.17.0-1-ce-non-root
  ports:
    - "8443:443"
  environment:
    APP_FULL_BASE_URL: https://${DOMAIN}
    DATASOURCES_DEFAULT_HOST: postgres
    DATASOURCES_DEFAULT_PORT: "3306"
    DATASOURCES_DEFAULT_USERNAME: passbolt
    DATASOURCES_DEFAULT_PASSWORD: ${PASSBOLT_DATABASE_PASSWORD}
    DATASOURCES_DEFAULT_DATABASE: passbolt
    PASSBOLT_GPG_SERVER_KEY_PATH: /etc/passbolt/gpg/serverkey_private.asc
    PASSBOLT_GPG_SERVER_KEY_FINGERPRINT: ${PASSBOLT_GPG_KEY_FINGERPRINT}
    PASSBOLT_EMAIL_TRANSPORT_DEFAULT_HOST: mailcatcher
    PASSBOLT_EMAIL_TRANSPORT_DEFAULT_PORT: "1025"
    PASSBOLT_EMAIL_DEFAULT_FROM: no-reply@${DOMAIN}
    PASSBOLT_EMAIL_DEFAULT_TRANSPORT: default
    JAVA_OPTS: "-Xmx1g"
  volumes:
    - "passbolt-gpg:/etc/passbolt/gpg"
    - "passbolt-images:/var/www/html/webroot/img"

services:
  - name: postgres
    image: mariadb:11.8
    environment:
      MYSQL_DATABASE: passbolt
      MYSQL_USER: passbolt
      MYSQL_PASSWORD: ${PASSBOLT_DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PASSBOLT_DATABASE_PASSWORD}
    volumes:
      - "passbolt-mysql:/var/lib/mysql"

  - name: mailcatcher
    image: sj26/mailcatcher:0.9.0
    ports:
      - "1080:1080"

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: passwords.example.com
      ssl: off
      upstream: app:443

monitoring:
  status_panel: true

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"

env_file: .env

volumes:
  passbolt-gpg: {}
  passbolt-images: {}
  passbolt-mysql: {}

config_contract:
  services:
    app:
      fields:
        DATASOURCES_DEFAULT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_FULL_BASE_URL:
          mutability: editable
        DATASOURCES_DEFAULT_DATABASE:
          mutability: editable
        DATASOURCES_DEFAULT_HOST:
          mutability: editable
        DATASOURCES_DEFAULT_PORT:
          mutability: editable
        DATASOURCES_DEFAULT_USERNAME:
          mutability: editable
        JAVA_OPTS:
          mutability: editable
        PASSBOLT_EMAIL_DEFAULT_FROM:
          mutability: editable
        PASSBOLT_EMAIL_DEFAULT_TRANSPORT:
          mutability: editable
        PASSBOLT_EMAIL_TRANSPORT_DEFAULT_HOST:
          mutability: editable
        PASSBOLT_EMAIL_TRANSPORT_DEFAULT_PORT:
          mutability: editable
        PASSBOLT_GPG_SERVER_KEY_FINGERPRINT:
          mutability: provided
        PASSBOLT_GPG_SERVER_KEY_PATH:
          mutability: provided
    postgres:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
      volumes:
        passbolt-mysql:
          mutability: generated

marketplace:
  publish: true
  display_name: "Passbolt"
  short_description: "Open-source password manager for teams with GPG-based sharing. Share credentials with granular permissions and audit trails."
  long_description: |
    **Passbolt**: Open-source password manager for teams with GPG-based sharing. Share credentials with granular permissions and audit trails.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 443 (public on 8443) | `passbolt/passbolt:4.8.0` |
    | postgres | internal | Database |
    | mailcatcher | 1080 (public) | `sj26/mailcatcher:0.9.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Domain** (`domain`): the hostname the stack is served on
    - **PASSBOLT_GPG_SERVER_KEY_FINGERPRINT**: you provide this in the deploy form
    - **PASSBOLT_GPG_SERVER_KEY_PATH**: you provide this in the deploy form
    - **Defaults provided**: `APP_FULL_BASE_URL`, `DATASOURCES_DEFAULT_DATABASE`, `DATASOURCES_DEFAULT_HOST`, `DATASOURCES_DEFAULT_PORT`, `DATASOURCES_DEFAULT_USERNAME`, `JAVA_OPTS` and 6 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/passbolt

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [passbolt]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/passbolt
  no_secrets_confirmation: true
