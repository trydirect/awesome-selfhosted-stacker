name: jellyseerr
app:
  type: custom
  image: fallenbagel/jellyseerr:2.3.0
  ports:
  - "5055:5055"
  volumes:
  - jellyseerr_config:/app/config
volumes:
  jellyseerr_config: {}
proxy:
  type: none
  auto_detect: false
config_contract:
  services:
    app:
      volumes:
        jellyseerr_config: { mutability: generated }
env_file: .env
deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22

marketplace:
  display_name: "Jellyseerr"
