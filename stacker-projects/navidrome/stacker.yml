name: navidrome

project:
  identity: navidrome

install:
  inputs:
    commonDomain: navidrome.try.direct

app:
  type: custom
  image: deluan/navidrome:latest
  ports:
    - "4533:4533"
  environment:
    ND_SCANSCHEDULE: 1h
    ND_LOGLEVEL: info
    ND_BASEURL: ""
  volumes:
    - navidrome_data:/data
    - navidrome_music:/music:ro

volumes:
  navidrome_data: {}
  navidrome_music: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: navidrome.example.com
      ssl: off
      upstream: app:4533

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ND_BASEURL:
          mutability: editable
        ND_LOGLEVEL:
          mutability: editable
        ND_SCANSCHEDULE:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "4533"

marketplace:
  publish: true
  display_name: "Navidrome"
  short_description: "Lightweight, self-hosted music streaming server compatible with Subsonic clients. Your library, any device, no limits."
  long_description: |
    **Navidrome**: Lightweight, self-hosted music streaming server compatible with Subsonic clients. Your library, any device, no limits.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 4533 (public) | `deluan/navidrome:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ND_BASEURL`, `ND_LOGLEVEL`, `ND_SCANSCHEDULE` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/navidrome

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [navidrome]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/navidrome
  no_secrets_confirmation: true
