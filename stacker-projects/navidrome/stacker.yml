name: navidrome

project:
  identity: navidrome

install:
  inputs:
    commonDomain: navidrome.try.direct

app:
  type: custom
  image: deluan/navidrome:latest
  ports:
    - "4533:4533"
  environment:
    ND_SCANSCHEDULE: 1h
    ND_LOGLEVEL: info
    ND_BASEURL: ""
  volumes:
    - navidrome_data:/data
    - navidrome_music:/music:ro

volumes:
  navidrome_data: {}
  navidrome_music: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: navidrome.example.com
      ssl: off
      upstream: app:4533

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "4533"
