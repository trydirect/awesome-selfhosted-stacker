name: navidrome

app:
  type: custom
  image: deluan/navidrome:latest
  ports:
    - "4533:4533"
  environment:
    ND_SCANSCHEDULE: 1h
    ND_LOGLEVEL: info
    ND_BASEURL: ""
  volumes:
    - navidrome_data:/data
    - navidrome_music:/music:ro

volumes:
  navidrome_data: {}
  navidrome_music: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "4533"
