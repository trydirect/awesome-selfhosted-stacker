name: khoj

project:
  identity: khoj

install:
  inputs:
    commonDomain: assistant.example.com

app:
  type: custom
  image: ghcr.io/khoj-ai/khoj:v1.28.0
  ports:
    - "42110:42110"
  environment:
    KHOJ_DJANGO_SECRET_KEY: "${KHOJ_DJANGO_SECRET_KEY}"
    KHOJ_ADMIN_EMAIL: admin@example.com
    KHOJ_ADMIN_PASSWORD: "${KHOJ_ADMIN_PASSWORD}"
    KHOJ_NO_HTTPS: "true"
    KHOJ_DATABASE_URL: "postgresql://khoj:${DB_PASSWORD}@postgres:5432/khoj"
    KHOJ_MODE: production
  command: --host=0.0.0.0 --port=42110 -vv --anonymous-mode --non-interactive
  volumes:
    - khoj_data:/root/.khoj
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: khoj
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U khoj"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: khoj.example.com
      ssl: off
      upstream: app:42110

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "42110"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        KHOJ_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        KHOJ_DJANGO_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        KHOJ_ADMIN_EMAIL:
          mutability: editable
        KHOJ_DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        KHOJ_MODE:
          mutability: editable
        KHOJ_NO_HTTPS:
          mutability: editable
        command:
          mutability: editable
        depends_on:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  khoj_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Khoj"
  short_description: "AI second brain, chat with your notes, documents and images using local or hosted LLMs. Khoj indexes your data for instant answers."
  long_description: |
    **Khoj**: AI second brain, chat with your notes, documents and images using local or hosted LLMs. Khoj indexes your data for instant answers.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 42110 (public) | `ghcr.io/khoj-ai/khoj:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `KHOJ_ADMIN_EMAIL`, `KHOJ_MODE`, `KHOJ_NO_HTTPS`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/khoj

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [khoj]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/khoj
  no_secrets_confirmation: true
