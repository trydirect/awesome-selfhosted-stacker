name: khoj

project:
  identity: khoj

install:
  inputs:
    commonDomain: assistant.example.com

app:
  type: custom
  image: ghcr.io/khoj-ai/khoj:latest
  ports:
    - "42110:42110"
  environment:
    KHOJ_DJANGO_SECRET_KEY: "${KHOJ_DJANGO_SECRET_KEY}"
    KHOJ_ADMIN_EMAIL: admin@example.com
    KHOJ_ADMIN_PASSWORD: "${KHOJ_ADMIN_PASSWORD}"
    KHOJ_NO_HTTPS: "true"
    KHOJ_DATABASE_URL: "postgresql://khoj:${DB_PASSWORD}@postgres:5432/khoj"
    KHOJ_MODE: production
  command: --host=0.0.0.0 --port=42110 -vv --anonymous-mode --non-interactive
  volumes:
    - khoj_data:/root/.khoj
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: khoj
      POSTGRES_USER: khoj
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U khoj"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: khoj.example.com
      ssl: off
      upstream: app:42110

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "42110"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  khoj_data: {}
  postgres_data: {}