name: espocrm

project:
  identity: espocrm

install:
  inputs:
    commonDomain: crm.example.com

app:
  type: custom
  image: espocrm/espocrm:latest
  ports:
    - "8080:80"
  environment:
    ESPOCRM_DATABASE_PLATFORM: mysql
    ESPOCRM_DATABASE_HOST: mysql
    ESPOCRM_DATABASE_PORT: 3306
    ESPOCRM_DATABASE_NAME: espocrm
    ESPOCRM_DATABASE_USER: espocrm
    ESPOCRM_DATABASE_PASSWORD: "${DB_PASSWORD}"
    ESPOCRM_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    ESPOCRM_SITE_URL: http://localhost:8080
  volumes:
    - espocrm_data:/var/www/html/data
    - espocrm_config:/var/www/html/config

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: espocrm
      MYSQL_USER: espocrm
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: traefik
  auto_detect: true
  domains:
    - domain: crm.example.com
      ssl: auto
      upstream: app:80

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

config_contract:
  services:
    app:
      fields:
        ESPOCRM_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ESPOCRM_DATABASE_HOST:
          mutability: editable
        ESPOCRM_DATABASE_NAME:
          mutability: editable
        ESPOCRM_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ESPOCRM_DATABASE_PLATFORM:
          mutability: editable
        ESPOCRM_DATABASE_PORT:
          mutability: editable
          display: number
        ESPOCRM_DATABASE_USER:
          mutability: editable
        ESPOCRM_SITE_URL:
          mutability: editable
        volumes:
          mutability: editable
    mysql:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  espocrm_data: {}
  espocrm_config: {}
  mysql_data: {}

marketplace:
  publish: true
  display_name: "Espocrm"
  short_description: "Open-source CRM with a clean UI, workflow automations and email integration. Manage leads, opportunities and customers on your server."
  long_description: |
    **EspoCRM**: Open-source CRM with a clean UI, workflow automations and email integration. Manage leads, opportunities and customers on your server.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `espocrm/espocrm:latest` |
    | mysql | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ESPOCRM_DATABASE_HOST`, `ESPOCRM_DATABASE_NAME`, `ESPOCRM_DATABASE_PLATFORM`, `ESPOCRM_DATABASE_PORT`, `ESPOCRM_DATABASE_USER`, `ESPOCRM_SITE_URL` and 2 more ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/espocrm

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [espocrm]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/espocrm
  no_secrets_confirmation: true
