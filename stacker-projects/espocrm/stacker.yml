name: espocrm

project:
  identity: espocrm

install:
  inputs:
    commonDomain: crm.example.com

app:
  type: custom
  image: espocrm/espocrm:latest
  ports:
    - "8080:80"
  environment:
    ESPOCRM_DATABASE_PLATFORM: mysql
    ESPOCRM_DATABASE_HOST: mysql
    ESPOCRM_DATABASE_PORT: 3306
    ESPOCRM_DATABASE_NAME: espocrm
    ESPOCRM_DATABASE_USER: espocrm
    ESPOCRM_DATABASE_PASSWORD: "${DB_PASSWORD}"
    ESPOCRM_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    ESPOCRM_SITE_URL: http://localhost:8080
  volumes:
    - espocrm_data:/var/www/html/data
    - espocrm_config:/var/www/html/config

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: espocrm
      MYSQL_USER: espocrm
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  espocrm_data: {}
  espocrm_config: {}
  mysql_data: {}
