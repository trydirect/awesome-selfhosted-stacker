name: cachet

project:
  identity: cachet

install:
  inputs:
    commonDomain: status.example.com

app:
  type: custom
  image: cachethq/docker:2.3.18
  ports:
    - "8000:8000"
  environment:
    APP_KEY: "${APP_KEY}"
    APP_URL: http://cachet.example.com
    DB_DRIVER: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: cachet
    DB_USERNAME: cachet
    DB_PASSWORD: "${DB_PASSWORD}"
    CACHE_DRIVER: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    MAIL_DRIVER: smtp
  command: >-
    sh -c "php artisan key:generate && php artisan migrate --force && php artisan config:cache && php artisan serve --host=0.0.0.0 --port=8000"
  volumes:
    - cachet_data:/var/www/html/storage

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: cachet
      POSTGRES_USER: cachet
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U cachet"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: traefik
  auto_detect: false
  domains:
    - domain: cachet.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: cloud
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_URL:
          mutability: editable
        CACHE_DRIVER:
          mutability: editable
        DB_DATABASE:
          mutability: editable
        DB_DRIVER:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USERNAME:
          mutability: editable
        MAIL_DRIVER:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        SESSION_DRIVER:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  cachet_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Cachet"
  short_description: "Open-source status page system for tracking uptime and communicating incidents. Tell your users when services are degraded with a beautiful Cachet page."
  long_description: |
    **Cachet**: Open-source status page system for tracking uptime and communicating incidents. Tell your users when services are degraded with a beautiful Cachet page.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `cachethq/docker:latest` |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APP_URL`, `CACHE_DRIVER`, `DB_DATABASE`, `DB_DRIVER`, `DB_HOST`, `DB_PORT` and 6 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/cachet

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [cachet]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/cachet
  no_secrets_confirmation: true
