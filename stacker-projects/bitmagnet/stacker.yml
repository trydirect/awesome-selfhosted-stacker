name: "bitmagnet"
version: "1.0.0"
project:
  identity: "bitmagnet"
install:
  inputs:
    commonDomain: "bitmagnet.example.com"
config_contract:
  services:
    app:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        TMDB_API_KEY:
          mutability: provided
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "ghcr.io/bitmagnet-io/bitmagnet:latest"
  ports:
    - "3333:3333"
  command: "worker run --all"
  volumes:
    - "bitmagnet_config:/root/.config/bitmagnet"
    - "bitmagnet_data:/root/.local/share/bitmagnet"
  environment:
    LOG_FILE_ROTATOR_ENABLED: "false"
    POSTGRES_HOST: "postgres"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "${DB_PASSWORD}"
    POSTGRES_DB: "bitmagnet"
    TMDB_API_KEY: ""
services:
  - name: "postgres"
    image: "postgres:16-alpine"
    environment:
      POSTGRES_DB: "bitmagnet"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "bitmagnet_postgres_data:/var/lib/postgresql/data"
    shm_size: "1g"
    healthcheck:
      test: "CMD-SHELL pg_isready -U postgres -d bitmagnet"
      interval: "10s"
      timeout: "5s"
      retries: 10
proxy:
  type: "none"
  auto_detect: false
deploy:
  target: "local"
  cloud:
    provider: "hetzner"
    region: "fsn1"
    size: "cpx22"
    public_ports:
      - "3333"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  bitmagnet_config: {}
  bitmagnet_data: {}
  bitmagnet_postgres_data: {}

marketplace:
  publish: true
  display_name: "Bitmagnet"
  short_description: "Self-hosted BitTorrent DHT network crawler and indexer with a GraphQL API. Build your own torrent search index with Bitmagnet."
  long_description: |
    **Bitmagnet**: Self-hosted BitTorrent DHT network crawler and indexer with a GraphQL API. Build your own torrent search index with Bitmagnet.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3333 (public) | `ghcr.io/bitmagnet-io/bitmagnet:latest` |
    | postgres | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/bitmagnet

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [bitmagnet]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/bitmagnet
  no_secrets_confirmation: true
