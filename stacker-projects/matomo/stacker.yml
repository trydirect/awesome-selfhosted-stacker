name: matomo
version: "5.0.0"

project:
  identity: matomo

install:
  inputs:
    commonDomain: matomo.example.com

app:
  type: php
  image: matomo:5.1
  ports:
    - "8080:80"
  environment:
    MATOMO_DATABASE_HOST: matomo_db
    MATOMO_DATABASE_DBNAME: matomo
    MATOMO_DATABASE_USERNAME: matomo
    MATOMO_DATABASE_PASSWORD: "${DB_PASSWORD}"
    MATOMO_DATABASE_TABLES_PREFIX: "matomo_"
  volumes:
    - matomo_config:/var/www/html/config
    - matomo_logs:/var/www/html/logs

services:
  - name: matomo_db
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - matomo_db:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  matomo_db: {}
  matomo_config: {}
  matomo_logs: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: matomo.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

config_contract:
  services:
    app:
      fields:
        MATOMO_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    matomo_db:
      fields:
        MARIADB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MARIADB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

marketplace:
  publish: true
  display_name: "Matomo"
  short_description: "Full-featured, privacy-focused web analytics platform (Google Analytics alternative). Own your data with heatmaps, funnels and GDPR controls."
  long_description: |
    **Matomo**: Full-featured, privacy-focused web analytics platform (Google Analytics alternative). Own your data with heatmaps, funnels and GDPR controls.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `matomo:5.1:5.1` |
    | matomo_db | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/matomo

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [matomo]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/matomo
  no_secrets_confirmation: true
