name: open-notebook
version: "1.0.0"

project:
  identity: open-notebook

install:
  inputs:
    commonDomain: open-notebook.example.com

app:
  type: custom
  image: lfnovo/open_notebook:1.15.0
  ports:
    - "8502:8502"
    - "5055:5055"
  environment:
    OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY}
    OPEN_NOTEBOOK_PASSWORD: ${OPEN_NOTEBOOK_PASSWORD}
    SURREAL_URL: ws://surrealdb:8000/rpc
    SURREAL_USER: ${SURREAL_USER}
    SURREAL_PASSWORD: ${SURREAL_PASSWORD}
    SURREAL_NAMESPACE: open_notebook
    SURREAL_DATABASE: open_notebook
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  volumes:
    - open_notebook_data:/app/data
  depends_on:
    - surrealdb
  healthcheck:
    test: "CMD curl -fs http://localhost:5055/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 90s

services:
  - name: surrealdb
    image: surrealdb/surrealdb:v2.0.0
    command: start --log info --user ${SURREAL_USER} --pass ${SURREAL_PASSWORD} rocksdb:/home/nonroot/mydatabase.db
    environment:
      SURREAL_EXPERIMENTAL_GRAPHQL: "true"
    volumes:
      - open_notebook_surreal:/home/nonroot

volumes:
  open_notebook_data: {}
  open_notebook_surreal: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8502"
      - "5055"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ANTHROPIC_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENAI_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPEN_NOTEBOOK_ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPEN_NOTEBOOK_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SURREAL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SURREAL_USER:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SURREAL_URL:
          mutability: editable
        SURREAL_NAMESPACE:
          mutability: editable
        SURREAL_DATABASE:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
    surrealdb:
      fields:
        command:
          mutability: editable
        environment:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        open_notebook_surreal:
          mutability: generated

marketplace:
  publish: true
  display_name: "Open Notebook"
  short_description: "AI-powered notebook with LLM chat, RAG, and knowledge management"
  long_description: |
    **Open Notebook**: AI-powered notebook with LLM chat, RAG, and knowledge management

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8502 (public), 5055 (public) | `lfnovo/open_notebook:1.15.0` |
    | surrealdb | internal | `surrealdb/surrealdb:v2` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `SURREAL_DATABASE`, `SURREAL_NAMESPACE`, `SURREAL_URL` ship prefilled and can be adjusted in the deploy form

    All 6 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/open-notebook

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [open notebook]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/open-notebook
  no_secrets_confirmation: true
