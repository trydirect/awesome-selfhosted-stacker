name: privatebin

project:
  identity: privatebin

install:
  inputs:
    commonDomain: paste.example.com

app:
  type: custom
  image: privatebin/nginx-fpm-alpine:latest
  ports:
    - "8080:8080"
  environment:
    PATH: /srv/bin:$PATH
  volumes:
    - privatebin_data:/srv/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

monitoring:
  status_panel: true

env_file: .env

volumes:
  privatebin_data: {}
