name: privatebin

project:
  identity: privatebin

install:
  inputs:
    commonDomain: paste.example.com

app:
  type: custom
  image: privatebin/nginx-fpm-alpine:latest
  ports:
    - "8080:8080"
  environment:
    PATH: /srv/bin:$PATH
  volumes:
    - privatebin_data:/srv/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PATH:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  privatebin_data: {}

marketplace:
  publish: true
  display_name: "Privatebin"
  short_description: "Zero-knowledge, encrypted pastebin with password protection. Share text that is unreadable to anyone but the recipient."
  long_description: |
    **PrivateBin**: Zero-knowledge, encrypted pastebin with password protection. Share text that is unreadable to anyone but the recipient.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | Web server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PATH` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/privatebin

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [privatebin]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/privatebin
  no_secrets_confirmation: true
