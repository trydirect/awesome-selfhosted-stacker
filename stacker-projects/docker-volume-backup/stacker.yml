name: docker-volume-backup

app:
  type: custom
  image: offen/docker-volume-backup:latest
  environment:
    BACKUP_FILENAME: "backup-{{.Time}}.tar.gz"
    BACKUP_RETENTION_DAYS: "7"
  volumes:
    - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    - docker_backup:/dump

volumes:
  docker_backup: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports: []

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        BACKUP_FILENAME:
          mutability: editable
        BACKUP_RETENTION_DAYS:
          mutability: editable
          display: number
        volumes:
          mutability: editable
      volumes:
        docker_backup:
          mutability: generated
