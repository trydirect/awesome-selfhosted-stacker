name: docker-volume-backup

app:
  type: custom
  image: offen/docker-volume-backup:latest
  environment:
    BACKUP_FILENAME: "backup-{{.Time}}.tar.gz"
    BACKUP_RETENTION_DAYS: "7"
  volumes:
    - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    - docker_backup:/dump

volumes:
  docker_backup: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports: []

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        BACKUP_FILENAME:
          mutability: editable
        BACKUP_RETENTION_DAYS:
          mutability: editable
          display: number
        volumes:
          mutability: editable
      volumes:
        docker_backup:
          mutability: generated

marketplace:
  publish: true
  display_name: "Docker Volume Backup App"
  short_description: "Self-hosted docker-volume-backup"
  long_description: |
    **docker-volume-backup**: Self-hosted docker-volume-backup

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | internal | `offen/docker-volume-backup:latest` |

    ## What you configure

    - **Defaults provided**: `BACKUP_FILENAME`, `BACKUP_RETENTION_DAYS` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/docker-volume-backup

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [docker volume backup app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/docker-volume-backup
  no_secrets_confirmation: true
