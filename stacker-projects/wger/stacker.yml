name: wger

project:
  identity: wger

install:
  inputs:
    commonDomain: fitness.example.com

app:
  type: custom
  image: wger/server:latest
  ports:
    - "8000:8000"
  environment:
    DJANGO_DB_ENGINE: django.db.backends.postgresql
    DJANGO_DB_HOST: postgres
    DJANGO_DB_PORT: 5432
    DJANGO_DB_DATABASE: wger
    DJANGO_DB_USER: wger
    DJANGO_DB_PASSWORD: "${DB_PASSWORD}"
    DJANGO_SECRET_KEY: "${SECRET_KEY}"
    DJANGO_ALLOWED_HOSTS: "*"
  volumes:
    - wger_data:/home/wger/media

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: wger
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U wger"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: fitness.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  wger_data: {}
  postgres_data: {}
