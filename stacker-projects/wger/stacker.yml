name: wger

project:
  identity: wger

install:
  inputs:
    commonDomain: fitness.example.com

app:
  type: custom
  image: wger/server:latest
  ports:
    - "8000:8000"
  environment:
    DJANGO_DB_ENGINE: django.db.backends.postgresql
    DJANGO_DB_HOST: postgres
    DJANGO_DB_PORT: 5432
    DJANGO_DB_DATABASE: wger
    DJANGO_DB_USER: wger
    DJANGO_DB_PASSWORD: "${DB_PASSWORD}"
    DJANGO_SECRET_KEY: "${SECRET_KEY}"
    DJANGO_ALLOWED_HOSTS: "*"
  volumes:
    - wger_data:/home/wger/media

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: wger
      POSTGRES_USER: wger
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U wger"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: fitness.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DJANGO_DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DJANGO_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DJANGO_ALLOWED_HOSTS:
          mutability: editable
        DJANGO_DB_DATABASE:
          mutability: editable
        DJANGO_DB_ENGINE:
          mutability: editable
        DJANGO_DB_HOST:
          mutability: editable
        DJANGO_DB_PORT:
          mutability: editable
          display: number
        DJANGO_DB_USER:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  wger_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Wger"
  short_description: "Fitness tracker and workout manager with exercise database and plans. Log training and track progress with wger."
  long_description: |
    **Wger**: Fitness tracker and workout manager with exercise database and plans. Log training and track progress with wger.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | API server |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DJANGO_ALLOWED_HOSTS`, `DJANGO_DB_DATABASE`, `DJANGO_DB_ENGINE`, `DJANGO_DB_HOST`, `DJANGO_DB_PORT`, `DJANGO_DB_USER` and 2 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/wger

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [wger]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/wger
  no_secrets_confirmation: true
