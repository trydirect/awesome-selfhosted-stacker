name: shaper

project:
  identity: shaper

install:
  inputs:
    commonDomain: dashboards.example.com

app:
  type: custom
  image: taleshape/shaper:1.0.0
  ports:
    - "8080:5454"
  environment:
    DUCKDB_PATH: /data/shaper.duckdb
  volumes:
    - shaper_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DUCKDB_PATH:
          mutability: editable
      volumes:
        shaper_data:
          mutability: generated
env_file: .env

volumes:
  shaper_data: {}

marketplace:
  publish: true
  display_name: "Shaper"
  short_description: "HTTP traffic shaping and load testing tool. Simulate realistic request patterns against your endpoints."
  long_description: |
    **Shaper**: HTTP traffic shaping and load testing tool. Simulate realistic request patterns against your endpoints.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5454 (public on 8080) | `taleshape/shaper:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DUCKDB_PATH` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/shaper

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [shaper]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/shaper
  no_secrets_confirmation: true
