name: shaper

project:
  identity: shaper

install:
  inputs:
    commonDomain: dashboards.example.com

app:
  type: custom
  image: taleshape/shaper:latest
  ports:
    - "8080:8080"
  environment:
    DUCKDB_PATH: /data/shaper.duckdb
  volumes:
    - shaper_data:/data

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: shaper.example.com
      ssl: off
      upstream: app:8080

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

env_file: .env

volumes:
  shaper_data: {}
