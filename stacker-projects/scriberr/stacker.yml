name: scriberr
version: "1.0.0"

project:
  identity: scriberr

install:
  inputs:
    commonDomain: scriberr.example.com

app:
  type: custom
  image: ghcr.io/rishikanthc/scriberr:v1.2.0
  ports:
    - "8080:8080"
  environment:
    APP_ENV: production
    PUID: "${PUID}"
    PGID: "${PGID}"
    SECURE_COOKIES: "${SECURE_COOKIES}"
    JWT_SECRET: "${JWT_SECRET}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    HF_TOKEN: "${HF_TOKEN}"
  volumes:
    - scriberr_data:/app/data
    - scriberr_env:/app/whisperx-env
  healthcheck:
    test: "CMD curl -fs http://localhost:8080/health"
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 600s

volumes:
  scriberr_data: {}
  scriberr_env: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx42
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_ENV:
          mutability: editable
        HF_TOKEN:
          mutability: provided
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        OPENAI_API_KEY:
          mutability: provided
          display: password
        PGID:
          mutability: editable
          display: number
        PUID:
          mutability: editable
          display: number
        SECURE_COOKIES:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        scriberr_data:
          mutability: generated
        scriberr_env:
          mutability: generated

marketplace:
  publish: true
  display_name: "Scriberr"
  short_description: "AI-powered audio transcription with speaker diarization"
  long_description: |
    **Scriberr**: AI-powered audio transcription with speaker diarization

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `ghcr.io/rishikanthc/scriberr:v1.2.0` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APP_ENV`, `PGID`, `PUID`, `SECURE_COOKIES` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/scriberr

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [scriberr]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/scriberr
  no_secrets_confirmation: true
