name: dify
version: "1.0.0"
organization: null
project:
  identity: dify
app:
  type: custom
  image: langgenius/dify-web:latest
  ports:
    - "3000:80"
  environment: {}
  volumes: []
services:
  - name: api
    image: langgenius/dify-api:latest
    ports:
      - "5001:5001"
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      CONSOLE_API_URL: "https://${commonDomain}"
      APP_API_URL: "https://${commonDomain}"
    volumes:
      - api_storage:/app/api/storage
    depends_on:
      - db
      - redis
  - name: db
    image: postgres:15
    environment:
      POSTGRES_DB: dify
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - db_data:/var/lib/postgresql/data
  - name: redis
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
proxy:
  type: none
  auto_detect: false
  domains: []
deploy:
  target: cloud
  environment: null
  targets: {}
  deployment_hash: null
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    orchestrator: remote
    region: null
    size: null
    install_image: null
    server: null
    key: htz-10
  server: null
  registry: null
  default_target: null
install:
  inputs:
    commonDomain: dify.my
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: false
  healthcheck: null
  metrics: null
hooks: {}
config_contract:
  services:
    app:
      fields:
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    api:
      fields:
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
env: {}
volumes:
  api_storage: {}
  db_data: {}
  redis_data: {}

marketplace:
  display_name: "Dify"
