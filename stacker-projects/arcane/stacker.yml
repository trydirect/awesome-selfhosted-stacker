name: arcane
version: "1.0.0"

project:
  identity: arcane

install:
  inputs:
    commonDomain: arcane.try.direct

hooks:
  pre_build: ./scripts/generate-secrets.sh

app:
  type: custom
  image: ghcr.io/getarcaneapp/manager:v0.14.2
  ports:
    - "3552:3552"
  environment:
    ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
    JWT_SECRET: "${JWT_SECRET}"
    APP_URL: "https://arcane.try.direct"
    TZ: "UTC"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - arcane-data:/app/data
  healthcheck:
    test: "CMD ./arcane health --timeout 2s"
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s

volumes:
  arcane-data: {}

deploy:
  target: cloud
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: hel1
    size: cpx22
    key: htz-0
    public_ports:
      - "22"
      - "80"
      - "443"

proxy:
  type: none
  auto_detect: false
monitoring:
  status_panel: true
  healthcheck:
    endpoint: /health
    interval: 30s

config_contract:
  services:
    app:
      fields:
        ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_URL:
          mutability: editable
        TZ:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  publish: true
  display_name: "Arcane"
  short_description: "Modern web-based UI for managing Docker containers and compose stacks. Arcane gives your homelab a clean dashboard for apps, volumes and logs."
  long_description: |
    **Arcane**: Modern web-based UI for managing Docker containers and compose stacks. Arcane gives your homelab a clean dashboard for apps, volumes and logs.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3552 (public) | `ghcr.io/getarcaneapp/manager:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `APP_URL`, `TZ` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/arcane

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [arcane]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/arcane
  no_secrets_confirmation: true
