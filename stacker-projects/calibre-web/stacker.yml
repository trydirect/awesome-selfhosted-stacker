name: calibre-web

app:
  type: custom
  image: linuxserver/calibre-web:latest
  ports:
    - "8083:8083"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
  volumes:
    - calibre_config:/config
    - calibre_library:/books

volumes:
  calibre_config: {}
  calibre_library: {}

proxy:
  type: none
  auto_detect: false

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8083"

marketplace:
  publish: true
  display_name: "Calibre Web"
  short_description: "Web app for browsing, reading and downloading eBooks from a Calibre database. Serve your ebook library through a clean browser interface."
  long_description: |
    **Calibre WEB**: Web app for browsing, reading and downloading eBooks from a Calibre database. Serve your ebook library through a clean browser interface.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8083 (public) | Web UI |

    ## What you configure

    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/calibre-web

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [calibre web]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/calibre-web
  no_secrets_confirmation: true
