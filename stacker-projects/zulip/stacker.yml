name: zulip
version: "2.1.0"

project:
  identity: zulip

install:
  inputs:
    commonDomain: zulip.example.com

app:
  type: custom
  image: zulip/docker-zulip:latest
  ports:
    - "8080:80"
    - "8443:443"
  environment:
    SETTING_EXTERNAL_HOST: 91.99.5.184
    SETTING_ZULIP_ADMINISTRATOR: "admin@example.com"
    SETTING_EMAIL_HOST: smtp.example.com
    SETTING_EMAIL_HOST_USER: "${SMTP_USER}"
    SETTING_EMAIL_HOST_PASSWORD: "${SMTP_PASSWORD}"
    SETTING_EMAIL_PORT: "587"
    SETTING_EMAIL_USE_TLS: "True"
    SETTING_EMAIL_USE_SSL: "False"
    SETTING_DEFAULT_EMAIL_FORMAT: "text/html"
    SETTING_NOREPLY_EMAIL_ADDRESS: "noreply@example.com"
    SETTING_QUEUE_WORKERS: "4"
    POSTGRES_HOST: zulip_db
    POSTGRES_USER: zulip
    POSTGRES_PASSWORD: "${DB_PASSWORD}"
    POSTGRES_DB: zulip
  volumes:
    - zulip_data:/data

services:
  - name: zulip_db
    image: zulip/zulip-postgresql:latest
    environment:
      POSTGRES_DB: zulip
      POSTGRES_USER: zulip
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - zulip_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U zulip -d zulip"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  zulip_db: {}
  zulip_data: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: zulip.example.com
      ssl: off
      upstream: app:80

deploy:
  target: cloud
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"

config_contract:
  services:
    app:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SETTING_EMAIL_HOST_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SMTP_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

marketplace:
  publish: true
  display_name: "Zulip"
  short_description: "Threaded team chat designed for productive, asynchronous collaboration. Organize conversations by topic, not chronology."
  long_description: |
    **Zulip**: Threaded team chat designed for productive, asynchronous collaboration. Organize conversations by topic, not chronology.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080), 443 (public on 8443) | `zulip/docker-zulip:latest` |
    | zulip_db | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/zulip

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [zulip]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/zulip
  no_secrets_confirmation: true
