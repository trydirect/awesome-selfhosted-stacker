name: "hitkeep"
version: "1.0.0"
project:
  identity: "hitkeep"
install:
  inputs:
    commonDomain: "hitkeep.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "ghcr.io/pascalebeier/hitkeep:2.10.1"
  ports:
    - "8080:8080"
  volumes:
    - "hitkeep_data:/var/lib/hitkeep/data"
    - "hitkeep_archive:/var/lib/hitkeep/archive"
    - "hitkeep_backups:/var/lib/hitkeep/backups"
  environment:
    HITKEEP_PUBLIC_URL: "${HITKEEP_PUBLIC_URL}"
    HITKEEP_JWT_SECRET: "${HITKEEP_JWT_SECRET}"
    HITKEEP_DB_PATH: "/var/lib/hitkeep/data/hitkeep.db"
    HITKEEP_DATA_PATH: "/var/lib/hitkeep/data"
    HITKEEP_ARCHIVE_PATH: "/var/lib/hitkeep/archive"
    HITKEEP_BACKUP_PATH: "/var/lib/hitkeep/backups"
    HITKEEP_BACKUP_INTERVAL: "${HITKEEP_BACKUP_INTERVAL}"
    HITKEEP_BACKUP_RETENTION: "${HITKEEP_BACKUP_RETENTION}"
    HITKEEP_SPAM_FILTER_AUTO_UPDATE: "true"
    HITKEEP_SPAM_FILTER_UPDATE_INTERVAL: "1440"
    HITKEEP_SPAM_FILTER_PATH: "/var/lib/hitkeep/data/spam-filter.json"
    HITKEEP_MCP_ENABLED: "true"
    HITKEEP_MCP_PATH: "/mcp"
    HITKEEP_MCP_MAX_RANGE_DAYS: "${HITKEEP_MCP_MAX_RANGE_DAYS}"
    HITKEEP_AI_ENABLED: "false"
    HITKEEP_AI_PROVIDER: ""
    HITKEEP_AI_MODEL: ""
    HITKEEP_AI_BASE_URL: ""
    HITKEEP_AI_REGION: ""
    HITKEEP_AI_API_KEY: "${HITKEEP_AI_API_KEY}"
    HITKEEP_AI_REQUEST_LIMIT: "100"
    HITKEEP_AI_TOKEN_LIMIT: "100000"
    HITKEEP_AI_BUDGET_WINDOW: "1440"
    HITKEEP_GOOGLE_SEARCH_CONSOLE_CLIENT_ID: "${HITKEEP_GOOGLE_SEARCH_CONSOLE_CLIENT_ID}"
    HITKEEP_GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET: "${HITKEEP_GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET}"
    HITKEEP_GOOGLE_SEARCH_CONSOLE_REDIRECT_URL: "${HITKEEP_GOOGLE_SEARCH_CONSOLE_REDIRECT_URL}"
    HITKEEP_MAIL_HOST: "${HITKEEP_MAIL_HOST}"
    HITKEEP_MAIL_PORT: "${HITKEEP_MAIL_PORT}"
    HITKEEP_MAIL_USERNAME: "${HITKEEP_MAIL_USERNAME}"
    HITKEEP_MAIL_PASSWORD: "${HITKEEP_MAIL_PASSWORD}"
    HITKEEP_MAIL_ENCRYPTION: "tls"
    HITKEEP_MAIL_FROM_ADDRESS: "${HITKEEP_MAIL_FROM_ADDRESS}"
    HITKEEP_MAIL_FROM_NAME: "${HITKEEP_MAIL_FROM_NAME}"
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: hitkeep.example.com
      ssl: off
      upstream: app:8080
deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  hitkeep_data: {}
  hitkeep_archive: {}
  hitkeep_backups: {}

config_contract:
  services:
    app:
      fields:
        HITKEEP_AI_API_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HITKEEP_AI_BASE_URL:
          mutability: editable
        HITKEEP_AI_BUDGET_WINDOW:
          mutability: editable
        HITKEEP_AI_ENABLED:
          mutability: editable
        HITKEEP_AI_MODEL:
          mutability: editable
        HITKEEP_AI_PROVIDER:
          mutability: editable
        HITKEEP_AI_REGION:
          mutability: editable
        HITKEEP_AI_REQUEST_LIMIT:
          mutability: editable
        HITKEEP_AI_TOKEN_LIMIT:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HITKEEP_ARCHIVE_PATH:
          mutability: editable
        HITKEEP_BACKUP_INTERVAL:
          mutability: editable
        HITKEEP_BACKUP_PATH:
          mutability: editable
        HITKEEP_BACKUP_RETENTION:
          mutability: editable
        HITKEEP_DATA_PATH:
          mutability: editable
        HITKEEP_DB_PATH:
          mutability: editable
        HITKEEP_GOOGLE_SEARCH_CONSOLE_CLIENT_ID:
          mutability: editable
        HITKEEP_GOOGLE_SEARCH_CONSOLE_CLIENT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HITKEEP_GOOGLE_SEARCH_CONSOLE_REDIRECT_URL:
          mutability: editable
        HITKEEP_JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HITKEEP_MAIL_ENCRYPTION:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HITKEEP_MAIL_FROM_ADDRESS:
          mutability: editable
        HITKEEP_MAIL_FROM_NAME:
          mutability: editable
        HITKEEP_MAIL_HOST:
          mutability: editable
        HITKEEP_MAIL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HITKEEP_MAIL_PORT:
          mutability: editable
        HITKEEP_MAIL_USERNAME:
          mutability: editable
        HITKEEP_MCP_ENABLED:
          mutability: editable
        HITKEEP_MCP_MAX_RANGE_DAYS:
          mutability: editable
        HITKEEP_MCP_PATH:
          mutability: editable
        HITKEEP_PUBLIC_URL:
          mutability: editable
        HITKEEP_SPAM_FILTER_AUTO_UPDATE:
          mutability: editable
        HITKEEP_SPAM_FILTER_PATH:
          mutability: editable
        HITKEEP_SPAM_FILTER_UPDATE_INTERVAL:
          mutability: editable
      volumes:
        hitkeep_data:
          mutability: generated
        hitkeep_archive:
          mutability: generated
        hitkeep_backups:
          mutability: generated

marketplace:
  publish: true
  display_name: "Hitkeep"
  short_description: "Bookmark and knowledge organizer for keeping links you care about. Save, tag and revisit web resources in a personal library."
  long_description: |
    **Hitkeep**: Bookmark and knowledge organizer for keeping links you care about. Save, tag and revisit web resources in a personal library.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `ghcr.io/pascalebeier/hitkeep:2.10.1` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `HITKEEP_AI_BASE_URL`, `HITKEEP_AI_BUDGET_WINDOW`, `HITKEEP_AI_ENABLED`, `HITKEEP_AI_MODEL`, `HITKEEP_AI_PROVIDER`, `HITKEEP_AI_REGION` and 21 more ship prefilled and can be adjusted in the deploy form

    All 6 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/hitkeep

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [hitkeep]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/hitkeep
  no_secrets_confirmation: true
