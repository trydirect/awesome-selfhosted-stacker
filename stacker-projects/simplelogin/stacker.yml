name: simplelogin

project:
  identity: simplelogin

install:
  inputs:
    commonDomain: mail.example.com

app:
  type: custom
  image: simplelogin/app:latest
  ports:
    - "8080:80"
  environment:
    APP_SECRET_KEY: "${SECRET_KEY}"
    URL: "http://mail.example.com"
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: simplelogin
    DB_USER: simplelogin
    DB_PASSWORD: "${DB_PASSWORD}"
    EMAIL_SERVER_HOST: "${SMTP_HOST}"
    EMAIL_SERVER_PORT: "${SMTP_PORT}"
    EMAIL_SERVER_USERNAME: "${SMTP_USER}"
    EMAIL_SERVER_PASSWORD: "${SMTP_PASSWORD}"
    EMAIL_DOMAIN: "${EMAIL_DOMAIN}"
    SUPPORT_EMAIL: "support@${EMAIL_DOMAIN}"
    EMAIL_SERVERS_WITH_PRIORITY: "{'10': 'smtp.example.com'}"
  command: >-
    sh -c "flask db upgrade && flask run --host=0.0.0.0 --port=80"
  volumes:
    - simplelogin_data:/data

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: simplelogin
      POSTGRES_USER: simplelogin
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U simplelogin"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: mail.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        EMAIL_DOMAIN:
          mutability: editable
        EMAIL_SERVERS_WITH_PRIORITY:
          mutability: editable
        EMAIL_SERVER_HOST:
          mutability: editable
        EMAIL_SERVER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        EMAIL_SERVER_PORT:
          mutability: editable
          display: number
        EMAIL_SERVER_USERNAME:
          mutability: editable
        SUPPORT_EMAIL:
          mutability: editable
          display: number
        URL:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  simplelogin_data: {}
  postgres_data: {}
