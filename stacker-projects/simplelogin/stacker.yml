name: simplelogin

project:
  identity: simplelogin

install:
  inputs:
    commonDomain: mail.example.com

app:
  type: custom
  image: simplelogin/app:3.4.0
  ports:
    - "8080:80"
  environment:
    APP_SECRET_KEY: "${SECRET_KEY}"
    URL: "http://mail.example.com"
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: simplelogin
    DB_USER: simplelogin
    DB_PASSWORD: "${DB_PASSWORD}"
    EMAIL_SERVER_HOST: "${SMTP_HOST}"
    EMAIL_SERVER_PORT: "${SMTP_PORT}"
    EMAIL_SERVER_USERNAME: "${SMTP_USER}"
    EMAIL_SERVER_PASSWORD: "${SMTP_PASSWORD}"
    EMAIL_DOMAIN: "${EMAIL_DOMAIN}"
    SUPPORT_EMAIL: "support@${EMAIL_DOMAIN}"
    EMAIL_SERVERS_WITH_PRIORITY: "{'10': 'smtp.example.com'}"
  command: >-
    sh -c "flask db upgrade && flask run --host=0.0.0.0 --port=80"
  volumes:
    - simplelogin_data:/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: simplelogin
      POSTGRES_USER: simplelogin
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U simplelogin"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: mail.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        EMAIL_SERVER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        EMAIL_DOMAIN:
          mutability: editable
        EMAIL_SERVERS_WITH_PRIORITY:
          mutability: editable
        EMAIL_SERVER_HOST:
          mutability: editable
        EMAIL_SERVER_PORT:
          mutability: editable
          display: number
        EMAIL_SERVER_USERNAME:
          mutability: editable
        SUPPORT_EMAIL:
          mutability: editable
          display: number
        URL:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  simplelogin_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Simplelogin"
  short_description: "Email aliasing service that hides your real inbox (Firefox Relay alternative). Receive and reply through disposable addresses."
  long_description: |
    **Simplelogin**: Email aliasing service that hides your real inbox (Firefox Relay alternative). Receive and reply through disposable addresses.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `simplelogin/app:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DB_HOST`, `DB_NAME`, `DB_PORT`, `DB_USER`, `EMAIL_DOMAIN`, `EMAIL_SERVERS_WITH_PRIORITY` and 7 more ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/simplelogin

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [simplelogin]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/simplelogin
  no_secrets_confirmation: true
