name: olivetin

project:
  identity: olivetin

install:
  inputs:
    commonDomain: olivetin.example.com

app:
  type: custom
  image: jamesread/olivetin:3000.21.0
  ports:
    - "1337:1337"
  volumes:
    - olivetin_config:/config

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "1337"

monitoring:
  status_panel: true

env_file: .env

volumes:
  olivetin_config: {}

config_contract:
  services:
    app:
      volumes:
        olivetin_config:
          mutability: generated

marketplace:
  publish: true
  display_name: "Olivetin"
  short_description: "Web UI for running pre-configured shell commands safely. Give your team one-click buttons for common server actions."
  long_description: |
    **Olivetin**: Web UI for running pre-configured shell commands safely. Give your team one-click buttons for common server actions.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 1337 (public) | `jamesread/olivetin:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/olivetin

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [olivetin]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/olivetin
  no_secrets_confirmation: true
