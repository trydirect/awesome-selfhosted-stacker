name: linkding
version: "1.27.0"

project:
  identity: linkding

install:
  inputs:
    commonDomain: bookmarks.example.com

app:
  type: python
  image: sissbruecker/linkding:1.27.0
  ports:
    - "9090:9090"
  environment:
    DJANGO_SUPERUSER_USERNAME: admin
    DJANGO_SUPERUSER_PASSWORD: "${ADMIN_PASSWORD}"
    DJANGO_SUPERUSER_EMAIL: "admin@example.com"
    LD_DISABLE_URL_VALIDATION: "false"
    LD_ENABLE_AUTH_PROXY: "false"
  volumes:
    - linkding_data:/etc/linkding/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ~/.config/stacker/ssh/server-450_ed25519
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "9090"

config_contract:
  services:
    app:
      fields:
        DJANGO_SUPERUSER_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  linkding_data: {}

marketplace:
  publish: true
  display_name: "Linkding"
  short_description: "Self-hosted bookmark manager with tags, full-text search and browser extensions. A minimal, fast link archive you own."
  long_description: |
    **Linkding**: Self-hosted bookmark manager with tags, full-text search and browser extensions. A minimal, fast link archive you own.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 9090 (public) | `sissbruecker/linkding:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/linkding

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [linkding]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/linkding
  no_secrets_confirmation: true
