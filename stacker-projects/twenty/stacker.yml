name: twenty

app:
  type: custom
  image: twentycrm/twenty:latest
  ports:
    - "3000:3000/tcp"
  environment:
    NODE_PORT: "3000"
    PG_DATABASE_URL: postgres://twenty:${DB_PASSWORD}@db:5432/twenty
    SERVER_URL: http://localhost:3000
    REDIS_URL: redis://redis:6379
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  volumes:
    - twenty_data:/app/packages/twenty-server/.local-storage
  depends_on:
    - db
    - redis
  healthcheck:
    test: "CMD curl -fs http://localhost:3000/health"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 120s

services:
  - name: db
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - twenty_db:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U twenty -d twenty"
      interval: 10s
      timeout: 5s
      retries: 6
  - name: redis
    image: redis:7.4-alpine
    command: redis-server --maxmemory-policy noeviction
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  twenty_data: {}
  twenty_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NODE_PORT:
          mutability: editable
          display: number
        PG_DATABASE_URL:
          mutability: editable
        REDIS_URL:
          mutability: editable
        SERVER_URL:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
    db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        twenty_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Twenty"
  short_description: "Modern open-source CRM with customizable views, workflows, and integrations"
  long_description: |
    **twenty**: Modern open-source CRM with customizable views, workflows, and integrations

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000/tcp (public on 3000) | `twentycrm/twenty:latest` |
    | db | internal | Database |
    | redis | internal | Cache |

    ## What you configure

    - **Defaults provided**: `NODE_PORT`, `PG_DATABASE_URL`, `REDIS_URL`, `SERVER_URL`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/twenty

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [twenty app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/twenty
  no_secrets_confirmation: true
