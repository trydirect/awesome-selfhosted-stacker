name: lidarr

project:
  identity: lidarr

install:
  inputs:
    commonDomain: music.example.com

app:
  type: custom
  image: linuxserver/lidarr:latest
  ports:
    - "8686:8686"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Etc/UTC
  volumes:
    - lidarr_config:/config
    - lidarr_music:/music
    - lidarr_downloads:/downloads

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8686"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  lidarr_config: {}
  lidarr_music: {}
  lidarr_downloads: {}

marketplace:
  publish: true
  display_name: "Lidarr"
  short_description: "Music collection manager for Usenet and BitTorrent, the “sonarr for albums”. Organize, upgrade and keep your library complete."
  long_description: |
    **Lidarr**: Music collection manager for Usenet and BitTorrent, the “sonarr for albums”. Organize, upgrade and keep your library complete.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8686 (public) | API server |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/lidarr

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [lidarr]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/lidarr
  no_secrets_confirmation: true
