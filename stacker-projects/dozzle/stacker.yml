name: dozzle

project:
  identity: dozzle

app:
  type: custom
  image: amir20/dozzle:v8.14.12
  ports:
    - "8080:8080"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - dozzle_data:/data

volumes:
  dozzle_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields: {}
      volumes:
        dozzle_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Dozzle"
  short_description: "Real-time Docker log viewer in the browser, lightweight and read-only"
  long_description: |
    **Dozzle**: Real-time Docker log viewer in the browser, lightweight and read-only

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `amir20/dozzle:v8.14.12` — live container log dashboard |

    ## What you configure

    - Dozzle watches every container on the host through a read-only
      Docker socket mount; filter and search logs from the web UI

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/dozzle

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [dozzle]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/dozzle
  no_secrets_confirmation: true
