name: langchain-chatchat
version: "1.0.0"

project:
  identity: langchain-chatchat

install:
  inputs:
    commonDomain: langchain-chatchat.example.com

app:
  type: custom
  image: chatimage/chatchat:0.3.1.3-93e2c87-20240829
  ports:
    - "8501:8501"
    - "7861:7861"
  environment:
    CHATCHAT_ROOT: "/root/chatchat_data"
  volumes:
    - chatchat_data:/root/chatchat_data
  depends_on:
    - xinference
  healthcheck:
    test: "CMD curl -fs http://localhost:8501/_stcore/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s

services:
  - name: xinference
    image: xprobe/xinference:v0.12.3-cpu
    command: "xinference-local -H 0.0.0.0"
    volumes:
      - xinference_data:/root/.xinference
    healthcheck:
      test: "CMD curl -fs http://localhost:9997/status"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  chatchat_data: {}
  xinference_data: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx42
    public_ports:
      - "8501"
      - "7861"

monitoring:
  status_panel: true

marketplace:
  publish: true
  display_name: "Langchain Chatchat"
  short_description: "Local LLM chat with RAG, knowledge bases, and agent tools"
  long_description: |
    **Langchain Chatchat**: Local LLM chat with RAG, knowledge bases, and agent tools

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8501 (public), 7861 (public) | `chatimage/chatchat:0.3.1.3-93e2c87-20240829` |
    | xinference | internal | `xprobe/xinference:v0.12.3-cpu` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/langchain-chatchat

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [langchain chatchat]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/langchain-chatchat
  no_secrets_confirmation: true
