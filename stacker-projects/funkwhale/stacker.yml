name: funkwhale

project:
  identity: funkwhale

install:
  inputs:
    commonDomain: music.example.com

app:
  type: custom
  image: funkwhale/all-in-one:1.2.10
  ports:
    - "5001:5000"
  environment:
    FUNKWHALE_HOSTNAME: localhost:5000
    DJANGO_SECRET_KEY: "${SECRET_KEY}"
    DATABASE_URL: "postgres://funkwhale:${DB_PASSWORD}@postgres:5432/funkwhale"
    CACHE_URL: "redis://redis:6379/0"
    MEDIA_ROOT: /srv/funkwhale/data/media
    MUSIC_DIRECTORY_PATH: /srv/funkwhale/data/music
  command: >-
    sh -c "python manage.py migrate && python manage.py collectstatic --no-input && daphne -b 0.0.0.0 -p 5000 config.asgi:application"
  volumes:
    - funkwhale_data:/srv/funkwhale/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: funkwhale
      POSTGRES_USER: funkwhale
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U funkwhale"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "5000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DJANGO_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CACHE_URL:
          mutability: editable
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        FUNKWHALE_HOSTNAME:
          mutability: editable
        MEDIA_ROOT:
          mutability: editable
        MUSIC_DIRECTORY_PATH:
          mutability: editable
        command:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  funkwhale_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Funkwhale"
  short_description: "Federated music streaming platform, a self-hosted SoundCloud with ActivityPub. Upload, share and discover music across instances."
  long_description: |
    **Funkwhale**: Federated music streaming platform, a self-hosted SoundCloud with ActivityPub. Upload, share and discover music across instances.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 5000 (public on 5001) | `funkwhale/all-in-one:latest` |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `CACHE_URL`, `FUNKWHALE_HOSTNAME`, `MEDIA_ROOT`, `MUSIC_DIRECTORY_PATH`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/funkwhale

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [funkwhale]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/funkwhale
  no_secrets_confirmation: true
