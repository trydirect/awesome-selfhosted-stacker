name: pingvin-share
version: "1.4.0"

project:
  identity: pingvin-share

install:
  inputs:
    commonDomain: share.example.com

app:
  type: custom
  image: stonith404/pingvin-share:latest
  ports:
    - "3000:3000"
  environment:
    TRUST_PROXY: "false"
  volumes:
    - pingvin_data:/opt/app/backend/data
    - pingvin_uploads:/opt/app/frontend/public/uploads

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        TRUST_PROXY:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  pingvin_data: {}
  pingvin_uploads: {}

marketplace:
  publish: true
  display_name: "Pingvin Share"
  short_description: "Self-hosted file sharing platform (WeTransfer alternative) with teams and links. Upload once, share anywhere."
  long_description: |
    **Pingvin Share**: Self-hosted file sharing platform (WeTransfer alternative) with teams and links. Upload once, share anywhere.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `stonith404/pingvin-share:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `TRUST_PROXY` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/pingvin-share

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [pingvin share]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/pingvin-share
  no_secrets_confirmation: true
