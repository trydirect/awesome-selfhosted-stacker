name: pingvin-share
version: "1.4.0"

project:
  identity: pingvin-share

install:
  inputs:
    commonDomain: share.example.com

app:
  type: custom
  image: stonith404/pingvin-share:latest
  ports:
    - "3000:3000"
  environment:
    TRUST_PROXY: "false"
  volumes:
    - pingvin_data:/opt/app/backend/data
    - pingvin_uploads:/opt/app/frontend/public/uploads

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: 46.224.127.228
    user: root
    ssh_key: /Users/vasilipascal/work/stacker-project-examples/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

monitoring:
  status_panel: true

env_file: .env

volumes:
  pingvin_data: {}
  pingvin_uploads: {}
