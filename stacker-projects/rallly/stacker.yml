name: rallly

project:
  identity: rallly

install:
  inputs:
    commonDomain: rallly.try.direct

app:
  type: custom
  image: lukevella/rallly:latest
  ports:
    - "3000:3000"
  environment:
    DATABASE_URL: postgresql://rallly:${DB_PASSWORD}@rallly-db:5432/rallly
    SECRET_PASSWORD: ${SECRET_PASSWORD}
    SUPPORT_EMAIL: admin@example.com
    NEXT_PUBLIC_BASE_URL: http://rallly.example.com

services:
  - name: rallly-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rallly
      POSTGRES_USER: rallly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - rallly_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d rallly -U rallly
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rallly_db: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: rallly.example.com
      ssl: off
      upstream: app:3000

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NEXT_PUBLIC_BASE_URL:
          mutability: editable
        SECRET_PASSWORD:
          mutability: generated
          type: alphanumeric
        SUPPORT_EMAIL:
          mutability: editable
          length: 32
          display: password
    rallly-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"
      - "443"
      - "3000"

marketplace:
  publish: true
  display_name: "Rallly"
  short_description: "Open-source scheduling polls (Calendly alternative) where participants vote on times. Find the best slot for a group quickly."
  long_description: |
    **Rallly**: Open-source scheduling polls (Calendly alternative) where participants vote on times. Find the best slot for a group quickly.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `lukevella/rallly:latest` |
    | rallly-db | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `NEXT_PUBLIC_BASE_URL`, `SUPPORT_EMAIL`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/rallly

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [rallly]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/rallly
  no_secrets_confirmation: true
