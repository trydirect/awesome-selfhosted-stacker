name: node-red

project:
  identity: node-red

install:
  inputs:
    commonDomain: nodered.example.com

app:
  type: custom
  image: nodered/node-red:4.1.17-18-minimal
  ports:
    - "1880:1880"
  environment:
    NODE_RED_CREDENTIAL_SECRET: "${CREDENTIAL_SECRET}"
  volumes:
    - nodered_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "1880"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        NODE_RED_CREDENTIAL_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
env_file: .env

volumes:
  nodered_data: {}

marketplace:
  publish: true
  display_name: "Node Red"
  short_description: "Flow-based programming for wiring together hardware, APIs and services. Visual IoT and home automation flows with a huge node library."
  long_description: |
    **Node-RED**: Flow-based programming for wiring together hardware, APIs and services. Visual IoT and home automation flows with a huge node library.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 1880 (public) | `nodered/node-red:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/node-red

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [node red]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/node-red
  no_secrets_confirmation: true
