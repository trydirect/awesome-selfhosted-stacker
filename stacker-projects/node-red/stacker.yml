name: node-red

project:
  identity: node-red

install:
  inputs:
    commonDomain: nodered.example.com

app:
  type: custom
  image: nodered/node-red:latest
  ports:
    - "1880:1880"
  environment:
    NODE_RED_CREDENTIAL_SECRET: "${CREDENTIAL_SECRET}"
  volumes:
    - nodered_data:/data

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "1880"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  nodered_data: {}
