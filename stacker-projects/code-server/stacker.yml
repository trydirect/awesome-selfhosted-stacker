name: code-server
version: 4.90.4
app:
  type: custom
  image: lscr.io/linuxserver/code-server:4.96.1
  ports:
  - "8443:8443"
  environment:
    PUID: '1000'
    PGID: '1000'
    TZ: Etc/UTC
    PASSWORD: ${CODE_SERVER_PASSWORD}
    SUDO_PASSWORD: ${CODE_SERVER_SUDO_PASSWORD}
    DEFAULT_WORKSPACE: /config/workspace
  volumes:
  - code-server-config:/config
env_file: .env
install:
  inputs:
    domain: code.try.direct
    code-server-password: ""
    code-server-sudo-password: ""

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: /Users/vasilipascal/work/stacker-project-examples/stacker-project-test
    port: 22

config_contract:
  services:
    app:
      fields:
        PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SUDO_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DEFAULT_WORKSPACE:
          mutability: editable
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable

marketplace:
  display_name: "Code Server"
