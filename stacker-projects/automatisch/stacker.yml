name: automatisch

project:
  identity: automatisch

install:
  inputs:
    commonDomain: automatisch.try.direct

app:
  type: custom
  image: trydirect/automatisch:latest
  ports:
    - "3000:3000"
  environment:
    APP_SECRET_KEY: ${APP_SECRET_KEY}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
    REDIS_HOST: redis
    POSTGRES_HOST: automatisch-db
    POSTGRES_PORT: "5432"
    POSTGRES_DATABASE: automatisch
    POSTGRES_USERNAME: automatisch
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    WEB_APP_URL: http://localhost:3000

services:
  - name: automatisch-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automatisch
      POSTGRES_USER: automatisch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - automatisch_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d automatisch -U automatisch
      interval: 10s
      timeout: 5s
      retries: 10

  - name: redis
    image: redis:7-alpine
    healthcheck:
      test: CMD redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  automatisch_db: {}

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: automatisch.example.com
      ssl: off
      upstream: app:3000

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        APP_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENCRYPTION_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_DATABASE:
          mutability: editable
        POSTGRES_HOST:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_PORT:
          mutability: editable
          display: number
        POSTGRES_USERNAME:
          mutability: editable
        REDIS_HOST:
          mutability: editable
        WEBHOOK_SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        WEB_APP_URL:
          mutability: editable
    automatisch-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"

marketplace:
  publish: true
  display_name: "Automatisch"
  short_description: "Open-source workflow automation platform (Zapier alternative) that keeps data on your server. Connect apps and automate repetitive tasks visually."
  long_description: |
    **Automatisch**: Open-source workflow automation platform (Zapier alternative) that keeps data on your server. Connect apps and automate repetitive tasks visually.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | `trydirect/automatisch:latest` |
    | automatisch-db | internal | Database |
    | redis | internal | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `POSTGRES_DATABASE`, `POSTGRES_HOST`, `POSTGRES_PORT`, `POSTGRES_USERNAME`, `REDIS_HOST`, `WEB_APP_URL` and 2 more ship prefilled and can be adjusted in the deploy form

    All 5 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/automatisch

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [automatisch]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/automatisch
  no_secrets_confirmation: true
