name: standard-notes

project:
  identity: standard-notes

install:
  inputs:
    commonDomain: notes.example.com

app:
  type: custom
  image: standardnotes/server:3.193.0
  ports:
    - "3000:3000"
    - "3001:3001"
    - "3002:3002"
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: standardnotes
    DB_USERNAME: standardnotes
    DB_PASSWORD: "${DB_PASSWORD}"
    JWT_SECRET: "${JWT_SECRET}"
    ENCRYPTION_SERVER_KEY: "${ENCRYPTION_KEY}"
    REDIS_URL: "redis://redis:6379"
  volumes:
    - standardnotes_data:/var/lib/postgresql/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: standardnotes
      POSTGRES_USER: standardnotes
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U standardnotes"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: redis
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: cache
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: "CMD redis-cli ping"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ENCRYPTION_SERVER_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_SECRET:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_DATABASE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USERNAME:
          mutability: editable
        REDIS_URL:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  standardnotes_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Standard Notes"
  short_description: "End-to-end encrypted notes app with editors and extensions. Your private, lasting journal with desktop and mobile clients."
  long_description: |
    **Standard Notes**: End-to-end encrypted notes app with editors and extensions. Your private, lasting journal with desktop and mobile clients.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public), 3001 (public), 3002 (public) | API server |
    | postgres | 5432 (local only) | Database |
    | redis | 6379 (local only) | Cache |
    | cache | 6379 (local only) | Cache |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `DB_DATABASE`, `DB_HOST`, `DB_PORT`, `DB_USERNAME`, `REDIS_URL`, `POSTGRES_DB` and 1 more ship prefilled and can be adjusted in the deploy form

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/standard-notes

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [standard notes]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/standard-notes
  no_secrets_confirmation: true
