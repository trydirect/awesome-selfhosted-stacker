name: plausible
version: 1.1.0
organization: null
project:
  identity: plausible
app:
  type: custom
  path: .
  dockerfile: null
  image: ghcr.io/plausible/community-edition:v3.2.1
  build: null
  ports: []
  volumes: []
  environment:
    CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible
    TOTP_VAULT_KEY: ${TOTP_VAULT_KEY}
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    DATABASE_URL: postgres://postgres:${DB_PASSWORD}@plausible_db:5432/plausible
    BASE_URL: ${BASE_URL}
    DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
  command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
  healthcheck: null
services:
- name: plausible_db
  image: postgres:16.4-alpine
  ports: []
  environment:
    POSTGRES_PASSWORD: ${DB_PASSWORD}
    POSTGRES_DB: plausible
  volumes:
  - db_data:/var/lib/postgresql/data
  depends_on: []
  command: null
  healthcheck:
    test: CMD-SHELL pg_isready -U postgres -d plausible
    interval: 10s
    timeout: 5s
    retries: 10
- name: plausible_events_db
  image: clickhouse/clickhouse-server:24.12-alpine
  ports: []
  environment:
    CLICKHOUSE_SKIP_USER_SETUP: '1'
  volumes:
  - event_data:/var/lib/clickhouse
  - event_logs:/var/log/clickhouse-server
  depends_on: []
  command: null
  healthcheck:
    test: CMD-SHELL wget -qO- http://127.0.0.1:8123/ping || exit 1
    interval: 10s
    timeout: 5s
    retries: 10
proxy:
  type: none
  auto_detect: false
  domains: []
  config: null
deploy:
  target: server
  environment: null
  compose_file: docker/production/compose.yml
  deployment_hash: null
  cloud:
    provider: hetzner
    orchestrator: remote
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    install_image: null
    remote_payload_file: null
    ssh_key: null
    key: null
    server: null
    public_ports:
    - 8000/tcp
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
    port: 22
  registry: null
  default_target: null
  targets: {}
install:
  inputs:
    commonDomain: plausible.example.com
environments: {}
ai:
  enabled: false
  provider: openai
  model: null
  api_key: null
  endpoint: null
  timeout: 0
  tasks: []
monitoring:
  status_panel: true
  healthcheck: null
  metrics: null
hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: null
  on_failure: null
env_file: .env
env: {}
config_contract:
  services:
    app:
      fields:
        SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    plausible_db:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    plausible:
      required:
      - BASE_URL
      - DATABASE_URL
      - CLICKHOUSE_DATABASE_URL
      fields:
        SECRET_KEY_BASE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        TOTP_VAULT_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
    plausible_db:
      required:
      - POSTGRES_DB
      secret:
      - POSTGRES_PASSWORD

marketplace:
  publish: true
  display_name: "Plausible"
  short_description: "Deploy the official Plausible stack with one click: Plausible web, PostgreSQL event storage, and migration-ready event DB all configured for private analytics."
  long_description: |
    **Plausible**: Deploy the official Plausible stack with one click: Plausible web, PostgreSQL event storage, and migration-ready event DB all configured for private analytics.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    3 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | internal | `ghcr.io/plausible/community-edition:v3.2.1` |
    | plausible_db | internal | Database |
    | plausible_events_db | internal | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 3 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/plausible

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [plausible]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/plausible
  no_secrets_confirmation: true
