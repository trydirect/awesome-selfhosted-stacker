name: dittofeed

project:
  identity: dittofeed

install:
  inputs:
    commonDomain: dittofeed.example.com

app:
  type: custom
  image: dittofeed/dittofeed-lite:latest
  ports:
    - "3000:3000"
    - "3001:3001"
  environment:
    DATABASE_URL: "postgres://dittofeed:${DB_PASSWORD}@postgres:5432/dittofeed"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_USER: dittofeed
    CLICKHOUSE_PASSWORD: ${DB_PASSWORD}
    KAFKA_BROKERS: kafka:9092
    NODE_ENV: production
  volumes:
    - dittofeed_data:/data

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dittofeed
      POSTGRES_USER: dittofeed
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U dittofeed"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: clickhouse
    image: clickhouse/clickhouse-server:latest
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: "CMD wget -q --spider http://localhost:8123/ping"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: kafka
    image: apache/kafka:latest
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: "CMD kafka-topics.sh --bootstrap-server localhost:9092 --list"
      interval: 15s
      timeout: 10s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: dittofeed.example.com
      ssl: off
      upstream: app:3000

deploy:
  target: cloud
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx32
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"
      - "3001"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  dittofeed_data: {}
  postgres_data: {}
  clickhouse_data: {}
  kafka_data: {}
