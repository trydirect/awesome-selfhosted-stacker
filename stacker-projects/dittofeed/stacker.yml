name: dittofeed

project:
  identity: dittofeed

install:
  inputs:
    commonDomain: dittofeed.example.com

app:
  type: custom
  image: dittofeed/dittofeed-lite:v0.23.0
  ports:
    - "3000:3000"
    - "3001:3001"
  environment:
    DATABASE_URL: "postgres://dittofeed:${DB_PASSWORD}@postgres:5432/dittofeed"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_USER: dittofeed
    CLICKHOUSE_PASSWORD: ${DB_PASSWORD}
    KAFKA_BROKERS: kafka:9092
    NODE_ENV: production
  volumes:
    - dittofeed_data:/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: dittofeed
      POSTGRES_USER: dittofeed
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U dittofeed"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: clickhouse
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: "CMD wget -q --spider http://localhost:8123/ping"
      interval: 10s
      timeout: 5s
      retries: 5

  - name: kafka
    image: apache/kafka:3.8.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: "CMD kafka-topics.sh --bootstrap-server localhost:9092 --list"
      interval: 15s
      timeout: 10s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: dittofeed.example.com
      ssl: off
      upstream: app:3000

deploy:
  target: cloud
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx32
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "3000"
      - "3001"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        CLICKHOUSE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        CLICKHOUSE_HOST:
          mutability: editable
        CLICKHOUSE_USER:
          mutability: editable
        DATABASE_URL:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        KAFKA_BROKERS:
          mutability: editable
        NODE_ENV:
          mutability: editable
        volumes:
          mutability: editable
    kafka:
      fields:
        CLUSTER_ID:
          mutability: editable
        KAFKA_ADVERTISED_LISTENERS:
          mutability: editable
        KAFKA_CONTROLLER_LISTENER_NAMES:
          mutability: editable
        KAFKA_CONTROLLER_QUORUM_VOTERS:
          mutability: editable
        KAFKA_LISTENERS:
          mutability: editable
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:
          mutability: editable
        KAFKA_NODE_ID:
          mutability: editable
        KAFKA_PROCESS_ROLES:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  dittofeed_data: {}
  postgres_data: {}
  clickhouse_data: {}
  kafka_data: {}

marketplace:
  publish: true
  display_name: "Dittofeed"
  short_description: "Open-source customer engagement and lifecycle messaging platform. Design email and SMS journeys with segmentation and analytics."
  long_description: |
    **Dittofeed**: Open-source customer engagement and lifecycle messaging platform. Design email and SMS journeys with segmentation and analytics.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    4 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public), 3001 (public) | `dittofeed/dittofeed-lite:latest` |
    | postgres | 5432 (local only) | Database |
    | clickhouse | 8123 (local only), 9000 (local only) | Database |
    | kafka | 9092 (local only) | Message queue |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `CLICKHOUSE_HOST`, `CLICKHOUSE_USER`, `KAFKA_BROKERS`, `NODE_ENV`, `CLUSTER_ID`, `KAFKA_ADVERTISED_LISTENERS` and 8 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 4 containers (4 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/dittofeed

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [dittofeed]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/dittofeed
  no_secrets_confirmation: true
