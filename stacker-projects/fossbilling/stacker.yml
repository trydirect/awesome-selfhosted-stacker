name: fossbilling

app:
  type: custom
  image: fossbilling/fossbilling:0.8.9
  ports:
    - "8083:80/tcp"
  environment:
    APP_URL: http://localhost:8083
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: fossbilling
    DB_USER: fossbilling
    DB_PASSWORD: ${DB_PASSWORD}
  volumes:
    - fossbilling_data:/data
  healthcheck:
    test: "CMD curl -fs http://localhost/health"
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  - name: db
    image: mariadb:11.8.8
    environment:
      MARIADB_DATABASE: fossbilling
      MARIADB_USER: fossbilling
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - fossbilling_db:/var/lib/mysql
    healthcheck:
      test: "CMD healthcheck.sh --connect --innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fossbilling_data: {}
  fossbilling_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8083"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        APP_URL:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
    db:
      fields:
        MARIADB_DATABASE:
          mutability: editable
        MARIADB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MARIADB_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        fossbilling_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Fossbilling App"
  short_description: "Self-hosted fossbilling"
  long_description: |
    **fossbilling**: Self-hosted fossbilling

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80/tcp (public on 8083) | `fossbilling/fossbilling:latest` |
    | db | internal | Database |

    ## What you configure

    - **Defaults provided**: `APP_URL`, `DB_HOST`, `DB_NAME`, `DB_PORT`, `DB_USER`, `MARIADB_DATABASE` and 1 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/fossbilling

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [fossbilling app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/fossbilling
  no_secrets_confirmation: true
