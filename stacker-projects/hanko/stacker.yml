name: hanko

app:
  type: custom
  image: ghcr.io/teamhanko/hanko:latest
  ports:
    - "8002:8000"
  volumes:
    - ./config.yaml:/etc/config.yaml:ro
  environment:
    HANKO_DATABASE_HOST: hanko-db
    HANKO_DATABASE_PORT: "5432"
    HANKO_DATABASE_USER: hanko
    HANKO_DATABASE_PASSWORD: ${DB_PASSWORD}
    HANKO_DATABASE_NAME: hanko
    HANKO_SECRETS_DEFAULT: ${SECRETS_DEFAULT}
    HANKO_SERVER_PUBLIC_PORT: "8000"
    HANKO_URL: http://localhost:8000
  command: serve public --config /etc/config.yaml

services:
  - name: hanko-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hanko
      POSTGRES_USER: hanko
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hanko_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d hanko -U hanko
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hanko_db: {}

proxy:
  type: none
  auto_detect: false

hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: ./scripts/migrate.sh

config_contract:
  services:
    app:
      fields:
        HANKO_DATABASE_HOST:
          mutability: editable
        HANKO_DATABASE_NAME:
          mutability: editable
        HANKO_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HANKO_DATABASE_PORT:
          mutability: editable
          display: number
        HANKO_DATABASE_USER:
          mutability: editable
        HANKO_SECRETS_DEFAULT:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HANKO_SERVER_PUBLIC_PORT:
          mutability: editable
          display: number
        HANKO_URL:
          mutability: editable
        command:
          mutability: editable
    hanko-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8002"

marketplace:
  publish: true
  display_name: "Hanko"
  short_description: "Open-source passwordless authentication with passkeys and WebAuthn. Add modern login to any app with Hanko's drop-in components."
  long_description: |
    **Hanko**: Open-source passwordless authentication with passkeys and WebAuthn. Add modern login to any app with Hanko's drop-in components.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public on 8002) | `ghcr.io/teamhanko/hanko:latest` |
    | hanko-db | internal | Database |

    ## What you configure

    - **Defaults provided**: `HANKO_DATABASE_HOST`, `HANKO_DATABASE_NAME`, `HANKO_DATABASE_PORT`, `HANKO_DATABASE_USER`, `HANKO_SERVER_PUBLIC_PORT`, `HANKO_URL` and 2 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/hanko

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [hanko]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/hanko
  no_secrets_confirmation: true
