name: hanko

app:
  type: custom
  image: ghcr.io/teamhanko/hanko:latest
  ports:
    - "8002:8000"
  volumes:
    - ./config.yaml:/etc/config.yaml:ro
  environment:
    HANKO_DATABASE_HOST: hanko-db
    HANKO_DATABASE_PORT: "5432"
    HANKO_DATABASE_USER: hanko
    HANKO_DATABASE_PASSWORD: ${DB_PASSWORD}
    HANKO_DATABASE_NAME: hanko
    HANKO_SECRETS_DEFAULT: ${SECRETS_DEFAULT}
    HANKO_SERVER_PUBLIC_PORT: "8000"
    HANKO_URL: http://localhost:8000
  command: serve public --config /etc/config.yaml

services:
  - name: hanko-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hanko
      POSTGRES_USER: hanko
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hanko_db:/var/lib/postgresql/data
    healthcheck:
      test: CMD-SHELL pg_isready -d hanko -U hanko
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  hanko_db: {}

proxy:
  type: none
  auto_detect: false

hooks:
  pre_build: ./scripts/generate-secrets.sh
  post_deploy: ./scripts/migrate.sh

config_contract:
  services:
    app:
      fields:
        HANKO_DATABASE_HOST:
          mutability: editable
        HANKO_DATABASE_NAME:
          mutability: editable
        HANKO_DATABASE_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HANKO_DATABASE_PORT:
          mutability: editable
          display: number
        HANKO_DATABASE_USER:
          mutability: editable
        HANKO_SECRETS_DEFAULT:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        HANKO_SERVER_PUBLIC_PORT:
          mutability: editable
          display: number
        HANKO_URL:
          mutability: editable
        command:
          mutability: editable
    hanko-db:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: cloud
  server: null
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8002"
