name: astrbot
version: "1.0.0"

project:
  identity: astrbot

app:
  type: custom
  image: soulter/astrbot:latest
  ports:
    - "6185:6185"
    - "6199:6199"
  environment:
    TZ: Asia/Shanghai
  volumes:
    - astrbot_data:/AstrBot/data

volumes:
  astrbot_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: cloud
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    public_ports:
      - "6185"
      - "6199"

monitoring:
  status_panel: true

env_file: .env
