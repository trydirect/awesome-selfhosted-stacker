name: astrbot
version: "1.0.0"

project:
  identity: astrbot

app:
  type: custom
  image: soulter/astrbot:v3.5.5
  ports:
    - "6185:6185"
    - "6199:6199"
  environment:
    TZ: Asia/Shanghai
  volumes:
    - astrbot_data:/AstrBot/data

volumes:
  astrbot_data: {}

proxy:
  type: none
  auto_detect: false

deploy:
  target: cloud
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: ${HETZNER_REGION}
    size: ${HETZNER_SERVER_TYPE}
    public_ports:
      - "6185"
      - "6199"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

marketplace:
  display_name: "Astrbot"
  short_description: "Self-hosted Astrbot application, ready to deploy with Stacker"

  long_description: |
    ## Astrbot
    
    A self-hosted Astrbot stack, ready to deploy with Stacker.
    
    ### Docker images
    
    - `soulter/astrbot:v3.5.5`
    
    ### Quick start
    
    ```bash
    stacker install AstrBot
    ```
    
    ### Configuration
    
    Secrets and passwords are auto-generated on first deploy. Customize via `stacker.yml` or environment variables.