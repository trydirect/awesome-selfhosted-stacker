name: semaphore
version: "2.10.0"

project:
  identity: semaphore

install:
  inputs:
    commonDomain: ansible.example.com

app:
  type: custom
  image: semaphoreui/semaphore:latest
  ports:
    - "3000:3000"
  environment:
    SEMAPHORE_DB_USER: semaphore
    SEMAPHORE_DB_PASS: "${DB_PASSWORD}"
    SEMAPHORE_DB_HOST: postgres
    SEMAPHORE_DB_PORT: "5432"
    SEMAPHORE_DB_DIALECT: postgres
    SEMAPHORE_DB: semaphore
    SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore
    SEMAPHORE_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    SEMAPHORE_ADMIN_NAME: admin
    SEMAPHORE_ADMIN_EMAIL: admin@example.com
    SEMAPHORE_ADMIN: admin
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: semaphore
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - semaphore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U semaphore
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: 46.224.127.228
    user: root
    ssh_key: /Users/vasilipascal/work/stacker-project-examples/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  app:
    environment:
      - name: DB_PASSWORD
        required: true
        secret: true
      - name: ADMIN_PASSWORD
        required: true
        secret: true

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  semaphore_pgdata: {}
