name: semaphore
version: "2.10.0"

project:
  identity: semaphore

install:
  inputs:
    commonDomain: ansible.example.com

app:
  type: custom
  image: semaphoreui/semaphore:latest
  ports:
    - "3000:3000"
  environment:
    SEMAPHORE_DB_USER: semaphore
    SEMAPHORE_DB_PASS: "${DB_PASSWORD}"
    SEMAPHORE_DB_HOST: postgres
    SEMAPHORE_DB_PORT: "5432"
    SEMAPHORE_DB_DIALECT: postgres
    SEMAPHORE_DB: semaphore
    SEMAPHORE_PLAYBOOK_PATH: /tmp/semaphore
    SEMAPHORE_ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
    SEMAPHORE_ADMIN_NAME: admin
    SEMAPHORE_ADMIN_EMAIL: admin@example.com
    SEMAPHORE_ADMIN: admin
  depends_on:
    - postgres

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: semaphore
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - semaphore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U semaphore
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"

config_contract:
  services:
    app:
      fields:
        SEMAPHORE_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password

    postgres:
      fields:
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  semaphore_pgdata: {}

marketplace:
  publish: true
  display_name: "Semaphore"
  short_description: "Modern UI for Ansible, Terraform and shell scripts, a lightweight CI/CD alternative. Schedule playbooks with runbooks and audit logs."
  long_description: |
    **Semaphore**: Modern UI for Ansible, Terraform and shell scripts, a lightweight CI/CD alternative. Schedule playbooks with runbooks and audit logs.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public) | Web UI |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    All 4 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/semaphore

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [semaphore]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/semaphore
  no_secrets_confirmation: true
