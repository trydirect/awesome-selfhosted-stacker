name: netbird

project:
  identity: netbird

install:
  inputs:
    commonDomain: vpn.example.com

app:
  type: custom
  image: netbirdio/management:latest
  ports:
    - "33073:33073"
    - "8080:80"
  environment:
    NETBIRD_STORE_ENGINE: postgres
    NETBIRD_STORE_ENGINE_POSTGRES_DSN: "postgres://netbird:${DB_PASSWORD}@postgres:5432/netbird"
  volumes:
    - netbird_data:/var/lib/netbird

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: netbird
      POSTGRES_USER: netbird
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U netbird"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    public_ports:
      - "33073"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

env_file: .env

volumes:
  netbird_data: {}
  postgres_data: {}
