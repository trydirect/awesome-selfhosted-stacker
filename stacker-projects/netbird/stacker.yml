name: netbird

project:
  identity: netbird

install:
  inputs:
    commonDomain: vpn.example.com

app:
  type: custom
  image: netbirdio/management:v0.33.0
  ports:
    - "33073:33073"
    - "8080:80"
  environment:
    NETBIRD_STORE_ENGINE: postgres
    NETBIRD_STORE_ENGINE_POSTGRES_DSN: "postgres://netbird:${DB_PASSWORD}@postgres:5432/netbird"
  volumes:
    - netbird_data:/var/lib/netbird

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: netbird
      POSTGRES_USER: netbird
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U netbird"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "33073"
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        NETBIRD_STORE_ENGINE:
          mutability: editable
        NETBIRD_STORE_ENGINE_POSTGRES_DSN:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  netbird_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Netbird"
  short_description: "Open-source WireGuard-based zero-trust networking platform. Connect devices and peers securely without exposing ports."
  long_description: |
    **NetBird**: Open-source WireGuard-based zero-trust networking platform. Connect devices and peers securely without exposing ports.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 33073 (public), 80 (public on 8080) | `netbirdio/management:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `NETBIRD_STORE_ENGINE`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/netbird

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [netbird]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/netbird
  no_secrets_confirmation: true
