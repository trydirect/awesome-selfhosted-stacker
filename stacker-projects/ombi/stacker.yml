name: ombi

app:
  type: custom
  image: lscr.io/linuxserver/ombi:latest
  ports:
    - "3579:3579"
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: UTC
    BASE_URL: /
  volumes:
    - ombi_config:/config

volumes:
  ombi_config: {}

proxy:
  type: none
  auto_detect: false

config_contract:
  services:
    app:
      fields:
        BASE_URL:
          mutability: editable
        PGID:
          mutability: editable
        PUID:
          mutability: editable
        TZ:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3579"

marketplace:
  publish: true
  display_name: "Ombi"
  short_description: "Self-hosted media request manager for Plex, Jellyfin and Emby. Let users request movies and shows that flow to your download clients."
  long_description: |
    **Ombi**: Self-hosted media request manager for Plex, Jellyfin and Emby. Let users request movies and shows that flow to your download clients.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3579 (public) | API server |

    ## What you configure

    - **Defaults provided**: `BASE_URL`, `PGID`, `PUID`, `TZ` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/ombi

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [ombi]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/ombi
  no_secrets_confirmation: true
