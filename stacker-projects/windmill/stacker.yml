name: windmill

project:
  identity: windmill

install:
  inputs:
    commonDomain: scripts.example.com

app:
  type: custom
  image: ghcr.io/windmill-labs/windmill:v1.404.1
  ports:
    - "8000:8000"
  environment:
    DATABASE_URL: "postgres://windmill:${DB_PASSWORD}@postgres:5432/windmill?sslmode=disable"
    BASE_URL: http://localhost:8000
    MODE: standalone
  volumes:
    - windmill_logs:/tmp/windmill/logs

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: windmill
      POSTGRES_USER: windmill
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U windmill"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: windmill.example.com
      ssl: off
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        BASE_URL:
          mutability: editable
        DATABASE_URL:
          mutability: editable
        MODE:
          mutability: editable
      volumes:
        windmill_logs:
          mutability: generated
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
      volumes:
        postgres_data:
          mutability: generated
env_file: .env

volumes:
  windmill_logs: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Windmill"
  short_description: "Open-source platform to build internal tools, workflows and APIs, a developer-first alternative to Retool, Temporal and Airflow. Write scripts in Python, TypeScript, Go, Bash and SQL, compose them"
  long_description: |
    **windmill**: Open-source platform to build internal tools, workflows and APIs, a developer-first alternative to Retool, Temporal and Airflow. Write scripts in Python, TypeScript, Go, Bash and SQL, compose them

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `ghcr.io/windmill-labs/windmill:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `BASE_URL`, `DATABASE_URL`, `MODE`, `POSTGRES_DB`, `POSTGRES_USER` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/windmill

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [windmill]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/windmill
  no_secrets_confirmation: true
