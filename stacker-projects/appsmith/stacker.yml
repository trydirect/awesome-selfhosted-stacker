name: appsmith
version: "1.9.0"

project:
  identity: appsmith

install:
  inputs:
    commonDomain: appsmith.example.com

app:
  type: custom
  image: appsmith/appsmith-ce:latest
  ports:
    - "8080:80"
    - "8443:443"
  volumes:
    - appsmith_data:/appsmith-stacks

proxy:
  type: none
  auto_detect: false

deploy:
  target: local
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "80"
      - "443"

config_contract:
  services:
    app:
      fields:
        COMMON_DOMAIN:
          mutability: editable

monitoring:
  status_panel: true

env_file: .env

volumes:
  appsmith_data: {}

marketplace:
  publish: true
  display_name: "Appsmith"
  short_description: "Open-source low-code platform for building internal tools and admin panels. Connect databases and APIs, drag-and-drop UI components, and deploy custom apps."
  long_description: |
    **Appsmith**: Open-source low-code platform for building internal tools and admin panels. Connect databases and APIs, drag-and-drop UI components, and deploy custom apps.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080), 443 (public on 8443) | `appsmith/appsmith-ce:v1.50` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `COMMON_DOMAIN` ship prefilled and can be adjusted in the deploy form

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/appsmith

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [appsmith]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/appsmith
  no_secrets_confirmation: true
