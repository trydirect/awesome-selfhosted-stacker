name: healthchecks

project:
  identity: healthchecks

install:
  inputs:
    commonDomain: healthchecks.example.com

app:
  type: custom
  image: healthchecks/healthchecks:v5.0.1
  ports:
    - "8000:8000"
  environment:
    DB: postgres
    DB_CONN_MAX_AGE: "600"
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: healthchecks
    DB_USER: healthchecks
    DB_PASSWORD: "${DB_PASSWORD}"
    SECRET_KEY: "${SECRET_KEY}"
    ALLOWED_HOSTS: "*"
  volumes:
    - healthchecks_data:/data

services:
  - name: postgres
    image: postgres:16.4-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: healthchecks
      POSTGRES_USER: healthchecks
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U healthchecks"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: traefik
  auto_detect: true
  domains:
    - domain: healthchecks.example.com
      ssl: auto
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        ALLOWED_HOSTS:
          mutability: editable
        DB:
          mutability: editable
        DB_CONN_MAX_AGE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  healthchecks_data: {}
  postgres_data: {}

marketplace:
  publish: true
  display_name: "Healthchecks"
  short_description: "Cron job monitoring service, get alerted when jobs stop reporting. Receive email, Slack and webhook notifications on missed checks."
  long_description: |
    **Healthchecks**: Cron job monitoring service, get alerted when jobs stop reporting. Receive email, Slack and webhook notifications on missed checks.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8000 (public) | `healthchecks/healthchecks:latest` |
    | postgres | 5432 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `ALLOWED_HOSTS`, `DB`, `DB_CONN_MAX_AGE`, `DB_HOST`, `DB_NAME`, `DB_PORT` and 3 more ship prefilled and can be adjusted in the deploy form

    All 3 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/healthchecks

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [healthchecks]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/healthchecks
  no_secrets_confirmation: true
