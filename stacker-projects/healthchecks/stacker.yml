name: healthchecks

project:
  identity: healthchecks

install:
  inputs:
    commonDomain: healthchecks.example.com

app:
  type: custom
  image: healthchecks/healthchecks:latest
  ports:
    - "8000:8000"
  environment:
    DB: postgres
    DB_CONN_MAX_AGE: "600"
    DB_HOST: postgres
    DB_PORT: 5432
    DB_NAME: healthchecks
    DB_USER: healthchecks
    DB_PASSWORD: "${DB_PASSWORD}"
    SECRET_KEY: "${SECRET_KEY}"
    ALLOWED_HOSTS: "*"
  volumes:
    - healthchecks_data:/data

services:
  - name: postgres
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: healthchecks
      POSTGRES_USER: healthchecks
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: "CMD-SHELL pg_isready -U healthchecks"
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: traefik
  auto_detect: true
  domains:
    - domain: healthchecks.example.com
      ssl: auto
      upstream: app:8000

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8000"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        ALLOWED_HOSTS:
          mutability: editable
        DB:
          mutability: editable
        DB_CONN_MAX_AGE:
          mutability: editable
        DB_HOST:
          mutability: editable
        DB_NAME:
          mutability: editable
        DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_PORT:
          mutability: editable
          display: number
        DB_USER:
          mutability: editable
        SECRET_KEY:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        volumes:
          mutability: editable
    postgres:
      fields:
        POSTGRES_DB:
          mutability: editable
        POSTGRES_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        POSTGRES_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  healthchecks_data: {}
  postgres_data: {}
