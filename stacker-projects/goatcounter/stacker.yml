name: "goatcounter"
version: "1.0.0"
project:
  identity: "goatcounter"
install:
  inputs:
    commonDomain: "stats.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "arp242/goatcounter:latest"
  ports:
    - "8080:8080"
  command: "serve -listen :8080 -automigrate"
  volumes:
    - "goatcounter_data:/home/goatcounter/goatcounter-data"
  environment: {}
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: goatcounter.example.com
      ssl: off
      upstream: app:8080
deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  goatcounter_data: {}
