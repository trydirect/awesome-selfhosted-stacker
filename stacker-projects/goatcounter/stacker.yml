name: "goatcounter"
version: "1.0.0"
project:
  identity: "goatcounter"
install:
  inputs:
    commonDomain: "stats.example.com"
hooks:
  pre_build: "./scripts/generate-secrets.sh"
app:
  type: "custom"
  image: "arp242/goatcounter:2.7.0"
  ports:
    - "8080:8080"
  command: "serve -listen :8080 -automigrate"
  volumes:
    - "goatcounter_data:/home/goatcounter/goatcounter-data"
  environment: {}
proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: goatcounter.example.com
      ssl: off
      upstream: app:8080
deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    region: fsn1
    size: cpx22
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"
monitoring:
  status_panel: true
env_file: ".env"
volumes:
  goatcounter_data: {}

config_contract:
  services:
    app:
      volumes:
        goatcounter_data:
          mutability: generated

marketplace:
  publish: true
  display_name: "Goatcounter"
  short_description: "Privacy-friendly web analytics with no cookies and no tracking of individuals. Simple, accurate page stats you fully own."
  long_description: |
    **Goatcounter**: Privacy-friendly web analytics with no cookies and no tracking of individuals. Simple, accurate page stats you fully own.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 8080 (public) | `arp242/goatcounter:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/goatcounter

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [goatcounter]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/goatcounter
  no_secrets_confirmation: true
