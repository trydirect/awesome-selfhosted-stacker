name: seafile

project:
  identity: seafile

install:
  inputs:
    commonDomain: files.example.com

app:
  type: custom
  image: seafileltd/seafile-mc:13.0.25
  ports:
    - "8080:80"
  environment:
    SEAFILE_SERVER_HOSTNAME: ${SEAFILE_HOSTNAME}
    SEAFILE_ADMIN_EMAIL: admin@example.com
    SEAFILE_ADMIN_PASSWORD: "${SEAFILE_ADMIN_PASSWORD}"
    SEAFILE_SERVER_LETSENCRYPT: "false"
    SEAFILE_SERVER_PROTOCOL: http
    SEAFILE_MYSQL_DB_HOST: mysql
    SEAFILE_MYSQL_DB_PORT: "3306"
    INIT_SEAFILE_MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    SEAFILE_MYSQL_DB_USER: seafile
    SEAFILE_MYSQL_DB_PASSWORD: "${DB_PASSWORD}"
    SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
    SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
    SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
    JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY}"
  volumes:
    - seafile_data:/shared
  depends_on:
    - mysql

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: ccnet_db
      MYSQL_USER: seafile
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - seafile_mysql:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        SEAFILE_MYSQL_DB_HOST:
          mutability: editable
        SEAFILE_MYSQL_DB_PORT:
          mutability: editable
          display: number
        INIT_SEAFILE_MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SEAFILE_MYSQL_DB_USER:
          mutability: editable
        SEAFILE_MYSQL_DB_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        JWT_PRIVATE_KEY:
          mutability: generated
          type: alphanumeric
          length: 64
          display: password
        SEAFILE_ADMIN_EMAIL:
          mutability: editable
        SEAFILE_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SEAFILE_SERVER_HOSTNAME:
          mutability: editable
        SEAFILE_SERVER_LETSENCRYPT:
          mutability: editable
        SEAFILE_SERVER_PROTOCOL:
          mutability: editable
        depends_on:
          mutability: editable
        volumes:
          mutability: editable
    mysql:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  seafile_data: {}
  seafile_mysql: {}

marketplace:
  publish: true
  display_name: "Seafile"
  short_description: "High-performance file sync and share with client-side encryption. A fast, Dropbox-like private cloud for teams."
  long_description: |
    **Seafile**: High-performance file sync and share with client-side encryption. A fast, Dropbox-like private cloud for teams.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `seafileltd/seafile-mc:13.0.25` |
    | mysql | 3306 (local only) | Database |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `SEAFILE_ADMIN_EMAIL`, `SEAFILE_MYSQL_DB_HOST`, `SEAFILE_MYSQL_DB_PORT`, `SEAFILE_MYSQL_DB_USER`, `SEAFILE_SERVER_HOSTNAME`, `SEAFILE_SERVER_LETSENCRYPT` and 3 more ship prefilled and can be adjusted in the deploy form

    All 6 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/seafile

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [seafile]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/seafile
  no_secrets_confirmation: true
