name: seafile

project:
  identity: seafile

install:
  inputs:
    commonDomain: files.example.com

app:
  type: custom
  image: seafileltd/seafile-mc:latest
  ports:
    - "8080:80"
  environment:
    SEAFILE_SERVER_HOSTNAME: ${SEAFILE_HOSTNAME}
    SEAFILE_ADMIN_EMAIL: admin@example.com
    SEAFILE_ADMIN_PASSWORD: "${SEAFILE_ADMIN_PASSWORD}"
    SEAFILE_SERVER_LETSENCRYPT: "false"
    SEAFILE_SERVER_PROTOCOL: http
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_ROOT_PASSWD: "${DB_ROOT_PASSWORD}"
    DB_USER: seafile
    DB_USER_PASSWD: "${DB_PASSWORD}"
  volumes:
    - seafile_data:/shared
  depends_on:
    - mysql

services:
  - name: mysql
    image: mysql:8
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: ccnet_db
      MYSQL_USER: seafile
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - seafile_mysql:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 10s
      timeout: 5s
      retries: 5

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        DB_HOST:
          mutability: editable
        DB_PORT:
          mutability: editable
          display: number
        DB_ROOT_PASSWD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        DB_USER:
          mutability: editable
        DB_USER_PASSWD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SEAFILE_ADMIN_EMAIL:
          mutability: editable
        SEAFILE_ADMIN_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        SEAFILE_SERVER_HOSTNAME:
          mutability: editable
        SEAFILE_SERVER_LETSENCRYPT:
          mutability: editable
        SEAFILE_SERVER_PROTOCOL:
          mutability: editable
        depends_on:
          mutability: editable
        volumes:
          mutability: editable
    mysql:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
env_file: .env

volumes:
  seafile_data: {}
  seafile_mysql: {}