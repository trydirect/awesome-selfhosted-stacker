name: freescout

app:
  type: custom
  image: bfren/freescout:php8.3-freescout1.8.222-6.1.20
  ports:
    - "8082:80/tcp"
  environment:
    FREESCOUT_URL: http://localhost:8082
    FREESCOUT_HTTPS: "false"
    FREESCOUT_DB_CONN: mysql
    FREESCOUT_DB_HOST: db
    FREESCOUT_DB_PORT: "3306"
    FREESCOUT_DB_NAME: freescout
    FREESCOUT_DB_USER: freescout
    FREESCOUT_DB_PASS: ${DB_PASSWORD}
    FREESCOUT_ADMIN_FIRSTNAME: Admin
    FREESCOUT_ADMIN_LASTNAME: User
    FREESCOUT_ADMIN_EMAIL: ${ADMIN_EMAIL}
    FREESCOUT_ADMIN_PASS: ${ADMIN_PASSWORD}
  volumes:
    - freescout_data:/data
  depends_on:
    - db
  healthcheck:
    test: "CMD curl -fsL http://localhost:80/"
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 120s

services:
  - name: db
    image: mysql:8.4
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
    volumes:
      - freescout_db:/var/lib/mysql
    healthcheck:
      test: "CMD mysqladmin ping -h localhost -u root -p${ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  freescout_data: {}
  freescout_db: {}

proxy:
  type: none
  auto_detect: false

env_file: .env

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8082"

hooks:
  pre_build: ./scripts/generate-secrets.sh

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        FREESCOUT_ADMIN_EMAIL:
          mutability: editable
          display: string
        FREESCOUT_ADMIN_FIRSTNAME:
          mutability: editable
        FREESCOUT_ADMIN_LASTNAME:
          mutability: editable
        FREESCOUT_ADMIN_PASS:
          mutability: editable
          display: password
        FREESCOUT_DB_CONN:
          mutability: editable
        FREESCOUT_DB_HOST:
          mutability: editable
        FREESCOUT_DB_NAME:
          mutability: editable
        FREESCOUT_DB_PASS:
          mutability: editable
          display: password
        FREESCOUT_DB_PORT:
          mutability: editable
          display: number
        FREESCOUT_DB_USER:
          mutability: editable
        FREESCOUT_URL:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        start_period:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        freescout_data:
          mutability: generated
    db:
      fields:
        MYSQL_DATABASE:
          mutability: editable
        MYSQL_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MYSQL_ROOT_PASSWORD:
          mutability: generated
          type: alphanumeric
          length: 24
          display: password
        MYSQL_USER:
          mutability: editable
        healthcheck:
          mutability: editable
        interval:
          mutability: editable
        retries:
          mutability: editable
        test:
          mutability: editable
        timeout:
          mutability: editable
        volumes:
          mutability: editable
      volumes:
        freescout_db:
          mutability: generated

marketplace:
  publish: true
  display_name: "Freescout"
  short_description: "Self-hosted freescout"
  long_description: |
    **freescout**: Self-hosted freescout

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    2 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80/tcp (public on 8082) | `bfren/freescout:latest` |
    | db | internal | Database |

    ## What you configure

    - **Defaults provided**: `FREESCOUT_ADMIN_EMAIL`, `FREESCOUT_ADMIN_FIRSTNAME`, `FREESCOUT_ADMIN_LASTNAME`, `FREESCOUT_ADMIN_PASS`, `FREESCOUT_DB_CONN`, `FREESCOUT_DB_HOST` and 7 more ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 2 containers (2 GB RAM or more recommended)

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/freescout

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [freescout app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/freescout
  no_secrets_confirmation: true
