name: ntfy

project:
  identity: ntfy

install:
  inputs:
    commonDomain: ntfy.example.com

app:
  type: custom
  image: binwiederhier/ntfy:latest
  ports:
    - "8080:80"
  command: "serve"
  environment:
    NTFY_BASE_URL: http://ntfy.example.com
    NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    NTFY_AUTH_FILE: /var/lib/ntfy/user.db
    NTFY_AUTH_DEFAULT_ACCESS: "read-write"
  volumes:
    - ntfy_data:/var/lib/ntfy
    - ntfy_cache:/var/cache/ntfy

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: ntfy.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ~/.config/stacker/ssh/server-580_ed25519
  cloud:
    provider: hetzner
    region: nbg1
    size: cx23
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        NTFY_AUTH_DEFAULT_ACCESS:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NTFY_AUTH_FILE:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        NTFY_BASE_URL:
          mutability: editable
        NTFY_CACHE_FILE:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  ntfy_data: {}
  ntfy_cache: {}

marketplace:
  publish: true
  display_name: "Ntfy"
  short_description: "Send push notifications to your phone from any script with a simple HTTP API. Instant, self-hosted alerts without vendor lock-in."
  long_description: |
    **ntfy**: Send push notifications to your phone from any script with a simple HTTP API. Instant, self-hosted alerts without vendor lock-in.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `binwiederhier/ntfy:v2.8` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `NTFY_BASE_URL`, `NTFY_CACHE_FILE` ship prefilled and can be adjusted in the deploy form

    All 2 credentials (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/ntfy

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [ntfy]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/ntfy
  no_secrets_confirmation: true
