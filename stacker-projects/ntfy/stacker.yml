name: ntfy

project:
  identity: ntfy

install:
  inputs:
    commonDomain: ntfy.example.com

app:
  type: custom
  image: binwiederhier/ntfy:latest
  ports:
    - "8080:80"
  command: "serve"
  environment:
    NTFY_BASE_URL: http://ntfy.example.com
    NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
    NTFY_AUTH_FILE: /var/lib/ntfy/user.db
    NTFY_AUTH_DEFAULT_ACCESS: "read-write"
  volumes:
    - ntfy_data:/var/lib/ntfy
    - ntfy_cache:/var/cache/ntfy

proxy:
  type: caddy
  auto_detect: false
  domains:
    - domain: ntfy.example.com
      ssl: off
      upstream: app:80

deploy:
  target: server
  server:
    host: ${EXISTING_SERVER_HOST}
    user: ${EXISTING_SERVER_USER}
    ssh_key: ~/.config/stacker/ssh/server-580_ed25519
  cloud:
    provider: hetzner
    region: nbg1
    size: cx23
    ssh_key: ${BASE_PATH}/stacker-project-test
    public_ports:
      - "80"
      - "443"
      - "8080"

monitoring:
  status_panel: true

env_file: .env

volumes:
  ntfy_data: {}
  ntfy_cache: {}
