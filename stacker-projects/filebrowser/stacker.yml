name: filebrowser
version: "2.28.0"

project:
  identity: filebrowser

install:
  inputs:
    commonDomain: files.example.com

app:
  type: custom
  image: filebrowser/filebrowser:v2.31.2
  ports:
    - "8080:80"
  environment:
    FB_DATABASE: /database/filebrowser.db
    FB_ROOT: /srv
    FB_NOAUTH: "false"
  volumes:
    - filebrowser_data:/srv
    - filebrowser_db:/database

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "8080"

monitoring:
  status_panel: true

config_contract:
  services:
    app:
      fields:
        FB_DATABASE:
          mutability: editable
        FB_NOAUTH:
          mutability: generated
          type: alphanumeric
          length: 32
          display: password
        FB_ROOT:
          mutability: editable
        volumes:
          mutability: editable
env_file: .env

volumes:
  filebrowser_data: {}
  filebrowser_db: {}

marketplace:
  publish: true
  display_name: "Filebrowser"
  short_description: "Self-hosted filebrowser"
  long_description: |
    **filebrowser**: Self-hosted filebrowser

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 80 (public on 8080) | `filebrowser/filebrowser:latest` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on
    - **Defaults provided**: `FB_DATABASE`, `FB_ROOT` ship prefilled and can be adjusted in the deploy form

    All 1 credential (passwords and keys) are generated per
    deployment and stored in your project's secret store.

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/filebrowser

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [filebrowser app]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/filebrowser
  no_secrets_confirmation: true
