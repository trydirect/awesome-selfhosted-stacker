name: adguard-home

project:
  identity: adguard-home

install:
  inputs:
    commonDomain: dns.example.com

app:
  type: custom
  image: adguard/adguardhome:v0.107.53
  ports:
    - "3000:3000"
    - "8080:80"
    - "8053:53/tcp"
    - "8053:53/udp"
  volumes:
    - adguard_work:/opt/adguardhome/work
    - adguard_conf:/opt/adguardhome/conf

proxy:
  type: none
  auto_detect: false

deploy:
  target: server
  server:
    host: ${DEPLOY_HOST}
    user: root
    ssh_key: ${BASE_PATH}/stacker-project-test
  cloud:
    provider: hetzner
    ssh_key: ${BASE_PATH}/stacker-project-test
    region: fsn1
    size: cpx22
    public_ports:
      - "3000"
      - "8080"
      - "8053/tcp"
      - "8053/udp"

monitoring:
  status_panel: true

env_file: .env

volumes:
  adguard_work: {}
  adguard_conf: {}

config_contract:
  services:
    app:
      volumes:
        adguard_work:
          mutability: generated
        adguard_conf:
          mutability: generated

marketplace:
  publish: true
  display_name: "Adguard Home"
  short_description: "Network-wide ad and tracker blocking DNS server. Protect every device on your home network by simply pointing your router's DNS to this self-hosted AdGuard Home instance."
  long_description: |
    **Adguard Home**: Network-wide ad and tracker blocking DNS server. Protect every device on your home network by simply pointing your router's DNS to this self-hosted AdGuard Home instance.

    Deploy from this page: TryDirect provisions the server, starts the
    services, generates the deployment credentials and wires the
    1 containers together. Nothing is shared between deployments and no
    secrets ship with the stack.

    ## What's included

    | Service | Port | Description |
    | ------- | ---- | ----------- |
    | app | 3000 (public), 80 (public on 8080), 53/tcp (public on 8053), 53/udp (public on 8053) | `adguard/adguardhome:v0.107.53` |

    ## What you configure

    - **Domain** (`commonDomain`): the hostname the stack is served on

    ## Requirements

    - A cloud account connected to TryDirect (the deploy form provisions
      the server) or one of your own servers
    - A server that fits 1 containers (2 GB RAM or more recommended)
    - A DNS record for the domain you set in the deploy form

    ## Alternative: deploy with the Stacker CLI

    Everything above also works from the command line:

    ```bash
    git clone https://github.com/trydirect/awesome-selfhosted-stacker.git
    cd awesome-selfhosted-stacker/stacker-projects/adguard-home

    # Generate secrets
    cp .env.example .env
    ./scripts/generate-secrets.sh

    # Deploy
    stacker deploy
    ```
  category: devops
  tags: [adguard home]
  support_url: https://github.com/trydirect/awesome-selfhosted-stacker/tree/main/stacker-projects/adguard-home
  no_secrets_confirmation: true
